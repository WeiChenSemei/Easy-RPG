else if(d.ht)V.ht=+d.ht;else if(d.hv)V.hv=V.hv?0:1;else if(d.hn!=null)V.hc=[V.ht&&V.ht<=T.hu.mx?V.ht:T.hu.mx,+d.hn];else if(d.ts&&isTester())tsDo(d.ts);else if(d.tr){V.tr=d.tr;V.pg=0}else if(d.t)T.t=d.t;

<div class="ssk${sc?' s6':''}">${Object.keys(K).map(x=>`<button data-ss="${x}"${x===k?' class="sel"':''}>${K[x]}</button>`).join('')}</div>`+
L.map(({h,i,x},j)=>`<div class="sc" style="--w:${Math.round(100*val(i)/mx)}%"><div class="sr1"><span>${val(i)>0?md[rks[j]]:'－'}</span><span class="nm">${HE[i]} ${h.name}${i?'':'（你）'}</span>${sc?`<span${on('sc')}>🏆 ${nf(sc[i])}</span>`:''}<span>${h.w.i}${h.w.n}</span></div>
