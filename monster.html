const pLog=()=>logs.slice(-14).reverse().map(l=>`<div class="sm">${l}</div>`).join('')+'<div class="sm" style="margin-top:8px">每次攻擊累積氣力，滿格發動必殺。AUTO 開啟＝自動放必殺；關閉時，氣力滿的我方怪物會發光，點它才發動。擊敗敵人有機率捕獲，重複捕獲＝升星。農怪＝停在同一波反覆戰鬥。<br>站位：前排減傷但輸出較低、後排輸出 +30% 但較脆弱（被攻擊機率 前3：中2：後1）。同屬 ×3 或三屬各異有羈絆加成。進化與融合在「培育」。<br>被動：每隻怪有天生屬性被動，並可在培育分頁學習其他被動；隊伍中擁有相同被動的怪物每多一隻威力 +25%，進化每階 +50%（上限 ×2.5）。<br>元素反應：目標卡片右上角會附著上一次攻擊的屬性，被「不同屬性」攻擊就引發反應（敌人也會）。完整反應表在圖鑑底部。</div>';
function pTeam(){let h='<div class="sm">點選怪物查看，再放入隊伍 1／2／3 格（放入後該波重新開始）</div><div class="g">'+S.team.map((id,i)=>tile(id,i)).join('')+'</div>';
 if(sel!=null&&S.box[sel]){const o=S.box[sel],u=mkU(sel,o.L,0,o.st,o.ev||0),k=SK[u.m.el],c=Math.round(NEED(o.L)*1.1);
  h+=`<div class="cardbox"><b style="font-size:18px">${u.m.e} ${EVT[o.ev||0].n}${u.m.n}</b>　Lv${o.L} ${o.st?'★'.repeat(o.st):'☆'}　${ELC[u.m.el]}${u.m.el}・${ARCH[u.m.k].t}<br><small>HP ${u.mhp}　ATK ${F(u.atk)}　DEF ${F(u.df)}　EXP ${o.exp}/${NEED(o.L)}<br>必殺【${k.n}】${k.d}<br>被動【${PASV[u.m.el].n}】${PASV[u.m.el].d}</small><div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap">${[1,2,3].map(n=>`<button data-a="put:${n-1}">放入 ${n}</button>`).join('')}<button data-a="lvup" style="opacity:${S.coin<c?.5:1}">💰${fmt(c)} 升級</button></div></div>`}
 return h+`<h4>怪物箱 ${Object.keys(S.box).length}/${MON.length}</h4><div class="g">`+Object.keys(S.box).sort((a,b)=>S.box[b].L-S.box[a].L).map(id=>tile(id)).join('')+'</div>'}
const pShop=()=>SHOP.map(s=>{const l=S.up[s.k],c=s.c(l);return `<div class="row"><span style="font-size:26px">${s.ic}</span><div style="flex:1"><b>${s.n}</b> <small>Lv${l}/${s.max}</small><br><small>${s.d}</small></div><button data-a="buy:${s.k}" style="opacity:${S.coin<c||l>=s.max?.5:1}">${l>=s.max?'MAX':'💰'+fmt(c)}</button></div>`}).join('')+`<div class="row"><span style="font-size:26px">🔮</span><div style="flex:1"><b>召喚水晶</b><br><small>隨機召喚已解鎖區域的怪物（已有則升星）</small></div><button data-a="sum" style="opacity:${S.coin<SUMC()?.5:1}">💰${fmt(SUMC())}</button></div><div style="margin-top:14px"><button data-a="reset">${rst?'再按一次確認（進度清除）':'重新開始'}</button></div>`;
function pDex(){const own=MON.filter(m=>S.box[m.id]).length,sn=MON.filter(m=>S.seen[m.id]).length;let h=`<div>收服 ${own}　遇見 ${sn}　共 ${MON.length}</div>`;
 if(dsel!=null){const m=MON[dsel],k=SK[m.el];h+=`<div class="cardbox">${S.seen[dsel]?`<b style="font-size:18px">${m.e} ${m.n}</b>　${ELC[m.el]}${m.el}・${ARCH[m.k].t}・${ZONES[m.z].n}<br><small>必殺【${k.n}】${k.d}<br>被動【${PASV[m.el].n}】${PASV[m.el].d}<br>${S.box[dsel]?'已收服 ★'+S.box[dsel].st:'尚未收服（擊敗後有機率捕獲）'}</small>`:'❓ 尚未遇見'}</div>`}
 ZONES.forEach((z,zi)=>{h+=`<h4>${z.n}</h4><div class="g">`+MON.filter(m=>m.z==zi).map(m=>`<div class="t" data-a="mon:${m.id}" style="${S.box[m.id]?'':S.seen[m.id]?'opacity:.55':''}">${S.seen[m.id]?m.e:'❓'}${S.box[m.id]?'<b>✔</b>':''}</div>`).join('')+'</div>'});h+='<h4>元素反應表</h4>'+Object.entries(RX).map(([k,r])=>`<div class="sm"><b>${ELC[k[0]]}${ELC[k[1]]} ${r.n}</b>：${rxd(r)}</div>`).join('');return h}
const pZone=()=>pTower()+ZONES.map((z,i)=>`<div class="row" data-a="zone:${i}" style="opacity:${i>S.maxZone?.4:1}"><span style="font-size:22px">${i>S.maxZone?'🔒':i==S.zone?'📍':'🗺️'}</span><div style="flex:1"><b>${z.n}</b> <small>敵人 Lv${i*8+1}~${i*8+9}</small><br>${MON.filter(m=>m.z==i).map(m=>m.e).join('')}</div></div>`).join('')+'<div class="sm" style="margin-top:6px">擊敗該區 BOSS 解鎖下一區。每 10 波出現一次 BOSS 戰；全滅會退回本輪第 1 波。</div>';
function pLab(){cs=cs.filter(i=>S.box[i]);const n=cs.length,ks=Object.keys(S.box).sort((a,b)=>S.box[b].L-S.box[a].L);
 let h="<div class='sm'>選 1 隻＝進化／個體／招式／被動／天賦；選 2 隻＝融合（兩隻消耗，得到新怪物）</div><div class='g'>"+ks.map(i=>tile(i,null,'cs',cs.includes(+i))).join('')+'</div>';
 if(n==1){const o=S.box[cs[0]],m=MON[cs[0]],v=o.ev||0,t=EVT[v+1];
  h+=`<div class='cardbox'><b>${m.e} ${EVT[v].n}${m.n}</b>　Lv${o.L}<br>`+(t?`<small>進化為【${t.n}】：全能力 ×${t.m}／必殺威力 +40%<br>需求 Lv${t.L}　💰${fmt(t.c)}</small><div style='margin-top:6px'><button data-a='evo' style='opacity:${o.L>=t.L&&S.coin>=t.c?1:.5}'>🧬 進化</button></div>`:'<small>已達最終型態 🌟</small>')+'</div>'+indiv(cs[0])+skp(cs[0])+pasp(cs[0])+tal(cs[0])}
 if(n==2){const[a,b]=cs,m=MON[fuseRes(a,b)],ok=ks.length>=5;h+=`<div class='cardbox'>${MON[a].e}＋${MON[b].e} → <b style='font-size:20px'>${m.e} ${m.n}</b> ${ELC[m.el]}${m.el}<br><small>${S.box[m.id]?'已擁有：升星':'新夥伴'}　Lv${Math.max(1,F((S.box[a].L+S.box[b].L)*.6))}，繼承較高星級與進化${ok?'':'<br>怪物箱需至少 5 隻才能融合'}</small><div style='margin-top:6px'><button data-a='fuse' style='opacity:${ok?1:.5}'>🧪 融合</button></div></div>`}
 return h}
function render(){const p=E('panel'),y=p.scrollTop;E('nav').children[5].textContent='🏆 每日'+(ready()?' ❗':'');E('nav').children[3].textContent='📖 圖鑑'+(achReady()?' ❗':'');E('nav').children[0].textContent='📜 戰況'+(S.ev?' ❗':'');[...E('nav').children].forEach((b,i)=>b.classList.toggle('on',i==tab));p.innerHTML=[()=>pEv()+pLog(),pTeam,pLab,()=>dnav()+(dv?pAch():pDex()),pZone,()=>pQ()+pWB()+pCup(),pEq,pShop][tab]();p.scrollTop=y}

// ===== 操作 =====
const ACT={
 tab:i=>{tab=+i;dirty=1},em:i=>{em=+i;dirty=1},es:s=>{es=+s;dirty=1},
 eqp:i=>{const x=S.inv[+i];if(x.o==em)x.o=null;else{S.inv.forEach(y=>{if(y.o==em&&y.s==x.s)y.o=null});x.o=em}dirty=1;save()},
 eup:i=>{const x=S.inv[+i],c=upc(x);if(x.n<10&&S.coin>=c){S.coin-=c;x.n++;dq('enh');dirty=1;save()}},
 esell:i=>{S.coin+=val(S.inv[+i]);S.inv.splice(+i,1);dirty=1;save()},
 ev:k=>{const e=S.ev;if(!e||TW||T)return;const o=EVN[e.i].o[+k];if(!o)return;const c=o.c?o.c():0;if(S.coin<c)return;S.coin-=c;S.ev=null;dq('evn');lg(o.f());dirty=1;save()},
 dv:i=>{dv=+i;dirty=1},
 ach:k=>{const a=ACH.find(x=>x.k==k),ac=S.ac||(S.ac={}),n=ac[k]||0;if(n<4&&a.g()>=a.t[n])claim(a,n)},
 acha:()=>{const ac=S.ac||(S.ac={});ACH.forEach(a=>{let n=ac[a.k]||0;while(n<4&&a.g()>=a.t[n]){claim(a,n);n++}});dirty=1;save()},
 zcl:z=>{z=+z;const zc=S.zc||(S.zc={});if(!zc[z]&&zcnt(z)>=10){zc[z]=1;const c=Math.round(800*(1+z*.5)*(1+S.maxZone*.3));S.coin+=c;addItem(z,Math.max(rr(),rr(),3));lg(`📖 ${ZONES[z].n}圖鑑完成　+${fmt(c)}💰`);dirty=1;save()}},
 wbs:()=>{const w=wbd();if(T||TW||w.att>=3||w.hp<=0)return;w.att++;dq('wb');TW={wb:1,t:90,hp:[1,1,1],f:0};lg('🐲 挑戰世界 BOSS！');save();startWave()},
 wbx:()=>{if(TW&&TW.wb){bEnd();st='wait';tw=1.2;dirty=1}},
 tws:f=>{f=+f;const t=S.tw||(S.tw={best:0});if(T||TW||!(f==1||(f-1)%10==0&&f-1<=t.best))return;TW={f,hp:[1,1,1]};lg(`🗼 無盡之塔開始，第 ${f} 層`);startWave()},
 twx:()=>{if(TW){TW=null;lg('🏳️ 已撤退');startWave()}},
 nrr:()=>{const o=S.box[cs[0]],c=Math.round(100*o.L);if(S.coin>=c){S.coin-=c;let n;do n=F(R()*NAT.length);while(n==o.nt);o.nt=n;dirty=1;save()}},
 awk:()=>{const o=S.box[cs[0]],c=Math.round(200*(1+o.iv.reduce((a,b)=>a+b,0)/31));if(S.coin>=c&&o.iv.some(x=>x<31)){S.coin-=c;let j=F(R()*3);while(o.iv[j]>=31)j=(j+1)%3;o.iv[j]=Math.min(31,o.iv[j]+4);dirty=1;save()}},
 pkp:k=>{const o=S.box[cs[0]];if(ppk(o)>0&&poff(cs[0]).includes(k)){(o.ps=o.ps||[]).push(k);dirty=1;save()}},
 pkr:()=>{const o=S.box[cs[0]],c=Math.round(60*o.L);if(o.ps&&o.ps.length&&S.coin>=c){S.coin-=c;o.ps=[];dirty=1;save()}},
 skp:i=>{const o=S.box[cs[0]];if(picks(o)>0&&offer(cs[0]).some(x=>x[0]==+i)){(o.sk=o.sk||[]).push(+i);dirty=1;save()}},
 skr:()=>{const o=S.box[cs[0]],c=Math.round(60*o.L);if(o.sk&&o.sk.length&&S.coin>=c){S.coin-=c;o.sk=[];dirty=1;save()}},
 tlu:(k,n)=>{const o=S.box[cs[0]],x=TAL.find(y=>y.k==k),l=(o.tl=o.tl||{})[k]||0,a=Math.min(+n,x.m-l,tp(o));if(a>0){o.tl[k]=l+a;dirty=1;save()}},
 trs:()=>{const o=S.box[cs[0]],c=Math.round(40*o.L);if(o.tl&&Object.keys(o.tl).length&&S.coin>=c){S.coin-=c;o.tl={};dirty=1;save()}},
 dqc:k=>{const d=dqs(),q=QST.find(x=>x.k==k);if(q&&d.l.includes(k)&&(d.p[k]||0)>=q.v&&!d.c[k]){d.c[k]=1;S.coin+=dqr(q);S.dqn=(S.dqn||0)+1;dirty=1;save()}},
 dqa:()=>{const d=dqs();if(!d.all&&d.l.every(k=>d.c[k])){d.all=1;S.coin+=Math.round(600*(1+S.maxZone*.7));addItem(S.maxZone,R()<.2?3:2);lg('🎁 全勤獎勵已領取！');dirty=1;save()}},
 ere:i=>{const x=S.inv[+i],c=rrc(x);if(S.coin>=c){S.coin-=c;x.a=affx(x.t,x.q);dirty=1;save()}},
 esall:()=>{S.inv=S.inv.filter(x=>x.o!=null||x.q>1||(S.coin+=val(x),0));dirty=1;save()},
 cup:()=>{const t=tn();if(T||TW||t.res||t.r>3)return;T={r:t.r};t.a=1;save();lg(`🏆 ${CUP[t.r].n} 開打！`);startWave()},cs:i=>{i=+i;cs=cs.includes(i)?cs.filter(x=>x!=i):[...cs,i].slice(-2);dirty=1},
 evo:()=>{const id=cs[0],o=S.box[id],t=EVT[(o.ev||0)+1];if(t&&o.L>=t.L&&S.coin>=t.c){S.coin-=t.c;o.ev=(o.ev||0)+1;dq('evo');lg(`🧬 ${MON[id].e}${MON[id].n} 進化為【${t.n}】！`);dirty=1;save()}},
 fuse:()=>{const[a,b]=cs;if(T||TW||Object.keys(S.box).length<5)return;const A=S.box[a],B=S.box[b],r=fuseRes(a,b);delete S.box[a];delete S.box[b];S.inv.forEach(x=>{if(x.o==a||x.o==b)x.o=null});give(r,Math.max(1,F((A.L+B.L)*.6)),Math.max(A.st,B.st),Math.max(A.ev||0,B.ev||0));{const q=S.box[r];if(A.iv&&B.iv&&q.iv)q.iv=q.iv.map((x,i)=>Math.max(x,A.iv[i],B.iv[i]))}dq('fuse');fixTeam();cs=[r];startWave();save()},
 sum:()=>{const c=SUMC();if(S.coin<c)return;S.coin-=c;const m=pick(MON.filter(x=>x.z<=S.maxZone&&x.k!=9));S.seen[m.id]=1;give(m.id,Math.max(1,m.z*6),0,0);dirty=1;save()},auto:()=>{S.auto^=1;save()},spd:()=>{S.spd=S.spd==1?2:S.spd==2?4:1;save()},farm:()=>{S.farm^=1;save()},
 cast:i=>{const u=U[0][+i];if(st=='fight'&&u&&!u.dead&&u.en>=100){special(u);end()}},
 sel:i=>{sel=+i;dirty=1},mon:i=>{dsel=+i;dirty=1},
 put:n=>{n=+n;if(sel==null||T||TW)return;const i=S.team.indexOf(sel);if(i>=0)[S.team[i],S.team[n]]=[S.team[n],S.team[i]];else S.team[n]=sel;startWave();save()},
 lvup:()=>{const o=S.box[sel],c=Math.round(NEED(o.L)*1.1);if(S.coin>=c){S.coin-=c;gain(sel,NEED(o.L)-o.exp);dirty=1;save()}},
 buy:k=>{const s=SHOP.find(x=>x.k==k),l=S.up[k],c=s.c(l);if(l<s.max&&S.coin>=c){S.coin-=c;S.up[k]++;dirty=1;save()}},
 zone:i=>{i=+i;if(!T&&!TW&&i<=S.maxZone&&i!=S.zone){S.zone=i;S.w=0;lg('➡️ 移動到 '+ZONES[i].n);startWave();save()}},
 reset:()=>{if(!rst){rst=1;dirty=1;setTimeout(()=>{rst=0;dirty=1},3000);return}try{localStorage.removeItem(KEY)}catch(e){}fresh();T=null;logs=[];rst=0;sel=null;startWave()}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const[a,b,c]=t.dataset.a.split(':');ACT[a](b,c)});
let last=0;function loop(t){const dt=Math.min(.1,(t-last)/1000||0);last=t;tick(dt);draw();if(dirty){dirty=0;render()}requestAnimationFrame(loop)}
if(!S||!S.box)fresh();S.inv=S.inv||[];if(S.t){const m=Math.min(480,(Date.now()-S.t)/6e4);if(m>=5){const c=Math.round(m*(10+S.zone*30));S.coin+=c;lg(`🌙 離線 ${F(m)} 分鐘，獲得 ${c}💰`)}}lg('歡迎來到怪物仙境！擊敗敵人並捕獲新夥伴，組成最強 3 隻隊伍。');if(S.tn&&S.tn.a){if(S.tn.d==dk()){tEnd(0,S.tn.r);lg('⚠️ 錦標賽中途離開，視為落敗')}else S.tn.a=0}startWave();requestAnimationFrame(loop);
