// Forge Logic
let forgeSelectedUid = null;
function renderForgeHub() {
    const invContainer = document.getElementById('ui-forge-inventory'); invContainer.innerHTML = '';
    const panelContainer = document.getElementById('ui-forge-panel');
    document.getElementById('ui-magic-stones-hub').innerText = PlayerState.magicStones;
    
    // Find who wears what
    let equipMap = {};
    PlayerState.roster.forEach(h => { Object.values(h.equip).forEach(uid => { if (uid) equipMap[uid] = DB.classes[h.classId].name; }); });

    // Sort inventory by rarity (legendary -> common) and then by name
    let sortedInventory = [...PlayerState.inventory].sort((a, b) => {
        const rarityWeights = { legendary: 5, epic: 4, rare: 3, uncommon: 2, common: 1 };
        const weightA = rarityWeights[a.rarity] || 0;
        const weightB = rarityWeights[b.rarity] || 0;
        const nameA = DB.items[a.itemId] ? DB.items[a.itemId].name : "";
        const nameB = DB.items[b.itemId] ? DB.items[b.itemId].name : "";
        let nameCompare = nameA.localeCompare(nameB);
        if (nameCompare !== 0) {return nameCompare; 
        } else {return weightB - weightA; }
    });

    sortedInventory.forEach(invItem => {
        let itemTemp = DB.items[invItem.itemId];
        if (!itemTemp) return; // 確保有這件裝備的資料 
        let rarity = DB.rarities[invItem.rarity];
        let div = document.createElement('div');
        div.className = 'item-row' + (forgeSelectedUid === invItem.uid ? ' equipped' : '');
        let equipStatus = equipMap[invItem.uid] ? `<span style="color:#00ffcc;">(已裝備)</span>` : '';
        div.innerHTML = `<div style="display:flex; justify-content:space-between;"><strong class="${rarity.class}">${itemTemp.name} ${invItem.enhance>0?'+'+invItem.enhance:''}</strong><span style="font-size:12px;">${equipStatus}</span></div>`;
        div.onclick = () => { forgeSelectedUid = invItem.uid; renderForgeHub(); };
        invContainer.appendChild(div);
    });

    if (forgeSelectedUid) {
        let invItem = PlayerState.inventory.find(i => i.uid === forgeSelectedUid);
        if (!invItem) { forgeSelectedUid = null; renderForgeHub(); return; }
        let itemTemp = DB.items[invItem.itemId]; let rarity = DB.rarities[invItem.rarity];
        
        let statText = Object.entries(invItem.stats).map(([k,v])=>{
            let t = DB.statTypes.find(s=>s.key===k);
            let mult = 1 + (invItem.enhance * 0.1);
            let finalVal = t.isPct ? `+${(v*mult*100).toFixed(1)}%` : `+${Math.floor(v*mult)}`;
            return `${t.name}: ${finalVal}`;
        }).join('<br>');
        
        let costs = { enhance: 50 + invItem.enhance * 100, reroll: 350 * rarity.mult, add: 100 * rarity.mult, salvage: rarity.salvage + invItem.enhance*10 };

        panelContainer.innerHTML = `
            <div style="text-align:center; font-size:18px; margin-bottom:5px;" class="${rarity.class}">${itemTemp.name} ${invItem.enhance>0?'+'+invItem.enhance:''}</div>
            <div style="font-size:13px; color:#aaa; margin-bottom:15px; border-bottom:1px solid #444; padding-bottom:10px;">${statText||'無數值加成'}</div>
            <div class="forge-action-btn" onclick="forgeAction('enhance')">強化 (提昇現有數值 10%)<br><span style="font-size:12px;color:#ffaa00;">💎 ${costs.enhance}</span></div>
            <div class="forge-action-btn" onclick="forgeAction('reroll')">重鑄 (重新骰出數值類型)<br><span style="font-size:12px;color:#ffaa00;">💎 ${costs.reroll}</span></div>
            <div class="forge-action-btn" onclick="forgeAction('add')">附加 (增加一條新詞綴)<br><span style="font-size:12px;color:#ffaa00;">💎 ${costs.add}</span></div>
            <div style="flex:1;"></div>
            <div class="forge-action-btn salvage" onclick="forgeAction('salvage')">分解 (摧毀裝備)<br><span style="font-size:12px;color:#00ff00;">獲得 💎 ${costs.salvage}</span></div>
        `;
    } else {
        panelContainer.innerHTML = `<div style="text-align:center; color:#888;">請由左側選擇裝備進行鍛造</div>`;
    }
}

function forgeAction(actionType) {
    if(!forgeSelectedUid) return;
    let invItem = PlayerState.inventory.find(i => i.uid === forgeSelectedUid);
    let rarity = DB.rarities[invItem.rarity];
    let costs = { enhance: 50 + invItem.enhance * 100, reroll: 350 * rarity.mult, add: 100 * rarity.mult, salvage: rarity.salvage + invItem.enhance*10 };

    if (actionType === 'salvage') {
        showSysMsg(`確定要分解此裝備嗎？<br>已裝備的物品分解後會自動卸下。`, () => {
            PlayerState.magicStones += costs.salvage;
            // Remove from heroes
            PlayerState.roster.forEach(h => { Object.keys(h.equip).forEach(k => { if (h.equip[k] === invItem.uid) h.equip[k] = null; }); });
            // Remove from inv
            PlayerState.inventory = PlayerState.inventory.filter(i => i.uid !== invItem.uid);
            forgeSelectedUid = null; saveGame(); renderForgeHub();
        }, true);
        return;
    }

    if (PlayerState.magicStones < costs[actionType]) { showSysMsg("魔石不足！"); return; }

    if (actionType === 'enhance') {
        if(invItem.enhance >= 10) { showSysMsg("強化已達上限 (+10)！"); return; }
        
        // 設定成功率：+0 是 100%, +5 是 50%, +9 是 10%
        let successRate = 1.0 - (invItem.enhance * 0.1); 
        
        PlayerState.magicStones -= costs.enhance; // 先扣錢
        
        if (Math.random() < successRate) {
            invItem.enhance++;
            showSysMsg(`強化成功！目前等級 +${invItem.enhance}`);
        } else {
            showSysMsg("強化失敗... 魔石已碎裂散落一地。");
        }
    } else if (actionType === 'reroll') {
        PlayerState.magicStones -= costs.reroll;
        let statCount = Object.keys(invItem.stats).length;
        let itemTemp = DB.items[invItem.itemId];
        
        // 判斷部位允許的詞綴
        let allowedKeys = itemTemp.type === 'weapon' ? ['atk', 'spd', 'critR', 'critD', 'hp'] : 
                          (itemTemp.type === 'body' || itemTemp.type === 'head') ? ['hp', 'def', 'spd', 'eva', 'blk', 'reg'] : 
                          DB.statTypes.map(s => s.key);
        
        let pool = DB.statTypes.filter(s => allowedKeys.includes(s.key));
        let generatedStats = {};
        
        for(let i=0; i<statCount; i++) {
            if(pool.length === 0) break;
            let idx = pickByWeight(pool); // 使用權重抽取
            let sType = pool.splice(idx, 1)[0];
            let rawVal = sType.baseRoll * Math.max(1, 1 + (PlayerState.stage * 0.01)) * rarity.mult * (0.5 + Math.random() * 0.5);
            generatedStats[sType.key] = sType.isPct ? Math.min(sType.max || Infinity, rawVal) : Math.max(1, Math.floor(rawVal));
        }
        invItem.stats = generatedStats;
    } else if (actionType === 'add') {
        let currentKeys = Object.keys(invItem.stats);
        if(currentKeys.length >= 5) { showSysMsg("已達最多詞綴數量 (5)！"); return; }
        
        let itemTemp = DB.items[invItem.itemId];
        let allowedKeys = itemTemp.type === 'weapon' ? ['atk', 'spd', 'critR', 'critD', 'hp'] : 
                          (itemTemp.type === 'body' || itemTemp.type === 'head') ? ['hp', 'def', 'spd', 'eva', 'blk', 'reg'] : 
                          DB.statTypes.map(s => s.key);
                          
        // 過濾出：1. 該部位允許的 2. 裝備上還沒有的詞綴
        let pool = DB.statTypes.filter(s => allowedKeys.includes(s.key) && !currentKeys.includes(s.key));
        if(pool.length === 0) { showSysMsg("無法獲得更多種類詞綴！"); return; }
        
        PlayerState.magicStones -= costs.add;
        let idx = pickByWeight(pool); // 使用權重抽取
        let sType = pool[idx];
        let rawVal = sType.baseRoll * Math.max(1, 1 + (PlayerState.stage * 0.01)) * rarity.mult * (0.5 + Math.random() * 0.5);
        invItem.stats[sType.key] = sType.isPct ? Math.min(sType.max || Infinity, rawVal) : Math.max(1, Math.floor(rawVal));
    }
    saveGame(); renderForgeHub();
}

function openItemModal(slotKey, hero) {
    const modal = document.getElementById('item-modal'); const listContainer = document.getElementById('modal-item-list');
    listContainer.innerHTML = ''; document.getElementById('modal-title').innerText = `選擇裝備 (點擊替換)`;

    let unequipDiv = document.createElement('div'); unequipDiv.className = 'item-row'; 
    unequipDiv.innerHTML = `<div style="text-align:center; color:#ffaa00; font-weight:bold;">[ 卸下目前裝備 ]</div>`;
    unequipDiv.onclick = () => { hero.equip[slotKey] = null; closeItemModal(); saveGame(); renderEquipHub(); }; 
    listContainer.appendChild(unequipDiv);

    let equipMap = {};
    PlayerState.roster.forEach(h => { Object.values(h.equip).forEach(uid => { if (uid) equipMap[uid] = DB.classes[h.classId].name; }); });

    PlayerState.inventory.forEach(invItem => {
        let itemTemp = DB.items[invItem.itemId]; // 統一叫 itemTemp
        if (!itemTemp) return;
        let itemType = slotKey.startsWith('acc') ? 'acc' : slotKey;
        
        // 檢查部位
        if (itemTemp.type !== itemType) return;
        
        // 檢查職業專屬限制 (支援字串與陣列)
        if (itemTemp.exclusive) {
            let allowedClasses = Array.isArray(itemTemp.exclusive) ? itemTemp.exclusive : [itemTemp.exclusive];
            if (!allowedClasses.includes(hero.classId)) {
                return; 
            }
        }

        let equippedBy = equipMap[invItem.uid]; let isWornByMe = (hero.equip[slotKey] === invItem.uid);
        let rarity = DB.rarities[invItem.rarity] || DB.rarities['common'];
        
        let div = document.createElement('div'); div.className = 'item-row' + (isWornByMe ? ' equipped' : '');
        let equipStatus = isWornByMe ? '<span style="color:#00ffcc;">(目前裝備中)</span>' : (equippedBy ? `<span style="color:#ff6666;">(${equippedBy} 穿戴中)</span>` : '');

        // 修復：改讀取背包中實體物件的隨機詞綴，並正確計算強化倍率
        let statText = "無隨機屬性";
        if (invItem.stats && Object.keys(invItem.stats).length > 0) {
            statText = Object.entries(invItem.stats).map(([k,v])=>{
                let t = DB.statTypes.find(s=>s.key===k);
                if (!t) return '';
                let mult = 1 + ((invItem.enhance || 0) * 0.1);
                let finalVal = t.isPct ? `+${(v*mult*100).toFixed(1)}%` : `+${Math.floor(v*mult)}`;
                return `${t.name}: ${finalVal}`;
            }).filter(s => s !== '').join(', ');
        }

        // 取得翻譯好的職業限制文字
        let limitText = getExclusiveText(itemTemp.exclusive);

        div.innerHTML = `
            <div style="display:flex; justify-content:space-between;">
                <!-- 加入顏色特效與強化等級顯示 -->
                <strong class="${rarity.class}">${itemTemp.name} ${invItem.enhance>0?'+'+invItem.enhance:''}</strong>
                <span style="font-size:12px;">${equipStatus}</span>
            </div>
            <div style="font-size:11px; color:#aaa; margin-top:3px;">${limitText}</div>
            <div class="item-desc" style="margin-top:3px;">${statText}</div>
            <div class="item-desc" style="color:#ffea88;">解鎖技能: ${itemTemp.skill1?DB.skills[itemTemp.skill1].name:''}${itemTemp.skill2?', '+DB.skills[itemTemp.skill2].name:''}</div>
        `;
        
        div.onclick = () => {
            if (equippedBy && !isWornByMe) { PlayerState.roster.forEach(h => { Object.keys(h.equip).forEach(k => { if (h.equip[k] === invItem.uid) h.equip[k] = null; }); }); }
            hero.equip[slotKey] = invItem.uid; closeItemModal(); saveGame(); renderEquipHub(); 
        };
        listContainer.appendChild(div);
    });
    modal.style.display = 'flex';
}

function closeItemModal() { document.getElementById('item-modal').style.display = 'none'; }
function startNextStage() {
    if (PlayerState.activePartyIds.filter(id => id).length === 0) { showSysMsg("至少需要派一名隊員上場！"); return; }
    document.getElementById('end-of-time-ui').style.display = 'none'; initBattle();
}

// 啟動流程
if (!loadGame()) { PlayerState.initNew(); }
openEndOfTimeHub();
</script>
