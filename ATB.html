<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title> 超時空之戰 </title>
<style>
    /* 基本重置與全螢幕設定 */
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
    height: 100%; /* 確保根元素不會超過螢幕 */
    overflow: hidden; /* 徹底鎖死捲軸 */
    touch-action: none; /* 防止手機的預設雙擊放大或滑動手勢 */
    }
    body { background-color: #111; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; touch-action: none; }
    
    /* 遊戲主視窗 */
    #game-container {
        position: relative; width: 100vw; height: 100dvh; max-width: 540px; margin: 0 auto;
        background: #222; box-shadow: 0 0 20px rgba(0,0,0,0.8); display: flex; flex-direction: column;
    }
    
    #game-canvas { flex: 1; width: 100%; display: block; transition: background 1s ease-in-out; }
    #battle-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #stage-info { position: absolute; top: 10px; left: 15px; font-size: 18px; font-weight: bold; color: #fff; text-shadow: 1px 1px 3px #000; display:flex; flex-direction:column; gap:5px;}
    .currency-tag { font-size: 14px; color: #ff00ff; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 10px; display: inline-block;}

    /* 技能指令選單 */
    #action-menu {
        position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0, 0, 0, 0.95);
        border-top: 2px solid #aaa; padding: 10px; display: none; pointer-events: auto;
        flex-direction: column; gap: 8px; z-index: 100; animation: slideUp 0.2s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    
    .menu-header { text-align: center; font-weight: bold; color: #ffd700; margin-bottom: 5px; font-size: 1.1em;}
    .skill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 250px; overflow-y: auto;}
    .btn { background: linear-gradient(180deg, #444, #222); border: 1px solid #777; border-radius: 5px; color: white; padding: 12px; font-size: 14px; text-align: center; cursor: pointer; transition: 0.1s; display:flex; flex-direction:column; align-items:center; }
    .btn:active { background: #555; transform: scale(0.98); }
    .btn.combo { border-color: #ffaa00; color: #ffea88; background: linear-gradient(180deg, #663300, #331100); }
    .btn.combo-ultimate { border-color: #ff00ff; color: #ffccff; background: linear-gradient(180deg, #440044, #110011); }
    .btn.disabled { opacity: 0.5; pointer-events: none; filter: grayscale(1); }

    /* 瞄準模式 UI */
    #targeting-ui { position: absolute; bottom: 20px; left: 0; width: 100%; display: none; pointer-events: auto; flex-direction: column; align-items: center; gap: 10px; z-index: 100; }
    .target-msg { background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 20px; color: #00ffcc; border: 1px solid #00ffcc; font-weight: bold;}
    .cancel-btn { background: #aa3333; padding: 10px 30px; border-radius: 5px; border: 2px solid #ff5555; color: white; font-weight: bold; cursor: pointer;}

    /* 時間的盡頭 UI (Hub) */
    #end-of-time-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 20, 0.95); display: none; flex-direction: column; pointer-events: auto; z-index: 200; padding: 15px; overflow-y: hidden; }
    .hub-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 10px; }
    .hub-title { color: #bbaaff; font-size: 24px; text-shadow: 0 0 10px #7755ff; margin-bottom: 5px;}
    .stage-selector { display:flex; align-items:center; gap: 10px; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; border: 1px solid #444; }
    .stage-btn { background: #444; border:none; color:white; width: 25px; height: 25px; border-radius:50%; font-weight:bold; cursor:pointer;}
    .stage-btn:active { background: #666; }
    
    .hub-nav { display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto; flex-shrink: 0;}
    .hub-tab { flex: 1; padding: 8px 5px; text-align: center; background: #333; border-radius: 5px; cursor: pointer; font-size: 13px; min-width: 60px;}
    .hub-tab.active { background: #5544aa; border: 1px solid #9988ff; }
    .hub-content { flex: 1; display: none; flex-direction: column; gap: 10px; overflow: hidden; }
    .hub-content.active { display: flex; }

    /* 隊伍設定介面 */
    .party-slots { display: flex; justify-content: space-around; background: #222; padding: 15px 5px; border-radius: 8px; border: 1px solid #444; }
    .party-slot { width: 80px; height: 100px; background: #111; border: 2px dashed #666; border-radius: 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; cursor: pointer;}
    .party-slot.selected { border-color: #ffaa00; background: #332200; }
    .party-slot .emoji { font-size: 36px; }
    .roster-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; overflow-y: auto; padding-bottom: 20px;}
    .roster-char { background: #222; padding: 10px; text-align: center; border-radius: 5px; border: 1px solid #444; cursor: pointer; display:flex; flex-direction:column; align-items:center; }
    .roster-char:active { background: #444; }
    .roster-char.in-party { opacity: 0.4; pointer-events: none; }

    /* 裝備與詳細數值介面 */
    .equip-layout { display: flex; flex-direction: column; gap: 10px; height: 100%; overflow: hidden; }
    .equip-top-row { display: flex; gap: 10px; max-height: 120px; overflow-x: auto; padding-bottom: 5px;}
    .equip-char-btn { min-width: 80px; padding: 10px; background: #222; border: 1px solid #444; text-align: center; border-radius: 5px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px;}
    .equip-char-btn.active { background: #44aa44; border-color: #66cc66;}
    
    .equip-bottom-row { display: flex; gap: 10px; flex: 1; overflow: hidden; }
    .equip-slots { flex: 1; background: #222; padding: 10px; border-radius: 5px; display: flex; flex-direction: column; gap: 8px; overflow-y:auto;}
    .equip-stats-panel { flex: 1; background: #1a1a1a; border: 1px solid #00ffcc; border-radius: 5px; padding: 10px; overflow-y: auto; color: #ccc; font-size: 13px;}
    .stat-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #444; }
    .stat-val { color: #fff; font-weight: bold; }
    .stat-val.high { color: #00ffcc; }
    
    .equip-item { display: flex; flex-direction: column; background: #111; padding: 10px; border: 1px solid #555; border-radius: 5px; cursor: pointer;}
    .equip-item:active { background: #333; }
    .equip-row-top { display: flex; align-items: center; justify-content: space-between; }
    .equip-type { color: #888; font-size: 12px; width: 45px; }
    .equip-name { flex: 1; text-align: left; padding-left: 5px; font-weight: bold; font-size: 14px;}

    /* 裝備品質顏色 */
    .rarity-common { color: #dddddd; }
    .rarity-uncommon { color: #44ff44; text-shadow: 0 0 5px rgba(0,255,0,0.3);}
    .rarity-rare { color: #44aaff; text-shadow: 0 0 5px rgba(0,150,255,0.4);}
    .rarity-epic { color: #dd44ff; text-shadow: 0 0 5px rgba(200,0,255,0.5);}
    .rarity-legendary { color: #ffcc00; text-shadow: 0 0 8px rgba(255,200,0,0.8);}

    /* 鍛造所 */
    .forge-layout { display: flex; gap: 10px; height: 100%; overflow: hidden; }
    .forge-inventory { flex: 1; display:flex; flex-direction:column; gap:8px; overflow-y:auto; background: #222; padding: 10px; border-radius:5px;}
    .forge-panel { flex: 1; background: #1a1a1a; border: 1px solid #ff00ff; border-radius: 5px; padding: 10px; display:flex; flex-direction:column; gap:10px; overflow-y:auto;}
    .forge-action-btn { background: #442244; border: 1px solid #ff00ff; color: white; padding: 10px; border-radius: 5px; cursor: pointer; text-align:center; font-weight:bold;}
    .forge-action-btn:active { background: #662266; }
    .forge-action-btn.salvage { background: #442222; border-color: #ff4444; }

    /* 系統設定 */
    .sys-btn { padding: 12px; background: #333; border: 1px solid #666; border-radius: 5px; color: white; cursor: pointer; text-align:center; font-weight:bold;}
    .sys-btn.danger { background: #551111; border-color: #ff3333; color: #ffaaaa;}

    /* 彈窗 */
    .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 300; display: none; flex-direction: column; padding: 20px; }
    .modal-title { font-size: 20px; color: #ffaa00; margin-bottom: 15px; text-align: center;}
    .item-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .item-row { background: #222; padding: 12px; border: 1px solid #555; border-radius: 5px; cursor: pointer; display: flex; flex-direction: column;}
    .item-row.equipped { border-color: #884444; }
    .item-desc { font-size: 12px; color: #aaa; margin-top: 6px; }
    .close-modal { margin-top: 15px; padding: 15px; background: #444; text-align: center; border-radius: 5px; font-weight: bold; cursor: pointer;}
    
    #sys-modal-box { background: #222; border: 2px solid #555; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; align-items:center; gap: 15px; margin: auto; max-width: 90%;}
    .sys-modal-btns { display: flex; gap: 10px; width: 100%; }
    .sys-modal-btn { flex: 1; padding: 10px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; }

    .start-btn { padding: 15px; background: linear-gradient(180deg, #008800, #004400); color: white; text-align: center; font-size: 18px; font-weight: bold; border-radius: 8px; border: 2px solid #00aa00; cursor: pointer; margin-top: auto; flex-shrink: 0;}
    
    #stage-msg { position: absolute; top: 35%; left: 0; width: 100%; text-align: center; pointer-events: none; opacity: 0; transition: 0.5s; z-index: 150;}
    .clear-title { font-size: 40px; font-weight: bold; color: #ffea00; text-shadow: 0 0 15px #ff5500; margin-bottom: 10px;}
    .boss-title { font-size: 45px; font-weight: bold; color: #ff0000; text-shadow: 0 0 20px #ffea00; margin-bottom: 10px;}
    .gameover-title { font-size: 45px; font-weight: bold; color: #555; text-shadow: 0 0 20px #ff0000; margin-bottom: 10px;}
    .loot-text { font-size: 14px; font-weight: bold; color: #00ffaa; text-shadow: 0 0 5px #000; background: rgba(0,0,0,0.6); display: inline-block; padding: 5px 15px; border-radius: 20px; max-width: 90%; word-wrap: break-word; line-height: 1.4;}
</style>
</head>
<body>

<div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="battle-ui">
        <div id="stage-info">
            <div>Stage <span id="ui-stage-num">1</span></div>
            <div class="currency-tag">💎 <span id="ui-magic-stones-battle">0</span></div>
        </div>
        <div id="stage-msg">
            <div class="clear-title" id="stage-msg-title">Stage Clear!</div>
            <div class="loot-text" id="loot-info" style="display:none;"></div>
            <div id="hub-return-btn" class="start-btn" style="display:none; pointer-events:auto; margin-top:20px;" onclick="openEndOfTimeHub()">在時間的盡頭甦醒</div>
        </div>
        
        <div id="action-menu">
            <div class="menu-header" id="menu-actor-name">Actor Name</div>
            <div class="skill-grid" id="skill-container"></div>
        </div>

        <div id="targeting-ui">
            <div class="target-msg">請點擊目標...</div>
            <div class="cancel-btn" onclick="cancelTargeting()">取消 (返回選單)</div>
        </div>
    </div>

    <!-- Hub UI -->
    <div id="end-of-time-ui">
        <div class="hub-header">
            <div class="hub-title">🌌 時間的盡頭 🌌</div>
            <div class="stage-selector">
                <button class="stage-btn" onclick="changeHubStage(-1)">-</button>
                <span>挑戰關卡: <span id="hub-target-stage">1</span></span>
                <button class="stage-btn" onclick="changeHubStage(1)">+</button>
            </div>
            <div class="currency-tag" style="margin-top:5px;">魔石碎片: <span id="ui-magic-stones-hub">0</span></div>
        </div>
        
        <div class="hub-nav">
            <div class="hub-tab active" onclick="switchHubTab(this, 'party')">陣容</div>
            <div class="hub-tab" onclick="switchHubTab(this, 'equip')">裝備</div>
            <div class="hub-tab" onclick="switchHubTab(this, 'forge')">鍛造</div>
            <div class="hub-tab" onclick="switchHubTab(this, 'system')">系統</div>
        </div>

        <!-- Tab: Party -->
        <div id="tab-party" class="hub-content active">
            <div style="color: #aaa; font-size: 12px; text-align:center;">點擊上方空位，再點選下方角色進行替換</div>
            <div class="party-slots" id="ui-party-slots"></div>
            <div class="roster-list" id="ui-roster-list"></div>
        </div>

        <!-- Tab: Equip -->
        <div id="tab-equip" class="hub-content">
            <div class="equip-layout">
                <div class="equip-top-row" id="ui-equip-chars"></div>
                <div class="equip-bottom-row">
                    <div class="equip-slots" id="ui-equip-slots"></div>
                    <div class="equip-stats-panel" id="ui-equip-stats"></div>
                </div>
            </div>
        </div>

        <!-- Tab: Forge -->
        <div id="tab-forge" class="hub-content">
            <div class="forge-layout">
                <div class="forge-inventory" id="ui-forge-inventory"></div>
                <div class="forge-panel" id="ui-forge-panel">
                    <div style="text-align:center; color:#888;">請由左側選擇裝備</div>
                </div>
            </div>
        </div>
        
        <!-- Tab: System -->
        <div id="tab-system" class="hub-content">
            <h3 style="color:#ffaa00; text-align:center; margin-bottom: 10px;">檔案管理</h3>
            <div class="sys-btn" onclick="saveGame(true)">💾 強制手動存檔</div>
            <div class="sys-btn" onclick="exportSave()">📤 匯出存檔 (JSON)</div>
            <label class="sys-btn" style="display:block;">
                📥 匯入存檔
                <input type="file" accept=".json" style="display:none;" onchange="importSave(event)">
            </label>
            <div style="flex:1;"></div>
            <div class="sys-btn danger" onclick="confirmReset()">⚠️ 重置所有遊戲進度</div>
        </div>

        <div class="start-btn" onclick="startNextStage()">進入戰鬥 ➔</div>
    </div>

    <!-- Modals -->
    <div id="item-modal" class="modal-overlay">
        <div class="modal-title" id="modal-title">選擇裝備</div>
        <div class="item-list" id="modal-item-list"></div>
        <div class="close-modal" onclick="closeItemModal()">關閉</div>
    </div>

    <div id="sys-modal" class="modal-overlay" style="z-index:999; justify-content:center;">
        <div id="sys-modal-box">
            <div id="sys-modal-text" style="font-size:16px; text-align:center; line-height:1.5;">Message</div>
            <div class="sys-modal-btns" id="sys-modal-btns">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>
</div>

<script>
const DB = {
    classes: {
        warrior:   { id: 'warrior', name: '戰士', emoji: '🛡️', hp: 500, atk: 40, def: 30, spd: 40, color: '#e74c3c' },

        graveyard: { bg: 'linear-gradient(to bottom, #141e30, #243b55, #000000)', scenery: ['🪦', '💀', '🥀', '🦴'], enemySkins: { light: {e:'🦇', n:'蝙蝠'}, heavy: {e:'🧟', n:'殭屍'}, mage: {e:'👻', n:'幽靈'}, boss: {e:'🧙‍♂️', n:'巫妖王'} } },
        volcano: { bg: 'linear-gradient(to bottom, #4a0000, #220000, #110000)', scenery: ['🌋', '🔥', '☄️', '🌑'], enemySkins: { light: {e:'🐕‍🦺', n:'地獄犬'}, heavy: {e:'👹', n:'食人魔'}, mage: {e:'🔥', n:'火元素'}, boss: {e:'🐉', n:'遠古紅龍'} } },

        sky: { bg: 'linear-gradient(to bottom, #87CEEB, #f0f8ff)', scenery: ['☁️', '🦅', '⛅', '✨'], enemySkins: { light: {e:'🦅', n:'神鷹'}, heavy: {e:'🛡️', n:'天界守衛'}, mage: {e:'⚡', n:'雷雲'}, boss: {e:'👼', n:'墮落天使'} } },
        mech: { bg: 'linear-gradient(to bottom, #333333, #666666)', scenery: ['⚙️', '🔧', '🔋', '🏗️'], enemySkins: { light: {e:'🛸', n:'探測機'}, heavy: {e:'🤖', n:'破壞者'}, mage: {e:'📡', n:'干擾塔'}, boss: {e:'🦾', n:'終極機甲'} } },

    enemyPrototypes: {
        light: { hp: 120, atk: 25, def: 5, spd: 65, type: 'melee', radius: 18 },
        heavy: { hp: 300, atk: 35, def: 20, spd: 30, type: 'melee', radius: 24 },
        mage:  { hp: 150, atk: 40, def: 10, spd: 50, type: 'ranged', radius: 18 },
        boss:  { hp: 1500, atk: 70, def: 35, spd: 45, type: 'boss', radius: 45, isBoss: true }
    },
    rarities: {
        common:    { name: '普通', color: '#dddddd', mult: 1.0, stats: 1, class: 'rarity-common', salvage: 10 },
        uncommon:  { name: '精良', color: '#44ff44', mult: 1.5, stats: 2, class: 'rarity-uncommon', salvage: 25 },
        rare:      { name: '稀有', color: '#44aaff', mult: 2.0, stats: 3, class: 'rarity-rare', salvage: 50 },

    },
    statTypes: [
        { key: 'hp', name: 'HP', isPct: false, baseRoll: 20, weight: 100 },
        { key: 'atk', name: '攻擊', isPct: false, baseRoll: 2, weight: 100 },
        { key: 'def', name: '防禦', isPct: false, baseRoll: 2, weight: 100 },

        { key: 'critR', name: '爆擊率', isPct: true, baseRoll: 0.003, max: 0.8, weight: 30 },
        { key: 'critD', name: '爆傷', isPct: true, baseRoll: 0.02, max: 3.0, weight: 20 },
        { key: 'eva', name: '閃避率', isPct: true, baseRoll: 0.003, max: 0.6, weight: 30 },
        { key: 'blk', name: '格檔率', isPct: true, baseRoll: 0.004, max: 0.6, weight: 40 },
        { key: 'reg', name: '再生', isPct: true, baseRoll: 0.002, max: 0.5, weight: 10 }
    ],
    skills: {
        attack:        { name: "普通攻擊", type: "damage", target: "single", power: 1.0, cd: 0, desc: "基本攻擊" },

function generateUID() { return 'uid_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 5); }

function getExclusiveText(exclusive) {
    if (!exclusive) return '全職業通用';
    let classes = Array.isArray(exclusive) ? exclusive : [exclusive];
    let classNames = classes.map(id => DB.classes[id] ? DB.classes[id].name : id);
    return '專屬: ' + classNames.join(' / ');
}

function pickByWeight(pool) {
    if (!pool || pool.length === 0) return null;
    let totalWeight = pool.reduce((sum, item) => sum + (item.weight || 1), 0);
    let randomVal = Math.random() * totalWeight;
    for (let i = 0; i < pool.length; i++) {
        randomVal -= (pool[i].weight || 1);
        if (randomVal <= 0) return i; // 回傳抽中的索引
    }
    return pool.length - 1; // Fallback
}

const PlayerState = {
    stage: 1, targetStage: 1, maxStage: 1, magicStones: 0, battleCount: 0, inventory: [], roster: [], activePartyIds: ['warrior', 'mage', 'priest'],
    
    initNew() {
        this.stage = 1; this.targetStage = 1; this.maxStage = 1; this.magicStones = 0; this.inventory = []; this.roster = [];
        this.activePartyIds = ['warrior', 'mage', 'priest'];
        Object.keys(DB.classes).forEach(clsId => {
            this.roster.push({ 
                id: clsId, classId: clsId, equip: { weapon: null, head: null, body: null, acc1: null, acc2: null },
                intrinsicStats: { hp: 0, atk: 0, def: 0 }, skillLevels: { attack: 1 }
            });
        });
        
        // Initial Weapons (White rarity, low stats)
        this.addAndEquipItem('w_broadsword', 'warrior', 'weapon', 'common', 1);
        this.addAndEquipItem('w_staff', 'mage', 'weapon', 'common', 1);
        this.addAndEquipItem('w_mace', 'priest', 'weapon', 'common', 1);
        this.addAndEquipItem('w_dagger', 'rogue', 'weapon', 'common', 1);
        this.addAndEquipItem('w_bow', 'ranger', 'weapon', 'common', 1);
        this.addAndEquipItem('w_katana', 'swordsman', 'weapon', 'common', 1);
    },
    
    generateEquip(itemId, rarityKey, stageLv) {
        let template = DB.items[itemId]; if(!template) return null;
        let rarity = DB.rarities[rarityKey];
        let statCount = rarity.stats;
        let generatedStats = {};
        
        // 1. 定義各部位允許的詞綴池與必備屬性
        let allowedKeys = [];
        let guaranteedKeys = [];
        
        if (template.type === 'weapon') {
            allowedKeys = ['atk', 'spd', 'critR', 'critD', 'hp']; // 武器能抽的屬性
            guaranteedKeys = ['atk']; // 必定要有攻擊
        } else if (template.type === 'body' || template.type === 'head') {
            allowedKeys = ['hp', 'def', 'spd', 'eva', 'blk', 'reg']; // 防具能抽的屬性
            guaranteedKeys = Math.random() > 0.5 ? ['hp'] : ['def']; // 必定有血或防
        } else {
            // 飾品 (acc) 什麼都能抽
            allowedKeys = DB.statTypes.map(s => s.key);
        }

        // 從總池子過濾出允許的屬性
        let pool = DB.statTypes.filter(s => allowedKeys.includes(s.key));

        // 輔助函式：計算單一屬性數值
        const rollStatValue = (sType) => {
            let rawVal = sType.baseRoll * Math.max(1, 1 + (stageLv * 0.01)) * rarity.mult * (0.5 + Math.random() * 0.5);
            return sType.isPct ? Math.min(sType.max || Infinity, rawVal) : Math.max(1, Math.floor(rawVal));
        };

        // 2. 先塞入必備屬性
        for (let gKey of guaranteedKeys) {
            if (statCount <= 0) break;
            let sType = pool.find(s => s.key === gKey);
            if (sType) {
                generatedStats[sType.key] = rollStatValue(sType);
                // 把已經抽到的屬性從池子移除，避免重複
                pool = pool.filter(s => s.key !== sType.key);
                statCount--;
            }
        }

        // 3. 根據剩餘次數與「權重」抽取剩下的屬性
        for(let i=0; i<statCount; i++) {
            if(pool.length === 0) break;
            let idx = pickByWeight(pool); // 使用剛剛寫的權重抽取函式
            let sType = pool.splice(idx, 1)[0];
            generatedStats[sType.key] = rollStatValue(sType);
        }
        
        return { uid: generateUID(), itemId, rarity: rarityKey, stats: generatedStats, enhance: 0 };
    },

    rollLoot(isBoss) {
        let itemsToDrop = isBoss ? (2 + Math.floor(Math.random()*2)) : (Math.random() < 0.3 ? 1 : 0);
        let dropped = [];
        let allKeys = Object.keys(DB.items);
        for(let i=0; i<itemsToDrop; i++) {
            let itemId = allKeys[Math.floor(Math.random() * allKeys.length)];
            let rarityRoll = Math.random();
            let rKey = 'common';
            if (isBoss) {
                if(rarityRoll < 0.1) rKey = 'legendary';
                else if(rarityRoll < 0.4) rKey = 'epic';
                else if(rarityRoll < 0.9) rKey = 'rare';
                else rKey = 'uncommon';
            } else {
                if(rarityRoll < 0.01) rKey = 'legendary';
                else if(rarityRoll < 0.05) rKey = 'epic';
                else if(rarityRoll < 0.2) rKey = 'rare';
                else if(rarityRoll < 0.5) rKey = 'uncommon';
            }
            let newItem = this.generateEquip(itemId, rKey, this.stage);
            this.inventory.push(newItem);
            dropped.push(newItem);
        }
        return dropped;
    },

    addAndEquipItem(itemId, heroId, slot, rarityKey='common', stageLv=1) {
        let newItem = this.generateEquip(itemId, rarityKey, stageLv);
        this.inventory.push(newItem);
        let hero = this.roster.find(h => h.id === heroId);
        if (hero && newItem) hero.equip[slot] = newItem.uid;
    },

    getHero(id) { return this.roster.find(h => h.id === id); },

    getCalculatedStats(heroData) {
        const base = DB.classes[heroData.classId];
        let intr = heroData.intrinsicStats || {hp:0,atk:0,def:0};
        let stats = { hp: base.hp + intr.hp, maxHp: base.hp + intr.hp, atk: base.atk + intr.atk, def: base.def + intr.def, spd: base.spd, critR: 0, critD: 1.5, eva: 0, blk: 0, reg: 0 };
        let skills = ['attack'];
        
        Object.values(heroData.equip).forEach(uid => {
            if (uid) {
                let invItem = this.inventory.find(i => i.uid === uid);
                if (invItem && DB.items[invItem.itemId]) {
                    let itemTemp = DB.items[invItem.itemId];
                    let mult = 1 + (invItem.enhance * 0.1); 

                    if (itemTemp.baseStats) {
                        if (itemTemp.baseStats.hp) { stats.maxHp += itemTemp.baseStats.hp; stats.hp += itemTemp.baseStats.hp; }
                        if (itemTemp.baseStats.atk) stats.atk += itemTemp.baseStats.atk;
                        if (itemTemp.baseStats.def) stats.def += itemTemp.baseStats.def;
                        if (itemTemp.baseStats.spd) stats.spd += itemTemp.baseStats.spd;
                        if (itemTemp.baseStats.critR) stats.critR += itemTemp.baseStats.critR;
                        if (itemTemp.baseStats.critD) stats.critD += itemTemp.baseStats.critD;
                        if (itemTemp.baseStats.eva) stats.eva += itemTemp.baseStats.eva;
                        if (itemTemp.baseStats.blk) stats.blk += itemTemp.baseStats.blk;
                        if (itemTemp.baseStats.reg) stats.reg += itemTemp.baseStats.reg;
                    }
                    
                    if (invItem.stats) {
                        if (invItem.stats.hp) { let v = Math.floor(invItem.stats.hp*mult); stats.maxHp += v; stats.hp += v; }
                        if (invItem.stats.atk) stats.atk += Math.floor(invItem.stats.atk*mult);
                        if (invItem.stats.def) stats.def += Math.floor(invItem.stats.def*mult);
                        if (invItem.stats.spd) stats.spd += Math.floor(invItem.stats.spd*mult);
                        if (invItem.stats.critR) stats.critR += invItem.stats.critR*mult;
                        if (invItem.stats.critD) stats.critD += invItem.stats.critD*mult;
                        if (invItem.stats.eva) stats.eva += invItem.stats.eva*mult;
                        if (invItem.stats.blk) stats.blk += invItem.stats.blk*mult;
                        if (invItem.stats.reg) stats.reg += invItem.stats.reg*mult;
                    }
                    if (itemTemp.skill1) skills.push(itemTemp.skill1);
                    if (itemTemp.skill2) skills.push(itemTemp.skill2);
                }
            }
        });
        stats.hp = Math.max(1, stats.hp); stats.maxHp = Math.max(1, stats.maxHp);
        stats.atk = Math.max(1, stats.atk); stats.def = Math.max(0, stats.def);
        stats.spd = Math.max(1, stats.spd);
        stats.critR = Math.min(1, stats.critR); stats.eva = Math.min(0.8, stats.eva); stats.blk = Math.min(0.8, stats.blk);
        return { stats, skills };
    }
};

// Auto Save / Load
function saveGame(manual=false) {
    try {
        localStorage.setItem('infinite_rpg_save', JSON.stringify(PlayerState));
        if(manual) showSysMsg("檔案已成功儲存！");
    } catch(e) { console.error("Save failed", e); }
}

function loadGame() {
    let saved = localStorage.getItem('infinite_rpg_save');
    if (saved) {
        try {
            let data = JSON.parse(saved);
            Object.assign(PlayerState, data);
            
            // Ensure compatibility (migrations)
            if(!PlayerState.targetStage) PlayerState.targetStage = PlayerState.stage;
            if(!PlayerState.maxStage) PlayerState.maxStage = PlayerState.stage;
            if(PlayerState.magicStones === undefined) PlayerState.magicStones = 0;
            PlayerState.roster.forEach(h => {
                if(!h.intrinsicStats) h.intrinsicStats = {hp:0, atk:0, def:0};
                if(!h.skillLevels) h.skillLevels = {attack:1};
            });
            PlayerState.inventory.forEach(i => {
                if(i.enhance === undefined) i.enhance = 0;
            });
            return true;
        } catch(e) { console.error("Load failed", e); }
    }
    return false;
}

function exportSave() {
    let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(PlayerState));
    let dlAnchorElem = document.createElement('a');
    dlAnchorElem.setAttribute("href", dataStr);
    dlAnchorElem.setAttribute("download", "infinite_rpg_save.json");
    dlAnchorElem.click();
}

function importSave(event) {
    let file = event.target.files[0];
    if (!file) return;
    let reader = new FileReader();
    reader.onload = function(e) {
        try {
            let data = JSON.parse(e.target.result);
            Object.assign(PlayerState, data);
            saveGame();
            showSysMsg("讀取成功！即將重啟遊戲。", () => location.reload());
        } catch(err) {
            showSysMsg("讀取失敗，檔案格式不正確！");
        }
    };
    reader.readAsText(file);
}

function confirmReset() {
    showSysMsg("確定要刪除所有進度嗎？此操作無法還原！", () => {
        localStorage.removeItem('infinite_rpg_save');
        location.reload();
    }, true);
}


const canvas = document.getElementById('game-canvas'); const ctx = canvas.getContext('2d');
let GAME_WIDTH = 540; let GAME_HEIGHT = 960;
let battleActive = false; let entities = []; let effects = []; let sceneryObjects = [];let screenShake = 0;
let menuOpen = false; let targetingMode = false; let victoryTriggered = false; let currentActor = null; 
let pendingSkill = null; let pendingSkillId = null; let pendingPartners = []; let validTargets = [];
let lastTime = 0; let difficultyMultiplier = 1.0;

class Entity {
    constructor(isHero, data) {
        this.isHero = isHero; this.id = data.id || generateUID();
        this.rosterRef = isHero ? PlayerState.getHero(this.id) : null;
        
        this.emoji = data.emoji; this.name = data.name;
        this.maxHp = data.stats.maxHp; this.hp = this.maxHp;
        this.atk = data.stats.atk; this.def = data.stats.def; this.spd = data.stats.spd;
        this.critR = data.stats.critR || 0; this.critD = data.stats.critD || 1.5;
        this.eva = data.stats.eva || 0; this.blk = data.stats.blk || 0; this.reg = data.stats.reg || 0;
        
        this.skills = data.skills || ['attack']; this.color = data.color || '#fff';
        this.radius = data.radius || 20;
        this.atb = (Math.random() * 200); this.atbMax = 1000;
        this.state = 'idle'; this.baseX = 0; this.baseY = 0; this.x = 0; this.y = 0;
        this.targetX = 0; this.targetY = 0; this.wanderTimer = 0;
        this.aiType = data.aiType || 'melee'; this.isBoss = data.isBoss || false;
        
        this.skillCooldowns = {}; this.debuffs = {}; this.buffs = {}; this.hitFlash = 0;
    }
    get isDead() { return this.hp <= 0; }
    
    takeDamage(amount, isHeal = false, isCrit = false) {
        if (this.isDead) return;
        if (isHeal) {
            let actualHeal = Math.floor(amount); this.hp = Math.min(this.maxHp, this.hp + actualHeal);
            effects.push(new TextEffect(this.x, this.y - 30, `+${actualHeal}`, '#00ff00', 25));
        } else {
            let currentDef = this.def; if (this.buffs.def_up) currentDef *= this.buffs.def_up.val;
            let actualDmg = Math.max(1, Math.floor(amount - currentDef * 0.5)); this.hp -= actualDmg;
            this.hitFlash = 150;
            let color = isCrit ? '#ffea00' : '#ff3333'; let size = isCrit ? 32 : 20; let prefix = isCrit ? "Crit! " : "";
            effects.push(new TextEffect(this.x, this.y - 30, `-${actualDmg} ${prefix}`, color, size));
            
            // Combat Growth: Defense / HP when taking damage
            if (this.isHero && Math.random() < 0.2) {
                if(Math.random() < 0.5) {
                    this.rosterRef.intrinsicStats.def += 1; this.def += 1;
                    effects.push(new TextEffect(this.x, this.y - 50, `DEF UP!`, '#aaaaaa', 14));
                } else {
                    this.rosterRef.intrinsicStats.hp += 5; this.maxHp += 5;
                    effects.push(new TextEffect(this.x, this.y - 50, `MaxHP UP!`, '#ffaaaa', 14));
                }
            }
            
            this.y += this.isHero ? 5 : -5;
            if (this.hp <= 0) { 
                if (currentActor && currentActor.id === this.id) 
                { menuOpen = false; document.getElementById('action-menu').style.display = 'none'; cancelTargeting(); }
                this.hp = 0; this.state = 'dead'; this.atb = 0; this.debuffs={}; this.buffs={}; }
        }
    }
    
    update(dt) {
        if (this.hitFlash > 0) this.hitFlash -= dt;
        let isAnyoneActing = entities.some(e => e.state === 'acting');
        if (this.isDead || menuOpen || targetingMode || this.state === 'acting' || victoryTriggered || isAnyoneActing) return;
        if (this.state === 'idle') {
            this.atb += this.spd * (dt / 100); 
            //if (this.reg > 0) { let regAmt = this.maxHp * this.reg * (dt / 1000); this.hp = Math.min(this.maxHp, this.hp + regAmt); }
            if (this.atb >= this.atbMax) { this.atb = this.atbMax; this.processTurnStart(); }
        }
        if (!this.isHero && this.state === 'ready') this.monsterAI();
        if (this.state === 'idle' || this.state === 'ready') {
            this.wanderTimer -= dt;
            if (this.wanderTimer <= 0) {
                this.wanderTimer = 800 + Math.random() * 1200;
                this.targetX = Math.max(50, Math.min(GAME_WIDTH - 50, this.baseX + (Math.random() - 0.5) * 80));
                this.targetY = this.baseY + (Math.random() - 0.5) * 60;
            }
            this.x += (this.targetX - this.x) * 0.03; this.y += (this.targetY - this.y) * 0.03;
        }
    }
    
    processTurnStart() {
        if (this.reg > 0 && !this.isDead && this.hp < this.maxHp) //每回合REG
        {let healAmt = this.maxHp * this.reg; this.takeDamage(healAmt, true); effects.push(new ExplosionEffect(this.x, this.y, 30, '#00ff00'));}
        let skipTurn = false;
        if (this.debuffs.poison) { this.takeDamage(this.maxHp * 0.05); effects.push(new TextEffect(this.x, this.y-50, "中毒", "#00ff00", 14)); this.debuffs.poison--; if(this.debuffs.poison <= 0) delete this.debuffs.poison; }
        if (this.debuffs.bleed && !this.isDead) { this.takeDamage(this.maxHp * 0.08); effects.push(new TextEffect(this.x, this.y-50, "流血", "#ff0000", 14)); this.debuffs.bleed--; if(this.debuffs.bleed <= 0) delete this.debuffs.bleed; }
        if (this.debuffs.stun && !this.isDead) { effects.push(new TextEffect(this.x, this.y-50, "無法行動", "#ffff00", 16)); skipTurn = true; this.debuffs.stun--; if(this.debuffs.stun <= 0) delete this.debuffs.stun; }
        if (this.debuffs.blind) { this.debuffs.blind--; if(this.debuffs.blind <= 0) delete this.debuffs.blind; }
        for (let key in this.buffs) { this.buffs[key].turns--; if(this.buffs[key].turns <= 0) delete this.buffs[key]; }
        if (this.isDead) return;
        if (skipTurn) { this.finishTurn(); } else { this.state = 'ready'; if (this.isHero) openMenu(this); }
    }
    
    draw(ctx) {
        if (this.isDead) return;
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.ellipse(this.x, this.y + this.radius, this.radius, this.radius * 0.4, 0, 0, Math.PI * 2); ctx.fill();
        if (targetingMode && validTargets.includes(this)) {
            let t = performance.now() / 200; let pulse = Math.abs(Math.sin(t)) * 5;
            ctx.strokeStyle = this.isHero ? '#00ff00' : '#ff3333'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(this.x, this.y, this.radius + 10 + pulse, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.fillStyle = '#ffffff'; ctx.font = `${this.radius * 2}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; 
        let drawX = this.x;let drawY = this.y;if (this.hitFlash > 0) {drawX += (Math.random() - 0.5) * 8; drawY += (Math.random() - 0.5) * 8;}
        ctx.fillText(this.emoji, this.x, this.y);
        if (this.hitFlash > 0) {ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';ctx.beginPath();ctx.arc(drawX, drawY, this.radius, 0, Math.PI * 2);ctx.fill();}
        
        let statusY = this.y - this.radius - 25; let iconSpacing = 12; 
        let totalIcons = Object.keys(this.debuffs).length + Object.keys(this.buffs).length;
        let startX = this.x - (totalIcons * iconSpacing)/2;
        ctx.font = `12px Arial`;
        // --- Debuffs (負面狀態) ---
        if(this.debuffs.poison) { ctx.fillText('☠️', startX, statusY); startX += iconSpacing; }
        if(this.debuffs.bleed) { ctx.fillText('🩸', startX, statusY); startX += iconSpacing; }
        if(this.debuffs.stun) { ctx.fillText('⚡', startX, statusY); startX += iconSpacing; } 
        if(this.debuffs.blind) { ctx.fillText('👁️‍🗨️', startX, statusY); startX += iconSpacing; }
        // --- Buffs (正面狀態) ---
        if(this.buffs.def_up) { ctx.fillText('🛡️', startX, statusY); startX += iconSpacing; }
        if(this.buffs.atk_up) { ctx.fillText('⚔️', startX, statusY); startX += iconSpacing; } // 衝鋒號角、戰吼
        if(this.buffs.crit_up) { ctx.fillText('🎯', startX, statusY); startX += iconSpacing; } // 鷹眼
        if(this.buffs.eva_up) { ctx.fillText('💨', startX, statusY); startX += iconSpacing; }  // (預留閃避Buff)
        if(this.buffs.blk_up) { ctx.fillText('🧱', startX, statusY); startX += iconSpacing; }  // 招架架勢

        const barW = this.isBoss ? 80 : 40; const barH = 6;
        ctx.fillStyle = '#000'; ctx.fillRect(this.x - barW/2, this.y - this.radius - 15, barW, barH);
        ctx.fillStyle = this.isHero ? '#2ecc71' : '#e74c3c'; ctx.fillRect(this.x - barW/2, this.y - this.radius - 15, barW * (this.hp / this.maxHp), barH);
        ctx.fillStyle = '#000'; ctx.fillRect(this.x - barW/2, this.y - this.radius - 7, barW, 4);
        ctx.fillStyle = this.state === 'ready' ? '#f1c40f' : '#3498db'; ctx.fillRect(this.x - barW/2, this.y - this.radius - 7, barW * (this.atb / this.atbMax), 4);
        if (this.state === 'ready' && this.isHero && !targetingMode) { ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 2; ctx.strokeRect(this.x - barW/2 - 2, this.y - this.radius - 17, barW + 4, barH + 16); }
    }
    
    monsterAI() {
        let heroes = entities.filter(e => e.isHero && !e.isDead); if (heroes.length === 0) return;
        let availableSkills = this.skills.filter(sId => {
            if (this.skillCooldowns[sId] > 0) return false;
            if (sId === 'boss_purify') {let hasDebuff = Object.keys(this.debuffs).length > 0;let isLowHp = this.hp < this.maxHp * 0.5;if (!hasDebuff || !isLowHp) return false;}
            if (sId === 'boss_summon') {let currentMinions = entities.filter(e => !e.isHero && !e.isDead && !e.isBoss);if (currentMinions.length >= 4) return false; }
            return true;
        });
        let skillToUse = 'attack';
        if (availableSkills.includes('boss_purify')) {skillToUse = 'boss_purify';} 
        else if (availableSkills.includes('boss_summon') && Math.random() < 0.6) {skillToUse = 'boss_summon';} 
        else if (availableSkills.length > 0) {skillToUse = availableSkills[Math.floor(Math.random() * availableSkills.length)];}
        // -----------------------------------
        let skillData = DB.skills[skillToUse];
        let target = heroes[Math.floor(Math.random() * heroes.length)];
        executeSkillWithTarget(this, skillToUse, skillData, [], target);
    }
    
    finishTurn() {
        if (this.isDead) return; 
        this.atb = 0; this.state = 'idle'; this.targetX = this.baseX; this.targetY = this.baseY; 
        for (let key in this.skillCooldowns) { if (this.skillCooldowns[key] > 0) this.skillCooldowns[key]--; }
    }
}

// Effects
class TextEffect { constructor(x,y,t,c,s=20){this.x=x;this.y=y;this.t=t;this.c=c;this.s=s;this.l=1;} 
update(dt){this.l-=dt/1000;this.y-=0.5;return this.l>0;} 
draw(ctx){ctx.globalAlpha=Math.max(0,this.l);ctx.fillStyle=this.c;ctx.font=`bold ${this.s}px Arial`;ctx.textAlign='center';ctx.fillText(this.t,this.x,this.y);ctx.globalAlpha=1;} }

class DashEffect { constructor(a,dx,dy,cb,ret=true){this.a=a;this.sx=a.x;this.sy=a.y;this.dx=dx;this.dy=dy;this.p=0;this.cb=cb;this.ht=false;this.ret=ret;} 
update(dt){ this.p+=dt/250; if(this.p>=1){ if(!this.ht){this.cb();this.ht=true;} if (this.ret) { this.a.x+=(this.sx-this.a.x)*0.2; this.a.y+=(this.sy-this.a.y)*0.2; if(Math.abs(this.a.x-this.sx)<5){this.a.x=this.sx;this.a.y=this.sy;return false;} return true; } else { return false; } } this.a.x=this.sx+(this.dx-this.sx)*Math.min(1,this.p); this.a.y=this.sy+(this.dy-this.sy)*Math.min(1,this.p); return true; } 
draw(){} }

class ProjectileEffect { constructor(sx,sy,tx,ty,c,cb){this.x=sx;this.y=sy;this.tx=tx;this.ty=ty;this.c=c;this.cb=cb;let d=Math.hypot(tx-sx,ty-sy);this.vx=(tx-sx)/d*15;this.vy=(ty-sy)/d*15;this.history = [];} 
update(dt){this.history.push({x: this.x, y: this.y});if (this.history.length > 5) this.history.shift();this.x+=this.vx;this.y+=this.vy;if(Math.hypot(this.tx-this.x,this.ty-this.y)<20){this.cb();return false;}return true;} 
draw(ctx) {for (let i = 0; i < this.history.length; i++) {let pt = this.history[i];let trailRatio = i / this.history.length; 
ctx.globalAlpha = trailRatio * 0.6;ctx.fillStyle = this.c;ctx.beginPath();ctx.arc(pt.x, pt.y, 8 * trailRatio, 0, Math.PI * 2);ctx.fill();}
ctx.globalAlpha = 1;ctx.fillStyle = '#ffffff';ctx.beginPath();ctx.arc(this.x, this.y, 8, 0, Math.PI * 2);ctx.fill();}
}

class ExplosionEffect { constructor(x,y,r,c,cb){this.x=x;this.y=y;this.r=r;this.c=c;this.l=0.5;this.m=0.5;this.cb=cb;} update(dt){this.l-=dt/1000;if(this.l<=0){if(this.cb)this.cb();return false;}return true;} 
draw(ctx) {let p = 1 - (this.l / this.m);ctx.globalAlpha = 1 - p;ctx.fillStyle = '#ffffff'; ctx.beginPath();ctx.arc(this.x, this.y, this.r * (1 - p) * 0.4, 0, Math.PI * 2);ctx.fill();
ctx.strokeStyle = this.c;ctx.lineWidth = 15 * (1 - p); ctx.beginPath();ctx.arc(this.x, this.y, this.r * p, 0, Math.PI * 2);ctx.stroke();ctx.globalAlpha = 1;}
 }

class LaserEffect { constructor(sx,sy,tx,ty,w,cb){this.sx=sx;this.sy=sy;this.w=w;let d=Math.hypot(tx-sx,ty-sy);this.ex=sx+(tx-sx)/d*1000;this.ey=sy+(ty-sy)/d*1000;this.l=0.4;this.m=0.4;this.cb=cb;} 
update(dt){this.l-=dt/1000;if(this.l<=0){if(this.cb)this.cb();return false;}return true;} 
draw(ctx){ctx.globalAlpha=this.l/this.m;ctx.strokeStyle='#00ffff';ctx.lineWidth=this.w;ctx.beginPath();ctx.moveTo(this.sx,this.sy);ctx.lineTo(this.ex,this.ey);ctx.stroke();ctx.globalAlpha=1;} }

class ScreenFlashEffect { constructor(c,d){this.c=c;this.l=d;this.d=d;} 
update(dt){this.l-=dt/1000;return this.l>0;} 
draw(ctx){ctx.globalAlpha=(this.l/this.d)*0.5;ctx.fillStyle=this.c;ctx.fillRect(0,0,GAME_WIDTH,GAME_HEIGHT);ctx.globalAlpha=1;} }

function getDistance(e1, e2) { return Math.hypot(e1.x - e2.x, e1.y - e2.y); }

function initBattle() {
    entities = []; effects = []; sceneryObjects = []; menuOpen = false; targetingMode = false; victoryTriggered = false;
    document.getElementById('action-menu').style.display = 'none';
    document.getElementById('targeting-ui').style.display = 'none';
    document.getElementById('hub-return-btn').style.display = 'none';
    
    // Set actual fighting stage
    PlayerState.stage = PlayerState.targetStage;
    document.getElementById('ui-stage-num').innerText = PlayerState.stage;
    document.getElementById('ui-magic-stones-battle').innerText = PlayerState.magicStones;
    
    let msg = document.getElementById('stage-msg'); msg.style.opacity = 0;
    document.getElementById('loot-info').style.display = 'none';

    const biomeKeys = Object.keys(DB.biomes);
    const selectedBiome = DB.biomes[biomeKeys[Math.floor(Math.random() * biomeKeys.length)]];
    document.getElementById('game-canvas').style.background = selectedBiome.bg;

    for(let i=0; i<8; i++) {
        sceneryObjects.push({ x: Math.random() * GAME_WIDTH, y: Math.random() * (GAME_HEIGHT * 0.4) + GAME_HEIGHT * 0.05, emoji: selectedBiome.scenery[Math.floor(Math.random() * selectedBiome.scenery.length)], size: 30 + Math.random() * 20 });
    }

    const activeHeroes = PlayerState.activePartyIds.map(id => PlayerState.roster.find(h=>h.id===id)).filter(h => h);
    const heroSpacing = GAME_WIDTH / (activeHeroes.length + 1);
    const meleeHeroIds = ['warrior', 'rogue', 'swordsman'];
    
    activeHeroes.forEach((hData, index) => {
        const { stats, skills } = PlayerState.getCalculatedStats(hData);
        let hero = new Entity(true, { id: hData.id, emoji: DB.classes[hData.classId].emoji, name: DB.classes[hData.classId].name, stats, skills, color: DB.classes[hData.classId].color });
        
        Object.values(hData.equip).forEach(uid => {
            if (uid) {
                let invItem = PlayerState.inventory.find(i => i.uid === uid);
                if (invItem && DB.items[invItem.itemId]) {
                    let itemTemp = DB.items[invItem.itemId];
                    if (itemTemp.curse) {
                        hero.debuffs[itemTemp.curse.type] = itemTemp.curse.turns;
                    }
                }
            }
        });
        
        hero.baseX = heroSpacing * (index + 1);
        let isMelee = meleeHeroIds.includes(hData.classId);
        hero.baseY = GAME_HEIGHT * (isMelee ? 0.52 : 0.62) + (Math.random() * 20 - 10);
        hero.x = hero.baseX; hero.y = hero.baseY;
        entities.push(hero);
    });

    difficultyMultiplier = 1.0 + (PlayerState.stage - 1) * 0.01;
    let isBossWave = (PlayerState.battleCount % 5 === 4);

    let totalSpd = 0;
    let heroCount = 0;
    entities.forEach(e => {
        if (e.isHero) {
            totalSpd += e.spd;
            heroCount++;
        }
    });
    let avgSpd = heroCount > 0 ? (totalSpd / heroCount) : 50; // 防呆機制，確保有預設值

    const getEnemySkills = (isBoss) => {
        let allSkills = Object.keys(DB.skills).filter(k => {
            let sk = DB.skills[k];
            if (sk.partners) return false;
            return sk.type.includes('damage') || sk.type === 'self_aoe' || sk.type === 'single_aoe' || sk.type === 'random_aoe';
        });
        let assigned = ['attack'];
        let count = isBoss ? 3 : 1;
        for(let i=0; i<count; i++) {
            let rndSkill = allSkills[Math.floor(Math.random() * allSkills.length)];
            if(!assigned.includes(rndSkill)) assigned.push(rndSkill);
        }
        return assigned;
    };

    if (isBossWave) {
        let bossSkin = selectedBiome.enemySkins.boss; let proto = DB.enemyPrototypes.boss;
        let bossSkills = getEnemySkills(true);
        bossSkills.push('boss_summon', 'boss_purify');
        // 將 proto.spd 替換為動態計算的 avgSpd * (0.5 ~ 1.5)
        let boss = new Entity(false, { emoji: bossSkin.e, name: bossSkin.n, aiType: proto.type, radius: proto.radius, isBoss: true, stats: { maxHp: proto.hp * difficultyMultiplier, atk: proto.atk * difficultyMultiplier, def: proto.def * difficultyMultiplier, spd: Math.floor(avgSpd * (0.5 + Math.random())) }, skills: bossSkills });
        boss.baseX = GAME_WIDTH / 2; boss.baseY = GAME_HEIGHT * 0.25; boss.x = boss.baseX; boss.y = boss.baseY; entities.push(boss);
        
        document.getElementById('stage-msg-title').className = 'boss-title'; document.getElementById('stage-msg-title').innerText = '⚠️ BOSS BATTLE ⚠️';
        msg.style.opacity = 1; setTimeout(() => { if(battleActive) msg.style.opacity = 0; }, 2000);
    } else {
        const enemyCount = 3 + Math.floor(Math.random() * 3); const enemySpacing = GAME_WIDTH / (enemyCount + 1); const skinTypes = ['light', 'heavy', 'mage'];
        for (let i = 0; i < enemyCount; i++) {
            let skinKey = skinTypes[Math.floor(Math.random() * skinTypes.length)];
            let skin = selectedBiome.enemySkins[skinKey]; let proto = DB.enemyPrototypes[skinKey];
            // 同樣將一般怪物的 proto.spd 替換為動態計算的 avgSpd * (0.5 ~ 1.5)
            let enemy = new Entity(false, { emoji: skin.e, name: skin.n, aiType: proto.type, radius: proto.radius, stats: { maxHp: proto.hp * difficultyMultiplier, atk: proto.atk * difficultyMultiplier, def: proto.def * difficultyMultiplier, spd: Math.floor(avgSpd * (0.5 + Math.random())) }, skills: getEnemySkills(false) });
            enemy.baseX = enemySpacing * (i + 1); enemy.baseY = GAME_HEIGHT * (proto.type === 'melee' ? 0.35 : 0.22) + (Math.random() * 20 - 10);
            enemy.x = enemy.baseX; enemy.y = enemy.baseY; entities.push(enemy);
        }
    }
    
    battleActive = true; lastTime = performance.now(); requestAnimationFrame(gameLoop);
}

function openMenu(hero) {
    if (menuOpen || targetingMode || victoryTriggered) return;
    menuOpen = true; currentActor = hero;
    document.getElementById('action-menu').style.display = 'flex';
    document.getElementById('menu-actor-name').innerText = hero.name + " 的回合"; document.getElementById('menu-actor-name').style.color = hero.color;
    
    const container = document.getElementById('skill-container'); container.innerHTML = '';
    const uniqueSkills = [...new Set(hero.skills)];
    
    uniqueSkills.forEach(skillId => {
        const skill = DB.skills[skillId]; if(!skill) return;
        let isCombo = skill.type.startsWith('combo'); let canCast = true; let partnersInBattle = [];
        
        if (isCombo && skill.partners) {
            skill.partners.forEach(pClass => { let partner = entities.find(e => e.id !== hero.id && e.isHero && !e.isDead && DB.classes[PlayerState.roster.find(h=>h.id===e.id).classId].id === pClass); if (partner) partnersInBattle.push(partner); });
            if (partnersInBattle.length !== skill.partners.length) canCast = false;
        }

        let currentCd = hero.skillCooldowns[skillId] || 0; if (currentCd > 0) canCast = false;
        let btn = document.createElement('div');
        btn.className = 'btn' + (isCombo ? (skill.isUltimate ? ' combo-ultimate' : ' combo') : '') + (!canCast ? ' disabled' : '');
        let cdText = currentCd > 0 ? `<span style="color:#ff5555; margin-left:8px; font-weight:900;">[CD: ${currentCd}]</span>` : '';
        
        let skLv = hero.rosterRef.skillLevels[skillId] || 1;
        
        // 新增：如果合體技不能放(缺隊友)，在描述加上提示
        let missingPartnerText = '';
        if (isCombo && !canCast && (hero.skillCooldowns[skillId] || 0) <= 0) {
            missingPartnerText = `<br><span style="color:#ff5555; font-weight:bold;">(缺乏存活的隊友)</span>`;
        }
        btn.innerHTML = `<strong>${skill.name} <span style="color:#00ffcc; font-size:0.9em;">Lv.${skLv}</span></strong>${cdText}<div style="font-size:11px; margin-top:4px; color:#aaa;">${skill.desc}${missingPartnerText}</div>`;
        if (canCast) btn.onclick = () => prepareSkill(hero, skillId, skill, partnersInBattle);

        container.appendChild(btn);
    });
}

function prepareSkill(actor, skillId, skill, partners) {
    if (skill.target === 'self_aoe' || skill.target === 'random_aoe' || skill.target === 'ally_aoe' || skill.target === 'self') {
        document.getElementById('action-menu').style.display = 'none'; executeSkillWithTarget(actor, skillId, skill, partners, actor);
    } else {
        pendingSkill = skill; pendingSkillId = skillId; pendingPartners = partners;
        document.getElementById('action-menu').style.display = 'none';
        validTargets = [];
        if (skill.target === 'ally_single') validTargets = entities.filter(e => e.isHero === actor.isHero && !e.isDead);
        else validTargets = entities.filter(e => e.isHero !== actor.isHero && !e.isDead);
        
        if (validTargets.length > 0) { targetingMode = true; document.getElementById('targeting-ui').style.display = 'flex'; }
        else { cancelTargeting(); }
    }
}

function cancelTargeting() {
    targetingMode = false; document.getElementById('targeting-ui').style.display = 'none';
    if (!victoryTriggered && currentActor && currentActor.state === 'ready') document.getElementById('action-menu').style.display = 'flex';
}

canvas.addEventListener('pointerdown', (e) => {
    if (!targetingMode || !battleActive) return;
    const rect = canvas.getBoundingClientRect(); const x = (e.clientX - rect.left) * (canvas.width / rect.width); const y = (e.clientY - rect.top) * (canvas.height / rect.height);
    let clickedEntity = validTargets.find(ent => Math.hypot(ent.x - x, ent.y - y) <= ent.radius + 15);
    if (clickedEntity) {
        document.getElementById('targeting-ui').style.display = 'none'; targetingMode = false;
        executeSkillWithTarget(currentActor, pendingSkillId, pendingSkill, pendingPartners, clickedEntity);
    }
});

function executeSkillWithTarget(actor, skillId, skill, partners, mainTarget) {
    actor.state = 'acting'; actor.atb = 0; partners.forEach(p => { p.atb = 0; }); menuOpen = false;
    actor.skillCooldowns[skillId] = skill.cd || 0;
    
    // Skill & Stat Growth (Heroes only)
    if (actor.isHero) {
        // Attack growth roll
        if (Math.random() < 0.2) {
            actor.rosterRef.intrinsicStats.atk += 1; actor.atk += 1;
            effects.push(new TextEffect(actor.x, actor.y - 70, `ATK UP!`, '#ffaa00', 14));
        }
        // Skill level up roll
        let currentLv = actor.rosterRef.skillLevels[skillId] || 1;
        if (Math.random() < (0.3 / currentLv)) {
            actor.rosterRef.skillLevels[skillId] = currentLv + 1;
            effects.push(new TextEffect(actor.x, actor.y - 90, `Skill Lv UP!`, '#00ffff', 16));
        }
    }

    let currentLv = actor.isHero ? (actor.rosterRef.skillLevels[skillId] || 1) : 1;
    let skillMultiplier = 1 + ((currentLv - 1) * 0.1); // +10% power per level

    let enemies = entities.filter(e => e.isHero !== actor.isHero && !e.isDead);
    let allies = entities.filter(e => e.isHero === actor.isHero && !e.isDead);
    const finish = () => { actor.finishTurn(); partners.forEach(p=>p.finishTurn()); };

    if (actor.debuffs.blind && Math.random() < 0.5 && !skill.type.includes('heal') && !skill.type.includes('buff')) {
        effects.push(new TextEffect(actor.x, actor.y - 40, "MISS!", '#aaaaaa')); setTimeout(finish, 500); return;
    }

    let currentAtk = actor.atk; if (actor.buffs.atk_up) currentAtk *= actor.buffs.atk_up.val;
    let dmg = currentAtk * (skill.power || 1.0) * skillMultiplier;
    
    if(skill.type.startsWith('combo') && skill.power > 0) {
        let totalAtk = actor.atk; 
        
        effects.push(new ExplosionEffect(actor.x, actor.y, 50, skill.color || '#ffffaa'));

        partners.forEach((p, index) => { 
            totalAtk += (p.buffs && p.buffs.atk_up ? p.atk * p.buffs.atk_up.val : p.atk);
            
            if (skill.target !== 'combo_special') {
                let offsetX = (index % 2 === 0 ? 35 : -35) * (Math.floor(index / 2) + 1);
                
                effects.push(new DashEffect(p, actor.x + offsetX, actor.y, () => {
                    effects.push(new ExplosionEffect(p.x, p.y, 35, skill.color || '#ffffaa'));
                    p.baseX = p.x; p.baseY = p.y;
                }, false));
            }
        });
        
        dmg = totalAtk * (skill.power / (partners.length+1)) * skillMultiplier;
        screenShake = 20;
    }
    
    let currentCritR = actor.critR; if (actor.buffs.crit_up) currentCritR += actor.buffs.crit_up.val;
    let isCrit = currentCritR > 0 && Math.random() < currentCritR;
    if (isCrit) {dmg *= actor.critD;screenShake = 10;}
    
    // Assassinate auto-crit
    if (skillId === 'assassinate') { isCrit = true; dmg = currentAtk * skill.power * skillMultiplier * actor.critD; }

    const applyDamage = (target, amount, isHeal=false) => {
        let currentEva = target.eva; if (target.buffs && target.buffs.eva_up) currentEva += target.buffs.eva_up.val;
        let currentBlk = target.blk; if (target.buffs && target.buffs.blk_up) currentBlk += target.buffs.blk_up.val;

        if (!isHeal && currentEva > 0 && Math.random() < currentEva) { effects.push(new TextEffect(target.x, target.y - 40, "迴避!", '#88ff88')); return; }
        if (!isHeal && currentBlk > 0 && Math.random() < currentBlk) { effects.push(new TextEffect(target.x, target.y - 40, "格檔!", '#aaaaff')); amount *= 0.5; }
        
        if (isHeal && skill.type === 'buff') { } else {target.takeDamage(amount, isHeal, isCrit);}
        
        if (!isHeal && skill.applyDebuff && !target.isDead) { target.debuffs[skill.applyDebuff.type] = skill.applyDebuff.turns; effects.push(new TextEffect(target.x, target.y - 60, skill.applyDebuff.name, skill.applyDebuff.color)); }
        if (skill.applyBuff && !target.isDead) { target.buffs[skill.applyBuff.type] = { val: skill.applyBuff.value, turns: skill.applyBuff.turns }; effects.push(new TextEffect(target.x, target.y - 60, "能力提升!", '#00ffff')); }
    };

    const targetHandlers = {
        'self': () => {
            effects.push(new ExplosionEffect(actor.x, actor.y, 50, skill.color || '#00ffff', finish));
            applyDamage(actor, 0, true);
        },
        'ally_single': () => {
            effects.push(new DashEffect(actor, mainTarget.x, mainTarget.y, () => {
                effects.push(new ExplosionEffect(mainTarget.x, mainTarget.y, 40, skill.color || '#00ff00', finish)); 
                applyDamage(mainTarget, dmg, true); 
            }, true));
        },
        'ally_aoe': () => {
            effects.push(new ExplosionEffect(GAME_WIDTH/2, GAME_HEIGHT/2, skill.aoeRadius || 800, skill.color || '#00ffff', finish));
            allies.forEach(a => { applyDamage(a, dmg, true); if(skillId === 'purify') a.debuffs = {}; });
            if (skillId === 'combo_valkyrie') allies.forEach(a => { a.state='idle'; applyDamage(a, a.maxHp, true); });
        },
        'single': () => {
            const hitCallback = () => {
            let hpBefore = mainTarget.hp;
            if (skill.color) {effects.push(new ExplosionEffect(mainTarget.x, mainTarget.y, 100, skill.color));}
            applyDamage(mainTarget, dmg);
            if (skill.type === 'damage_pull') { 
                enemies.forEach(e => { 
                    if (e !== mainTarget && getDistance(mainTarget, e) <= (skill.aoeRadius || 150)) { 
                        let rX = (Math.random() - 0.5) * 10; let rY = (Math.random() - 0.5) * 10;
                        effects.push(new DashEffect(e, mainTarget.x + rX, mainTarget.y + rY, () => { e.baseX = e.x; e.baseY = e.y; }, false));
                    } 
                }); 
            }
            if (skill.type === 'damage_heal_self') {
                let actualDealt = hpBefore - mainTarget.hp;
                if (actualDealt > 0) {
                    setTimeout(() => {applyDamage(actor, actualDealt * 0.2, true); effects.push(new ExplosionEffect(actor.x, actor.y, 40, '#00ff00'));}, 250); 
                }
            }            
            setTimeout(finish, 300);
           };
             if (skill.ranged) {effects.push(new ProjectileEffect(actor.x, actor.y - 30, mainTarget.x, mainTarget.y, skill.color || '#ffffff', hitCallback));
             } else { effects.push(new DashEffect(actor, mainTarget.x, mainTarget.y, hitCallback, true)); }
        },
        'single_dash_aoe': () => {
            effects.push(new DashEffect(actor, mainTarget.x, mainTarget.y, () => {
            actor.baseX = mainTarget.x; actor.baseY = mainTarget.y;
            if (skill.hits > 1) {
                for (let i = 0; i < skill.hits; i++) {
                    setTimeout(() => {
                        let offsetX = (Math.random() - 0.5) * 80;
                        let offsetY = (Math.random() - 0.5) * 80;
                        effects.push(new ExplosionEffect(actor.x + offsetX, actor.y + offsetY, (skill.aoeRadius || 100) * 0.8, skill.color || '#cccccc'));
                        enemies.forEach(e => { if (getDistance(actor, e) <= (skill.aoeRadius || 120)) applyDamage(e, dmg); });
                    }, i * 200); // 每 200 毫秒砍一刀
                } setTimeout(finish, skill.hits * 200 + 200); // 結束回合
            } else { 
                effects.push(new ExplosionEffect(actor.x, actor.y, skill.aoeRadius || 120, skill.color || '#aaaaaa', finish));
                let totalDealt = 0; 
                enemies.forEach(e => { 
                    if (getDistance(actor, e) <= (skill.aoeRadius || 120)) {
                        let hpBefore = e.hp; applyDamage(e, dmg);totalDealt += (hpBefore - e.hp); // 把真正造成的傷害累加起來
                    } 
                });
                if (skill.type === 'damage_heal_self' && totalDealt > 0) {
                    setTimeout(() => {applyDamage(actor, totalDealt * 0.2, true); effects.push(new ExplosionEffect(actor.x, actor.y, 40, '#00ff00'));}, 250); 
                    }
                   } }, false));
            
        },
        'single_aoe': () => {
            effects.push(new ProjectileEffect(actor.x, actor.y - 30, mainTarget.x, mainTarget.y, skill.color || '#ff4400', () => {
              effects.push(new ExplosionEffect(mainTarget.x, mainTarget.y, skill.aoeRadius || 150, skill.color || '#ff4400', finish));
              enemies.forEach(e => { if (getDistance(mainTarget, e) <= (skill.aoeRadius || 150)) applyDamage(e, dmg); });
              if (skill.type === 'damage_pull') { 
                enemies.forEach(e => { 
                    if (getDistance(mainTarget, e) <= (skill.aoeRadius || 150)) { 
                        let rX = (Math.random() - 0.5) * 10; let rY = (Math.random() - 0.5) * 10;
                        effects.push(new DashEffect(e, mainTarget.x + rX, mainTarget.y + rY, () => { e.baseX = e.x; e.baseY = e.y; }, false));
                    } 
                  }); 
                }
               if (skill.type === 'combo_damage_heal' || skill.type === 'heal_damage') { allies.forEach(a => { if (getDistance(mainTarget, a) <= (skill.aoeRadius || 150)) applyDamage(a, dmg, true); }); }
            }));
        },
        'self_aoe': () => {
            let cx = (skill.aoeRadius >= 400) ? GAME_WIDTH/2 : actor.x; let cy = (skill.aoeRadius >= 400) ? GAME_HEIGHT/2 : actor.y;
            effects.push(new ExplosionEffect(cx, cy, skill.aoeRadius || 600, skill.color || '#aaaaaa', finish));
            enemies.forEach(e => { if (getDistance({x:cx, y:cy}, e) <= (skill.aoeRadius || 600)) applyDamage(e, dmg); });
            if (skill.type === 'heal' || skill.type === 'combo_damage_heal' || skill.type === 'combo_trinity'|| skill.type === 'heal_damage') 
               { allies.forEach(a => { if (getDistance({x:cx, y:cy}, a) <= (skill.aoeRadius || 600)) applyDamage(a, dmg, true); }); }
            if (skillId === 'combo_trinity') allies.forEach(a => { a.state='idle'; applyDamage(a, 9999, true); });
        },
        'random_aoe': () => {
            if (enemies.length === 0) { finish(); return; }
            if (skill.type === 'random_multi' || skill.type === 'combo_random_multi') {
            let hits = skill.hits || 3;
            for(let i=0; i<hits; i++) {
                setTimeout(() => {
                    let aliveEnemies = entities.filter(e => e.isHero !== actor.isHero && !e.isDead); if(aliveEnemies.length === 0) return;
                    let rt = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
                    effects.push(new ProjectileEffect(actor.x, actor.y - 50, rt.x, rt.y, skill.color || '#ffff00', () => { applyDamage(rt, dmg); effects.push(new ExplosionEffect(rt.x, rt.y, 30, skill.color || '#ffff00')); }));
                }, i * 150);
              } setTimeout(finish, hits * 150 + 300);
            } else {let rt = enemies[Math.floor(Math.random() * enemies.length)];
                    effects.push(new ProjectileEffect(actor.x, actor.y - 30, rt.x, rt.y, skill.color || '#ff00ff', () => {
                    effects.push(new ExplosionEffect(rt.x, rt.y, skill.aoeRadius || 80, skill.color || '#ff00ff', finish));
                    enemies.forEach(e => { if (getDistance(rt, e) <= (skill.aoeRadius || 80)) applyDamage(e, dmg); });}));
                    }
        },
        'damage_line': () => {
            effects.push(new LaserEffect(actor.x, actor.y, mainTarget.x, mainTarget.y, skill.lineWidth || 40, finish));
            enemies.forEach(e => { 
            let l2 = (mainTarget.x-actor.x)**2 + (mainTarget.y-actor.y)**2; if (l2===0) return;
            let t = ((e.x-actor.x)*(mainTarget.x-actor.x) + (e.y-actor.y)*(mainTarget.y-actor.y))/l2; t = Math.max(0, Math.min(1, t)); 
            let dist = Math.hypot(e.x-(actor.x+t*(mainTarget.x-actor.x)), e.y-(actor.y+t*(mainTarget.y-actor.y))); 
            if (dist <= (skill.lineWidth||40)/2 + e.radius) applyDamage(e, dmg); 
            });
        },
        'combo_special': () => {
            effects.push(new ScreenFlashEffect(skill.color, 0.5));
            let p1 = actor, p2 = partners[0];
            effects.push(new DashEffect(p1, mainTarget.x - 30, mainTarget.y - 30, () => { p1.baseX = p1.x; p1.baseY = p1.y; }, false));        
            effects.push(new DashEffect(p2, mainTarget.x + 30, mainTarget.y - 30, () => { 
            p2.baseX = p2.x; p2.baseY = p2.y; 
            effects.push(new ExplosionEffect(mainTarget.x, mainTarget.y, 60, skill.color, () => { enemies.forEach(e => { if (getDistance(mainTarget, e) <= (skill.aoeRadius || 60)) applyDamage(e, dmg); });})); 
            finish(); }, false));
        },
        'boss_purify': () => {
            effects.push(new ExplosionEffect(actor.x, actor.y, 80, skill.color, finish));
            actor.debuffs = {}; // 清除所有異常
            effects.push(new TextEffect(actor.x, actor.y - 60, "狀態淨化！", '#ffffaa', 24));
        },
        'boss_summon': () => {
            effects.push(new ExplosionEffect(actor.x, actor.y, 80, skill.color, finish));
            let currentMinions = entities.filter(e => !e.isHero && !e.isDead && !e.isBoss);
            let spawnCount = Math.min(2, 4 - currentMinions.length); // 每次最多召 2 隻，總數不超過 4 隻
            if (spawnCount > 0) {// 2. 聰明的反查機制：用魔王的表情符號，查出他是哪張地圖的 Boss！
            let myBiome = Object.values(DB.biomes).find(b => b.enemySkins.boss.e === actor.emoji);
            let skinTypes = ['light', 'heavy', 'mage'];
            
            for (let i = 0; i < spawnCount; i++) {
                let skinKey = skinTypes[Math.floor(Math.random() * skinTypes.length)];
                let skin = myBiome.enemySkins[skinKey]; 
                let proto = DB.enemyPrototypes[skinKey];
                
                let availableSkills = Object.keys(DB.skills).filter(k => {
                    let sk = DB.skills[k];
                    // 排除需要隊友的合體技，並且只挑選有傷害或範圍的技能
                    return !sk.partners && (sk.type.includes('damage') || sk.type.includes('aoe'));
                });
                
                let randomSkill = availableSkills[Math.floor(Math.random() * availableSkills.length)];
                
                let minion = new Entity(false, { 
                    emoji: skin.e, name: skin.n, aiType: proto.type, radius: proto.radius, 
                    stats: { maxHp: proto.hp * difficultyMultiplier, atk: proto.atk * difficultyMultiplier, def: proto.def * difficultyMultiplier, spd: actor.spd }, 
                    skills: ['attack', randomSkill] // 小怪只會普攻
                });
                
                minion.baseX = actor.x + (Math.random() - 0.5) * 150; minion.baseY = actor.y + (Math.random() - 0.5) * 50;
                minion.x = minion.baseX; minion.y = minion.baseY; 
                entities.push(minion);
                
                effects.push(new TextEffect(minion.x, minion.y - 40, "降臨！", '#aa00ff', 20));
               }
            } else {effects.push(new TextEffect(actor.x, actor.y - 60, "召喚失敗(滿員)", '#aaaaaa', 16));}// 如果場上已經滿了
        },
    };

    if (targetHandlers[skill.target]) { targetHandlers[skill.target]();
    } else { console.error("未知的技能目標類型:", skill.target); finish(); } // 報錯避免遊戲卡死

}

function processVictory() {
    victoryTriggered = true; menuOpen = false; targetingMode = false;
    document.getElementById('action-menu').style.display = 'none'; document.getElementById('targeting-ui').style.display = 'none';
    entities.forEach(e => { if (e.isHero && (e.state === 'ready' || e.state === 'acting')) { e.state = 'idle'; e.atb = 0; } });

    let isBoss = entities.some(e => e.isBoss && e.isDead);
    
    // Magic Stones Reward
    let stonesEarned = Math.max(1, Math.floor(PlayerState.stage * (isBoss ? 25 : 10) * (0.5 + Math.random() * 0.5)));
    PlayerState.magicStones += stonesEarned;
    
    // Loot Roll
    let droppedItems = PlayerState.rollLoot(isBoss);
    let msg = document.getElementById('stage-msg');
    document.getElementById('stage-msg-title').className = 'clear-title'; document.getElementById('stage-msg-title').innerText = 'Stage Clear!';
    
    let lootHtml = `獲得魔石: ${stonesEarned} 💎<br>`;
    if (droppedItems.length > 0) {
        let droppedNames = droppedItems.map(item => {
            let temp = DB.items[item.itemId];
            let rarity = DB.rarities[item.rarity];
            return `<span style="color:${rarity.color}">${temp.name}</span>`;
        });
        lootHtml += `裝備: ${droppedNames.join(', ')}`;
    }
    document.getElementById('loot-info').innerHTML = lootHtml;
    document.getElementById('loot-info').style.display = 'inline-block';
    msg.style.opacity = 1;
    
    // Advance progress if highest stage
    if (PlayerState.stage === PlayerState.maxStage) {PlayerState.maxStage++;}
    PlayerState.targetStage = PlayerState.stage + 1; // Default to next stage
    if(PlayerState.targetStage > PlayerState.maxStage) PlayerState.targetStage = PlayerState.maxStage;
    PlayerState.battleCount++;
    saveGame(); // Auto save
    
    setTimeout(() => { msg.style.opacity = 0; battleActive = false; openEndOfTimeHub(); }, 3000);
}

function processGameOver() {
    battleActive = false;
    let msg = document.getElementById('stage-msg');
    document.getElementById('stage-msg-title').className = 'gameover-title'; document.getElementById('stage-msg-title').innerText = '全軍覆沒...';
    document.getElementById('loot-info').style.display = 'none';
    document.getElementById('hub-return-btn').style.display = 'block';
    msg.style.opacity = 1;
    
    PlayerState.battleCount++;
    saveGame();
}


function gameLoop(timestamp) {
    if (!battleActive) return;
    let dt = timestamp - lastTime; lastTime = timestamp; if (dt > 100) dt = 100;
    ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    
    if (screenShake > 0) {ctx.save();ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);screenShake -= dt / 20;}
    
    ctx.globalAlpha = 0.3; sceneryObjects.forEach(s => { ctx.font = `${s.size}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s.emoji, s.x, s.y); }); ctx.globalAlpha = 1.0;
    
    let aliveEnemies = entities.filter(e => !e.isHero && !e.isDead); let aliveHeroes = entities.filter(e => e.isHero && !e.isDead);
    if (aliveHeroes.length === 0) { processGameOver(); return; }
    if (aliveEnemies.length === 0 && effects.length === 0 && !victoryTriggered) processVictory();

    entities.sort((a, b) => a.y - b.y); entities.forEach(e => { e.update(dt); e.draw(ctx); });
    for (let i = effects.length - 1; i >= 0; i--) { if (!effects[i].update(dt)) effects.splice(i, 1); else effects[i].draw(ctx); }
    
    for (let i = 0; i < entities.length; i++) {
        for (let j = i + 1; j < entities.length; j++) {
            let e1 = entities[i];
            let e2 = entities[j];
            
            if (e1.isDead || e2.isDead) continue;
            
            //if (e1.state === 'acting' || e2.state === 'acting') continue;

            let dx = e1.x - e2.x;let dy = e1.y - e2.y;
            let dist = Math.hypot(dx, dy);let minDist = e1.radius + e2.radius + 5; 

            if (dist > 0 && dist < minDist) {   
                let overlap = minDist - dist;let pushForce = overlap * 0.1;
                let nx = dx / dist;let ny = dy / dist;
                e1.x += nx * pushForce;e1.y += ny * pushForce;
                e2.x -= nx * pushForce;e2.y -= ny * pushForce;
            }
        }
    }
    
    if (screenShake > 0) ctx.restore();
    requestAnimationFrame(gameLoop);
}

function openEndOfTimeHub() {
    // Hide battle-related UI elements completely
    document.getElementById('stage-msg').style.opacity = 0;
    document.getElementById('hub-return-btn').style.display = 'none';
    document.getElementById('action-menu').style.display = 'none';
    document.getElementById('targeting-ui').style.display = 'none';
    document.getElementById('game-canvas').style.background = '#222'; // Reset background
    ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT); // Clear canvas
    
    // Show hub UI
    document.getElementById('end-of-time-ui').style.display = 'flex';
    document.getElementById('ui-magic-stones-hub').innerText = PlayerState.magicStones;
    document.getElementById('hub-target-stage').innerText = PlayerState.targetStage;

    switchHubTab(document.querySelectorAll('.hub-tab')[0], 'party');
}

function changeHubStage(delta) {
    let newStage = PlayerState.targetStage + delta;
    if (newStage >= 1 && newStage <= PlayerState.maxStage) {
        PlayerState.targetStage = newStage;
        document.getElementById('hub-target-stage').innerText = PlayerState.targetStage;
    }
}

function switchHubTab(element, tabName) {
    document.querySelectorAll('.hub-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.hub-content').forEach(c => c.classList.remove('active'));
    element.classList.add('active');
    document.getElementById(`tab-${tabName}`).classList.add('active');
    if (tabName === 'party') renderPartyHub();
    if (tabName === 'equip') { if(!equipSelectedHeroId && PlayerState.activePartyIds[0]) equipSelectedHeroId = PlayerState.activePartyIds[0]; renderEquipHub(); }
    if (tabName === 'forge') renderForgeHub();
}
