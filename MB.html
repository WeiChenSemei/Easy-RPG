<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>魔彈射手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a202c; font-family: sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
        .pixelated { image-rendering: pixelated; }
        
        #joystick-zone { position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; z-index: 10; }
        #joystick-base { position: absolute; width: 100px; height: 100px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.5); display: none; transform: translate(-50%, -50%); pointer-events: none; }
        #joystick-stick { position: absolute; width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 255, 255, 0.6); top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 4px; }
        button, .cursor-pointer, input { touch-action: manipulation; }
    </style>
</head>
<body class="text-white h-[100dvh] w-screen flex flex-col absolute inset-0">

    <!-- 頂部 UI 區塊 -->
    <div id="ui-top" class="flex-none bg-gray-900 border-b border-gray-700 shadow-md z-20 flex flex-col p-2 gap-2 text-sm select-none">
        
        <div class="flex justify-between items-center text-xs font-bold text-gray-300 flex-wrap gap-y-1">
            <div class="flex gap-4">
                <span>波次:<span id="ui-wave" class="text-white">1</span></span>
                <span>死亡:<span id="ui-deaths" class="text-red-400">0</span></span>
                <span>🏰:<span id="ui-town-level" class="text-yellow-400">Lv 1</span></span>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleModal('modal-bag')" class="bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded shadow active:scale-95 transition-transform flex items-center gap-1 font-bold">🎒 背包</button>
                <button onclick="toggleModal('modal-file')" class="bg-green-600 hover:bg-green-500 px-3 py-1.5 rounded shadow active:scale-95 transition-transform flex items-center gap-1 font-bold">💾 檔案</button>
            </div>
        </div>

        <div class="flex gap-2 w-full">
            <div class="flex-1 bg-gray-800 rounded h-5 relative overflow-hidden border border-gray-700">
                <div id="bar-hp" class="bg-red-600 h-full w-full transition-all duration-200"></div>
                <div class="absolute inset-0 flex justify-center items-center text-[10px] font-bold drop-shadow-md"><span id="text-hp">100/100</span></div>
            </div>
            <div class="flex-1 bg-gray-800 rounded h-5 relative overflow-hidden border border-gray-700">
                <div id="bar-mp" class="bg-blue-600 h-full w-full transition-all duration-200"></div>
                <div class="absolute inset-0 flex justify-center items-center text-[10px] font-bold drop-shadow-md"><span id="text-mp">100/100</span></div>
            </div>
        </div>

        <div class="w-full bg-gray-800 rounded h-4 relative overflow-hidden border border-gray-700">
            <div id="bar-aggro" class="bg-purple-600 h-full w-0 transition-all duration-200"></div>
            <div class="absolute inset-0 flex justify-center items-center text-[10px] font-bold drop-shadow-md"><span>侵略值 <span id="text-aggro">0%</span></span></div>
        </div>

        <div class="flex justify-center flex-wrap gap-1.5 px-1" id="gun-slots-container"></div>
    </div>

    <!-- 遊戲畫面區塊 -->
    <div id="game-container" class="flex-1 relative overflow-hidden">
        <canvas id="gameCanvas" class="block w-full h-full pixelated"></canvas>
        <div id="joystick-zone"><div id="joystick-base"><div id="joystick-stick"></div></div></div>
        
        <div id="town-pointer" class="absolute hidden flex-col items-center justify-center pointer-events-none z-10 transition-all duration-100" style="width: 40px; height: 40px;">
            <div class="bg-blue-600 rounded-full p-1 shadow-lg border-2 border-white flex items-center justify-center"><span class="text-sm">🏰</span></div>
            <div id="town-dist" class="text-[10px] font-bold text-white drop-shadow-md bg-black/50 px-1 rounded mt-1">0m</div>
        </div>
        <div id="boss-pointer" class="absolute hidden flex-col items-center justify-center pointer-events-none z-10 transition-all duration-100" style="width: 40px; height: 40px;">
            <div class="bg-red-600 rounded-full p-1 shadow-lg border-2 border-white flex items-center justify-center"><span class="text-sm">👿</span></div>
            <div class="text-[10px] font-bold text-white drop-shadow-md bg-black/50 px-1 rounded mt-1">魔王</div>
        </div>
        
        <div id="pause-overlay" class="absolute inset-0 bg-black/40 hidden justify-center items-center z-10 pointer-events-none">
            <span class="text-white text-2xl font-bold tracking-widest drop-shadow-lg">PAUSED</span>
        </div>
    </div>

    <!-- 背包與打磨 -->
    <div id="modal-bag" class="fixed inset-0 bg-black/80 z-50 hidden flex-col justify-center items-center p-4">
        <div class="bg-gray-800 rounded-lg w-full max-w-sm flex flex-col max-h-[90dvh] shadow-2xl border border-gray-600">
            <div class="flex justify-between items-center p-3 border-b border-gray-700">
                <h2 class="text-lg font-bold">🎒 背包與打磨</h2>
                <button onclick="toggleModal('modal-bag')" class="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
            </div>
            <div class="p-4 overflow-y-auto flex-1">
                <div class="bg-gray-700 p-3 rounded mb-4 flex justify-between items-center">
                    <div><div class="text-sm text-gray-300">原石數量</div><div class="text-2xl font-bold text-gray-100" id="ui-rawstones">0</div></div>
                    <div><div class="text-sm text-gray-300">打磨經驗</div><div class="text-lg font-bold text-yellow-400" id="ui-craftlevel">Lv 1</div></div>
                    <button onclick="craftGem()" class="bg-yellow-600 hover:bg-yellow-500 text-white px-4 py-2 rounded font-bold active:scale-95">打磨!</button>
                </div>
                <h3 class="text-md font-bold mb-2 flex justify-between">
                    <span>💎 寶石庫 (<span id="ui-gem-count">0</span>/20)</span>
                    <span class="text-xs text-blue-300" id="ui-town-exp">城鎮EXP: 0/10</span>
                </h3>
                <div id="inventory-grid" class="grid grid-cols-5 gap-2"></div>
                <h3 class="text-md font-bold mt-4 mb-2">📊 角色詳細屬性</h3>
                <div id="player-stats-list" class="grid grid-cols-2 gap-x-2 gap-y-1 text-xs text-gray-300 bg-gray-900 p-2 rounded"></div>
            </div>
        </div>
    </div>

    <!-- 寶石詳細資訊 -->
    <div id="modal-gem-detail" class="fixed inset-0 bg-black/80 z-[60] hidden flex-col justify-center items-center p-4">
        <div class="bg-gray-800 rounded-lg w-full max-w-xs p-5 shadow-2xl border flex flex-col gap-3" id="gem-detail-content"></div>
    </div>

    <!-- 存檔與系統 -->
    <div id="modal-file" class="fixed inset-0 bg-black/80 z-50 hidden flex-col justify-center items-center p-4">
        <div class="bg-gray-800 rounded-lg w-full max-w-xs p-5 shadow-2xl border border-gray-600 flex flex-col gap-3">
            <h2 class="text-lg font-bold text-center border-b border-gray-700 pb-2">💾 遊戲存檔</h2>
            <button onclick="exportSave()" class="bg-purple-600 py-2.5 rounded font-bold w-full active:scale-95 text-md">匯出存檔 (JSON)</button>
            <button onclick="document.getElementById('import-file').click()" class="bg-yellow-600 py-2.5 rounded font-bold w-full active:scale-95 text-md">匯入存檔 (JSON)</button>
            <input type="file" id="import-file" accept=".json" class="hidden" onchange="handleImportSave(event)">
            <hr class="border-gray-600 my-1">
            <button onclick="fullResetGame()" class="bg-red-600 py-2.5 rounded font-bold w-full active:scale-95 text-md">重新開始 (清空存檔)</button>
            <button onclick="toggleModal('modal-file')" class="bg-gray-600 py-2 rounded font-bold w-full mt-2">關閉</button>
        </div>
    </div>

    <!-- 死亡結算視窗 -->
    <div id="modal-death" class="fixed inset-0 bg-red-900/90 z-[70] hidden flex-col justify-center items-center p-4">
        <div class="bg-gray-900 rounded-lg w-full max-w-xs p-6 shadow-2xl border-2 border-red-600 flex flex-col gap-4 text-center">
            <h2 class="text-3xl font-bold text-red-500 mb-2">YOU DIED</h2>
            <p class="text-gray-300 text-sm">你已倒下，怪物攻入了城鎮...</p>
            <div class="bg-gray-800 p-3 rounded text-left my-2 border border-gray-700">
                <div class="text-white mb-1">生存波次: <span class="font-bold text-yellow-400" id="death-wave"></span></div>
            </div>
            <button onclick="confirmDeath()" class="bg-red-600 hover:bg-red-500 py-3 rounded font-bold w-full active:scale-95 text-lg shadow-lg">確認並重生</button>
        </div>
    </div>

    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-900/90 text-white px-4 py-2 rounded shadow-lg z-50 hidden transition-opacity font-bold"></div>

    <script>
        /** ==========================================
         * 1. 遊戲設定與資料驅動字典
         * ========================================== */
        const GAME_CONFIG = {
            maxAggro: 100, aggroPerMove: 0.05, aggroPerMine: 1,
            inventoryLimit: 20, maxSlots: 8, town: { x: 0, y: 0, radius: 80 }
        };

        const ATTR_NAMES = { maxHp: '最大生命', maxMp: '最大魔力', atk: '攻擊力', def: '防禦力', spd: '移動速度', critRate: '爆擊率', critDmg: '爆擊傷害', dodge: '閃躲率', hpRegen: '生命回復/秒', mpRegen: '魔力回復/秒' };

        const RARITY_TIERS = [
            { id: 'common', name: '普通', color: '#a0aec0', weight: 1000, statMultiplier: 1.0, valueReq: 0 },
            { id: 'uncommon', name: '精良', color: '#48bb78', weight: 400, statMultiplier: 1.5, valueReq: 5 },
            { id: 'rare', name: '稀有', color: '#4299e1', weight: 150, statMultiplier: 2.2, valueReq: 15 },
            { id: 'epic', name: '史詩', color: '#9f7aea', weight: 50, statMultiplier: 3.5, valueReq: 30 },
            { id: 'legendary', name: '傳說', color: '#ed8936', weight: 10, statMultiplier: 5.5, valueReq: 60 },
            { id: 'mythic', name: '神話', color: '#f56565', weight: 1, statMultiplier: 9.0, valueReq: 100 }
        ];

        const GEM_TYPES = [
            { id: 'fire', icon: '🔥', name: '烈焰', effect: '子彈變大，傷害提升', color: '#fc8181' },
            { id: 'ice', icon: '❄️', name: '寒霜', effect: '子彈能穿透並大幅減速敵人', color: '#90cdf4' },
            { id: 'thunder', icon: '⚡', name: '雷霆', effect: '命中時觸發連鎖閃電', color: '#faf089' },
            { id: 'poison', icon: '🐍', name: '劇毒', effect: '子彈附加毒傷(基礎爆擊提升)', color: '#9ae6b4' },
            { id: 'summon', icon: '🛡️', name: '護衛', effect: '殺敵有機率召喚友軍', color: '#d6bcfa' },
            { id: 'wind', icon: '🌪️', name: '颶風', effect: '扇狀發射三枚子彈', color: '#cbd5e0' },
            { id: 'light', icon: '✨', name: '聖光', effect: '十字方向發射子彈', color: '#fef08a' },
            { id: 'arcane', icon: '🔮', name: '奧術', effect: '子彈會自動追蹤敵人', color: '#c084fc' },
            { id: 'earth', icon: '🪨', name: '大地', effect: '擊中或消失時分裂', color: '#d97706' },
            { id: 'mine', icon: '💣', name: '地雷', effect: '擊中時原地放置高傷地雷', color: '#ef4444' },
            { id: 'sniper', icon: '🎯', name: '狙擊', effect: '子彈極快且傷害暴增', color: '#fca5a5' },
            { id: 'vampire', icon: '🦇', name: '吸血', effect: '攻擊時有機率吸血', color: '#f43f5e' },
            { id: 'star', icon: '⭐', name: '星爆', effect: '八方發射，子彈緩慢形成彈幕', color: '#fde047' },
            { id: 'back', icon: '🌙', name: '背水', effect: '子彈會同時往背後發射', color: '#9ca3af' },
            { id: 'shotgun', icon: '💥', name: '散彈', effect: '前方扇形發射五枚短程子彈', color: '#f97316' },
            { id: 'chaos', icon: '🎲', name: '混沌', effect: '傷害、大小、顏色全隨機', color: '#e879f9' },
            { id: 'gravity', icon: '🌌', name: '重力', effect: '飛行時會把周圍的敵人吸過去', color: '#8b5cf6' },
            { id: 'time', icon: '⏳', name: '時停', effect: '機率讓一般怪物長時間暈眩', color: '#6ee7b7' },
            { id: 'greed', icon: '💰', name: '貪婪', effect: '擊殺怪物時機率掉落原石', color: '#fbbf24' },
            { id: 'phantom', icon: '👻', name: '幻影', effect: '子彈可以無限穿透', color: '#e2e8f0' },
            { id: 'meteor', icon: '☄️', name: '隕石', effect: '超大、超痛、超慢', color: '#ef4444' },
            { id: 'siphon', icon: '🧛‍♂️', name: '汲取', effect: '擊殺敵人時回復 5 點魔力', color: '#b91c1c' },
            { id: 'frugal', icon: '🪶', name: '節制', effect: '射擊時有 25% 機率不消耗魔力', color: '#a7f3d0' },
            { id: 'boomerang', icon: '🪃', name: '迴旋', effect: '子彈飛到極限距離時會折返', color: '#fb923c' },
            { id: 'spiral', icon: '🌀', name: '螺旋', effect: '子彈呈波浪螺旋狀飛行', color: '#38bdf8' },
            { id: 'sunder', icon: '💔', name: '破甲', effect: '擊中後使敵人受到的傷害提升50%', color: '#fca5a5' },
            { id: 'petrify', icon: '🧱', name: '石化', effect: '機率使敵人定身且受到的傷害增加', color: '#a8a29e' },
            { id: 'cluster', icon: '🎆', name: '煙火', effect: '子彈消失時散射出多枚碎片', color: '#f472b6' },
            { id: 'tether', icon: '🔗', name: '連結', effect: '飛行時持續電擊附近的敵人', color: '#2dd4bf' },
            { id: 'growth', icon: '🌱', name: '生長', effect: '子彈隨飛行時間變大且傷害增加', color: '#86efac' },
            { id: 'mirage', icon: '🪞', name: '鏡像', effect: '背後產生幻象，額外發射一次子彈', color: '#e0e7ff' },
            { id: 'blackhole', icon: '🕳️', name: '黑洞', effect: '子彈消失時化為黑洞，吸引並撕裂敵人', color: '#4c1d95' }
        ];

        const ENEMY_EMOJIS = ['💧', '👺', '🦇', '💀', '🕷️', '🐺', '🐗', '🦂', '🧟', '🦅', '🐍', '🐸', '🐀', '🦖', '🐊', '🐛', '🐜', '🐌', '🦀', '🦎'];
        const RANGED_EMOJIS = ['🏹', '🥷', '🧝', '🧚', '🧞', '🧜', '🧛', '🛸', '🛰️', '🐙'];
        const BOSS_EMOJIS = ['🐉', '👿', '👁️', '👹', '🦑', '👽', '🦖', '🤖', '🎃', '🤡', '🦍', '🐅', '🐘', '🦏', '🦅'];

        const ENEMY_TEMPLATES = [
            { emojiPool: ENEMY_EMOJIS, baseHp: 30, baseAtk: 8, spd: 40, isRanged: false },
            { emojiPool: ENEMY_EMOJIS, baseHp: 30, baseAtk: 9, spd: 60, isRanged: false },
            { emojiPool: ENEMY_EMOJIS, baseHp: 15, baseAtk: 7, spd: 90, isRanged: false },
            { emojiPool: ENEMY_EMOJIS, baseHp: 45, baseAtk: 10, spd: 30, isRanged: false },
            { emojiPool: RANGED_EMOJIS, baseHp: 30, baseAtk: 8, spd: 50, isRanged: true }
        ];
        const BOSS_TEMPLATES = [
            { emojiPool: BOSS_EMOJIS, baseHp: 225, baseAtk: 25, spdMulti: 1.5, isRanged: false },
            { emojiPool: BOSS_EMOJIS, baseHp: 225, baseAtk: 20, spdMulti: 1.2, isRanged: false },
            { emojiPool: BOSS_EMOJIS, baseHp: 225, baseAtk: 15, spdMulti: 1.0, isRanged: true }
        ];

        /** ==========================================
         * 2. 遊戲狀態與實體
         * ========================================== */
        const state = {
            wave: 1, deaths: 0, aggro: 0, isBossFight: false, timeOfDay: 0, lastTime: performance.now(),
            camera: { x: 0, y: 0 }, craftingExp: 0, input: { x: 0, y: 0 }, autoAimTarget: null, shootTimer: 0,
            enemySpawnTimer: 0, isPaused: false, isDeadModalOpen: false,
            townLevel: 1, townExp: 0 
        };

        class Player {
            constructor() {
                this.x = GAME_CONFIG.town.x; this.y = GAME_CONFIG.town.y; this.size = 15;
                this.baseStats = { maxHp: 100, maxMp: 100, atk: 10, def: 5, spd: 120, critRate: 0.05, critDmg: 1.5, dodge: 0.05, hpRegen: 1.5, mpRegen: 4.0 };
                this.stats = { ...this.baseStats }; this.hp = this.stats.maxHp; this.mp = this.stats.maxMp;
                this.inventory = { rawStones: 0, gems: [] }; this.slots = new Array(GAME_CONFIG.maxSlots).fill(null);
            }
            recalculateStats() {
          this.stats = { ...this.baseStats };
          this.slots.forEach(gem => { if (gem) for (let attr in gem.bonusStats) this.stats[attr] += gem.bonusStats[attr]; });
          
          this.stats.maxHp = this.stats.maxHp + (state.townLevel - 1) * 20;
          this.stats.atk = this.stats.atk + (state.townLevel - 1) * 10;
          this.stats.def = this.stats.def + (state.townLevel - 1) * 5;

          this.hp = Math.min(this.hp, this.stats.maxHp);
          this.mp = Math.min(this.mp, this.stats.maxMp);
         }
        }

        class Mercenary {
            constructor(type, emoji, bx, by, isSummoned = false) {
                this.type = type; this.emoji = emoji; this.x = bx; this.y = by; this.size = 15;
                this.baseHp = type === 'warrior' ? 150 : 100; this.baseAtk = type === 'warrior' ? 5 : 8;this.baseDef = type === 'warrior' ? 10 : 8;
                this.hp = this.baseHp; this.spd = 135; this.state = 'idle'; this.cooldown = 0; this.isFollowing = false;
                this.isSummoned = isSummoned;
                this.state = isSummoned ? 'follow' : 'idle'; 
                // 給予 10 秒壽命
                this.lifeTimer = 10.0;
            }
            update(dt, inTown) {
                if (this.isSummoned) {
                this.lifeTimer -= dt;
                if (this.lifeTimer <= 0) {this.isDead = true;showToast(`${this.emoji} 靈力耗盡已消散...`);return;}
                }
                
                let hpGrowth = this.type === 'warrior' ? 30 : 20;
                let atkGrowth = this.type === 'warrior' ? 5 : 8;
                let defGrowth = this.type === 'warrior' ? 10 : 8;

                let maxHp = this.baseHp + (state.townLevel - 1) * hpGrowth;
                let atk = this.baseAtk + (state.townLevel - 1) * atkGrowth;
                let def = this.baseDef + (state.townLevel - 1) * defGrowth;

                if (this.hp > maxHp) this.hp = maxHp;

                if (this.state === 'idle' || inTown) {
                    this.hp = Math.min(maxHp, this.hp + maxHp * 0.2 * dt);
                }

                if (this.state === 'idle') {
                    if (Math.hypot(player.x - this.x, player.y - this.y) < 50) { this.state = 'follow'; showToast(`${this.emoji} 加入了隊伍！`); }
                    return;
                }

                if (this.state === 'follow') {
                    if (this.hp <= 0) {
                        if (this.isSummoned) {this.isDead = true; showToast(`${this.emoji} 已消散...`);return;} 
                        else { this.state = 'idle'; this.hp = maxHp;
                    this.x = GAME_CONFIG.town.x + (Math.random()*40-20); this.y = GAME_CONFIG.town.y + (Math.random()*40-20);
                    showToast(`${this.emoji} 受到重傷，已撤退回城鎮！`); return;}
                    }
                    this.cooldown -= dt;
                    let distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
                    let closestEnemy = null; let minEnemyDist = 400;

                    if (inTown) {
                        this.isFollowing = true;
                    } else {
                        entities.enemies.forEach(e => {
                            if(e.invulnerable > 0) return;
                            let d = Math.hypot(this.x - e.x, this.y - e.y) - e.size;
                            if (d < minEnemyDist) { minEnemyDist = d; closestEnemy = e; }
                        });
                    }

                    if (this.type === 'warrior') {
                        if (closestEnemy && !inTown) {
                            if (minEnemyDist > this.size + 5) {
                                let angle = Math.atan2(closestEnemy.y - this.y, closestEnemy.x - this.x);
                                this.x += Math.cos(angle) * this.spd * dt; this.y += Math.sin(angle) * this.spd * dt;
                            }
                            if (minEnemyDist <= this.size + 15 && this.cooldown <= 0) {
                                closestEnemy.hp -= atk; addHitEffect(closestEnemy.x, closestEnemy.y, '💥');
                                if (Math.random() < 0.25 && !closestEnemy.isBoss) { closestEnemy.stun = 2.0; addFloatingText(closestEnemy.x, closestEnemy.y - closestEnemy.size - 10, '💫暈眩!', '#fbbf24'); }
                                this.cooldown = 1.0;
                            }
                        } else {
                            if (distToPlayer > 120) this.isFollowing = true; if (distToPlayer < 60) this.isFollowing = false;
                            if (this.isFollowing) { let angle = Math.atan2(player.y - this.y, player.x - this.x); this.x += Math.cos(angle) * this.spd * dt; this.y += Math.sin(angle) * this.spd * dt; }
                        }
                    } else if (this.type === 'priest') {
                        if (closestEnemy && minEnemyDist < 150 && !inTown) {
                            let angle = Math.atan2(this.y - closestEnemy.y, this.x - closestEnemy.x);
                            this.x += Math.cos(angle) * this.spd * dt; this.y += Math.sin(angle) * this.spd * dt; this.isFollowing = false;
                        } else {
                            if (distToPlayer > 120) this.isFollowing = true; if (distToPlayer < 60) this.isFollowing = false;
                            if (this.isFollowing) { let angle = Math.atan2(player.y - this.y, player.x - this.x); this.x += Math.cos(angle) * this.spd * dt; this.y += Math.sin(angle) * this.spd * dt; }
                        }
                        if (this.cooldown <= 0) {
                            let allyToHeal = null; let lowestPct = player.hp / player.stats.maxHp;
                            if (lowestPct < 0.7) allyToHeal = player;
                            entities.mercs.forEach(m => {
                                if(m.state === 'follow' && m !== this) {
                                    let mHpGrowth = m.type === 'warrior' ? 30 : 20;
                                    let mMaxHp = m.baseHp + (state.townLevel - 1) * mHpGrowth;
                                    let pct = m.hp / mMaxHp;
                                    if (pct < 0.7 && pct < lowestPct) { lowestPct = pct; allyToHeal = m; }
                                }
                            });
                            if (allyToHeal) {
                                let healAmt = 0;
                                // 1. 如果補的是玩家
                                if (allyToHeal === player) {
                                    healAmt = player.stats.maxHp * 0.25; // 玩家最大生命的 25%
                                    player.hp = Math.min(player.stats.maxHp, player.hp + healAmt);
                                } 
                                // 2. 如果補的是傭兵 (包含戰士或別的牧師)
                                else {
                                    let tHpGrowth = allyToHeal.type === 'warrior' ? 30 : 20;
                                    let targetMaxHp = allyToHeal.baseHp + (state.townLevel - 1) * tHpGrowth; // 先算出目標的最大生命
                                    healAmt = targetMaxHp * 0.25; // 目標最大生命的 25%
                                    allyToHeal.hp = Math.min(targetMaxHp, allyToHeal.hp + healAmt);
                                }
                                addFloatingText(allyToHeal.x, allyToHeal.y - 20, `+${Math.floor(healAmt)}`, '#4ade80'); 
                                this.cooldown = 2.0;
                            }else if (closestEnemy && minEnemyDist <= 350 && !inTown) {
                                closestEnemy.hp -= atk * 1.5; 
                                addHitEffect(closestEnemy.x, closestEnemy.y, '✨', '#fef08a');
                                let angle = Math.atan2(closestEnemy.y - this.y, closestEnemy.x - this.x);
                                closestEnemy.x += Math.cos(angle) * 50; 
                                closestEnemy.y += Math.sin(angle) * 50;
                                this.cooldown = 1.2; 
                            }
                        }
                    }
                }
            }
        }

        let player = new Player();
        let entities = { enemies: [], bullets: [], ores: [], scenery: [], floatingTexts: [], hitEffects: [], mercs: [], altars: [], mines: [] };

        /** ==========================================
         * 3. 城鎮建築管理與初始化
         * ========================================== */
        function updateTownBuildings() {
            entities.scenery = entities.scenery.filter(s => !s.isTown);
            entities.scenery.push({ x: GAME_CONFIG.town.x, y: GAME_CONFIG.town.y , emoji: '🏰', isTown: true });
            
            let buildingCount = Math.min(20, Math.floor(state.townLevel-1));
            const townEmojis = ['🏠', '🏡', '🛖', '⛪', '⛲', '🎪'];
            
            // 規則排列：利用同心圓與固定角度分佈建築，使其整齊
            let currentRadius = 60;
            let buildingsPlaced = 0;
            
            while (buildingsPlaced < buildingCount) {
                let circumference = 2 * Math.PI * currentRadius;
                let maxBuildingsInRing = Math.floor(circumference / 40); // 每個建築約佔 40px
                
                let toPlace = Math.min(maxBuildingsInRing, buildingCount - buildingsPlaced);
                if (currentRadius > GAME_CONFIG.town.radius - 20) break;
                let angleStep = (Math.PI * 2) / toPlace;
                
                for (let i = 0; i < toPlace; i++) {
                    let angle = i * angleStep;
                    let bx = GAME_CONFIG.town.x + Math.cos(angle) * currentRadius;
                    let by = GAME_CONFIG.town.y + Math.sin(angle) * currentRadius;
                    entities.scenery.push({ x: bx, y: by, emoji: townEmojis[Math.floor(Math.random() * townEmojis.length)], isTown: true });
                    buildingsPlaced++;
                }
                currentRadius += 40; // 下一圈擴展
            }
        }

        const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
        function resize() { canvas.width = document.getElementById('game-container').clientWidth; canvas.height = document.getElementById('game-container').clientHeight; }
        window.addEventListener('resize', resize); resize();

        function initWorld() {
            entities.scenery = []; entities.ores = []; entities.enemies = []; entities.bullets = []; entities.hitEffects = []; entities.altars = []; entities.mines = [];
            entities.mercs = [new Mercenary('warrior', '🛡️', GAME_CONFIG.town.x - 20, GAME_CONFIG.town.y + 20), new Mercenary('priest', '🪄', GAME_CONFIG.town.x + 20, GAME_CONFIG.town.y + 20)];
            updateTownBuildings();
            for(let i=0; i<150; i++) {
                let rx = (Math.random() - 0.5) * 3000; let ry = (Math.random() - 0.5) * 3000;
                if (Math.hypot(rx - GAME_CONFIG.town.x, ry - GAME_CONFIG.town.y) > GAME_CONFIG.town.radius) entities.scenery.push({ x: rx, y: ry, emoji: Math.random() > 0.5 ? '🌳' : '🌲' });
            }
            for(let i=0; i<40; i++) spawnRandomEntity(entities.ores, '🪨', 15, 800);
            for(let i=0; i<5; i++) spawnRandomEntity(entities.altars, '🗿', 20, 1500);
        }

        function spawnRandomEntity(arr, emoji, size, maxDist) {
            let angle = Math.random() * Math.PI * 2; let dist = GAME_CONFIG.town.radius + 50 + Math.random() * maxDist;
            let x = GAME_CONFIG.town.x + Math.cos(angle)*dist; let y = GAME_CONFIG.town.y + Math.sin(angle)*dist;
            arr.push({ x, y, emoji, size });
        }

        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
        window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        let isMouseDown = false;
        const gameContainer = document.getElementById('game-container');
        gameContainer.addEventListener('mousedown', e => { isMouseDown = true; updateMouseInput(e); });
        window.addEventListener('mouseup', () => { isMouseDown = false; updateMouseInput(null); });
        gameContainer.addEventListener('mousemove', e => { if (isMouseDown) updateMouseInput(e); });

        function updateMouseInput(e) {
            if (!isMouseDown || !e) return;
            const rect = canvas.getBoundingClientRect();
            let screenX = e.clientX - rect.left; let screenY = e.clientY - rect.top;
            let centerX = canvas.width / 2; let centerY = canvas.height / 2;
            let dx = screenX - centerX; let dy = screenY - centerY;
            let dist = Math.hypot(dx, dy);
            if (dist > 20) { state.input.x = dx / dist; state.input.y = dy / dist; } else { state.input.x = 0; state.input.y = 0; }
        }

        const joystickZone = document.getElementById('joystick-zone'), joystickBase = document.getElementById('joystick-base'), joystickStick = document.getElementById('joystick-stick');
        let touchId = null, baseCenter = { x: 0, y: 0 };
        joystickZone.addEventListener('touchstart', (e) => {
            if (touchId !== null || state.isPaused || state.isDeadModalOpen) return; const touch = e.changedTouches[0]; touchId = touch.identifier;
            joystickBase.style.display = 'block'; joystickBase.style.left = `${touch.clientX}px`; joystickBase.style.top = `${touch.clientY}px`;
            baseCenter = { x: touch.clientX, y: touch.clientY }; updateJoystick(touch.clientX, touch.clientY);
        }, {passive: false});
        joystickZone.addEventListener('touchmove', (e) => {
            e.preventDefault(); if(state.isPaused || state.isDeadModalOpen) return;
            for (let i = 0; i < e.changedTouches.length; i++) if (e.changedTouches[i].identifier === touchId) { updateJoystick(e.changedTouches[i].clientX, e.changedTouches[i].clientY); break; }
        }, {passive: false});
        const endJoystick = (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) if (e.changedTouches[i].identifier === touchId) { touchId = null; joystickBase.style.display = 'none'; joystickStick.style.transform = `translate(-50%, -50%)`; updateInputFromKeys(); break; }
        };
        joystickZone.addEventListener('touchend', endJoystick); joystickZone.addEventListener('touchcancel', endJoystick);
        
        function updateJoystick(cx, cy) {
            const dx = cx - baseCenter.x, dy = cy - baseCenter.y, distance = Math.min(50, Math.sqrt(dx*dx + dy*dy)), angle = Math.atan2(dy, dx);
            joystickStick.style.transform = `translate(calc(-50% + ${distance*Math.cos(angle)}px), calc(-50% + ${distance*Math.sin(angle)}px))`;
            state.input.x = distance > 0 ? Math.cos(angle) : 0; state.input.y = distance > 0 ? Math.sin(angle) : 0;
        }

        function updateInputFromKeys() {
            if (touchId !== null || isMouseDown || state.isDeadModalOpen) return;
            let vx = 0, vy = 0;
            if (keys.w || keys.ArrowUp) vy -= 1; if (keys.s || keys.ArrowDown) vy += 1;
            if (keys.a || keys.ArrowLeft) vx -= 1; if (keys.d || keys.ArrowRight) vx += 1;
            let dist = Math.hypot(vx, vy);
            state.input.x = dist > 0 ? vx / dist : 0; state.input.y = dist > 0 ? vy / dist : 0;
        }

        /** ==========================================
         * 4. 存檔與系統 & 自動儲存
         * ========================================== */
        function getSaveData() { return { player: { inventory: player.inventory, slots: player.slots, stats: player.baseStats, hp: player.hp, mp: player.mp }, state: { wave: state.wave, deaths: state.deaths, craftingExp: state.craftingExp, townLevel: state.townLevel, townExp: state.townExp } }; }
        function applySaveData(parsed) {
            player.inventory = parsed.player.inventory || { rawStones: 0, gems: [] };
            let loadedSlots = parsed.player.slots || []; player.slots = new Array(GAME_CONFIG.maxSlots).fill(null);
            for(let i=0; i < Math.min(loadedSlots.length, GAME_CONFIG.maxSlots); i++) player.slots[i] = loadedSlots[i];
            player.baseStats = { ...player.baseStats, ...parsed.player.stats }; player.recalculateStats();
            player.hp = Math.min(parsed.player.hp, player.stats.maxHp); player.mp = Math.min(parsed.player.mp, player.stats.maxMp);
            state.wave = parsed.state.wave || 1; state.deaths = parsed.state.deaths || 0; state.craftingExp = parsed.state.craftingExp || 0;
            state.townLevel = parsed.state.townLevel || 1; state.townExp = parsed.state.townExp || 0;
            GAME_CONFIG.town.radius = 80 * Math.pow(1.01, state.townLevel - 1);
            player.x = GAME_CONFIG.town.x; player.y = GAME_CONFIG.town.y; state.aggro = 0; state.isBossFight = false;
            initWorld(); updateUI(); renderSlots();
        }
        
        function autoSaveGame() { localStorage.setItem('magicBulletSave', JSON.stringify(getSaveData())); }
        function autoLoadGame() { const data = localStorage.getItem('magicBulletSave'); if (data) { applySaveData(JSON.parse(data)); showToast("進度已自動讀取"); } }
        setInterval(autoSaveGame, 10000);

        function exportSave() { const blob = new Blob([JSON.stringify(getSaveData())], { type: 'application/json' }); const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = 'magic_bullet_save.json'; a.click(); URL.revokeObjectURL(url); showToast("存檔已匯出！"); }
        function handleImportSave(event) { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (e) => { try { applySaveData(JSON.parse(e.target.result)); autoSaveGame(); showToast("存檔匯入成功！"); toggleModal('modal-file'); } catch (err) { showToast("存檔格式錯誤！"); } }; reader.readAsText(file); event.target.value = ''; }
        function fullResetGame() { localStorage.removeItem('magicBulletSave'); player = new Player(); state.wave = 1; state.deaths = 0; state.craftingExp = 0; state.aggro = 0; state.isBossFight = false; state.townLevel = 1; state.townExp = 0; GAME_CONFIG.town.radius = 80; initWorld(); updateUI(); renderSlots(); toggleModal('modal-file'); showToast("已重新開始遊戲"); }

        // --- 死亡處理機制 (UI 流程優化) ---
        function triggerDeath() {
            if (state.isDeadModalOpen) return;
            state.isDeadModalOpen = true;
            state.deaths++;
            
            // 暫停遊戲輸入
            state.input.x = 0; state.input.y = 0;
            if(joystickBase) joystickBase.style.display = 'none';
            // 更新死亡視窗資訊
            document.getElementById('death-wave').innerText = `第 ${state.wave} 波`;
            // 顯示死亡視窗
            document.getElementById('modal-death').style.display = 'flex';
            document.getElementById('modal-death').classList.remove('hidden');
        }

        // 玩家點擊確認後的實際重置
        function confirmDeath() {
            document.getElementById('modal-death').style.display = 'none';
            document.getElementById('modal-death').classList.add('hidden');
            
            player.x = GAME_CONFIG.town.x; player.y = GAME_CONFIG.town.y; 
            player.hp = player.stats.maxHp; player.mp = player.stats.maxMp;
            state.aggro = 0; state.isBossFight = false; 
            entities.enemies = []; entities.bullets = []; entities.hitEffects = []; entities.mines = [];

            entities.mercs.forEach(m => { 
                m.state = 'idle'; m.x = GAME_CONFIG.town.x + (Math.random()*40-20); m.y = GAME_CONFIG.town.y + (Math.random()*40-20); 
                m.hp = m.baseHp + (state.townLevel - 1) * (m.type === 'warrior' ? 30 : 20);
            });
            
            state.isDeadModalOpen = false;
            updateUI(); autoSaveGame();
        }

        /** ==========================================
         * 5. 無限地圖與邏輯更新
         * ========================================== */
        function update(dt) {
            if (player.hp <= 0 && !state.isDeadModalOpen) { triggerDeath(); return; }
            if (state.isDeadModalOpen) return;

            updateInputFromKeys();

            const inTown = Math.hypot(player.x - GAME_CONFIG.town.x, player.y - GAME_CONFIG.town.y) < GAME_CONFIG.town.radius;
            player.hp = Math.min(player.stats.maxHp, player.hp + (inTown ? player.stats.maxHp * 0.2 : player.stats.hpRegen) * dt);
            player.mp = Math.min(player.stats.maxMp, player.mp + (inTown ? player.stats.maxMp * 0.2 : player.stats.mpRegen) * dt);

            if (state.input.x !== 0 || state.input.y !== 0) {
                player.x += state.input.x * player.stats.spd * dt; player.y += state.input.y * player.stats.spd * dt;
                if (!state.isBossFight && !inTown) state.aggro = Math.min(GAME_CONFIG.maxAggro, state.aggro + GAME_CONFIG.aggroPerMove * dt * 10);
            }

            const despawnDist = 1800;
            entities.scenery = entities.scenery.filter(s => s.isTown || Math.hypot(player.x - s.x, player.y - s.y) < despawnDist);
            entities.ores = entities.ores.filter(o => Math.hypot(player.x - o.x, player.y - o.y) < despawnDist);
            entities.enemies = entities.enemies.filter(e => Math.hypot(player.x - e.x, player.y - e.y) < despawnDist * 1.5);
            entities.altars = entities.altars.filter(a => Math.hypot(player.x - a.x, player.y - a.y) < despawnDist);
            entities.mines = entities.mines.filter(m => Math.hypot(player.x - m.x, player.y - m.y) < despawnDist);

            while (entities.scenery.length < 150) {
                let rx = player.x + (Math.random() - 0.5) * 3000; let ry = player.y + (Math.random() - 0.5) * 3000;
                if (Math.hypot(rx - GAME_CONFIG.town.x, ry - GAME_CONFIG.town.y) > GAME_CONFIG.town.radius) entities.scenery.push({ x: rx, y: ry, emoji: Math.random() > 0.5 ? '🌳' : '🌲' });
            }
            if (entities.ores.length < 40 && Math.random() < 0.05) spawnRandomEntity(entities.ores, '🪨', 15, 1000);
            if (entities.altars.length < 3 && Math.random() < 0.01) spawnRandomEntity(entities.altars, '🗿', 20, 1500);

            for (let i = entities.ores.length - 1; i >= 0; i--) {
                const ore = entities.ores[i];
                if (Math.hypot(player.x - ore.x, player.y - ore.y) < player.size + ore.size + 10) {
                    const hpCost = Math.floor(Math.random() * 11) + 5; player.hp -= hpCost;
                    addFloatingText(player.x, player.y - 15, '採集!', '#fbbf24');
                    addFloatingText(player.x, player.y + 10, `-${hpCost} HP`, '#ff4444'); addHitEffect(player.x, player.y, '🩸', '#ff0000');
                    player.inventory.rawStones++; state.aggro = Math.min(GAME_CONFIG.maxAggro, state.aggro + GAME_CONFIG.aggroPerMine);
                    entities.ores.splice(i, 1);
                }
            }
            
            for (let i = entities.altars.length - 1; i >= 0; i--) {
                const altar = entities.altars[i];
                if (Math.hypot(player.x - altar.x, player.y - altar.y) < player.size + altar.size + 10) { activateAltar(); entities.altars.splice(i, 1); }
            }

            entities.mercs.forEach(m => m.update(dt, inTown));
            entities.mercs = entities.mercs.filter(m => !m.isDead);

            if (!inTown) {
                findAutoAimTarget(); state.shootTimer -= dt;
                if (state.shootTimer <= 0 && state.autoAimTarget && player.mp >= getShootCost()) { shoot(); state.shootTimer = 0.5; }
            } else { state.autoAimTarget = null; }

            updateBullets(dt); updateEnemies(dt, inTown); updateEffects(dt); updateMines(dt);
            if (!inTown) spawnEnemies(dt);

            state.camera.x = player.x - canvas.width / 2; state.camera.y = player.y - canvas.height / 2;
        }

        // --- 進階射擊邏輯 ---
        function getShootCost() { return 2 + player.slots.filter(g=>g).length*2; }
        function findAutoAimTarget() {
            let nearest = null; let minDist = 300;
            entities.enemies.forEach(e => { let d = Math.hypot(player.x - e.x, player.y - e.y); if (d < minDist) { minDist = d; nearest = e; } });
            state.autoAimTarget = nearest;
        }

        function shoot() {
            // 檢查身上有沒有「節制 (frugal)」寶石
            let hasFrugal = player.slots.some(g => g && g.type === 'frugal');
            // 如果有節制寶石，而且隨機數小於 0.25，就不扣魔力；否則正常扣
            if (hasFrugal && Math.random() < 0.25) {
            addFloatingText(player.x, player.y - 30, '省魔!', '#a7f3d0'); // 跳出特效字提醒玩家
            } else { player.mp -= getShootCost();}

            const centerAngle = Math.atan2(state.autoAimTarget.y - player.y, state.autoAimTarget.x - player.x);
            
            let hasFan = player.slots.some(g => g && g.type === 'wind');
            let hasCross = player.slots.some(g => g && g.type === 'light');
            let hasStar = player.slots.some(g => g && g.type === 'star');
            let hasBack = player.slots.some(g => g && g.type === 'back');
            let hasShotgun = player.slots.some(g => g && g.type === 'shotgun');
            
            let baseAngles = [];
            
            if (hasStar) {
                for (let i = 0; i < 8; i++) baseAngles.push(centerAngle + (Math.PI / 4) * i);
            } else if (hasShotgun) {
                baseAngles = [centerAngle - 0.4, centerAngle - 0.2, centerAngle, centerAngle + 0.2, centerAngle + 0.4];
            } else if (hasFan) {
                baseAngles = [centerAngle - 0.25, centerAngle, centerAngle + 0.25];
            } else {
                baseAngles = [centerAngle];
            }
            
            let finalAngles = [...baseAngles];
            
            if (hasBack && !hasStar) {
                baseAngles.forEach(a => finalAngles.push(a + Math.PI));
            }
            
            if (hasCross && !hasStar) {
                let expanded = [];
                finalAngles.forEach(a => { expanded.push(a, a + Math.PI/2, a - Math.PI/2); });
                finalAngles = [...new Set(expanded)]; 
            }

            let origins = [{ x: player.x, y: player.y }];

            if (player.slots.some(g => g && g.type === 'mirage')) {
                // 幻象出現在玩家背後 40 像素處
                origins.push({ 
                    x: player.x - Math.cos(centerAngle) * 40, 
                    y: player.y - Math.sin(centerAngle) * 40 
                });
            }

            origins.forEach(origin => {
                finalAngles.forEach(ang => {
                    let speedMulti = 1.0;
                    let dmgMulti = 1.0;
                    let bSize = 5;
                    let lifeTime = 1.5;
                    let bColor = '#ffff00';
                    
                    if (player.slots.some(g => g && g.type === 'sniper')) { speedMulti *= 3.0; dmgMulti *= 2.0; }
                    if (player.slots.some(g => g && g.type === 'meteor')) { speedMulti *= 0.3; dmgMulti *= 2.5; bSize += 15; lifeTime = 4.0; }
                    if (player.slots.some(g => g && g.type === 'star')) { speedMulti *= 0.5; lifeTime = 3.0; }
                    if (player.slots.some(g => g && g.type === 'shotgun')) { speedMulti *= 0.8; lifeTime = 0.6; }
                    if (player.slots.some(g => g && g.type === 'chaos')) { 
                        speedMulti *= (0.5 + Math.random() * 2); dmgMulti *= (0.1 + Math.random() * 3); 
                        bSize = 2 + Math.random() * 15; bColor = `hsl(${Math.random()*360}, 100%, 50%)`;
                    }
                

                let b = { owner: 'player', 
                        x: origin.x, y: origin.y, // ✨ 這裡把 player.x/y 換成 origin.x/y
                        vx: Math.cos(ang) * 300 * speedMulti, vy: Math.sin(ang) * 300 * speedMulti, 
                        life: lifeTime, size: bSize, color: bColor, 
                        dmg: player.stats.atk * dmgMulti, pierce: 1, effects: [], isSplit: false, hitTargets: new Set() 
                    };
                
                player.slots.forEach(gem => {
                    if(!gem) return;
                    if (gem.type === 'fire') { b.size+=3; b.color='#fc8181'; b.dmg*=1.2; }
                    if (gem.type === 'ice') { b.pierce+=2; b.color='#90cdf4'; b.effects.push('slow'); }
                    if (gem.type === 'thunder') { b.color='#faf089'; b.effects.push('chain'); }
                    if (gem.type === 'poison') { b.color='#9ae6b4'; b.effects.push('poison'); b.effects.push('crit_boost'); }
                    if (gem.type === 'summon') b.effects.push('summon');
                    if (gem.type === 'arcane') b.effects.push('homing');
                    if (gem.type === 'earth') b.effects.push('split');
                    if (gem.type === 'mine') b.effects.push('mine');
                    if (gem.type === 'vampire') b.effects.push('vampire');
                    if (gem.type === 'gravity') b.effects.push('gravity');
                    if (gem.type === 'time') b.effects.push('time');
                    if (gem.type === 'greed') b.effects.push('greed');
                    if (gem.type === 'phantom') { b.pierce = 999; b.color = '#e2e8f0'; };
                    if (gem.type === 'siphon') b.effects.push('siphon');
                    if (gem.type === 'boomerang') b.effects.push('boomerang');
                    if (gem.type === 'spiral') b.effects.push('spiral');
                    if (gem.type === 'cluster') b.effects.push('cluster');
                    if (gem.type === 'tether') b.effects.push('tether');
                    if (gem.type === 'growth') b.effects.push('growth');
                    if (gem.type === 'blackhole') b.effects.push('blackhole');
                });
                entities.bullets.push(b);
            });
         });
       }

        function updateBullets(dt) {
            for (let i = entities.bullets.length - 1; i >= 0; i--) {
                let b = entities.bullets[i];
                if (!b) continue;
                
                if (b.effects.includes('homing') && b.owner === 'player') {
                    let target = null; let minDist = 250;
                    entities.enemies.forEach(e => { if(e.invulnerable > 0) return; let d = Math.hypot(b.x - e.x, b.y - e.y); if (d < minDist) { minDist = d; target = e; } });
                    if (target) {
                        let currentAngle = Math.atan2(b.vy, b.vx); let targetAngle = Math.atan2(target.y - b.y, target.x - b.x);
                        let diff = targetAngle - currentAngle; while(diff < -Math.PI) diff += Math.PI*2; while(diff > Math.PI) diff -= Math.PI*2;
                        let turnRate = 4 * dt; let newAngle = currentAngle + Math.sign(diff) * Math.min(turnRate, Math.abs(diff));
                        let speed = Math.hypot(b.vx, b.vy); b.vx = Math.cos(newAngle) * speed; b.vy = Math.sin(newAngle) * speed;
                    }
                }

                if (b.effects.includes('tether') && b.owner === 'player') {
                    entities.enemies.forEach(e => {
                    if (e.invulnerable > 0) return;
                    let dSq = (b.x - e.x) ** 2 + (b.y - e.y) ** 2;
                     // 如果敵人在半徑 120 像素內
                     if (dSq < 14400) { 
                    e.hp -= (b.dmg * 0.5) * dt; // 每秒造成 50% 基礎傷害
                    // 產生連線特效 (控制機率避免畫面太亂)
                    if (Math.random() < 0.2) {
                    entities.hitEffects.push({ type: 'line', x: b.x, y: b.y, tx: e.x, ty: e.y, color: '#2dd4bf', life: 0.1 });
                    }
                    // 因為是持續扣血，所以也要檢查死亡
                    if (e.hp <= 0 && !e.isDead) {
                        e.isDead = true; // 標記死亡，交給主迴圈清理屍體與判斷魔王
                        // 觸發擊殺效果 (汲取、召喚)
                        if (b.effects.includes('siphon')) {
                            player.mp = Math.min(player.stats.maxMp, player.mp + 5);
                            addFloatingText(e.x, e.y - 20, '+5 MP', '#b91c1c');
                        }
                        if (b.effects.includes('summon') && Math.random() < 0.2) {
                            let type = Math.random() < 0.5 ? 'warrior' : 'priest';
                            let emoji = type === 'warrior' ? '🛡️' : '🪄';
                            entities.mercs.push(new Mercenary(type, emoji, e.x, e.y, true));
                            addFloatingText(e.x, e.y - 20, '召喚!', '#d6bcfa');
                        }
                    }
                    }
                  });
                } 

                if (b.effects.includes('gravity') && b.owner === 'player') {
                    entities.enemies.forEach(e => {
                        if(e.invulnerable > 0 || e.isBoss) return;
                        let dx = b.x - e.x; let dy = b.y - e.y;
                        let distSq = dx*dx + dy*dy;
                        if (distSq < 22500) { // 150 * 150
                            let pullAngle = Math.atan2(dy, dx);
                            e.x += Math.cos(pullAngle) * 100 * dt;
                            e.y += Math.sin(pullAngle) * 100 * dt;
                        }
                    });
                }
                if (b.effects.includes('spiral')) {
                    let waveSpeed = 15; // 旋轉速度
                    let waveSize = 250; // 波浪振幅
                    // 加上額外的偏移量
                     b.x += Math.cos(b.life * waveSpeed) * waveSize * dt;
                     b.y += Math.sin(b.life * waveSpeed) * waveSize * dt;
                }
                
                b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;

                if (b.effects.includes('growth') && b.owner === 'player') {
                    b.size += 15 * dt; // 每秒體積加 15
                    b.dmg += 5 * dt;   // 每秒傷害加 5
                }
                
                // 減少尾跡頻率，優化效能
                if (Math.random() < 0.15) { entities.hitEffects.push({ type: 'trail', x: b.x, y: b.y, color: b.color, size: b.size * 0.8, life: 0.2, isPlayer: b.owner === 'player' }); }
                
                let hitTarget = false;
                if (b.owner === 'player') {
                    for (let j = entities.enemies.length - 1; j >= 0; j--) {
                        let e = entities.enemies[j];
                        if (e.invulnerable > 0) continue; 
                        let dx = b.x - e.x; let dy = b.y - e.y;
                        let distSq = dx*dx + dy*dy;
                        let hitDist = b.size + e.size;
                        
                        if (!b.hitTargets.has(e) && distSq < hitDist*hitDist) {
                            hitTarget = true; b.hitTargets.add(e);
                            hitEnemy(e, b); b.pierce--;
                            if (b.pierce <= 0) break;
                        }
                    }
                } else {
                    let validTargets = [player]; entities.mercs.forEach(m => { if(m.state === 'follow' && m.hp > 0) validTargets.push(m); });
                    validTargets.forEach(t => {
                        let dx = b.x - t.x; let dy = b.y - t.y;
                        let distSq = dx*dx + dy*dy;
                        let hitDist = b.size + t.size;
                        // 加入防護機制：若打中，不再重複打同一個目標
                        if (!hitTarget && !b.hitTargets.has(t) && distSq < hitDist*hitDist) {
                            hitTarget = true; b.hitTargets.add(t);
                            if (t === player && Math.random() < player.stats.dodge) { addFloatingText(player.x, player.y, '閃躲!', '#a0aec0'); }
                            else {
                                let def = t === player ? player.stats.def : (t.baseDef + (state.townLevel - 1) * (t.type === 'warrior' ? 10 : 8));
                                let dmg = Math.max(1, b.dmg - def); t.hp -= dmg; addHitEffect(t.x, t.y, '🩸', '#ff0000');
                            }
                        }
                    });
                    if (hitTarget) b.pierce--;
                }

                if (b.life <= 0 && b.effects.includes('boomerang') && !b.isReturning && b.owner === 'player') {
                 b.vx = -b.vx; // 速度反轉 (掉頭)
                 b.vy = -b.vy;
                 b.life = 1.5; // 重新給予回程壽命
                 b.isReturning = true; // 標記為已回程，避免無限來回
                 b.hitTargets.clear(); // ✨ 清空已擊中清單，讓回程可以對同一隻怪再造成一次傷害！
                 } else if (b.pierce <= 0 || b.life <= 0) {
                    if (b.effects.includes('split') && !b.isSplit && b.owner === 'player') {
                        let currentAngle = Math.atan2(b.vy, b.vx); let speed = Math.hypot(b.vx, b.vy);
                        entities.bullets.push({ ...b, vx: Math.cos(currentAngle - 0.5)*speed, vy: Math.sin(currentAngle - 0.5)*speed, life: 1.0, size: Math.max(2, b.size - 2), pierce: 1, isSplit: true, hitTargets: new Set() });
                        entities.bullets.push({ ...b, vx: Math.cos(currentAngle + 0.5)*speed, vy: Math.sin(currentAngle + 0.5)*speed, life: 1.0, size: Math.max(2, b.size - 2), pierce: 1, isSplit: true, hitTargets: new Set() });
                    }

                    if (b.effects.includes('cluster') && !b.isSplit && b.owner === 'player') {
                        for (let k = 0; k < 5; k++) {
                        let angle = Math.random() * Math.PI * 2; // 隨機四面八方
                        entities.bullets.push({ ...b, vx: Math.cos(angle) * 150, vy: Math.sin(angle) * 150, life: 0.5, size: Math.max(2, b.size - 3), dmg: b.dmg * 0.3, pierce: 1, isSplit: true, hitTargets: new Set() });
                        }
                    }

                    if (b.effects.includes('blackhole') && !b.isBlackhole && b.owner === 'player') {
                        entities.bullets.push({ 
                            owner: 'player', 
                            x: b.x, y: b.y, 
                            vx: 0, vy: 0, // 停在原地
                            life: 3.0, // 黑洞存在 3 秒
                            size: 30, // 黑洞體積
                            color: '#4c1d95', // 深紫色
                            dmg: b.dmg * 0.2, // 傷害降為 20%（因為是持續電擊）
                            pierce: 9999, // 超高穿透，確保不會因為怪碰到底而消失
                            effects: ['gravity', 'tether'], // ✨ 核心魔法：結合重力吸引與雷射傷害！
                            isBlackhole: true, // 標記為黑洞，防止黑洞消失時又產黑洞
                            hitTargets: new Set() 
                        });
                    }

                    if (entities.bullets[i]) entities.bullets.splice(i, 1);
                }
            }
        }

        // --- 地雷系統 (震波特效改版) ---
        function updateMines(dt) {
            for (let i = entities.mines.length - 1; i >= 0; i--) {
                let m = entities.mines[i];
                m.life -= dt;
                let triggered = m.life <= 0;
                
                if (!triggered) {
                    for (let j = 0; j < entities.enemies.length; j++) {
                        let dx = entities.enemies[j].x - m.x; let dy = entities.enemies[j].y - m.y;
                        if (dx*dx + dy*dy < m.radius*m.radius) { triggered = true; break; }
                    }
                }
                
                if (triggered) {
                    // 加入震波特效
                    entities.hitEffects.push({ type: 'shockwave', x: m.x, y: m.y, radius: m.radius * 1.5, color: '#ef4444', life: 0.4 });
                    entities.hitEffects.push({ type: 'shockwave', x: m.x, y: m.y, radius: m.radius * 1.0, color: '#fca5a5', life: 0.3 });
                    
                    entities.enemies.forEach(e => {
                        if (e.invulnerable > 0) return;
                        let dx = e.x - m.x; let dy = e.y - m.y;
                        let blastRad = m.radius * 1.5;
                        if (dx*dx + dy*dy < blastRad*blastRad) { e.hp -= m.dmg; addHitEffect(e.x, e.y, '✨', '#ff4444'); }
                    });
                    entities.mines.splice(i, 1);
                }
            }
        }

        function hitEnemy(e, b) {
            let isCrit = Math.random() < player.stats.critRate + (b.effects.includes('crit_boost') ? 0.2 : 0);
            let finalDmg = isCrit ? b.dmg * player.stats.critDmg : b.dmg;
            
            if (e.sunderTimer > 0) {
                finalDmg *= 1.5; // 破甲狀態下傷害 1.5 倍
                addHitEffect(e.x, e.y, '💔', '#fca5a5'); // 額外飄個破甲特效
            }

            if (e.petrifyTimer > 0) {
                finalDmg *= 0.5; 
            }

             e.hp -= finalDmg; addHitEffect(e.x, e.y, isCrit ? '💥' : '✨', isCrit ? '#fbbf24' : '#ffffff'); 

            if (b.effects.includes('sunder')) {
                e.sunderTimer = 3.0; // 破甲狀態持續 3 秒
            }

            if (b.effects.includes('petrify') && Math.random() < 0.15 && !e.isBoss) {
                e.petrifyTimer = 4.0; // 石化狀態持續 4 秒
                e.stun = 4.0;         // 借用原本的暈眩變數讓怪物定身
                addFloatingText(e.x, e.y - 15, '🧱石化', '#a8a29e');
            }
            
            if (e.hp <= 0 && b.effects.includes('siphon')) {
                player.mp = Math.min(player.stats.maxMp, player.mp + 5);
                addFloatingText(e.x, e.y - 20, '+5 MP', '#b91c1c');
            }

            if (e.hp <= 0 && b.effects.includes('summon')) {
             if (Math.random() < 0.2) {
               let type = Math.random() < 0.5 ? 'warrior' : 'priest';
               let emoji = type === 'warrior' ? '🛡️' : '🪄';
               // 在怪物死亡的位置生成傭兵，並加入隊伍陣列
               entities.mercs.push(new Mercenary(type, emoji, e.x, e.y, true));
               addFloatingText(e.x, e.y - 20, '召喚!', '#d6bcfa');
              }
             }
            
            if (b.effects.includes('slow')) e.spd = Math.max(e.baseSpd * 0.2, e.spd * 0.6);
            if (b.effects.includes('mine')) entities.mines.push({ x: e.x, y: e.y, radius: 40, dmg: b.dmg * 1.5, life: 3.0 });
            if (b.effects.includes('vampire') && Math.random() < 0.2) {
                player.hp = Math.min(player.stats.maxHp, player.hp + finalDmg * 0.1);
                addFloatingText(player.x, player.y - 10, '+HP', '#f43f5e');
            }
            if (b.effects.includes('poison')) {
                e.poisonTimer = 3.0; // 中毒持續 3 秒
                e.poisonDmg = b.dmg * 0.3; // 每秒受到子彈基礎傷害 30% 的毒傷
            }

            if (b.effects.includes('time') && Math.random() < 0.15 && !e.isBoss) {
                e.stun = 3.0; addFloatingText(e.x, e.y - 15, '⏳時停', '#6ee7b7');
            }
            
            if (b.effects.includes('chain')) {
                let chainTarget = null; let minChainDistSq = 22500; // 150*150
                entities.enemies.forEach(otherE => {
                    if (otherE !== e && otherE.invulnerable <= 0) { 
                        let distSq = (e.x - otherE.x)*(e.x - otherE.x) + (e.y - otherE.y)*(e.y - otherE.y); 
                        if (distSq < minChainDistSq) { minChainDistSq = distSq; chainTarget = otherE; } 
                    }
                });
                if (chainTarget) {
                    chainTarget.hp -= finalDmg * 0.5; addHitEffect(chainTarget.x, chainTarget.y, '⚡', '#faf089');
                    entities.hitEffects.push({ type: 'line', x: e.x, y: e.y, tx: chainTarget.x, ty: chainTarget.y, color: '#faf089', life: 0.2 });
                }
            }
            
            if (e.hp <= 0 && b.effects.includes('greed') && Math.random() < 0.2) {
                entities.ores.push({ x: e.x, y: e.y, emoji: '💎', size: 15 });
            }
        }

        function updateEnemies(dt, inTown) {
            let validTargets = [player]; entities.mercs.forEach(m => { if(m.state === 'follow' && m.hp > 0) validTargets.push(m); });

            entities.enemies.forEach(e => {
                if (e.hp <= 0) e.isDead = true;
                if (e.sunderTimer > 0) e.sunderTimer -= dt;
                if (e.petrifyTimer > 0) e.petrifyTimer -= dt;
                if (e.poisonTimer > 0) {
                 e.poisonTimer -= dt;
                 e.hp -= e.poisonDmg * dt; // 持續扣血
                 // 偶爾冒出毒泡泡特效，讓玩家知道怪物中毒了
                 if (Math.random() < 0.1) addHitEffect(e.x, e.y, '🫧', '#9ae6b4');
                 }
            });

            for (let i = entities.enemies.length - 1; i >= 0; i--) {
                let e = entities.enemies[i];
                if (e.isDead) {
                    addHitEffect(e.x, e.y, '💨');
                    if (e.isBoss) { state.isBossFight = false; state.aggro = 0; state.wave++; showToast(`消滅了魔王！進入第 ${state.wave} 波`); }
                    entities.enemies.splice(i, 1);
                    continue;
                }

                if (e.invulnerable > 0) {
                    e.invulnerable -= dt;
                    e.x += Math.cos(e.wanderAngle) * e.spd * 2 * dt;
                    e.y += Math.sin(e.wanderAngle) * e.spd * 2 * dt;
                    continue; 
                }

                if (e.stun && e.stun > 0) { e.stun -= dt; continue; }
                if (e.spd < e.baseSpd) e.spd += (e.baseSpd - e.spd) * dt * 0.5;

                let closestTarget = player; let minDistToTargetSq = (player.x - e.x)*(player.x - e.x) + (player.y - e.y)*(player.y - e.y);
                validTargets.forEach(t => { let dSq = (t.x - e.x)*(t.x - e.x) + (t.y - e.y)*(t.y - e.y); if (dSq < minDistToTargetSq) { minDistToTargetSq = dSq; closestTarget = t; } });
                let distToTownSq = (e.x - GAME_CONFIG.town.x)*(e.x - GAME_CONFIG.town.x) + (e.y - GAME_CONFIG.town.y)*(e.y - GAME_CONFIG.town.y);

                let townRad150 = GAME_CONFIG.town.radius + 150;
                
                if (inTown) {
                    if (distToTownSq < townRad150*townRad150) {
                        let angle = Math.atan2(e.y - GAME_CONFIG.town.y, e.x - GAME_CONFIG.town.x);
                        e.x += Math.cos(angle) * (e.spd * 0.6) * dt; e.y += Math.sin(angle) * (e.spd * 0.6) * dt;
                    } else {
                        if (!e.wanderAngle || Math.random() < 0.02) e.wanderAngle = Math.random() * Math.PI * 2;
                        e.x += Math.cos(e.wanderAngle) * (e.spd * 0.3) * dt; e.y += Math.sin(e.wanderAngle) * (e.spd * 0.3) * dt;
                    }
                } else {
                    if (minDistToTargetSq > 100) { // > 10
                        if (e.isRanged && minDistToTargetSq < 62500) { // < 250
                            if (minDistToTargetSq < 22500) { // < 150
                                let angle = Math.atan2(e.y - closestTarget.y, e.x - closestTarget.x); e.x += Math.cos(angle) * e.spd * dt; e.y += Math.sin(angle) * e.spd * dt;
                            }
                            if (e.atkCooldown <= 0) {
                                let baseAng = Math.atan2(closestTarget.y - e.y, closestTarget.x - e.x);
                                let angles = [baseAng];
                                if(e.attackPattern === 'fan') angles = [baseAng-0.3, baseAng, baseAng+0.3];
                                else if(e.attackPattern === 'shotgun') angles = [baseAng-0.4, baseAng-0.2, baseAng, baseAng+0.2, baseAng+0.4];
                                else if(e.attackPattern === 'circle') { angles=[]; for(let a=0;a<Math.PI*2;a+=Math.PI/4) angles.push(a); }
                                
                                angles.forEach(ang => { entities.bullets.push({ owner: 'enemy', x: e.x, y: e.y, vx: Math.cos(ang)*200, vy: Math.sin(ang)*200, life: 2, size: 6, color: '#ff4444', dmg: e.atk, pierce: 1, effects: [], hitTargets: new Set() }); });
                                e.atkCooldown = 2.0;
                            }
                        } else {
                            let angle = Math.atan2(closestTarget.y - e.y, closestTarget.x - e.x); let nextX = e.x + Math.cos(angle) * e.spd * dt; let nextY = e.y + Math.sin(angle) * e.spd * dt;
                            let distToTownCenterSq = (nextX - GAME_CONFIG.town.x)*(nextX - GAME_CONFIG.town.x) + (nextY - GAME_CONFIG.town.y)*(nextY - GAME_CONFIG.town.y); 
                            let townBarrier = GAME_CONFIG.town.radius + (e.size / 2);
                            if (distToTownCenterSq < townBarrier*townBarrier) {
                                let pushAngle = Math.atan2(nextY - GAME_CONFIG.town.y, nextX - GAME_CONFIG.town.x); nextX = GAME_CONFIG.town.x + Math.cos(pushAngle) * townBarrier; nextY = GAME_CONFIG.town.y + Math.sin(pushAngle) * townBarrier;
                            }
                            e.x = nextX; e.y = nextY;
                        }
                    }
                }

                let hitDist = closestTarget.size + e.size;
                if (!inTown && minDistToTargetSq < hitDist*hitDist && e.atkCooldown <= 0 && !e.isRanged) {
                    if (closestTarget === player && Math.random() < player.stats.dodge) { addFloatingText(player.x, player.y, '閃躲!', '#a0aec0'); }
                    else {
                        let def = closestTarget === player ? player.stats.def : (closestTarget.baseDef + (state.townLevel - 1) * (closestTarget.type === 'warrior' ? 10 : 8));
                        let dmg = Math.max(1, e.atk - def); closestTarget.hp -= dmg; addHitEffect(closestTarget.x, closestTarget.y, '🩸', '#ff0000');
                    }
                    e.atkCooldown = 1.0;
                }
                if(e.atkCooldown > 0) e.atkCooldown -= dt;
            }
        }

        function spawnEnemies(dt) {
            state.enemySpawnTimer -= dt; if (state.enemySpawnTimer > 0) return;
            state.enemySpawnTimer = 0.25; 
            
            let patterns = ['single', 'fan', 'shotgun', 'circle'];
            
            if (state.aggro >= GAME_CONFIG.maxAggro && !state.isBossFight) {
                state.isBossFight = true; showToast("⚠️ 魔王降臨 ⚠️");
                let t = BOSS_TEMPLATES[Math.floor(Math.random() * BOSS_TEMPLATES.length)];
                let emoji = t.emojiPool[Math.floor(Math.random() * t.emojiPool.length)];
                let w = 1 + ((state.wave - 1) * 0.3);
                let angle = Math.random() * Math.PI * 2; let actualSpd = 40 * t.spdMulti;
                entities.enemies.push({ x: player.x + Math.cos(angle)*600, y: player.y + Math.sin(angle)*600, emoji: emoji, size: 40, hp: t.baseHp * w, maxHp: t.baseHp * w,  atk: t.baseAtk * w, spd: actualSpd, baseSpd: actualSpd, atkCooldown: 0, isBoss: true, isRanged: t.isRanged, attackPattern: patterns[Math.floor(Math.random()*patterns.length)], isDead: false, invulnerable: 1.0, wanderAngle: angle });
            }
            
            let aggroRatio = state.aggro / GAME_CONFIG.maxAggro;
            let spawnChance = 0.02 + Math.pow(aggroRatio, 2) * 0.15;
            
            if (!state.isBossFight && Math.random() < spawnChance && entities.enemies.length < 60) {
                let t = ENEMY_TEMPLATES[Math.floor(Math.random() * ENEMY_TEMPLATES.length)];
                let emoji = t.emojiPool[Math.floor(Math.random() * t.emojiPool.length)];
                let w = 1 + ((state.wave - 1) * 0.2);
                let angle = Math.random() * Math.PI * 2;
                entities.enemies.push({ x: player.x + Math.cos(angle)*400, y: player.y + Math.sin(angle)*400, emoji: emoji, size: 15, hp: t.baseH * w, maxHp: t.baseHp * w, atk: t.baseAtk * w, spd: t.spd, baseSpd: t.spd, atkCooldown: 0, isBoss: false, isRanged: t.isRanged, attackPattern: t.isRanged ? patterns[Math.floor(Math.random()*patterns.length)] : 'single', isDead: false, invulnerable: 1.0, wanderAngle: angle });
            }
        }

        function activateAltar() {
            let r = Math.random();
            if (r < 0.25) { player.hp = Math.min(player.stats.maxHp, player.hp + player.stats.maxHp * 0.5); addFloatingText(player.x, player.y - 20, "✨ 治癒之風", "#4ade80", true); }
            else if (r < 0.5) { player.hp -= player.stats.maxHp * 0.2; addFloatingText(player.x, player.y - 20, "💀 鮮血祭祀", "#f87171", true); }
            else if (r < 0.75) { state.aggro = Math.min(GAME_CONFIG.maxAggro, state.aggro + 30); addFloatingText(player.x, player.y - 20, "⚠️ 狂怒印記", "#c084fc", true); }
            else { state.aggro = Math.max(0, state.aggro - 30); addFloatingText(player.x, player.y - 20, "🕊️ 寧靜之祈", "#93c5fd", true); }
        }

        function addFloatingText(x, y, text, color, isBig = false) { entities.floatingTexts.push({ x, y, text, color, life: 1, isBig }); }
        function addHitEffect(x, y, emoji='💥', color='#ffffff') { entities.hitEffects.push({ type: 'emoji', x: x + (Math.random()*10-5), y: y + (Math.random()*10-5), emoji, color, life: 0.3 }); }
        function updateEffects(dt) {
            for (let i = entities.floatingTexts.length - 1; i >= 0; i--) { entities.floatingTexts[i].y -= 30 * dt; entities.floatingTexts[i].life -= dt; if (entities.floatingTexts[i].life <= 0) entities.floatingTexts.splice(i, 1); }
            for (let i = entities.hitEffects.length - 1; i >= 0; i--) { entities.hitEffects[i].life -= dt; if (entities.hitEffects[i].life <= 0) entities.hitEffects.splice(i, 1); }
        }

        /** ==========================================
         * 6. 渲染與 UI
         * ========================================== */
        function render() {
            state.timeOfDay = (state.timeOfDay + 0.0005) % 24; 
            
            let bgLight = Math.sin((state.timeOfDay / 24) * Math.PI * 2) * 20 + 30;
            let centerColor = state.isBossFight ? `hsl(0, 50%, 25%)` : `hsl(120, 30%, ${bgLight}%)`;
            let edgeColor = state.isBossFight ? `hsl(0, 70%, 10%)` : `hsl(120, 40%, ${bgLight - 15}%)`;
            let grd = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, Math.max(canvas.width, canvas.height));
            grd.addColorStop(0, centerColor); grd.addColorStop(1, edgeColor);
            ctx.fillStyle = grd; ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save(); ctx.translate(-state.camera.x, -state.camera.y);

            ctx.beginPath(); ctx.arc(GAME_CONFIG.town.x, GAME_CONFIG.town.y, GAME_CONFIG.town.radius, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(150, 150, 150, 0.3)'; ctx.fill();
            ctx.strokeStyle = 'rgba(100, 200, 255, 0.6)'; ctx.setLineDash([10, 10]); ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
            
            ctx.globalAlpha = 1.0;
            ctx.fillStyle = '#ffffff'; 
            ctx.font = '24px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            entities.scenery.forEach(s => { if(s.x>state.camera.x-50 && s.x<state.camera.x+canvas.width+50 && s.y>state.camera.y-50 && s.y<state.camera.y+canvas.height+50) ctx.fillText(s.emoji, s.x, s.y); });
            ctx.font = '20px sans-serif'; entities.ores.forEach(o => { ctx.fillText(o.emoji, o.x, o.y); });
            ctx.font = '28px sans-serif'; entities.altars.forEach(a => { ctx.fillText(a.emoji, a.x, a.y); });
            
            entities.mines.forEach(m => {
                ctx.beginPath(); ctx.arc(m.x, m.y, m.radius, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(239, 68, 68, 0.2)'; ctx.fill();
                ctx.strokeStyle = 'rgba(239, 68, 68, 0.8)'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
                ctx.fillStyle = '#ffffff'; 
                ctx.font = '16px sans-serif'; ctx.fillText('💣', m.x, m.y);
            });

            entities.mercs.forEach(m => {
                ctx.fillStyle = '#ffffff'; 
                ctx.font = '20px sans-serif'; ctx.fillText(m.emoji, m.x, m.y);
                let mMaxHp = m.baseHp + (state.townLevel - 1) * (m.type === 'warrior' ? 30 : 20);
                if(m.state === 'follow' && m.hp < mMaxHp) { 
                   ctx.fillStyle='#000'; ctx.fillRect(m.x-10, m.y-18, 20, 3); 
                   ctx.fillStyle='#0f0'; ctx.fillRect(m.x-10, m.y-18, 20 * (m.hp / mMaxHp), 3); 
                   }
            });
            
            entities.enemies.forEach(e => {
                ctx.fillStyle = '#ffffff'; 
                ctx.font = `${e.size * 1.5}px sans-serif`; 
                if (e.invulnerable > 0) ctx.globalAlpha = 0.5 + Math.sin(e.invulnerable * 20) * 0.3;
                ctx.fillText(e.emoji, e.x, e.y);
                ctx.globalAlpha = 1.0;
                
                if (e.stun && e.stun > 0) { ctx.font = '16px sans-serif'; ctx.fillText('💫', e.x, e.y - e.size); }
            });

            // ⚠️ 關鍵修復：將 inTown 的宣告移到上面
            const inTown = Math.hypot(player.x - GAME_CONFIG.town.x, player.y - GAME_CONFIG.town.y) < GAME_CONFIG.town.radius;

            if (player.slots.some(g => g && g.type === 'mirage') && state.autoAimTarget && !inTown) {
              const centerAngle = Math.atan2(state.autoAimTarget.y - player.y, state.autoAimTarget.x - player.x);
              let mx = player.x - Math.cos(centerAngle) * 40;
              let my = player.y - Math.sin(centerAngle) * 40;
        
              ctx.globalAlpha = 0.4; // 設定為 40% 半透明
              ctx.font = '24px sans-serif'; 
              ctx.fillText('🧙‍♂️', mx, my); // 畫出幻影
              ctx.globalAlpha = 1.0; // 畫完後恢復不透明
             }
            
            ctx.fillStyle = '#ffffff'; 
            ctx.font = '24px sans-serif'; ctx.fillText('🧙‍♂️', player.x, player.y);
            
            if (!inTown && state.autoAimTarget && player.mp >= getShootCost()) {
                ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(state.autoAimTarget.x, state.autoAimTarget.y);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
            }

            // 移除 ctx.shadowBlur 解決過熱問題
            entities.bullets.forEach(b => {
                ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx));
                if (b.owner === 'player') {
                    let grad = ctx.createRadialGradient(0, 0, 0, 0, 0, b.size);
                    grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.5, b.color); grad.addColorStop(1, 'transparent');
                    ctx.beginPath(); ctx.ellipse(0, 0, b.size*1.5, b.size*0.8, 0, 0, Math.PI*2);
                    ctx.fillStyle = grad; ctx.fill();
                } else {
                    ctx.beginPath(); ctx.moveTo(b.size*1.2, 0); ctx.lineTo(-b.size, b.size*0.8); ctx.lineTo(-b.size*0.5, 0); ctx.lineTo(-b.size, -b.size*0.8); ctx.closePath();
                    let grad = ctx.createLinearGradient(-b.size, 0, b.size*1.2, 0);
                    grad.addColorStop(0, 'rgba(0,0,0,0.8)'); grad.addColorStop(1, b.color);
                    ctx.fillStyle = grad; ctx.fill();
                }
                ctx.restore();
            });
            
            entities.hitEffects.forEach(h => {
                if (h.type === 'line') {
                    ctx.beginPath(); ctx.moveTo(h.x, h.y); ctx.lineTo(h.tx, h.ty);
                    ctx.strokeStyle = h.color; ctx.lineWidth = 2; ctx.globalAlpha = Math.max(0, h.life / 0.2); ctx.stroke(); ctx.globalAlpha = 1.0;
                } else if (h.type === 'trail') {
                    ctx.beginPath(); ctx.arc(h.x, h.y, h.size, 0, Math.PI*2);
                    ctx.fillStyle = h.color; ctx.globalAlpha = Math.max(0, h.life / 0.2) * 0.5; ctx.fill(); ctx.globalAlpha = 1.0;
                } else if (h.type === 'shockwave') {
                    // 新增震波繪製邏輯
                    ctx.beginPath(); ctx.arc(h.x, h.y, h.radius * (1 - h.life / 0.4), 0, Math.PI*2);
                    ctx.strokeStyle = h.color; ctx.lineWidth = 4 * (h.life / 0.4); ctx.globalAlpha = Math.max(0, h.life / 0.4); ctx.stroke(); ctx.globalAlpha = 1.0;
                } else {
                    ctx.font = '20px sans-serif'; ctx.globalAlpha = Math.max(0, h.life / 0.3); ctx.fillStyle = h.color; ctx.fillText(h.emoji, h.x, h.y); ctx.globalAlpha = 1.0; 
                }
            });
            entities.floatingTexts.forEach(ft => { ctx.fillStyle = ft.color; ctx.font = ft.isBig ? 'bold 20px sans-serif' : '14px sans-serif'; ctx.globalAlpha = Math.max(0, ft.life); ctx.fillText(ft.text, ft.x, ft.y); ctx.globalAlpha = 1.0; });
            ctx.restore(); updateUI(); updatePointers();
        }

        function updatePointers() {
            const tp = document.getElementById('town-pointer'); const bp = document.getElementById('boss-pointer');
            let townDist = Math.hypot(player.x - GAME_CONFIG.town.x, player.y - GAME_CONFIG.town.y);
            if (townDist > Math.max(canvas.width, canvas.height) / 1.5) {
                tp.style.display = 'flex'; document.getElementById('town-dist').innerText = `${Math.floor(townDist/10)}m`;
                let angle = Math.atan2(GAME_CONFIG.town.y - player.y, GAME_CONFIG.town.x - player.x);
                let px = canvas.width/2 + Math.cos(angle) * (canvas.width/2 - 30); let py = canvas.height/2 + Math.sin(angle) * (canvas.height/2 - 30);
                px = Math.max(30, Math.min(canvas.width - 30, px)); py = Math.max(30, Math.min(canvas.height - 30, py));
                tp.style.left = `${px-20}px`; tp.style.top = `${py-20}px`;
            } else { tp.style.display = 'none'; }

            let boss = entities.enemies.find(e => e.isBoss);
            if (boss) {
                let bossDist = Math.hypot(player.x - boss.x, player.y - boss.y);
                if (bossDist > Math.max(canvas.width, canvas.height) / 1.8) {
                    bp.style.display = 'flex';
                    let angle = Math.atan2(boss.y - player.y, boss.x - player.x);
                    let px = canvas.width/2 + Math.cos(angle) * (canvas.width/2 - 30); let py = canvas.height/2 + Math.sin(angle) * (canvas.height/2 - 30);
                    px = Math.max(30, Math.min(canvas.width - 30, px)); py = Math.max(30, Math.min(canvas.height - 30, py));
                    bp.style.left = `${px-20}px`; bp.style.top = `${py-20}px`;
                } else { bp.style.display = 'none'; }
            } else { bp.style.display = 'none'; }
        }

        function updateUI() {
            document.getElementById('ui-wave').innerText = state.wave; document.getElementById('ui-deaths').innerText = state.deaths;
            document.getElementById('ui-town-level').innerText = `Lv ${state.townLevel}`;
            document.getElementById('ui-town-exp').innerText = `城鎮EXP: ${state.townExp}/${state.townLevel * 10}`;
            
            document.getElementById('bar-hp').style.width = `${Math.max(0, Math.min(100, (player.hp/player.stats.maxHp)*100))}%`; document.getElementById('text-hp').innerText = `${Math.floor(player.hp)} / ${Math.floor(player.stats.maxHp)}`;
            document.getElementById('bar-mp').style.width = `${Math.max(0, Math.min(100, (player.mp/player.stats.maxMp)*100))}%`; document.getElementById('text-mp').innerText = `${Math.floor(player.mp)} / ${Math.floor(player.stats.maxMp)}`;
            const aggroPct = (state.aggro / GAME_CONFIG.maxAggro) * 100; document.getElementById('bar-aggro').style.width = `${aggroPct}%`;
            if (state.isBossFight) { document.getElementById('bar-aggro').classList.replace('bg-purple-600', 'bg-red-600'); document.getElementById('text-aggro').innerText = `⚠️ 魔王戰鬥中`; }
            else { document.getElementById('bar-aggro').classList.replace('bg-red-600', 'bg-purple-600'); document.getElementById('text-aggro').innerText = `${Math.floor(aggroPct)}%`; }
        }

        /** ==========================================
         * 7. 寶石系統
         * ========================================== */
        function craftGem() {
            if (player.inventory.rawStones <= 0) { showToast('原石不足！(請在世界中採礦)'); return; }
            if (player.inventory.gems.length >= GAME_CONFIG.inventoryLimit) { showToast('背包已滿！請先丟棄或鑲嵌'); return; }

            player.inventory.rawStones--; state.craftingExp++;
            let expBonus = state.craftingExp;
            let availableTiers = RARITY_TIERS.filter(t => expBonus >= t.valueReq); if (availableTiers.length === 0) availableTiers = [RARITY_TIERS[0]];
