<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Medieval Magic Idle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #0b0b13;
            color: white;
            font-family: 'MedievalSharp', cursive;
            overflow: hidden;
            touch-action: none; /* Prevent scroll on touch devices */
            user-select: none;
            -webkit-user-select: none;
        }
        #game-container {
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background-color: #050510;
            box-shadow: 0 0 30px rgba(100, 0, 255, 0.2);
            /* Constrain width on desktop to maintain portrait ratio */
            max-width: 600px;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            let w = Math.min(window.innerWidth, 600);
            let h = window.innerHeight;
            canvas.width = w;
            canvas.height = h;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const GAME_DATA = {
            enemies: {
                weak: { hp: 10, speed: 80, radius: 15, score: 10, color: '#ff4444', type: 'minion', rate: 0.5 },
                fast: { hp: 5, speed: 180, radius: 12, score: 15, color: '#4444ff', type: 'fast', rate: 0.3 },
                tank: { hp: 50, speed: 40, radius: 25, score: 25, color: '#44ff44', type: 'tank', rate: 0.2 },
                boss: { hp: 600, speed: 20, radius: 65, score: 500, color: '#ff00ff', type: 'boss', rate: 0 }
            },
            wandPaths: ['straight', 'curve', 'laser', 'homing'],
            wandColors: ['#FF5733', '#33FF57', '#3357FF', '#F333FF', '#33FFF3', '#FFFF33', '#FFFFFF'],
            emojis: {
                entities: ['🦇', '🕷️', '🧟', '🧛', '🐺', '🐉', '🐲', '👹', '👺', '👻', '💀', '👽', '👾', '🐍', '🪲', '🦂', '😈', '👿', '🧌', '👁️', '🌋', '🌑', '🧿', '🦑']
            },
            allies: {
                warrior: { emoji: '🤺', type: 'warrior', speed: 120, life: 15, radius: 15 },
                cleric:  { emoji: '🧙‍♀️', type: 'cleric', speed: 80, life: 15, radius: 15 },
                rogue:   { emoji: '🥷', type: 'rogue', speed: 200, life: 10, radius: 15 },
                bard:    { emoji: '🧚', type: 'bard', speed: 100, life: 20, radius: 15 }
            },
            bulletShapes: ['circle', 'diamond', 'triangle', 'square', 'hollow']
        };

        class ObjectPool {
            constructor(createFn) {
                this.pool = [];
                this.createFn = createFn;
            }
            get() { return this.pool.length > 0 ? this.pool.pop() : this.createFn(); }
            release(obj) { this.pool.push(obj); }
        }

        class Bullet {
            constructor() { 
                this.active = false; 
                this.hitEnemies = new Set();
            }
            init(x, y, dx, dy, props, isPlayer) {
                this.active = true;
                this.x = x; this.y = y;
                this.dx = dx; this.dy = dy;
                this.isPlayer = isPlayer;
                this.lifeTime = 0;
                this.hitEnemies.clear();
                
                this.shape = 'circle';
                this.isPierce = false;
                this.isSplit = false;
                this.isLifesteal = false;
                this.isFreeze = false;
                this.isExplosion = false;
                this.chainCount = 0;
                this.hasSplit = false;
                this.laserTick = 0;

                Object.assign(this, props);
            }
            update(dt, game) {
                this.lifeTime += dt;
                
                if (this.path === 'laser') {
                    this.laserTick += dt;
                    if (this.laserTick > 0.15) {
                        this.hitEnemies.clear();
                        this.laserTick = 0;
                    }
                }
                
                if (this.path === 'curve') {
                    let wobbleSpeed = Math.sin(this.lifeTime * 15) * 150; 
                    let baseAngle = Math.atan2(this.dy, this.dx);
                    let perpX = Math.cos(baseAngle + Math.PI/2) * wobbleSpeed;
                    let perpY = Math.sin(baseAngle + Math.PI/2) * wobbleSpeed;
                    this.x += (this.dx + perpX) * dt;
                    this.y += (this.dy + perpY) * dt;
                } else if (this.path === 'laser') {
                    this.dx *= 1.02;
                    this.dy *= 1.02;
                    this.x += this.dx * dt;
                    this.y += this.dy * dt;
                } else if (this.path === 'homing') {
                    let target = game.getNearestEnemy(this.x, this.y);
                    if (target) {
                        let speed = Math.hypot(this.dx, this.dy) || 400;
                        let desiredAngle = Math.atan2(target.y - this.y, target.x - this.x);
                        let desiredDx = Math.cos(desiredAngle) * speed;
                        let desiredDy = Math.sin(desiredAngle) * speed;
                        this.dx += (desiredDx - this.dx) * 10 * dt;
                        this.dy += (desiredDy - this.dy) * 10 * dt;
                    }
                    this.x += this.dx * dt;
                    this.y += this.dy * dt;
                } else {
                    this.x += this.dx * dt;
                    this.y += this.dy * dt;
                }

                if (this.y < -100 || this.y > canvas.height + 100 || this.x < -100 || this.x > canvas.width + 100) {
                    this.active = false;
                }
                if (this.lifeTime > 2.0) {
                    this.active = false;
                }
            }
            draw(ctx) {
                ctx.save();
                ctx.fillStyle = this.color;
                ctx.beginPath();
                if (this.shape === 'circle') {
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                    ctx.fill();
                } else if (this.shape === 'diamond') {
                    ctx.moveTo(this.x, this.y - this.size);
                    ctx.lineTo(this.x + this.size, this.y);
                    ctx.lineTo(this.x, this.y + this.size);
                    ctx.lineTo(this.x - this.size, this.y);
                    ctx.fill();
                } else if (this.shape === 'triangle') {
                    ctx.moveTo(this.x, this.y - this.size);
                    ctx.lineTo(this.x + this.size, this.y + this.size);
                    ctx.lineTo(this.x - this.size, this.y + this.size);
                    ctx.fill();
                } else if (this.shape === 'square') {
                    let angle = this.lifeTime * 5; 
                    ctx.translate(this.x, this.y);
                    ctx.rotate(angle);
                    ctx.fillRect(-this.size, -this.size, this.size * 2, this.size * 2);
                } else if (this.shape === 'hollow') {
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else {
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        class Particle {
            constructor() { this.active = false; }
            init(x, y, color, speedScale) {
                this.active = true;
                this.x = x; this.y = y; this.color = color;
                let angle = Math.random() * Math.PI * 2;
                let v = Math.random() * 150 * speedScale;
                this.dx = Math.cos(angle) * v;
                this.dy = Math.sin(angle) * v;
                this.lifeTime = 0;
                this.maxLife = Math.random() * 0.4 + 0.2;
                this.size = Math.random() * 4 + 1;
            }
            update(dt) {
                this.lifeTime += dt;
                this.x += this.dx * dt;
                this.y += this.dy * dt;
                if (this.lifeTime > this.maxLife) this.active = false;
            }
            draw(ctx) {
                ctx.save();
                ctx.fillStyle = this.color;
                let alpha = 1 - (this.lifeTime / this.maxLife);
                ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            }
        }

        class FloatingText {
            constructor() { this.active = false; }
            init(text, x, y, color, size) {
                this.active = true;
                this.text = text; this.x = x; this.y = y; 
                this.color = color; this.size = size;
                this.lifeTime = 0;
                this.maxLife = 1.0;
            }
            update(dt) {
                this.lifeTime += dt;
                this.y -= 40 * dt;
                if (this.lifeTime > this.maxLife) this.active = false;
            }
            draw(ctx) {
                ctx.save();
                ctx.fillStyle = this.color;
                let alpha = 1 - (this.lifeTime / this.maxLife);
                ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
                ctx.font = `bold ${this.size}px 'Inter', sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        class Enemy {
            constructor() { this.active = false; }
            init(template, x, y, emoji, stage) {
                this.active = true;
                this.x = x; this.y = y;
                this.template = template;
                this.emoji = emoji;
                this.radius = template.radius;
                this.color = template.color;
                this.isBoss = template.type === 'boss';
                
                let multiplier = this.isBoss ? Math.pow(1.5, stage - 1) : Math.pow(1.2, stage - 1);
                this.maxHp = template.hp * multiplier;
                this.hp = this.maxHp;
                this.speed = template.speed * (1 + (stage * 0.05));
                this.score = template.score * stage;
                
                this.freezeTimer = 0;
                this.spawnId = Math.random().toString(36).substring(2, 10); 
                
                if (this.isBoss) {
                    this.mass = 9999;
                    this.bossState = 'entering'; 
                    this.bossTimer = 0;
                    this.bossDashCooldown = 4.0;
                    this.targetX = canvas.width / 2;
                    this.dashAngle = 0;
                    this.dashStartX = 0;
                    this.dashStartY = 0;
                    this.fireTimer = 2.5; 
                } else {
                    this.mass = 1;
                }
            }
            update(dt, game) {
                if (this.freezeTimer > 0) {
                    this.freezeTimer -= dt;
                    return; 
                }

                if (this.isBoss) {
                    // Boss State Machine AI
                    if (this.bossState === 'entering') {
                        // 【關鍵修復】：讓 Boss 用極快的速度進場，避免還在畫面外慢速移動時就被玩家秒殺
                        this.y += 300 * dt; 
                        if (this.y >= canvas.height * 0.25) {
                            this.bossState = 'strafing';
                            this.targetX = Math.random() * (canvas.width - this.radius * 2) + this.radius;
                        }
                    } else if (this.bossState === 'strafing') {
                        let dx = this.targetX - this.x;
                        if (Math.abs(dx) < 10) {
                            this.targetX = Math.random() * (canvas.width - this.radius * 2) + this.radius;
                        } else {
                            this.x += Math.sign(dx) * this.speed * dt;
                        }

                        this.bossDashCooldown -= dt;
                        if (this.bossDashCooldown <= 0) {
                            this.bossState = 'warning';
                            this.bossTimer = 1.2; 
                            this.dashAngle = Math.atan2(game.player.y - this.y, game.player.x - this.x);
                            this.dashStartX = this.x;
                            this.dashStartY = this.y;
                        }

                        this.fireTimer -= dt;
                        if (this.fireTimer <= 0) {
                            this.fireTimer = 2.5; 
                            this.bossShoot(game); // 發射隨機屬性彈幕
                        }
                    } else if (this.bossState === 'warning') {
                        if (this.bossTimer > 0.6) {
                            // Track player for the first half of warning
                            this.dashAngle = Math.atan2(game.player.y - this.y, game.player.x - this.x);
                        }
                        this.bossTimer -= dt;
                        if (this.bossTimer <= 0) {
                            this.bossState = 'dashing';
                            this.bossTimer = 1.0; 
                        }
                    } else if (this.bossState === 'dashing') {
                        let dashSpeed = 1000;
                        this.x += Math.cos(this.dashAngle) * dashSpeed * dt;
                        this.y += Math.sin(this.dashAngle) * dashSpeed * dt;
                        
                        this.bossTimer -= dt;
                        if (this.bossTimer <= 0 || this.x < -100 || this.x > canvas.width + 100 || this.y > canvas.height + 100) {
                            this.bossState = 'returning';
                        }
                    } else if (this.bossState === 'returning') {
                        let dx = this.dashStartX - this.x;
                        let dy = this.dashStartY - this.y;
                        let dist = Math.hypot(dx, dy);
                        let retSpeed = 400;
                        if (dist < 10) {
                            this.x = this.dashStartX;
                            this.y = this.dashStartY;
                            this.bossState = 'strafing';
                            this.bossDashCooldown = 4.0 + Math.random() * 3.0; // Randomize next dash
                        } else {
                            this.x += (dx / dist) * retSpeed * dt;
                            this.y += (dy / dist) * retSpeed * dt;
                        }
                    }
                } else {
                    let angle = Math.atan2(game.player.y - this.y, game.player.x - this.x);
                    this.x += Math.cos(angle) * this.speed * dt;
                    this.y += Math.sin(angle) * this.speed * dt;
                }
            }
            bossShoot(game) {
                // Boss 扇形隨機變異彈幕
                let bulletCount = 7 + Math.floor(Math.random() * 6); 
                let spread = 0.35;
                let baseAngle = Math.atan2(game.player.y - this.y, game.player.x - this.x);

                let shapes = GAME_DATA.bulletShapes;
                let randomShape = shapes[Math.floor(Math.random() * shapes.length)];
                let randomSize = 8 * (0.8 + Math.random() * 1.5);
                let randomSpeed = 220 * (0.8 + Math.random() * 0.6);
                let randomColor = GAME_DATA.wandColors[Math.floor(Math.random() * GAME_DATA.wandColors.length)];

                for (let i = 0; i < bulletCount; i++) {
                    let angle = baseAngle - (spread * (bulletCount - 1)) / 2 + spread * i;
                    let dx = Math.cos(angle) * randomSpeed;
                    let dy = Math.sin(angle) * randomSpeed;

                    game.spawnBullet(this.x, this.y, dx, dy, {
                        color: randomColor, 
                        size: randomSize,
                        path: 'straight',
                        damage: 20 + game.stageManager.stage * 5,
                        shape: randomShape
                    }, false);
                }
            }
            takeDamage(amt, game) {
                // 【關鍵修復】：Boss 進場期間獲得無敵，避免因血量較少且移動慢，還沒進場就被高等玩家秒殺
                if (this.isBoss && this.bossState === 'entering') {
                    if (Math.random() < 0.1) game.spawnFloatingText("IMMUNE", this.x, this.y - this.radius, '#aaaaaa', 14);
                    return; 
                }

                this.hp -= amt;
                game.spawnFloatingText(Math.floor(amt).toString(), this.x, this.y - this.radius, '#ffffff', 14);
                
                if (this.hp <= 0 && this.active) {
                    this.active = false;
                    game.player.addExp(this.score, game);
                    game.stageManager.onEnemyKilled(this.isBoss, game);
                    game.spawnParticles(this.x, this.y, this.color, this.isBoss ? 50 : 15);
                    
                    if (Math.random() < 0.12) {
                        game.triggerRandomBuff(this.x, this.y);
                    }
                    game.noKillTimer = 0;
                }
            }
            draw(ctx) {
                if (this.isBoss && this.bossState === 'warning') {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.dashAngle);
                    
                    let blink = Math.floor(this.bossTimer * 15) % 2 === 0 ? 0.3 : 0.05;
                    ctx.fillStyle = `rgba(255, 0, 0, ${blink})`;
                    ctx.fillRect(0, -this.radius, canvas.height * 1.5, this.radius * 2);
                    
                    ctx.strokeStyle = 'rgba(255, 0, 0, 0.8)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(0, -this.radius);
                    ctx.lineTo(canvas.height * 1.5, -this.radius);
                    ctx.moveTo(0, this.radius);
                    ctx.lineTo(canvas.height * 1.5, this.radius);
                    ctx.stroke();
                    ctx.restore();
                }

                // 畫出 Emoji 主體
                ctx.font = `${this.radius * 2}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.emoji, this.x, this.y);
                
                // 冰凍特效
                if (this.freezeTimer > 0 && !this.isBoss) {
                    ctx.save();
                    ctx.fillStyle = 'rgba(100, 200, 255, 0.4)';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                    ctx.fill();
                    ctx.restore();
                }
                
                // Boss 血條
                if (this.isBoss) {
                    ctx.save();
                    ctx.fillStyle = 'rgba(255,0,0,0.5)';
                    ctx.fillRect(this.x - 40, this.y - this.radius - 20, 80, 6);
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(this.x - 40, this.y - this.radius - 20, 80 * (Math.max(0, this.hp) / this.maxHp), 6);
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 1; 
                    ctx.strokeRect(this.x - 40, this.y - this.radius - 20, 80, 6);
                    ctx.restore();
                }
            }
        }

        class Ally {
            constructor() { this.active = false; }
            init(template, x, y) {
                this.active = true;
                this.x = x; this.y = y;
                this.template = template;
                this.emoji = template.emoji;
                this.lifeTime = template.life;
                this.radius = template.radius; 
                this.timer = 0;
            }
            update(dt, game) {
                this.lifeTime -= dt;
                if (this.lifeTime <= 0) {
                    this.active = false;
                    game.spawnParticles(this.x, this.y, '#ffffff', 15);
                    return;
                }
                this.timer += dt;
                
                if (this.template.type === 'warrior') {
                    let target = game.getNearestEnemy(this.x, this.y);
                    if (target) {
                        let angle = Math.atan2(target.y - this.y, target.x - this.x);
                        this.x += Math.cos(angle) * this.template.speed * dt;
                        this.y += Math.sin(angle) * this.template.speed * dt;
                        
                        if (Math.hypot(target.x - this.x, target.y - this.y) < target.radius + this.radius) {
                            if (this.timer > 0.5) {
                                target.takeDamage(20 + game.stageManager.stage * 5, game);
                                this.timer = 0;
                                game.spawnParticles(target.x, target.y, '#ff4444', 5);
                            }
                        }
                    }
                } else if (this.template.type === 'cleric') {
                    let angle = Math.atan2(game.player.y - this.y, game.player.x - this.x);
                    let dist = Math.hypot(game.player.x - this.x, game.player.y - this.y);
                    if (dist > 50) {
                        this.x += Math.cos(angle) * this.template.speed * dt;
                        this.y += Math.sin(angle) * this.template.speed * dt;
                    }
                    if (this.timer > 2) {
                        game.player.hp = Math.min(game.player.maxHp, game.player.hp + 10);
                        game.spawnFloatingText("+10 HP", game.player.x, game.player.y - 20, '#00ff00', 16);
                        this.timer = 0;
                    }
                } else if (this.template.type === 'rogue') {
                    let target = game.getNearestEnemy(this.x, this.y);
                    if (target) {
                        let angle = Math.atan2(target.y - this.y, target.x - this.x);
                        this.x += Math.cos(angle) * this.template.speed * dt;
                        this.y += Math.sin(angle) * this.template.speed * dt;
                        if (this.timer > 0.4) {
                            game.spawnBullet(this.x, this.y, Math.cos(angle)*300, Math.sin(angle)*300, {
                                color: '#cccccc', size: 4, path: 'straight', damage: 10 + game.stageManager.stage*2, shape: 'diamond'
                            }, true);
                            this.timer = 0;
                        }
                    }
                } else if (this.template.type === 'bard') {
                    let angle = Math.atan2(game.player.y - this.y, game.player.x - this.x);
                    let dist = Math.hypot(game.player.x - this.x, game.player.y - this.y);
                    if (dist > 40) {
                        this.x += Math.cos(angle) * this.template.speed * dt;
                        this.y += Math.sin(angle) * this.template.speed * dt;
                    }
                    if (this.timer > 1.5) {
                        game.player.buffs.frenzy = Math.max(game.player.buffs.frenzy, 2.0); 
                        game.spawnFloatingText("🎵", this.x, this.y - 20, '#ff00ff', 16);
                        this.timer = 0;
                    }
                }
            }
            draw(ctx) {
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.emoji, this.x, this.y);
                
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(this.x - 15, this.y + 15, 30, 4);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(this.x - 15, this.y + 15, 30 * (this.lifeTime / this.template.life), 4);
            }
        }

        class Player {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height - 100;
                this.targetX = this.x;
                this.targetY = this.y;
                this.radius = 20;
                this.iFrame = 0; 
                
                this.maxHp = 100;
                this.hp = this.maxHp;
                this.level = 1;
                this.exp = 0;
                this.maxExp = 100;
                this.rebornCount = 0;

                this.resetWand();
                this.resetBuffs();
            }

            resetWand() {
                this.wand = {
                    color: '#33FFFF',
                    size: 6,
                    speed: 400,
                    count: 1,
                    path: 'straight',
                    damage: 15,
                    fireDelay: 400, 
                    fireTimer: 0,
                    chain: 0
                };
                this.currentShape = 'circle';
            }

            resetBuffs() {
                this.buffs = {
                    multi: 0, giant: 0, homing: 0, frenzy: 0,
                    shapeTimer: 0, pierce: 0, split: 0, lifesteal: 0,
                    freeze: 0, explosion: 0, chaos: 0, shield: 0, rebornPower: 0
                };
            }

            update(dt, game) {
                this.x += (this.targetX - this.x) * 10 * dt;
                this.y += (this.targetY - this.y) * 10 * dt;
                
                this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));

                if (this.iFrame > 0) this.iFrame -= dt;

                for (let k in this.buffs) {
                    if (this.buffs[k] > 0) this.buffs[k] -= dt;
                }
                if (this.buffs.shapeTimer <= 0) this.currentShape = 'circle';

                let currentDelay = this.buffs.frenzy > 0 ? Math.max(this.wand.fireDelay * 0.3, 50) : this.wand.fireDelay;
                this.wand.fireTimer -= dt * 1000;
                if (this.wand.fireTimer <= 0) {
                    this.wand.fireTimer = currentDelay;
                    this.fire(game);
                }
            }
            fire(game) {
                let spread = 0.25;
                let currentCount = this.wand.count + (this.buffs.multi > 0 ? 4 : 0);
                let currentSize = this.wand.size * (this.buffs.giant > 0 ? 3.5 : 1);
                let currentPath = this.buffs.homing > 0 ? 'homing' : this.wand.path;
                let isRainbow = this.buffs.giant > 0 || this.buffs.frenzy > 0 || this.buffs.multi > 0 || this.buffs.homing > 0 || this.buffs.chaos > 0;
                
                // Damage modifiers: Base + (Level - 1) * HP Missing Multiplier * Reborn Multiplier
                let missingHpPercent = 1.0 - (Math.max(0, this.hp) / this.maxHp);
                let hpMultiplier = 1.0 + missingHpPercent; 
                let rebornMultiplier = this.buffs.rebornPower > 0 ? 2.0 : 1.0;
                let finalDamage = (this.wand.damage + (this.level - 1)) * hpMultiplier * rebornMultiplier;
                
                for(let i=0; i<currentCount; i++) {
                    let angle = -Math.PI/2;
                    if (currentCount > 1) {
                        angle = -Math.PI/2 - (spread * (currentCount-1))/2 + spread * i;
                    }
                    
                    let finalSpeed = this.wand.speed;
                    let finalSize = currentSize;
                    let finalShape = this.currentShape;
                    
                    if (this.buffs.chaos > 0) {
                        finalSpeed = this.wand.speed * (0.4 + Math.random() * 1.2); 
                        finalSize = currentSize * (0.5 + Math.random() * 1.5);      
                        finalShape = GAME_DATA.bulletShapes[Math.floor(Math.random() * GAME_DATA.bulletShapes.length)]; 
                    }
                    
                    let dx = Math.cos(angle) * finalSpeed;
                    let dy = Math.sin(angle) * finalSpeed;
                    let color = isRainbow ? GAME_DATA.wandColors[Math.floor(Math.random() * GAME_DATA.wandColors.length)] : this.wand.color;
                    
                    game.spawnBullet(this.x, this.y - 20, dx, dy, {
                        color: color,
                        size: finalSize,
                        path: currentPath,
                        damage: finalDamage,
                        shape: finalShape,
                        isPierce: this.buffs.pierce > 0,
                        isSplit: this.buffs.split > 0,
                        isLifesteal: this.buffs.lifesteal > 0,
                        isFreeze: this.buffs.freeze > 0,
                        isExplosion: this.buffs.explosion > 0,
                        chainCount: this.wand.chain
                    }, true);
                }
            }
            addExp(amt, game) {
                this.exp += amt;
                if (this.exp >= this.maxExp) {
                    this.level++;
                    this.exp -= this.maxExp;
                    this.maxExp = Math.floor(this.maxExp * 1.5);
                    this.hp = this.maxHp; 
                    
                    let mutation = this.evolveWand();
                    game.spawnFloatingText(`LVL UP! ${mutation}`, this.x, this.y - 50, '#FFD700', 20);
                    game.spawnParticles(this.x, this.y, '#FFD700', 3);
                }
            }
            evolveWand() {
                const choices = [
                    { desc: "Density +1", fn: () => this.wand.count = Math.min(this.wand.count + 1, 9) },
                    { desc: "Fire Rate UP", fn: () => this.wand.fireDelay = Math.max(this.wand.fireDelay * 0.85, 50) },
                    { desc: "Size UP", fn: () => this.wand.size = Math.min(this.wand.size * 1.2, 30) },
                    { desc: "Speed UP", fn: () => this.wand.speed = Math.min(this.wand.speed * 1.2, 1200) },
                    { desc: "Path Mutated", fn: () => this.wand.path = GAME_DATA.wandPaths[Math.floor(Math.random() * GAME_DATA.wandPaths.length)] },
                    { desc: "Chain +1", fn: () => this.wand.chain++ },
                    { desc: "Base Damage UP", fn: () => this.wand.damage *= 1.4 }
                ];
                let choice = choices[Math.floor(Math.random() * choices.length)];
                choice.fn();
                return choice.desc;
            }
            takeDamage(amt, game) {
                this.hp -= amt;
                if (this.hp <= 0) {
                    this.rebornCount++;
                    this.hp = this.maxHp;
                    // No longer resetting EXP to 0 based on new rules
                    
                    game.spawnFloatingText("REBORN!", this.x, this.y - 30, '#ff0000', 26);
                    game.spawnParticles(this.x, this.y, '#ff0000', 20);
                    
                    this.resetWand();
                    this.resetBuffs(); 
                    
                    // Add Reborn specific Buffs
                    this.buffs.shield = 5.0;
                    this.buffs.rebornPower = 5.0;
                    game.spawnFloatingText("SHIELD & 2x DMG!", this.x, this.y - 60, '#FFD700', 20);
                    
                    for(let i = 1; i < this.level; i++) {
                        this.evolveWand(); 
                    }
                }
            }
            draw(ctx) {
                ctx.save();
                if (this.iFrame > 0 && Math.floor(this.iFrame * 15) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }
                
                // Draw Golden Shield
                if (this.buffs.shield > 0) {
                    ctx.save();
                    ctx.strokeStyle = '#FFD700'; 
                    ctx.lineWidth = 3;
                    let pulse = Math.abs(Math.sin(Date.now() / 150)) * 4;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + 12 + pulse, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(255, 215, 0, 0.2)';
                    ctx.fill();
                    ctx.restore();
                }

                // Draw Reborn 2x Power Aura
                if (this.buffs.rebornPower > 0) {
                    ctx.save();
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.4)';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                ctx.font = `${this.radius * 2}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🧙‍♂️', this.x, this.y);

                ctx.save();
                ctx.translate(this.x + 15, this.y - 5);
                if (this.wand.fireTimer > this.wand.fireDelay - 100) {
                    ctx.rotate(-Math.PI/4);
                }
                ctx.font = '18px Arial';
                ctx.fillText('🪄', 0, 0);
                ctx.restore();
                
                ctx.restore();
            }
        }

        class StageManager {
            constructor() {
                this.stage = 1;
                this.enemySpawnTimer = 0;
                this.allySpawnTimer = 10;
                this.bossActive = false;
                this.enemiesKilled = 0;
            }
            update(dt, game) {
                this.allySpawnTimer -= dt;
                if (this.allySpawnTimer <= 0) {
                    this.spawnAlly(game);
                    this.allySpawnTimer = 15 + Math.random() * 15; 
                }

                if (this.bossActive) return;
                
                this.enemySpawnTimer -= dt;
                if (this.enemySpawnTimer <= 0) {
                    this.spawnEnemy(game);
                    this.enemySpawnTimer = Math.max(0.3, 1.5 - this.stage * 0.08); 
                }
                
                // Requirement for boss greatly increased by stage level (boss spawns later)
                if (this.enemiesKilled >= 10 + this.stage * 20) {
                    this.spawnBoss(game);
                }
            }
            spawnEnemy(game) {
                let rand = Math.random();
                let template;
                if (rand < GAME_DATA.enemies.tank.rate) template = GAME_DATA.enemies.tank;
                else if (rand < GAME_DATA.enemies.tank.rate + GAME_DATA.enemies.fast.rate) template = GAME_DATA.enemies.fast;
                else template = GAME_DATA.enemies.weak;
                
                let enemy = game.enemyPool.get();
                let x = Math.random() * (canvas.width - 40) + 20;
                let emoji = GAME_DATA.emojis.entities[Math.floor(Math.random() * GAME_DATA.emojis.entities.length)];
                enemy.init(template, x, -30, emoji, this.stage);
                game.enemies.push(enemy);
            }
            spawnAlly(game) {
                let keys = Object.keys(GAME_DATA.allies);
                let template = GAME_DATA.allies[keys[Math.floor(Math.random() * keys.length)]];
                let ally = game.allyPool.get();
                ally.init(template, Math.random() * canvas.width, -20);
                game.allies.push(ally);
                game.spawnFloatingText("ALLY APPEARED!", ally.x, 50, '#ffff00', 20);
            }
            spawnBoss(game) {
                this.bossActive = true;
                game.changeEnvironment('boss');
                let enemy = game.enemyPool.get();
                let x = canvas.width / 2;
                let emoji = GAME_DATA.emojis.entities[Math.floor(Math.random() * GAME_DATA.emojis.entities.length)];
                enemy.init(GAME_DATA.enemies.boss, x, -50, emoji, this.stage);
                game.enemies.push(enemy);
            }
            onEnemyKilled(isBoss, game) {
                if (isBoss) {
                    this.bossActive = false;
                    this.stage++;
                    this.enemiesKilled = 0;
                    game.changeEnvironment('normal');
                    game.player.hp = game.player.maxHp;
                    game.spawnFloatingText("STAGE CLEARED!", canvas.width/2, canvas.height/2, '#00ff00', 30);
                } else {
                    this.enemiesKilled++;
                }
            }
        }

        class Game {
            constructor() {
                this.player = new Player();
                this.stageManager = new StageManager();
                
                this.bulletPool = new ObjectPool(() => new Bullet());
                this.enemyPool = new ObjectPool(() => new Enemy());
                this.particlePool = new ObjectPool(() => new Particle());
                this.textPool = new ObjectPool(() => new FloatingText());
                this.allyPool = new ObjectPool(() => new Ally());
                
                this.bullets = [];
                this.enemies = [];
                this.particles = [];
                this.texts = [];
                this.allies = [];
                
                this.bgColors = ['#050510', '#1a1a2e'];

                this.stars = Array.from({length: 100}, () => ({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    s: Math.random() * 2 + 0.5,
                    v: Math.random() * 50 + 20,
                    c: ['#fff', '#a8d8ff', '#ffb3ff', '#fffeb3'][Math.floor(Math.random()*4)]
                }));

                this.lastInteractionTime = Date.now();
                this.isIdle = false;
                this.noKillTimer = 0; 

                // Low-pass filter targets for idle movement
                this.idleTargetX = canvas.width / 2;
                this.idleTargetY = canvas.height - 150;

                this.keys = {
                    w: false, a: false, s: false, d: false,
                    ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false
                };

                this.setupInput();
            }

            setupInput() {
                this.isDragging = false;
                this.dragStartX = 0;
                this.dragStartY = 0;
                this.charDragStartX = 0;
                this.charDragStartY = 0;

                const getPointerPos = (e) => {
                    let rect = canvas.getBoundingClientRect();
                    let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    let clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    return {
                        x: (clientX - rect.left) * (canvas.width / rect.width),
                        y: (clientY - rect.top) * (canvas.height / rect.height)
                    };
                };

                const pointerDown = (e) => {
                    this.isDragging = true;
                    let pos = getPointerPos(e);
                    this.dragStartX = pos.x;
                    this.dragStartY = pos.y;
                    
                    // Stop target exactly at current physics location so character doesn't jump
                    this.player.targetX = this.player.x;
                    this.player.targetY = this.player.y;
                    
                    // Record the base point for this drag sequence
                    this.charDragStartX = this.player.targetX;
                    this.charDragStartY = this.player.targetY;
                    this.lastInteractionTime = Date.now();
                };

                const pointerMove = (e) => {
                    if (!this.isDragging) return;
                    let pos = getPointerPos(e);
                    
                    // Calculate pixel displacement from the initial touch point
                    let dx = pos.x - this.dragStartX;
                    let dy = pos.y - this.dragStartY;
                    
                    // Apply relative displacement (x1.5 sensitivity for better phone feel)
                    let newTargetX = this.charDragStartX + dx * 1.5;
                    let newTargetY = this.charDragStartY + dy * 1.5;
                    
                    // Clamp to canvas to prevent target escaping screen boundaries
                    this.player.targetX = Math.max(this.player.radius, Math.min(canvas.width - this.player.radius, newTargetX));
                    this.player.targetY = Math.max(this.player.radius, Math.min(canvas.height - this.player.radius, newTargetY));
                    
                    this.lastInteractionTime = Date.now();
                };

                const pointerUp = () => {
                    this.isDragging = false;
                    this.lastInteractionTime = Date.now();
                };

                // Desktop Mouse bindings
                canvas.addEventListener('mousedown', pointerDown);
                window.addEventListener('mousemove', pointerMove);
                window.addEventListener('mouseup', pointerUp);

                // Mobile Touch bindings
                canvas.addEventListener('touchstart', (e) => { e.preventDefault(); pointerDown(e); }, { passive: false });
                window.addEventListener('touchmove', (e) => { if (this.isDragging) e.preventDefault(); pointerMove(e); }, { passive: false });
                window.addEventListener('touchend', pointerUp);
                window.addEventListener('touchcancel', pointerUp);
                
                // Keyboard Fallback
                window.addEventListener('keydown', (e) => {
                    if (this.keys.hasOwnProperty(e.key)) {
                        this.keys[e.key] = true;
                        this.lastInteractionTime = Date.now();
                    }
                });
                window.addEventListener('keyup', (e) => {
                    if (this.keys.hasOwnProperty(e.key)) {
                        this.keys[e.key] = false;
                        this.lastInteractionTime = Date.now();
                    }
                });
            }

            triggerRandomBuff(x, y) {
                const buffs = ['multi', 'giant', 'homing', 'frenzy', 'shape_diamond', 'shape_triangle', 'shape_square', 'shape_hollow', 'pierce', 'split', 'lifesteal', 'freeze', 'explosion', 'color_shift', 'chaos', 'shield'];
                const buff = buffs[Math.floor(Math.random() * buffs.length)];
                
                if (buff === 'color_shift') {
                    this.player.wand.color = GAME_DATA.wandColors[Math.floor(Math.random() * GAME_DATA.wandColors.length)];
                    this.spawnFloatingText('COLOR SHIFT!', x, y, this.player.wand.color, 20);
                } else if (buff.startsWith('shape_')) {
                    this.player.buffs.shapeTimer = 6.0;
                    this.player.currentShape = buff.split('_')[1];
                    this.spawnFloatingText('SHAPE SHIFT!', x, y, '#00ffff', 20);
                } else {
                    this.player.buffs[buff] = buff === 'shield' ? 6.0 : 4.0;
                    let text = buff === 'multi' ? 'MULTI-SHOT!' : buff === 'giant' ? 'GIANT MAGIC!' : buff === 'homing' ? 'HOMING!' : buff === 'frenzy' ? 'FRENZY!' : buff === 'pierce' ? 'PIERCE!' : buff === 'split' ? 'SPLIT!' : buff === 'lifesteal' ? 'VAMPIRISM!' : buff === 'freeze' ? 'FREEZE!' : buff === 'explosion' ? 'EXPLOSION!' : buff === 'shield' ? 'DIVINE SHIELD!' : 'CHAOS!';
                    let color = buff === 'multi' ? '#ff00ff' : buff === 'giant' ? '#ffff00' : buff === 'homing' ? '#00ff00' : buff === 'frenzy' ? '#ff0000' : buff === 'pierce' ? '#00ffff' : buff === 'split' ? '#ffaa00' : buff === 'lifesteal' ? '#ff0044' : buff === 'freeze' ? '#8888ff' : buff === 'explosion' ? '#ff5500' : buff === 'shield' ? '#FFD700' : '#ffffff';
                    this.spawnFloatingText(text, x, y, color, 20);
                }
            }

            changeEnvironment(type) {
                if (type === 'boss') {
                    this.bgColors = ['#2b0000', '#1a0000'];
                    this.spawnFloatingText("WARNING! BOSS INCOMING!", canvas.width/2, canvas.height/2, '#ff0000', 28);
                } else {
                    const themes = [
                        ['#050510', '#1a1a2e'], 
                        ['#001a1a', '#003333'], 
                        ['#1a1a00', '#333300'], 
                        ['#1a001a', '#330033']  
                    ];
                    this.bgColors = themes[Math.floor(Math.random() * themes.length)];
                }
                
                this.bullets.forEach(b => {
                    if (b.active) this.spawnParticles(b.x, b.y, b.color, 2);
                    b.active = false;
                });
            }

            spawnBullet(x, y, dx, dy, props, isPlayer) {
                let b = this.bulletPool.get();
                b.init(x, y, dx, dy, props, isPlayer);
                this.bullets.push(b);
            }

            spawnParticles(x, y, color, count) {
                for(let i=0; i<count; i++) {
                    let p = this.particlePool.get();
                    p.init(x, y, color, 1);
                    this.particles.push(p);
                }
            }

            spawnFloatingText(text, x, y, color, size = 16) {
                let t = this.textPool.get();
                t.init(text, x, y, color, size);
                this.texts.push(t);
            }

            getNearestEnemy(x, y) {
                let nearest = null;
                let minDist = Infinity;
                for (let e of this.enemies) {
                    let d = Math.hypot(e.x - x, e.y - y);
                    if (d < minDist) {
                        minDist = d;
                        nearest = e;
                    }
                }
                return nearest;
            }

            getNearestEnemyExclude(x, y, excludeSet) {
                let nearest = null;
                let minDist = Infinity;
                for (let e of this.enemies) {
                    if (excludeSet.has(e.spawnId)) continue;
                    let d = Math.hypot(e.x - x, e.y - y);
                    if (d < minDist) {
                        minDist = d;
                        nearest = e;
                    }
                }
                return nearest;
            }

            update(dt) {
                // Keep game active if user is holding the mouse down
                if (this.isDragging) {
                    this.lastInteractionTime = Date.now();
                }
                
                this.isIdle = (Date.now() - this.lastInteractionTime) > 5000;
                
                if (this.isIdle) {
                    let target = this.getNearestEnemy(this.player.x, this.player.y);
                    let desiredBaseX = canvas.width / 2;
                    let desiredBaseY = canvas.height - 150; 
                    
                    if (target) {
                        desiredBaseX = target.x; 
                    }
                    
                    let evX = 0, evY = 0;
                    
                    // Repulsion from bullets
                    for (let b of this.bullets) {
                        if (b.active && !b.isPlayer) {
                            let dist = Math.hypot(b.x - this.player.x, b.y - this.player.y);
                            let safeRange = 120;
                            if (dist < safeRange) {
                                let push = (safeRange - dist) * 2.5; 
                                evX += ((this.player.x - b.x) / dist) * push;
                                evY += ((this.player.y - b.y) / dist) * push;
                            }
                        }
                    }

                    // Repulsion from enemies/bosses
                    for (let e of this.enemies) {
                        if (e.isBoss) {
                            if (e.bossState === 'warning' || e.bossState === 'dashing' || e.bossState === 'returning') {
                                let perpX = -Math.sin(e.dashAngle);
                                let perpY = Math.cos(e.dashAngle);
                                let toPlayerX = this.player.x - e.x;
                                let toPlayerY = this.player.y - e.y;
                                let dot = toPlayerX * perpX + toPlayerY * perpY;
                                let dir = dot > 0 ? 1 : -1; 
                                let perpDist = Math.abs(dot);
                                
                                let safeZone = e.radius + 120;
                                if (perpDist < safeZone) { 
                                    let push = (safeZone - perpDist) * 5.0; 
                                    evX += perpX * dir * push;
                                    evY += perpY * dir * push;
                                }
                            } else {
                                let dist = Math.hypot(e.x - this.player.x, e.y - this.player.y);
                                let safeRange = 250;
                                if (dist < safeRange) {
                                    let push = (safeRange - dist) * 1.5;
                                    evX += ((this.player.x - e.x) / dist) * push;
                                    evY += ((this.player.y - e.y) / dist) * push;
                                }
                            }
                        } else {
                            let dist = Math.hypot(e.x - this.player.x, e.y - this.player.y);
                            let safeRange = e.radius + this.player.radius + 60;
                            if (dist < safeRange) {
                                let push = (safeRange - dist) * 2.0;
                                evX += ((this.player.x - e.x) / dist) * push;
                                evY += ((this.player.y - e.y) / dist) * push;
                            }
                        }
                    }

                    // Apply low-pass filter to the evasion target to prevent jittering
                    let rawTargetX = desiredBaseX + evX;
                    let rawTargetY = desiredBaseY + evY;
                    
                    this.idleTargetX += (rawTargetX - this.idleTargetX) * 4 * dt;
                    this.idleTargetY += (rawTargetY - this.idleTargetY) * 4 * dt;
                    
                    this.player.targetX = Math.max(this.player.radius, Math.min(canvas.width - this.player.radius, this.idleTargetX));
                    this.player.targetY = Math.max(this.player.radius, Math.min(canvas.height - this.player.radius, this.idleTargetY));
                    
                } else {
                    this.idleTargetX = this.player.targetX;
                    this.idleTargetY = this.player.targetY;
                    
                    let speed = 600 * dt;
                    let moved = false;
                    if (this.keys.w || this.keys.ArrowUp) { this.player.targetY -= speed; moved = true; }
                    if (this.keys.s || this.keys.ArrowDown) { this.player.targetY += speed; moved = true; }
                    if (this.keys.a || this.keys.ArrowLeft) { this.player.targetX -= speed; moved = true; }
                    if (this.keys.d || this.keys.ArrowRight) { this.player.targetX += speed; moved = true; }
                    
                    if (moved) {
                        this.player.targetX = Math.max(this.player.radius, Math.min(canvas.width - this.player.radius, this.player.targetX));
                        this.player.targetY = Math.max(this.player.radius, Math.min(canvas.height - this.player.radius, this.player.targetY));
                        
                        if (this.isDragging) {
                            this.charDragStartX = this.player.targetX;
                            this.charDragStartY = this.player.targetY;
                        }
                    }
                }

                this.player.update(dt, this);
                this.stageManager.update(dt, this);

                this.noKillTimer += dt;
                if (this.noKillTimer >= 10.0) {
                    this.noKillTimer = 0;
                    this.triggerRandomBuff(this.player.x, this.player.y - 30);
                }

                for (let s of this.stars) {
                    s.y += s.v * dt;
                    if (s.y > canvas.height) {
                        s.y = 0;
                        s.x = Math.random() * canvas.width;
                    }
                }

                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    let e = this.enemies[i];
                    e.update(dt, this);
                    
                    // Enemy vs Enemy Collision
                    for (let j = i - 1; j >= 0; j--) {
                        let e2 = this.enemies[j];
                        let dx = e.x - e2.x;
                        let dy = e.y - e2.y;
                        let dist = Math.hypot(dx, dy) || 1;
                        let overlap = (e.radius + e2.radius) - dist;
                        
                        if (overlap > 0) {
                            let nx = dx / dist;
                            let ny = dy / dist;
                            let totalMass = e.mass + e2.mass;
                            
                            let eRatio = e2.mass / totalMass;
                            let e2Ratio = e.mass / totalMass;
                            
                            e.x += nx * overlap * eRatio;
                            e.y += ny * overlap * eRatio;
                            e2.x -= nx * overlap * e2Ratio;
                            e2.y -= ny * overlap * e2Ratio;
                        }
                    }

                    // Player vs Enemy Collision
                    let pDx = this.player.x - e.x;
                    let pDy = this.player.y - e.y;
                    let pDist = Math.hypot(pDx, pDy) || 1;
                    let pOverlap = (this.player.radius + e.radius) - pDist;
                    
                    if (pOverlap > 0) {
                        if (this.player.iFrame <= 0) {
                            if (this.player.buffs.shield > 0) {
                                // Shield block
                                this.player.iFrame = 0.5; 
                                this.spawnFloatingText("BLOCKED!", this.player.x, this.player.y - 30, '#FFD700', 16);
                            } else {
                                this.player.takeDamage(e.isBoss ? 40 : 15, this);
                                this.player.iFrame = 0.5; 
                            }
                        }
                        
                        let nx = pDx / pDist;
                        let ny = pDy / pDist;
                        
                        this.player.targetX += nx * pOverlap * 3;
                        this.player.targetY += ny * pOverlap * 3;
                        this.player.x += nx * pOverlap * 1.5;
                        this.player.y += ny * pOverlap * 1.5;
                        
                        if (this.isDragging) {
                            this.charDragStartX += nx * pOverlap * 3;
                            this.charDragStartY += ny * pOverlap * 3;
                        }

                        if (!e.isBoss) {
                            e.x -= nx * pOverlap * 0.5;
                            e.y -= ny * pOverlap * 0.5;
                        }
                    }

                    // Ally vs Enemy Collision
                    for (let a of this.allies) {
                        let aDx = a.x - e.x;
                        let aDy = a.y - e.y;
                        let aDist = Math.hypot(aDx, aDy) || 1;
                        let aOverlap = (a.radius + e.radius) - aDist;
                        
                        if (aOverlap > 0) {
                            let nx = aDx / aDist;
                            let ny = aDy / aDist;
                            
                            if (a.template.type === 'warrior') {
                                if (!e.isBoss) {
                                    e.x -= nx * aOverlap; e.y -= ny * aOverlap;
                                }
                            } else {
                                a.x += nx * aOverlap * (e.isBoss ? 1 : 0.5);
                                a.y += ny * aOverlap * (e.isBoss ? 1 : 0.5);
                                if (!e.isBoss) {
                                    e.x -= nx * aOverlap * 0.5;
                                    e.y -= ny * aOverlap * 0.5;
                                }
                            }
                        }
                    }

                    if (!e.active) {
                        this.enemyPool.release(e);
                        this.enemies.splice(i, 1);
                    }
                }

                for (let i = this.allies.length - 1; i >= 0; i--) {
                    let a = this.allies[i];
                    a.update(dt, this);
                    if (!a.active) {
                        this.allyPool.release(a);
                        this.allies.splice(i, 1);
                    }
                }

                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    let b = this.bullets[i];
                    b.update(dt, this);
                    
                    if (b.active) {
                        if (b.isPlayer) {
                            for (let e of this.enemies) {
                                if (b.hitEnemies.has(e.spawnId)) continue; 

                                let hit = false;
                                if (b.path === 'laser') {
                                    if (Math.abs(b.x - e.x) < (b.size + e.radius) && b.y > e.y - e.radius - b.size*4 && b.y < e.y + e.radius + b.size*4) hit = true;
                                } else {
                                    if (Math.hypot(b.x - e.x, b.y - e.y) < b.size + e.radius) hit = true;
                                }

                                if (hit) {
                                    b.hitEnemies.add(e.spawnId);
                                    e.takeDamage(b.damage, this);

                                    if (b.isLifesteal) {
                                        let heal = b.damage / 10;
                                        this.player.hp = Math.min(this.player.maxHp, this.player.hp + heal);
                                        this.spawnFloatingText("+" + Math.floor(heal), this.player.x, this.player.y - 20, '#00ff00', 14);
                                    }

                                    if (b.isFreeze && !e.isBoss && Math.random() < 0.3) {
                                        e.freezeTimer = 2.0;
                                    }

                                    if (b.isExplosion) {
                                        this.spawnParticles(e.x, e.y, '#ff8800', 6);
                                        for (let other of this.enemies) {
                                            if (other !== e && Math.hypot(other.x - e.x, other.y - e.y) < 70) {
                                                other.takeDamage(b.damage * 0.5, this);
                                            }
                                        }
                                    }

                                    if (b.isSplit && !b.hasSplit) {
                                        b.hasSplit = true;
                                        let angle = Math.atan2(b.dy, b.dx);
                                        let speed = Math.hypot(b.dx, b.dy);
                                        let spreadAngle = 0.5;
                                        
                                        this.spawnBullet(b.x, b.y, Math.cos(angle - spreadAngle)*speed, Math.sin(angle - spreadAngle)*speed, {
                                            color: b.color, size: b.size*0.8, path: b.path, damage: b.damage*0.5, shape: b.shape, 
                                            chainCount: b.chainCount, isPierce: b.isPierce, isLifesteal: b.isLifesteal, isFreeze: b.isFreeze, isExplosion: b.isExplosion
                                        }, true);
                                        this.spawnBullet(b.x, b.y, Math.cos(angle + spreadAngle)*speed, Math.sin(angle + spreadAngle)*speed, {
                                            color: b.color, size: b.size*0.8, path: b.path, damage: b.damage*0.5, shape: b.shape, 
                                            chainCount: b.chainCount, isPierce: b.isPierce, isLifesteal: b.isLifesteal, isFreeze: b.isFreeze, isExplosion: b.isExplosion
                                        }, true);
                                    }

                                    if (b.chainCount > 0) {
                                        b.chainCount--;
                                        let nextTarget = this.getNearestEnemyExclude(b.x, b.y, b.hitEnemies);
                                        if (nextTarget) {
                                            let angle = Math.atan2(nextTarget.y - b.y, nextTarget.x - b.x);
                                            let speed = Math.hypot(b.dx, b.dy) || 400;
                                            b.dx = Math.cos(angle) * speed;
                                            b.dy = Math.sin(angle) * speed;
                                        } else if (!b.isPierce && b.path !== 'laser') {
                                            b.active = false;
                                        }
                                    } else if (!b.isPierce && b.path !== 'laser') {
                                        b.active = false;
                                    }
                                    
                                    if (!b.active) break;
                                }
                            }
                        } else {
                            if (Math.hypot(b.x - this.player.x, b.y - this.player.y) < b.size + this.player.radius - 5) {
                                if (this.player.iFrame <= 0) {
                                    if (this.player.buffs.shield > 0) {
                                        this.player.iFrame = 0.5;
                                        this.spawnFloatingText("BLOCKED!", this.player.x, this.player.y - 30, '#FFD700', 16);
                                    } else {
                                        this.player.takeDamage(b.damage, this);
                                        this.player.iFrame = 0.5;
                                    }
                                }
                                b.active = false;
                            }
                        }
                    }

                    if (!b.active) {
                        this.bulletPool.release(b);
                        this.bullets.splice(i, 1);
                    }
                }

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    let p = this.particles[i];
                    p.update(dt);
                    if (!p.active) {
                        this.particlePool.release(p);
                        this.particles.splice(i, 1);
                    }
                }

                for (let i = this.texts.length - 1; i >= 0; i--) {
                    let t = this.texts[i];
                    t.update(dt);
                    if (!t.active) {
                        this.textPool.release(t);
                        this.texts.splice(i, 1);
                    }
                }
            }

            draw(ctx) {
                let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                grad.addColorStop(0, this.bgColors[0]);
                grad.addColorStop(1, this.bgColors[1]);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                for (let s of this.stars) {
                    ctx.fillStyle = s.c;
                    ctx.globalAlpha = 0.5;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.s, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                for (let p of this.particles) p.draw(ctx);
                for (let b of this.bullets) b.draw(ctx);
                for (let e of this.enemies) if (!e.isBoss) e.draw(ctx);
                for (let e of this.enemies) if (e.isBoss) e.draw(ctx);
                for (let a of this.allies) a.draw(ctx);
                this.player.draw(ctx);
                for (let t of this.texts) t.draw(ctx);

                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 0, canvas.width, 65);
                
                ctx.fillStyle = 'rgba(255,0,0,0.3)';
                ctx.fillRect(15, 15, canvas.width - 30, 12);
                ctx.fillStyle = '#ff3333';
                ctx.fillRect(15, 15, (Math.max(0, this.player.hp) / this.player.maxHp) * (canvas.width - 30), 12);
                ctx.strokeStyle = '#fff';
                ctx.strokeRect(15, 15, canvas.width - 30, 12);

                ctx.fillStyle = 'rgba(0,255,255,0.3)';
                ctx.fillRect(15, 32, canvas.width - 30, 6);
                ctx.fillStyle = '#00ffff';
                ctx.fillRect(15, 32, (this.player.exp / this.player.maxExp) * (canvas.width - 30), 6);

                ctx.fillStyle = '#fff';
                ctx.font = '16px "MedievalSharp", cursive';
                ctx.textAlign = 'left';
                ctx.fillText(`Lv. ${this.player.level}`, 15, 55);
                ctx.textAlign = 'right';
                ctx.fillText(`Stage ${this.stageManager.stage}`, canvas.width - 15, 55);

                if (this.isIdle) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    
                    let timeStr = new Date().toLocaleTimeString('en-US', {hour: 'numeric', minute:'2-digit', hour12: true});
                    ctx.font = 'bold 70px "MedievalSharp", cursive';
                    ctx.fillText(timeStr, canvas.width/2, canvas.height/2 - 40);
                    
                    ctx.font = '22px "MedievalSharp", cursive';
                    ctx.fillStyle = '#aaaaaa';
                    ctx.fillText("Auto-Battling Mode", canvas.width/2, canvas.height/2 + 10);
                    
                    ctx.font = '16px "Inter", sans-serif';
                    ctx.fillStyle = '#FFD700';
                    ctx.fillText(`Level ${this.player.level} • Stage ${this.stageManager.stage} • Reborn ${this.player.rebornCount}`, canvas.width/2, canvas.height/2 + 50);
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText("Touch & drag anywhere to resume", canvas.width/2, canvas.height - 50);
                }
            }
        }

        let game;
        let lastTime = performance.now();

        function gameLoop(timestamp) {
            let dt = (timestamp - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1;
            lastTime = timestamp;

            game.update(dt);
            game.draw(ctx);

            requestAnimationFrame(gameLoop);
        }

        window.onload = () => {
            game = new Game();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
