let qTab='d';
const ctv=k=>+(P.ct&&P.ct[k])||0,acU=()=>P.u.concat(P.rs),
cxU=()=>{const m=new Map();AR.forEach(a=>[a.b,...a.sp].forEach(x=>m.set(x.n,x)));RDS.forEach(x=>m.set(x.n,x));return m},

['k1','獵魔人','擊敗 300 隻怪物',()=>ctv('k'),300,800,3],['k2','屠魔者','擊敗 3000 隻怪物',()=>ctv('k'),3000,6000,15],['s1','弒王者','擊敗 20 隻 BOSS',()=>ctv('s'),20,1500,5],
['f1','小有所成','抵達第 30 層',()=>P.best,30,500,2],['f2','魔王城','抵達第 91 層',()=>P.best,91,2000,8],['f3','次元旅人','抵達第 101 層（次元魔境）',()=>P.best,101,3000,10],['f4','深淵行者','抵達第 150 層',()=>P.best,150,8000,25],
['l1','登峰造極','任一隊員達到 Lv80',()=>Math.max(...acU().map(u=>u.lv)),80,3000,10],['j1','五階之道','任一隊員的五階職業達到 Lv1',()=>acU().some(u=>Object.keys(u.jl).some(id=>T[id]&&T[id].t==5&&u.jl[id]>0))?1:0,1,2000,10],
['r1','輪迴新生','任一隊員轉生 1 次',()=>Math.max(...acU().map(u=>u.rb||0)),1,5000,15],['d1','次元挑戰者','完成 5 次次元魔王討伐',()=>ctv('r'),5,3000,10],['d2','傷害之王','次元魔王討伐單次累計傷害達 100 萬',()=>ctv('m'),1e6,5000,15],
['c1','博物學家','圖鑑收集 20 種',()=>cxN(),20,1000,5],['c2','圖鑑大師','收集全部圖鑑',()=>cxN(),cxT(),10000,30],['q1','勤奮冒險者','每日任務全部完成 7 天',()=>ctv('a'),7,2000,10]],
qBad=()=>{dqEns();return P.dq.q.filter(x=>x.c>=x.t&&!x.r).length+ACL.filter(a=>!P.ac[a[0]]&&a[3]()>=a[4]).length};
function dqEns(){if(P.dq&&P.dq.d===dk()&&Array.isArray(P.dq.q))return;const av=avg(),ks=['b','k','s','l','y'].sort(()=>Math.random()-.5).slice(0,P.best>=100?3:4),tg={b:8,k:40,s:1,l:6,y:Math.round((2000+av*100)/100)*100};
if(P.best>=100)ks.push('r');P.dq={d:dk(),b:0,q:ks.map(k=>({k,t:k=='r'?1:tg[k],c:0,r:0,g:Math.round((200+av*20)*(k=='r'?3:k=='s'?1.5:1)),cr:k=='r'?5:k=='s'?2:1}))}}
function dqAdd(k,n){dqEns();const q=P.dq.q.find(x=>x.k==k);if(!q||q.c>=q.t)return;q.c=Math.min(q.t,q.c+n);if(q.c>=q.t)return'📜 每日任務完成：'+DQP[k][0]}
function ctw(en,g,msg){const c=P.ct,nl=msg.filter(m=>/^(獲得|背包已滿)/.test(m)).length,bs=en.filter(e=>e.boss).length;c.b=ctv('b')+1;c.k=ctv('k')+en.length;c.s=ctv('s')+bs;cxAdd(en);
[dqAdd('b',1),dqAdd('k',en.length),dqAdd('s',bs),dqAdd('l',nl),dqAdd('y',g)].filter(Boolean).forEach(m=>msg.push(m));const n=ACL.filter(a=>!P.ac[a[0]]&&a[3]()>=a[4]).length;if(n)msg.push('🏅 有 '+n+' 項成就可領取（首頁「每日・成就・圖鑑」）')}
function cxAdd(en){en.forEach(e=>{const n=e.nm.replace('★','');P.cx[n]=(P.cx[n]||0)+1})}

function acGet(id){const a=ACL.find(x=>x[0]==id);if(!a||P.ac[id]||a[3]()<a[4])return;P.ac[id]=1;P.g+=a[5];P.cr=(P.cr||0)+a[6];save();qv()}

if(qTab=='d')h=P.dq.q.map((x,i)=>`<div class=c style="text-align:left"><b>${DQP[x.k][0]}${x.k=='r'?'':' '+fmt(x.t)+DQP[x.k][1]}</b><br><small>進度 ${fmt(x.c)}/${fmt(x.t)}　獎勵 💰${fmt(x.g)} 💎${x.cr}</small><div class=row>${x.k=='r'&&x.c<x.t&&rdOk()?'<button onclick="rd0()">前往挑戰</button>':''}<button ${x.c>=x.t&&!x.r?'class=p':'disabled'} onclick="dqGet(${i})">${x.r?'已領取':'領取'}</button></div></div>`).join('')+`<div class=c><small>每日任務每天重置；全部領取後額外 💎10。累計全部完成 ${ctv('a')} 天。${P.best<100?'<br>通關魔王城後會多一項「次元魔王討伐」任務。':''}</small></div>`;
else if(qTab=='a'){const L=ACL.map(a=>{const v=Math.min(a[3](),a[4]),ok=v>=a[4],got=!!P.ac[a[0]];return{a,v,ok,got,o:got?2:ok?0:1}}).sort((x,y)=>x.o-y.o);
h=L.map(({a,v,ok,got})=>`<div class=c style="text-align:left${got?';opacity:.6':''}"><b>${got?'🏅':'🎖️'} ${a[1]}</b> <small>${a[2]}</small><br><small>進度 ${fmt(v)}/${fmt(a[4])}　獎勵 💰${fmt(a[5])}${a[6]?' 💎'+a[6]:''}</small><button style="margin-top:4px" ${ok&&!got?'class=p':'disabled'} onclick="acGet('${a[0]}')">${got?'已領取':ok?'領取':'未達成'}</button></div>`).join('')}
else{const sec=(n,e,l)=>{const k=l.filter(x=>P.cx[x.n]>0).length;return`<h3>${e} ${n} <small>(${k}/${l.length})</small></h3><div class=g2>${l.map(x=>{const c=P.cx[x.n]||0;return`<div class=c><div class=big>${c?x.e:'❓'}</div><small>${c?x.n+'<br>擊敗 '+fmt(c):'？？？'}</small></div>`}).join('')}</div>`};
h=`<div class=c><small>已收集 ${cxN()}/${cxT()} 種（擊敗怪物即登錄）</small></div>`+AR.map(a=>sec(a.n,a.e,[a.b,...a.sp])).join('')+sec('次元裂隙','🌀',RDS)}
V(`<h3>📜 每日・成就・圖鑑</h3><div class=row>${[['d','每日'],['a','成就'],['c','圖鑑']].map(([k,n])=>`<button ${k==qTab?'class=p':''} onclick="qT('${k}')">${n}</button>`).join('')}</div><div class=sc>${h}</div><button onclick="town()">返回</button>`)}
function sv(m=''){const b=gb();V(`<h3>💾 存檔管理</h3><div class=c style="text-align:left"><small>進度只存在這個瀏覽器裡，清除網站資料就會消失，建議定期匯出備份。${G.sf?'<br><b style="color:var(--hp)">⚠️ 目前無法寫入瀏覽器存檔！請立刻匯出備份。</b>':''}${m}</small></div><div class=sc><button class=p onclick="ex()">匯出存檔（複製存檔碼）</button><button onclick="im()">匯入存檔（貼上存檔碼）</button>${b?`<button onclick="rs0()">還原備份：「${b.n}」前的進度（${tm(b.t)}）</button>`:''}<button style="color:var(--hp)" onclick="clr()">清除存檔重新開始</button></div><button onclick="town()">返回</button>`)}
