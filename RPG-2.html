orm:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1.05)}}
.snp{animation:snp calc(.6s/var(--sp,1)) ease-out}@keyframes snp{35%{transform:scale(1.9);text-shadow:0 0 10px currentColor}}.kh{color:#6fe3b0}.kb{color:#ffd978}.kl{color:#ff8fb0}.kp{color:#ffb86b}.km{color:#a9b8ff}.kbn{color:#ff7a66}.ksl{color:#7cc8ff}.kps{color:#c77dff}.kst{color:#ffe45e}.kwk{color:#b0a4c8}.ksn{color:#ff9f7a}

<script>
// ═════ 程式區段索引（搜尋「■■■ [S」可跳到各區段；新增內容請放進對應區段）═════
//  [S00] 防止雙擊／雙指縮放（Safari）
//  [S01A] 平衡常數（調整難度、機率、獎勵倍率只改這一區）
//  [S01] 資料表與常數：職業樹、技能、區域與怪物
//  [S02] 全域狀態、能力值計算、升級與主職加成
//  [S03] 通用畫面元件、城鎮、隊伍頁
//  [S04] 職業頁：配點、主職／副職、退點、轉生、隊員管理
//  [S05] 裝備資料：品質、詞條、套裝、神話武器、mkItem
//  [S06] 裝備背包、管理、批次分解、鍛造、鎖定、整備（最佳裝備／預設組）
//  [S07] 酒館：道具店、存款、賣出頁、招募
//  [S07A] 聖物系統（魔石合成、分解、全隊加成）
//  [S07B] 召喚獸（圖鑑「🐾 召喚獸」；資料 P.sm／P.smd；常數在 S01A）
//  [S07C] 領域與倒數大招（怪物新機制，Lv120 起；資料 B.dm／B.cd，不存檔）
//  [S08] 戰鬥系統：敵人生成、狀態、弱點與護盾、戰鬥統計收集、畫面與特效、AI、行動、結算
//  [S09] 存檔系統：版本、自動修復、遷移
//  [S10] 出發頁、次元魔境、次元魔王討伐
//  [S11] 每日任務、成就、圖鑑、戰鬥統計頁
//  [S12] 存檔管理頁：匯出入、備份、清除
//  [S13] 啟動：讀檔、進入城鎮
// ══════════════════════════════════════════════════════════════
// ■■■ [S00] 防止雙擊／雙指縮放（Safari） ■■■
(function(){var D=document,lt=0,sx=0,sy=0,ok=0;
function sk(t){return t&&t.closest&&t.closest('input,textarea,select,[contenteditable]')}
D.addEventListener('touchstart',function(e){if(e.touches.length>1){ok=0;return}var t=e.touches[0];sx=t.clientX;sy=t.clientY;ok=1},{passive:true,capture:true});
D.addEventListener('touchmove',function(e){if(e.touches.length>1){ok=0;e.preventDefault();return}var t=e.touches[0];if(Math.abs(t.clientX-sx)>10||Math.abs(t.clientY-sy)>10)ok=0},{passive:false});
D.addEventListener('touchend',function(e){var n=Date.now();if(ok&&e.touches.length===0&&e.changedTouches.length===1){if(n-lt<350&&!sk(e.target)&&e.cancelable){e.preventDefault();var el=e.target;if(el&&el.click)el.click()}lt=n}else lt=0},{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(function(k){D.addEventListener(k,function(e){e.preventDefault()},{passive:false})});
})();
// ■■■ [S01A] 平衡常數：調整難度、機率、獎勵倍率請只改這一區（其他地方不要再寫死數字）■■■
// 弱點：WKP 怪物有弱點的機率；WKS／WKA 弱點威力基準（單體／全體每目標）；WKX 弱點倍率上限
const WKP=.6,WKS=5.2,WKA=2.9,WKX=3.5,
// 護盾：SHL 怪物等級門檻；SHP／SHB 一般怪／BOSS 出現機率；SHF 階數係數（一～五階）；SHD 有盾時受到的傷害倍率
SHL=90,SHP=.25,SHB=.5,SHF=[0,1,.8,.6,.4,.2],SHD=.5,
// 特性：TRL 怪物等級門檻；TRP／TRB 一般怪／BOSS 出現機率；TRH 硬化後的傷害倍率；TRF 反傷比例；TRG 再生每回合回復比例（占最大 HP）
TRL=100,TRP=.25,TRB=.5,TRH=.6,TRF=.15,TRG=.05,
// 不屈（特性之一）：UBL 怪物等級門檻（其他特性仍是 TRL）；UBH 復活時的 HP 比例（占最大 HP，只復活一次，次元魔王討伐不啟用）
UBL=140,UBH=.3,RZL=160,RZD=2,RZA=.25,RZS=.3,RZR=.25,MXG=2,
// 每日任務：DQM 獎勵倍率；DQC 魔石倍率；DQRP 裝備品質機率（普通／精良／稀有／傳說）；DQSP 裝備部位機率（武器／防具／飾品）
DQM={m:1,o:1.5,u:1,t:1.5,e:1,r:3},DQC={m:1,o:2,u:1,t:2,e:1,r:5},DQRP=[.4,.29,.12,.18],DQSP={w:.4,a:.41,x:.2},
// 聖物：RLB 合成基礎價（💎）；RLK 每多擁有 1 顆，價格再加 RLB×RLK；RLM 每種聖物數量上限；RLR 分解返還比例（按該顆當初價格）；RLC 數量上限的基數（上限＝RLC＋成就點數）
RLB=80,RLK=.45,RLM=10,RLR=.25,RLC=5,
// 召喚獸：SMT 各星級所需擊敗次數；SMB＋SMS×星級＝每回合出手機率；SMK1／SMK2 每星技能／副作用成長；SMC 對魔王單次傷害上限（最大HP比例）；SMQ 對一般怪上限；SMF 最大MP至少保留；SMW 主動技傷害總倍率；SMX 出手機率上限（含聖物「馴獸之哨」每顆 +1.2%）
SMT=[50,150,400,1000,2500],SMB=.18,SMS=.02,SMK1=.15,SMK2=.25,SMC=.08,SMQ=.5,SMF=.6,SMW=.65,SMX=.6,

function acGet(id){const a=ACL.find(x=>x[0]==id);if(!a||!acOk(a))return;const g=acG(a);P.ac[id]=acN(a)+1;P.g+=g[0];P.cr=(P.cr||0)+g[1];save();qv()}
function acAll(){let g=0,c=0,n=0;for(let i=0;i<2000;i++){const a=ACL.find(acOk);if(!a)break;const r=acG(a);P.ac[a[0]]=acN(a)+1;g+=r[0];c+=r[1];n++}if(n){P.g+=g;P.cr=(P.cr||0)+c;qMsg='已領取 '+n+' 項：💰'+fmt(g)+(c?' 💎'+c:'');save()}qv()}
function qT(t){qTab=t;qv()}
// ===== 戰鬥統計頁（📜 裡的「統計」分頁）：資料在 P.bst，收集用的函式在 [S08]（bzA／bzH／bzE／bzR）=====
function bzV(){const b=P.bst||{},g=k=>+b[k]||0,pc=(a,c)=>c>0?(Math.round(a/c*1000)/10)+'%':'—',f=g('f'),w=g('w'),l=g('l'),
cd=(t,body)=>`<div class=c style="text-align:left"><b>${t}</b><br><small>${body}</small></div>`;
if(!f)return cd('📊 戰鬥統計','還沒有紀錄。出戰一場之後會開始累計（次元魔王討伐不列入）。');
const fl=Math.max(0,f-w-l),n=w+l,
ov=cd('📊 戰鬥總覽',`出戰 ${fmt(f)} 場：勝 ${fmt(w)}／敗 ${fmt(l)}${fl?'／逃跑或中斷 '+fmt(fl):''}<br>勝率 ${pc(w,n)}　平均每場 ${(g('rn')/Math.max(1,n)).toFixed(1)} 回合　最長一戰 ${fmt(g('mr'))} 回合<br>目前連勝 ${fmt(P.st||0)}　最高連勝 ${fmt(P.bs||0)}`),
dm=cd('⚔️ 輸出與承受',`造成傷害 ${fmt(g('dd'))}　承受傷害 ${fmt(g('dt'))}<br>技能治療 ${fmt(g('hl'))}　最高單次傷害 ${fmt(g('mh'))}<br>暴擊率 ${pc(g('cr'),g('ph'))}（${fmt(g('cr'))}／${fmt(g('ph'))} 次攻擊）`),
tr=Object.keys(TRN).map(k=>TRN[k][0]+TRN[k][1]+' '+fmt(g('t_'+k))).join('　'),
mc=cd('🎯 弱點・護盾・特性・領域',`弱點：對有弱點的怪出手 ${fmt(g('wt'))} 次，觸發弱點加成 ${fmt(g('wk'))} 次（${pc(g('wk'),g('wt'))}）<br>護盾：遇到有盾的怪 ${fmt(g('sh'))} 隻，對有盾怪出手 ${fmt(g('sa'))} 次，破盾 ${fmt(g('sb'))} 次（${pc(g('sb'),g('sa'))}）<br>特性：${tr}<br>領域：出現 ${fmt(g('dmn'))} 次　倒數大招：出現 ${fmt(g('cdn'))} 次　不屈復活：${fmt(g('ubn'))} 次`),
rows=[...AR,DMA].map((a,i)=>{const x=g('aw'+i),y=g('al'+i),t=x+y;return t?`<div style="margin:6px 0"><span>${a.e} ${a.n}${g('rc'+i)?'<small style="opacity:.7">　⏱均 '+(g('rn'+i)/g('rc'+i)).toFixed(1)+' 回合</small>':''}</span><span style="float:right">${x}勝 ${y}敗　${pc(x,t)}</span><div style="height:5px;margin-top:3px;background:rgba(255,255,255,.12);border-radius:3px"><div style="height:100%;width:${Math.round(x/t*100)}%;background:var(--ac);border-radius:3px"></div></div></div>`:''}).join(''),
az=cd('🗺️ 各區勝率',rows||'還沒有紀錄。');
return ov+dm+az+mc+`<button style="color:var(--hp)" onclick="bzX()">清除統計</button>`}
function bzX(){cfm('清除戰鬥統計？','只會清除「統計」分頁的數字，不影響進度、成就與每日任務。','bzD()','qv()')}
function bzD(){P.bst={};save();qv()}
function qv(){dqEns();let h='';
if(qTab=='d')h=P.dq.q.map((x,i)=>`<div class=c style="text-align:left"><b>${dqTx(x)}</b><br><small>進度 ${fmt(x.c)}/${fmt(x.t)}　獎勵 💰${fmt(x.g)} 💎${x.cr}</small><div class=row>${x.k=='r'&&
x.c<x.t&&rdOk()?'<button onclick="rd0()">前往挑戰</button>':''}<button ${x.c>=x.t&&!x.r?'class=p':'disabled'} onclick="dqGet(${i})">${x.r?
'已領取':'領取'}</button></div></div>`).join('')+`<div class=c><small>每日任務每天重置；全部領取後額外 💎10。累計全部完成 ${ctv('a')} 天。<br>任務指定的怪物，等級會依你的最高層數自動調整。${P.best<100?'<br>通關魔王城後會多一項「次元魔王討伐」任務。':
''}</small></div>`;
else if(qTab=='a'){const L=ACL.map(a=>{const T0=acT(a),v=Math.min(acV(a),T0),ok=acOk(a),inf=acI(a)&&!acDn(a),got=!inf&&acN(a)>0;return{a,v,T0,ok,got,inf,g:acG(a),o:got?2:ok?0:1}}).sort((x,y)=>x.o-y.o),nb=L.filter(x=>x.ok).length;
h=`<div class=c style="text-align:left"><b>🏅 成就點數 ${acP()}</b>${qMsg?'<br><small>'+qMsg+'</small>':''}<br><small>每領取一個成就（可無限成長的成就每一階都算）+1 點。標有 ∞ 的成就領完會自動出現下一階，目標與獎勵逐階遞增。</small>${nb>1?
'<button class=p style="margin-top:6px" onclick="acAll()">全部領取（'+nb+' 項可領）</button>':''}</div>`+L.map(({a,v,T0,ok,got,inf,g})=>`<div class=c style="text-align:left${got?
';opacity:.6':''}"><b>${got?'🏅':'🎖️'} ${acNm(a)}</b>${inf?' <small style="color:var(--ac2)">∞</small>':''} <small>${acD(a)}</small><br><small>進度 ${fmt(v)}/${fmt(T0)}　獎勵 💰${fmt(g[0])}${g[1]?
' 💎'+g[1]:''}</small><button style="margin-top:4px" ${ok&&!got?'class=p':'disabled'} onclick="acGet('${a[0]}')">${got?'已領取':ok?'領取':
'未達成'}</button></div>`).join('');qMsg=''}
else if(qTab=='z')h=bzV();
else{const sec=(n,e,l)=>{const k=l.filter(x=>P.cx[x.n]>0).length;return`<h3>${e} ${n} <small>(${k}/${l.length})</small></h3><div class=g2>${l.map(x=>{const c=P.cx[x.n]||
0;return`<div class=c><div class=big>${c?x.e:'❓'}</div><small>${c?x.n+'<br>擊敗 '+fmt(c):'？？？'}</small></div>`}).join('')}</div>`};
h=`<div class=row><button onclick="smv()">🐾 召喚獸（${smN()} 隻可用）</button></div><div class=c><small>已收集 ${cxN()}/${cxT()} 種（擊敗怪物即登錄）</small></div>`+AR.map(a=>sec(a.n,a.e,[a.b,...a.sp])).join('')+sec('次元裂隙','🌀',RDS)}
V(`<h3>📜 每日・成就・圖鑑・統計</h3><div class=row>${[['d','每日'],['a','成就'],['c','圖鑑'],['z','統計']].map(([k,n])=>`<button ${k==qTab?'class=p':''} onclick="qT('${k}')">${n}</button>`).join('')}</div><div class=sc>${h}</div><button onclick="town()">返回</button>`)}
// ■■■ [S12] 存檔管理頁：匯出入、備份、清除 ■■■
function sv(m=''){const b=gb();V(`<h3>💾 存檔管理</h3><div class=c style="text-align:left"><small>進度只存在這個瀏覽器裡，清除網站資料就會消失，建議定期匯出備份。${G.sf?
'<br><b style="color:var(--hp)">⚠️ 目前無法寫入瀏覽器存檔！請立刻匯出備份。</b>':''}${m}</small></div><div class=sc><button class=p onclick="ex()">匯出存檔（複製存檔碼）</button><button onclick="im()">匯入存檔（貼上存檔碼）</button>${b?
`<button onclick="rs0()">還原備份：「${b.n}」前的進度（${tm(b.t)}）</button>`:''}<button style="color:var(--hp)" onclick="clr()">清除存檔重新開始</button></div><button onclick="town()">返回</button>`)}
function ex(){const c=enc();V(`<h3>匯出存檔</h3><div class=c style="text-align:left"><small>整串複製後貼到備忘錄或傳給自己保存（約 ${c.length} 字）。</small></div><textarea id=exc readonly style="${TA}">${c}</textarea><div class=row><button id=cpb class=p onclick="cp()">複製</button><button onclick="sv()">返回</button></div>`)}
function cp(){const t=$('exc');t.select();let ok=0;try{navigator.clipboard.writeText(t.value);ok=1}catch(e){}try{ok=document.execCommand('copy')||ok}catch(e){}$('cpb').textContent=ok?'✅ 已複製':'請長按文字框手動複製'}
function im(m=''){V(`<h3>匯入存檔</h3><div class=c style="text-align:left"><small>貼上之前匯出的存檔碼。匯入會覆蓋目前進度（匯入前會自動備份）。${m}</small></div><textarea id=imc autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="BJ${SV}:..." style="${TA}"></textarea><div class=row><button class=p onclick="im2()">讀取</button><button onclick="sv()">返回</button></div>`)}
function im2(){const c=($('imc').value||'').replace(/\s+/g,'');let o;try{if(!/^bj\d+:/i.test(c))throw 0;o=JSON.parse(decodeURIComponent(escape(atob(c.replace(/^bj\d+:/i,
'').replace(/[^A-Za-z0-9+\/=]/g,'')))));if(!(Array.isArray(o.u)&&o.u.length&&o.u.every(u=>u&&typeof u.lv=='number'&&u.jl&&typeof u.jl=='object')&&
typeof o.g=='number'))throw 0}catch(e){return im('<br><b style="color:var(--hp)">存檔碼格式不正確，請確認有完整複製。</b>')}
G.imp=o;cfm('確定要匯入這份存檔？','目前的進度會被覆蓋。匯入前會自動備份，可以到「存檔管理」還原。','im3()','im()')}
function im3(){const old=P;snap('匯入');try{P=G.imp;migrate();save();town()}catch(e){P=old;sv('<br><b style="color:var(--hp)">匯入失敗，已保留原本的進度。</b>')}}
function rs0(){cfm('確定還原備份？','目前的進度會被覆蓋（還原前會先備份目前進度，可以再還原回來）。','rs1()','sv()')}
function rs1(){const b=gb();if(!b)return sv();let o;try{o=JSON.parse(b.d)}catch(e){return sv('<br>備份已損毀，無法還原。')}const old=P;snap('還原');try{P=o;migrate();save();town()}catch(e){P=old;sv('<br>還原失敗，已保留原本的進度。')}}
function clr(){cfm('確定清除存檔？','所有角色、裝備、金幣都會消失。清除前會自動備份，可以到「存檔管理」還原。','clr2()','sv()')}
function clr2(){snap('清除存檔');P=newP();migrate();save();town()}
// ■■■ [S13] 啟動：讀檔、進入城鎮 ■■■
try{P=JSON.parse(localStorage.getItem('bj5'))}catch(e){try{localStorage.setItem('bj5x',localStorage.getItem('bj5'))}catch(e2){}}
try{migrate()}catch(e){try{localStorage.setItem('bj5x',localStorage.getItem('bj5'))}catch(e2){}P=newP();migrate()}
if(P.rdp){RD=P.rdp;const q=rdFin();RD=null;G.rdm='🌀 上次的次元魔王討伐被中斷，已自動結算：傷害 '+q.t+'、擊破 '+q.cl+' 波，獲得 💰'+q.g+' 💎'+q.cr+' 與 '+q.its.length+' 件裝備。';save()}
town();
</script></body></html>
