<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>地城大冒險</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a202c; /* tailwind gray-900 */
            color: #e2e8f0; /* tailwind gray-200 */
            font-family: 'Inter', sans-serif;
            touch-action: none; /* Prevent browser handling of gestures */
            -webkit-user-select: none; /* 鎖定文字圈選 */
            user-select: none; 
            -webkit-touch-callout: none; /* 禁用長按彈出選單 */
        }
        button {
            touch-action: manipulation; /* 禁用按鈕的雙擊放大 */
            outline: none;
            -webkit-tap-highlight-color: transparent; /* 移除點擊時的藍色半透明底色 */
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100dvh; /* Improved viewport height for mobile */
            display: flex;
            flex-direction: column;
        }
        #canvas-container {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas by default */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .pointer-events-auto {
            pointer-events: auto;
        }
        
        /* Modal styling */
        .modal-overlay {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            z-index: 50;
        }
        
        /* Custom scrollbar for logs */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1); 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3); 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.5); 
        }

        /* Dice Animation */
        @keyframes rollDice {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.2); }
            50% { transform: rotate(180deg) scale(0.8); }
            75% { transform: rotate(270deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }
        .rolling {
            animation: rollDice 0.5s ease-in-out;
        }

        /* Combat Animations */
        @keyframes attack-player {
            0%, 100% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(20px) translateY(-20px); scale: 1.1; }
        }
        @keyframes attack-monster {
            0%, 100% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(-20px) translateY(20px); scale: 1.1; }
        }
        @keyframes damage-shake {
            0%, 100% { transform: translateX(0); border-color: inherit; }
            25% { transform: translateX(-8px); border-color: #ef4444; }
            75% { transform: translateX(8px); border-color: #ef4444; }
        }
        .anim-atk-p { animation: attack-player 0.3s ease-in-out; z-index: 10; }
        .anim-atk-m { animation: attack-monster 0.3s ease-in-out; z-index: 10; }
        .anim-dmg { animation: damage-shake 0.4s ease-in-out; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Game Canvas -->
    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- UI Overlay (Top Stats) -->
    <div id="top-ui" class="absolute top-0 left-0 w-full p-2 flex justify-between items-start pointer-events-none z-10">
        <div class="bg-gray-800/80 p-2 rounded border border-gray-700 shadow-lg flex flex-col gap-1 w-1/3">
            <div class="text-xs font-bold text-yellow-400">玩家狀態 <span id="loop-count" class="text-purple-400 text-[10px] ml-1"></span></div>
            <div class="text-xs flex justify-between"><span>HP:</span> <span id="player-hp" class="text-red-400">100/100</span></div>
            <div class="text-xs flex justify-between"><span>ATK:</span> <span id="player-atk" class="text-blue-400">10</span></div>
            <div class="text-xs flex justify-between"><span>DEF:</span> <span id="player-def" class="text-green-400">5</span></div>
            <div class="text-xs flex justify-between"><span>GOLD:</span> <span id="player-gold" class="text-yellow-300">0</span></div>
            <div class="text-[10px] text-gray-400 mt-1">回合: <span id="turn-count">0</span></div>
        </div>
        
        <div class="bg-gray-800/80 p-2 rounded border border-gray-700 shadow-lg text-right w-1/3">
            <div class="text-xs font-bold text-red-500 mb-1">存活魔物</div>
            <div id="alive-count" class="text-xl font-bold">12</div>
            <div class="text-[10px] text-gray-400">當前迷宮: <span id="current-maze">1</span></div>
        </div>
    </div>

    <!-- UI Overlay (Bottom Controls) -->
    <div id="bottom-ui" class="absolute bottom-0 left-0 w-full px-4 pt-0 pb-[15vh] pointer-events-none z-10 flex flex-col justify-end gap-2">
        
        <!-- Log Window -->
        <div id="log-window" class="bg-black/60 border border-gray-700 rounded p-2 h-20 overflow-y-auto text-xs font-mono custom-scrollbar pointer-events-auto flex flex-col-reverse shadow-lg">
            <!-- Logs will appear here -->
        </div>

        <!-- Controls -->
        <div class="flex justify-center w-full">
            <button id="btn-roll" class="pointer-events-auto bg-gradient-to-r from-blue-600 to-blue-800 hover:from-blue-500 hover:to-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-[0_0_15px_rgba(37,99,235,0.5)] active:scale-95 transition-all border-2 border-blue-400 flex items-center justify-center gap-2 w-full max-w-xs mx-auto">
                <span id="dice-icon" class="text-xl">🎲</span>
                <span id="dice-result" class="text-xl font-black drop-shadow-[0_1px_2px_rgba(0,0,0,0.8)]">擲骰移動</span>
            </button>
        </div>
    </div>

    <!-- Encounter Modal -->
    <div id="encounter-modal" class="absolute inset-0 modal-overlay hidden flex items-center justify-center pb-[15vh] pointer-events-auto z-[51]">
        <div class="bg-gray-800 border-2 border-red-500 rounded-xl p-6 w-5/6 max-w-sm flex flex-col items-center shadow-2xl">
            <h2 class="text-2xl font-bold text-red-500 mb-2">遭遇魔物！</h2>
            <div id="encounter-name" class="text-xl font-bold mb-4 text-purple-400">魔物名稱</div>
            
            <div class="flex gap-4 mb-6 w-full text-sm">
                <div class="flex-1 bg-gray-900 p-2 rounded text-center">
                    <div class="text-gray-400 text-xs">HP</div>
                    <div id="encounter-hp" class="text-red-400">0</div>
                </div>
                <div class="flex-1 bg-gray-900 p-2 rounded text-center">
                    <div class="text-gray-400 text-xs">ATK</div>
                    <div id="encounter-atk" class="text-blue-400">0</div>
                </div>
                <div class="flex-1 bg-gray-900 p-2 rounded text-center">
                    <div class="text-gray-400 text-xs">DEF</div>
                    <div id="encounter-def" class="text-green-400">0</div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 w-full">
                <button id="btn-fight" class="bg-red-600 hover:bg-red-500 py-2 rounded font-bold shadow">戰鬥</button>
                <button id="btn-flee" class="bg-gray-600 hover:bg-gray-500 py-2 rounded font-bold shadow">逃避 (70%)</button>
                <button id="btn-persuade" class="bg-blue-600 hover:bg-blue-500 py-2 rounded font-bold shadow">說服 (需魅力)</button>
                <button id="btn-bribe" class="bg-yellow-600 hover:bg-yellow-500 py-2 rounded font-bold shadow">賄賂 (花費金幣)</button>
            </div>
        </div>
    </div>
    
    <!-- General Message Modal -->
    <div id="message-modal" class="absolute inset-0 modal-overlay hidden flex items-center justify-center pb-[15vh] pointer-events-auto z-[52]">
        <div class="bg-gray-800 border-2 border-gray-500 rounded-xl p-6 w-5/6 max-w-sm flex flex-col items-center shadow-2xl transition-transform transform scale-95 duration-200">
            <h2 id="message-title" class="text-xl font-bold text-white mb-4 text-center">提示</h2>
            <p id="message-desc" class="text-gray-300 text-sm mb-6 text-center leading-relaxed">內容</p>
            <button id="btn-msg-close" class="bg-blue-600 hover:bg-blue-500 py-2 px-8 rounded font-bold shadow">確定</button>
        </div>
    </div>

    <!-- Combat Screen Overlay -->
    <div id="combat-screen" class="absolute inset-0 bg-gray-900 hidden flex-col z-[55] pointer-events-auto">
        <!-- Header -->
        <div class="p-2 bg-gray-800 text-center font-bold text-lg text-red-500 border-b border-gray-700 shadow-md shrink-0">戰鬥階段</div>
        
        <!-- Fighters -->
        <div class="shrink-0 flex flex-col justify-center gap-3 p-4">
            <!-- Monster -->
            <div id="combat-monster" class="flex flex-col items-center bg-gray-800/80 p-3 rounded-xl border-2 border-gray-700 shadow-lg relative transition-transform">
                <div id="cb-m-name" class="text-base text-purple-400 font-bold mb-1">魔物</div>
                <div id="cb-m-sym" class="text-5xl mb-2 filter drop-shadow-[0_0_10px_rgba(168,85,247,0.5)]">🐉</div>
                <div class="w-full bg-gray-900 rounded-full h-3 relative overflow-hidden border border-gray-700">
                    <div id="cb-m-hpbar" class="absolute top-0 left-0 h-full bg-gradient-to-r from-red-600 to-red-400 transition-all duration-300 w-full"></div>
                </div>
                <div id="cb-m-hp" class="text-[10px] mt-1 text-gray-300 font-mono">HP: 100/100</div>
            </div>

            <div class="text-center text-xl font-black text-gray-600 italic">VS</div>

            <!-- Player -->
            <div id="combat-player" class="flex flex-col items-center bg-gray-800/80 p-3 rounded-xl border-2 border-blue-800 shadow-lg relative transition-transform">
                <div class="text-base text-blue-400 font-bold mb-1">勇者</div>
                <div class="text-5xl mb-2 filter drop-shadow-[0_0_10px_rgba(59,130,246,0.5)]">🧑‍🌾</div>
                <div class="w-full bg-gray-900 rounded-full h-3 relative overflow-hidden border border-gray-700">
                    <div id="cb-p-hpbar" class="absolute top-0 left-0 h-full bg-gradient-to-r from-green-600 to-green-400 transition-all duration-300 w-full"></div>
                </div>
                <div id="cb-p-hp" class="text-[10px] mt-1 text-gray-300 font-mono">HP: 100/100</div>
            </div>
        </div>

        <!-- Combat Log -->
        <div id="combat-log" class="flex-1 bg-black/90 border-t-2 border-b-2 border-gray-700 p-3 overflow-y-auto text-xs font-mono custom-scrollbar flex flex-col shadow-inner min-h-0">
            <!-- Combat logs here -->
        </div>

        <!-- Actions -->
        <div class="p-3 grid grid-cols-2 gap-3 bg-gray-800 pb-[15vh] shrink-0">
            <button id="btn-cb-attack" class="bg-gradient-to-b from-red-500 to-red-700 hover:from-red-400 hover:to-red-600 active:scale-95 transition-transform py-3 rounded-xl font-bold text-lg shadow-lg border border-red-400 text-white flex items-center justify-center gap-2"><span>⚔️</span>攻擊</button>
            <button id="btn-cb-flee" class="bg-gradient-to-b from-gray-500 to-gray-700 hover:from-gray-400 hover:to-gray-600 active:scale-95 transition-transform py-3 rounded-xl font-bold text-lg shadow-lg border border-gray-400 text-white flex items-center justify-center gap-2"><span>🏃</span>撤退</button>
        </div>
    </div>

    <!-- Game Over / Victory Modal -->
    <div id="endgame-modal" class="absolute inset-0 modal-overlay hidden flex items-center justify-center pb-[15vh] pointer-events-auto z-[60]">
        <div class="bg-gray-800 border-4 rounded-xl p-6 w-5/6 max-w-sm flex flex-col items-center shadow-[0_0_30px_rgba(0,0,0,0.8)]">
            <h1 id="end-title" class="text-4xl font-black mb-2 text-center text-transparent bg-clip-text"></h1>
            <div id="end-rank" class="text-xl text-gray-300 mb-6"></div>
            
            <div class="bg-gray-900 w-full p-4 rounded mb-6 text-sm">
                <div class="flex justify-between mb-1"><span>存活回合:</span> <span id="end-turns" class="text-yellow-400">0</span></div>
                <div class="flex justify-between mb-1"><span>擊敗魔物:</span> <span id="end-kills" class="text-red-400">0</span></div>
                <div class="flex justify-between"><span>最終等級:</span> <span id="end-level" class="text-purple-400">1</span></div>
            </div>

            <button id="btn-restart" class="w-full py-3 rounded font-bold text-lg shadow-lg transition-transform hover:scale-105"></button>
        </div>
    </div>

</div>

<script>
// --- 行動裝置防止縮放防呆 ---
document.addEventListener('gesturestart', function(e) {
    e.preventDefault(); // 阻止 iOS Safari 雙指縮放
});

let lastTouchEnd = 0;
document.addEventListener('touchend', function(event) {
    const now = (new Date()).getTime();
    // 偵測雙擊 (300毫秒內)，並阻止雙擊放大
    if (now - lastTouchEnd <= 300) {
        // 為了避免阻擋到正常 UI 按鈕的連點，排除 BUTTON 標籤
        if (event.target.tagName !== 'BUTTON') {
            event.preventDefault();
        }
    }
    lastTouchEnd = now;
}, { passive: false });

// --- Configuration & Constants ---
const CONFIG = {
    TILE_SIZE: 40,
    MAZE_WIDTH: 21,  // Must be odd
    MAZE_HEIGHT: 21, // Must be odd
    NUM_MAZES: 5,
    VIEW_RADIUS_X: 5, // How many tiles to show around player horizontally (approx on mobile)
    VIEW_RADIUS_Y: 7,
    BASE_SCALE: 1.5,  // Base zoom level
    ANIMATION_SPEED: 0.15, // movement interpolation speed
};

// --- Data Dictionaries (Data-Driven Design) ---

const TILE_TYPES = {
    WALL: 0,
    PATH: 1,
    START: 2,
    TELEPORT: 3,
    EVENT_GOOD: 4,
    EVENT_BAD: 5,
    EVENT_ITEM: 6,
    EVENT_EMPTY: 7
};

// Visual mapping for tiles
const TILE_COLORS = {
    [TILE_TYPES.WALL]: '#2d3748', // gray-800
    [TILE_TYPES.PATH]: '#cbd5e1', // slate-300
    [TILE_TYPES.START]: '#3b82f6', // blue-500
    [TILE_TYPES.TELEPORT]: '#a855f7', // purple-500
    [TILE_TYPES.EVENT_GOOD]: '#4ade80', // green-400
    [TILE_TYPES.EVENT_BAD]: '#f87171', // red-400
    [TILE_TYPES.EVENT_ITEM]: '#fbbf24', // amber-400
    [TILE_TYPES.EVENT_EMPTY]: '#94a3b8' // slate-400
};

// Event pool for Monopoly-like tiles
const EVENTS = {
    GOOD: [
        { name: "神秘泉水", desc: "恢復 30 HP", effect: (p) => p.heal(30) },
        { name: "戰神雕像", desc: "攻擊力永久 +2", effect: (p) => p.atk += 2 },
        { name: "守護者祝福", desc: "防禦力永久 +2", effect: (p) => p.def += 2 },
        { name: "隱藏的金庫", desc: "獲得 50 金幣", effect: (p) => p.gold += 50 },
        { name: "精靈之吻", desc: "生命值完全恢復！", effect: (p) => p.heal(p.maxHp) },
        { name: "英雄祭壇", desc: "最大生命 +10，攻擊 +1", effect: (p) => { p.maxHp += 10; p.atk += 1; p.heal(10); } },
        { name: "流浪商人", desc: "獲得 100 金幣", effect: (p) => p.gold += 100 }
    ],
    BAD: [
        { name: "毒氣陷阱", desc: "失去 15 HP", effect: (p) => p.takeDamage(15, null, true) },
        { name: "詛咒之刃", desc: "攻擊力 -1", effect: (p) => p.atk = Math.max(1, p.atk - 1) },
        { name: "生鏽的鎧甲", desc: "防禦力 -1", effect: (p) => p.def = Math.max(0, p.def - 1) },
        { name: "小偷", desc: "失去 30 金幣", effect: (p) => p.gold = Math.max(0, p.gold - 30) },
        { name: "落石陷阱", desc: "被砸中，失去 25 HP", effect: (p) => p.takeDamage(25, null, true) },
        { name: "疲勞詛咒", desc: "最大生命 -5", effect: (p) => { p.maxHp = Math.max(1, p.maxHp - 5); if(p.hp>p.maxHp) p.hp=p.maxHp; } },
        { name: "強盜", desc: "失去一半金幣", effect: (p) => p.gold = Math.floor(p.gold / 2) }
    ],
    ITEM: [
        { name: "鐵劍", desc: "裝備：攻擊力 +5", effect: (p) => p.atk += 5 },
        { name: "皮甲", desc: "裝備：防禦力 +5", effect: (p) => p.def += 5 },
        { name: "生命護符", desc: "最大生命值 +20", effect: (p) => { p.maxHp += 20; p.heal(20); } },
        { name: "魅力寶石", desc: "增加說服機率", effect: (p) => p.charm = (p.charm || 0) + 1 },
        { name: "王者之劍", desc: "傳說武器：攻擊力 +12", effect: (p) => p.atk += 12 },
        { name: "秘銀鎧甲", desc: "傳說防具：防禦力 +10", effect: (p) => p.def += 10 },
        { name: "幸運草", desc: "撤退及說服機率大幅提升", effect: (p) => p.charm = (p.charm || 0) + 3 }
    ]
};

// 12 Distinct Monsters with behaviors
const MONSTER_TEMPLATES = [
    { id: 1, name: "狂暴哥布林", symbol: "👺", hp: 30, atk: 8, def: 2, behavior: "aggressive", desc: "脾氣暴躁，見人就砍。" },
    { id: 2, name: "貪婪史萊姆", symbol: "💧", hp: 50, atk: 5, def: 5, behavior: "greedy", desc: "喜歡收集閃亮亮的東西。" },
    { id: 3, name: "骷髏劍士", symbol: "💀", hp: 40, atk: 12, def: 3, behavior: "patrol", desc: "死板地在迷宮中巡邏。" },
    { id: 4, name: "幽靈刺客", symbol: "👻", hp: 25, atk: 15, def: 1, behavior: "ambush", desc: "喜歡從死角發動攻擊。" },
    { id: 5, name: "石像鬼", symbol: "🗿", hp: 80, atk: 6, def: 10, behavior: "defensive", desc: "不動如山，防禦極高。" },
    { id: 6, name: "魅魔", symbol: "🧛‍♀️", hp: 45, atk: 10, def: 4, behavior: "charming", desc: "容易被說服，但也擅長誘惑。" },
    { id: 7, name: "牛頭人", symbol: "🐂", hp: 100, atk: 14, def: 8, behavior: "aggressive", desc: "力量強大，橫衝直撞。" },
    { id: 8, name: "毒蜘蛛", symbol: "🕷️", hp: 35, atk: 9, def: 3, behavior: "erratic", desc: "行蹤飄忽不定。" },
    { id: 9, name: "寶箱怪", symbol: "🎁", hp: 60, atk: 11, def: 9, behavior: "mimic", desc: "偽裝成寶物，極難被賄賂。" },
    { id: 10, name: "巫妖", symbol: "🧙‍♂️", hp: 70, atk: 18, def: 5, behavior: "smart", desc: "智力高超，會避開不利戰鬥。" },
    { id: 11, name: "地獄犬", symbol: "🐕‍🦺", hp: 55, atk: 13, def: 6, behavior: "hunter", desc: "一旦鎖定目標就會窮追不捨。" },
    { id: 12, name: "深淵魔龍", symbol: "🐉", hp: 150, atk: 25, def: 15, behavior: "boss", desc: "迷宮的霸主，實力深不可測。" }
];

// --- Game State ---
const State = {
    loop: 1,
    turn: 0,
    mazes: [],
    entities: [], // player + monsters
    player: null,
    currentEncounter: null,
    animating: false,
    camera: { x: 0, y: 0 },
    logs: []
};

// --- Classes ---

class Entity {
    constructor(x, y, mazeIndex, isPlayer = false) {
        this.x = x;
        this.y = y;
        this.visualX = x;
        this.visualY = y;
        this.mazeIndex = mazeIndex;
        this.isPlayer = isPlayer;
        this.alive = true;
        this.movedThisTurn = false;
        
        // Stats
        this.maxHp = 100;
        this.hp = 100;
        this.atk = 10;
        this.def = 5;
        this.gold = 0;
        this.charm = 0;
        this.kills = 0;
    }

    takeDamage(amount, source, ignoreDef = false) {
        let dmg = ignoreDef ? amount : Math.max(1, amount - this.def);
        this.hp -= dmg;
        if (this.hp <= 0) {
            this.hp = 0;
            this.die(source);
        }
        return dmg;
    }

    heal(amount) {
        this.hp = Math.min(this.maxHp, this.hp + amount);
    }

    die(killer) {
        this.alive = false;
        if (this.isPlayer) {
            Game.handlePlayerDeath();
        } else {
            if (killer && killer.isPlayer) {
                killer.kills++;
                // Simple leveling on kill
                killer.maxHp += 10;
                killer.heal(10);
                killer.atk += 2;
                killer.def += 1;
                killer.gold += this.gold + 50;
                logMsg(`擊敗了 ${this.name}! 能力提升！獲得金幣。`);
            }
        }
    }

    // Interpolation for smooth movement
    updateAnimation() {
        if (!this.alive) return;
        const dx = this.x - this.visualX;
        const dy = this.y - this.visualY;
        if (Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01) {
            this.visualX += dx * CONFIG.ANIMATION_SPEED;
            this.visualY += dy * CONFIG.ANIMATION_SPEED;
            State.animating = true;
        } else {
            this.visualX = this.x;
            this.visualY = this.y;
        }
    }
}

class Monster extends Entity {
    constructor(x, y, mazeIndex, template) {
        super(x, y, mazeIndex);
        this.id = template.id;
        this.name = template.name;
        this.symbol = template.symbol;
        this.behavior = template.behavior;
        
        // Apply stats + scaling based on loop and time
        const scale = 1 + (State.loop - 1) * 0.5 + (State.turn * 0.01);
        this.maxHp = Math.floor(template.hp * scale);
        this.hp = this.maxHp;
        this.atk = Math.floor(template.atk * scale);
        this.def = Math.floor(template.def * scale);
        this.gold = Math.floor(Math.random() * 20 * scale) + 10;
    }

    takeTurn() {
        if (!this.alive) return;
        
        // Simple AI: Move randomly, but favor paths
        const dirs = [[0,-1], [0,1], [-1,0], [1,0]];
        const maze = State.mazes[this.mazeIndex];
        const p = State.player;
        
        let validMoves = dirs.map(d => ({nx: this.x + d[0], ny: this.y + d[1]}))
                             .filter(pos => 
                                pos.nx >= 0 && pos.nx < maze[0].length && 
                                pos.ny >= 0 && pos.ny < maze.length &&
                                maze[pos.ny][pos.nx] !== TILE_TYPES.WALL
                             );
        
        if (validMoves.length > 0) {
            let chosenMove = validMoves[Math.floor(Math.random() * validMoves.length)];
            
            // Advanced AI behavior
            if (p.mazeIndex === this.mazeIndex && p.alive) {
                let dx = p.x - this.x;
                let dy = p.y - this.y;
                let dist = Math.abs(dx) + Math.abs(dy);
                
                if (dist < 10) { // Vision range
                    let idealDx = dx === 0 ? 0 : (dx > 0 ? 1 : -1);
                    let idealDy = dy === 0 ? 0 : (dy > 0 ? 1 : -1);
                    
                    if (this.behavior === 'defensive' || this.behavior === 'mimic') {
                        chosenMove = {nx: this.x, ny: this.y}; // Stay
                    } else if (this.behavior === 'aggressive' || this.behavior === 'hunter' || this.behavior === 'boss') {
                        let towards = validMoves.filter(m => (m.nx - this.x === idealDx && idealDx !== 0) || (m.ny - this.y === idealDy && idealDy !== 0));
                        if (towards.length > 0) chosenMove = towards[Math.floor(Math.random() * towards.length)];
                    } else if (this.behavior === 'smart' || this.behavior === 'charming' || this.behavior === 'greedy') {
                        // Flee if weaker, otherwise attack
                        if (p.hp > this.hp || p.atk > this.atk) {
                            let flee = validMoves.filter(m => (m.nx - this.x === -idealDx && idealDx !== 0) || (m.ny - this.y === -idealDy && idealDy !== 0));
                            if (flee.length > 0) chosenMove = flee[Math.floor(Math.random() * flee.length)];
                        } else {
                            let towards = validMoves.filter(m => (m.nx - this.x === idealDx && idealDx !== 0) || (m.ny - this.y === idealDy && idealDy !== 0));
                            if (towards.length > 0) chosenMove = towards[Math.floor(Math.random() * towards.length)];
                        }
                    }
                }
            }

            this.x = chosenMove.nx;
            this.y = chosenMove.ny;
            
            // Check teleport
            if (maze[this.y][this.x] === TILE_TYPES.TELEPORT) {
                const nextMaze = (this.mazeIndex + 1) % CONFIG.NUM_MAZES;
                this.mazeIndex = nextMaze;
                const startPos = findTile(nextMaze, TILE_TYPES.TELEPORT) || findTile(nextMaze, TILE_TYPES.START);
                if(startPos) {
                    this.x = startPos.x;
                    this.y = startPos.y;
                    this.visualX = this.x; // Instant move visually
                    this.visualY = this.y;
                }
            }
        }
    }
}

// --- Maze Generation (Recursive Backtracker modified for open paths) ---
function generateMaze(width, height) {
    // Initialize with walls
    let maze = Array.from({length: height}, () => Array(width).fill(TILE_TYPES.WALL));
    
    // Starting point
    let startX = 1, startY = 1;
    maze[startY][startX] = TILE_TYPES.START;
    
    // Stack for backtracking
    let stack = [{x: startX, y: startY}];
    
    // Directions (2 steps to keep walls between paths)
    const dirs = [[0, -2], [0, 2], [-2, 0], [2, 0]];
    
    while(stack.length > 0) {
        let curr = stack[stack.length - 1];
        
        // Shuffle directions
        let unvisited = dirs.map(d => ({x: curr.x + d[0], y: curr.y + d[1], dx: d[0], dy: d[1]}))
                            .filter(n => n.x > 0 && n.x < width - 1 && n.y > 0 && n.y < height - 1 && maze[n.y][n.x] === TILE_TYPES.WALL)
                            .sort(() => Math.random() - 0.5);
                            
        if (unvisited.length > 0) {
            let next = unvisited[0];
            // Carve path
            maze[curr.y + next.dy/2][curr.x + next.dx/2] = TILE_TYPES.PATH;
            maze[next.y][next.x] = TILE_TYPES.PATH;
            stack.push({x: next.x, y: next.y});
        } else {
            stack.pop();
        }
    }

    // Add loops / open up dead ends to make it more board-game like
    for(let y=1; y<height-1; y+=2) {
        for(let x=1; x<width-1; x+=2) {
            if (Math.random() < 0.2 && maze[y][x] === TILE_TYPES.PATH) {
                let neighbors = [[0,-1],[0,1],[-1,0],[1,0]];
                let n = neighbors[Math.floor(Math.random()*neighbors.length)];
                if (y+n[1] > 0 && y+n[1] < height-1 && x+n[0] > 0 && x+n[0] < width-1) {
                    maze[y+n[1]][x+n[0]] = TILE_TYPES.PATH;
                }
            }
        }
    }

    // Place Teleporter
    let placedTeleport = false;
    while(!placedTeleport) {
        let tx = Math.floor(Math.random() * Math.floor(width / 2)) * 2 + 1;
        let ty = Math.floor(Math.random() * Math.floor(height / 2)) * 2 + 1;
        if (maze[ty][tx] === TILE_TYPES.PATH && (tx !== startX || ty !== startY)) {
            maze[ty][tx] = TILE_TYPES.TELEPORT;
            placedTeleport = true;
        }
    }

    // Place Events (Monopoly style tiles)
    for(let y=1; y<height-1; y++) {
        for(let x=1; x<width-1; x++) {
            if (maze[y][x] === TILE_TYPES.PATH) {
                let r = Math.random();
                if (r < 0.08) maze[y][x] = TILE_TYPES.EVENT_GOOD;
                else if (r < 0.16) maze[y][x] = TILE_TYPES.EVENT_BAD;
                else if (r < 0.24) maze[y][x] = TILE_TYPES.EVENT_ITEM;
                else if (r < 0.40) maze[y][x] = TILE_TYPES.EVENT_EMPTY;
            }
        }
    }

    return maze;
}

function findTile(mazeIndex, type) {
    const m = State.mazes[mazeIndex];
    for(let y=0; y<m.length; y++){
        for(let x=0; x<m[y].length; x++){
            if(m[y][x] === type) return {x, y};
        }
    }
    return null;
}

// --- Core System ---
const Game = {
    canvas: null,
    ctx: null,
    lastTime: 0,
    stepsRemaining: 0,
    movementHistory: [], // To prevent going back
    
    saveGameState() {
        try {
            const saveData = {
                loop: State.loop, turn: State.turn,
                mazes: State.mazes, logs: State.logs, 
                stepsRemaining: this.stepsRemaining, movementHistory: this.movementHistory,
                entities: State.entities.map(e => ({...e, type: e.isPlayer ? 'player' : 'monster'}))
            };
            localStorage.setItem('dungeon_save', JSON.stringify(saveData));
        } catch(e) { console.error("Save failed", e); }
    },

    loadGameState() {
        try {
            const data = localStorage.getItem('dungeon_save');
            if(!data) return false;
            const parsed = JSON.parse(data);
            if(parsed.entities.find(e => e.type === 'player' && e.hp <= 0)) return false; // don't load if dead
            State.loop = parsed.loop; State.turn = parsed.turn;
            State.mazes = parsed.mazes; State.logs = parsed.logs || [];
            this.stepsRemaining = parsed.stepsRemaining || 0;
            this.movementHistory = parsed.movementHistory || [];
            State.entities = parsed.entities.map(eData => {
                let e = eData.type === 'player' ? 
                    new Entity(eData.x, eData.y, eData.mazeIndex, true) : 
                    new Monster(eData.x, eData.y, eData.mazeIndex, MONSTER_TEMPLATES.find(t => t.id === eData.id) || MONSTER_TEMPLATES[0]);
                Object.assign(e, eData);
                return e;
            });
            State.player = State.entities.find(e => e.isPlayer);
            return true;
        } catch(e) { console.error("Load failed", e); return false; }
    },

    init() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        
        window.addEventListener('resize', this.resize.bind(this));
        this.resize();

        this.setupUI();
        
        if (this.loadGameState()) {
            this.resumeLoop();
        } else {
            this.startLoop(State.loop > 1); // Check if new game+
        }
    },

    resumeLoop() {
        logMsg("載入上次儲存的遊戲進度...");
        this.updateUI();
        if(this.stepsRemaining > 0) {
            this.setMovementPhase(true);
        }
        requestAnimationFrame(this.render.bind(this));
    },

    resize() {
        this.canvas.width = document.getElementById('canvas-container').clientWidth;
        this.canvas.height = document.getElementById('canvas-container').clientHeight;
    },

    startLoop(keepStats = false) {
        // Hide any open modals/screens to ensure clean restart
        document.getElementById('endgame-modal').classList.add('hidden');
        document.getElementById('encounter-modal').classList.add('hidden');
        document.getElementById('message-modal').classList.add('hidden');
        document.getElementById('combat-screen').classList.add('hidden');
        document.getElementById('combat-screen').classList.remove('flex');
        document.getElementById('btn-cb-attack').disabled = false;
        document.getElementById('btn-cb-flee').disabled = false;

        let oldStats = null;
        if (keepStats && State.player) {
            oldStats = {
                maxHp: State.player.maxHp,
                hp: State.player.maxHp, // heal on loop
                atk: State.player.atk,
                def: State.player.def,
                gold: State.player.gold,
                charm: State.player.charm,
                kills: State.player.kills
            };
        }

        // Reset state
        State.turn = 0;
        State.mazes = [];
        State.entities = [];
        State.logs = [];
        this.stepsRemaining = 0;
        this.movementHistory = [];

        logMsg(`--- 第 ${State.loop} 輪迴開始 ---`);

        // Generate Mazes
        for(let i=0; i<CONFIG.NUM_MAZES; i++) {
            State.mazes.push(generateMaze(CONFIG.MAZE_WIDTH, CONFIG.MAZE_HEIGHT));
        }

        // Create Player
        let startPos = findTile(0, TILE_TYPES.START);
        State.player = new Entity(startPos.x, startPos.y, 0, true);
        State.player.name = "勇者";
        State.entities.push(State.player);

        if (oldStats) {
            Object.assign(State.player, oldStats);
        }

        // Create Monsters
        let availableMonsters = [...MONSTER_TEMPLATES].sort(() => Math.random() - 0.5);
        for(let i=0; i<12; i++) {
            let template = availableMonsters[i];
            let mIndex = i % CONFIG.NUM_MAZES; // Distribute across mazes
            
            // Find empty path for monster
            let placed = false;
            while(!placed) {
                let rx = Math.floor(Math.random() * CONFIG.MAZE_WIDTH);
                let ry = Math.floor(Math.random() * CONFIG.MAZE_HEIGHT);
                if (State.mazes[mIndex][ry][rx] !== TILE_TYPES.WALL) {
                    State.entities.push(new Monster(rx, ry, mIndex, template));
                    placed = true;
                }
            }
        }

        this.updateUI();
        this.saveGameState(); // Initial save
        requestAnimationFrame(this.render.bind(this));
    },

    setupUI() {
        // 新增直接點擊 Canvas 移動的事件監聽
        this.canvas.addEventListener('pointerdown', (e) => {
            if (this.stepsRemaining <= 0) return;
            
            if (!document.getElementById('encounter-modal').classList.contains('hidden') ||
                !document.getElementById('message-modal').classList.contains('hidden') ||
                !document.getElementById('combat-screen').classList.contains('hidden') ||
                !document.getElementById('endgame-modal').classList.contains('hidden')) return;

            const rect = this.canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const worldX = x + State.camera.x;
            const worldY = y + State.camera.y;

            const gridX = Math.floor(worldX / CONFIG.TILE_SIZE);
            const gridY = Math.floor(worldY / CONFIG.TILE_SIZE);

            const validMoves = this.getValidMoves();
            const move = validMoves.find(m => m.x === gridX && m.y === gridY);
            
            if (move) {
                this.movePlayer(move.dx, move.dy);
            }
        });

        document.getElementById('btn-roll').addEventListener('click', () => {
            if (this.stepsRemaining > 0 || State.player.hp <= 0) return;
            
            // 防止視窗開啟時或動畫進行中連點觸發錯誤
            if (!document.getElementById('encounter-modal').classList.contains('hidden') ||
                !document.getElementById('message-modal').classList.contains('hidden') ||
                !document.getElementById('combat-screen').classList.contains('hidden') ||
                !document.getElementById('endgame-modal').classList.contains('hidden')) return;
                
            const btn = document.getElementById('btn-roll');
            if (btn.classList.contains('rolling')) return; 
            
            btn.classList.add('rolling');
            
            setTimeout(() => {
                this.stepsRemaining = Math.floor(Math.random() * 6) + 1;
                btn.classList.remove('rolling');
                
                this.setMovementPhase(true);
                this.movementHistory = [{x: State.player.x, y: State.player.y}]; // track where we came from
            }, 500);
        });

        // Encounter buttons
        document.getElementById('btn-fight').addEventListener('click', () => this.resolveEncounter('fight'));
        document.getElementById('btn-flee').addEventListener('click', () => this.resolveEncounter('flee'));
        document.getElementById('btn-persuade').addEventListener('click', () => this.resolveEncounter('persuade'));
        document.getElementById('btn-bribe').addEventListener('click', () => this.resolveEncounter('bribe'));

        // Combat Screen buttons
        document.getElementById('btn-cb-attack').addEventListener('click', () => this.processCombatRound());
        document.getElementById('btn-cb-flee').addEventListener('click', () => this.combatFlee());

        document.getElementById('btn-msg-close').addEventListener('click', () => {
            document.getElementById('message-modal').classList.add('hidden');
        });
        
        // 點擊黑色半透明背景也能關閉提示視窗
        document.getElementById('message-modal').addEventListener('click', (e) => {
            if (e.target.id === 'message-modal') {
                document.getElementById('message-modal').classList.add('hidden');
            }
        });

        document.getElementById('btn-restart').addEventListener('click', () => {
            document.getElementById('endgame-modal').classList.add('hidden');
            if (document.getElementById('btn-restart').innerText.includes('下一輪迴')) {
                State.loop++;
                this.startLoop(true);
            } else {
                State.loop = 1;
                this.startLoop(false);
            }
        });

        // Add Keyboard listener for movement
        window.addEventListener('keydown', (e) => {
            if (this.stepsRemaining <= 0) return;
            
            if (!document.getElementById('encounter-modal').classList.contains('hidden') ||
                !document.getElementById('message-modal').classList.contains('hidden') ||
                !document.getElementById('combat-screen').classList.contains('hidden') ||
                !document.getElementById('endgame-modal').classList.contains('hidden')) return;

            let dx = 0, dy = 0;
            const key = e.key.toLowerCase();
            if (key === 'arrowup' || key === 'w') dy = -1;
            else if (key === 'arrowdown' || key === 's') dy = 1;
            else if (key === 'arrowleft' || key === 'a') dx = -1;
            else if (key === 'arrowright' || key === 'd') dx = 1;
            else return;

            const validMoves = this.getValidMoves();
            const move = validMoves.find(m => m.dx === dx && m.dy === dy);
            if (move) {
                this.movePlayer(dx, dy);
            }
        });
    },

    getValidMoves() {
        const p = State.player;
        const maze = State.mazes[p.mazeIndex];
        const dirs = [[0,-1], [0,1], [-1,0], [1,0]];
        let valid = [];
        
        for (let d of dirs) {
            let nx = p.x + d[0], ny = p.y + d[1];
            const isBacktrack = this.movementHistory.length > 1 && 
                                this.movementHistory[this.movementHistory.length-2].x === nx && 
                                this.movementHistory[this.movementHistory.length-2].y === ny;
            
            if (nx >= 0 && nx < CONFIG.MAZE_WIDTH && ny >= 0 && ny < CONFIG.MAZE_HEIGHT && maze[ny][nx] !== TILE_TYPES.WALL) {
                if (!isBacktrack) valid.push({x: nx, y: ny, dx: d[0], dy: d[1]});
            }
        }
        
        // 如果走進死胡同（沒有合法移動方向），則允許回頭
        if (valid.length === 0 && this.movementHistory.length > 1) {
            let prev = this.movementHistory[this.movementHistory.length-2];
            valid.push({x: prev.x, y: prev.y, dx: prev.x - p.x, dy: prev.y - p.y});
            this.movementHistory = [{x: p.x, y: p.y}]; // 清除歷史軌跡
        }
        return valid;
    },

    setMovementPhase(isMoving) {
        const btn = document.getElementById('btn-roll');
        const icon = document.getElementById('dice-icon');
        const text = document.getElementById('dice-result');
        
        if (isMoving) {
            btn.classList.remove('from-blue-600', 'to-blue-800', 'hover:from-blue-500', 'hover:to-blue-700');
            btn.classList.add('from-yellow-600', 'to-yellow-800');
            icon.innerText = '👣';
            text.innerText = `點擊發亮處 (剩 ${this.stepsRemaining} 步)`;
        } else {
            btn.classList.remove('from-yellow-600', 'to-yellow-800');
            btn.classList.add('from-blue-600', 'to-blue-800', 'hover:from-blue-500', 'hover:to-blue-700');
            icon.innerText = '🎲';
            text.innerText = '擲骰移動';
        }
    },

    movePlayer(dx, dy) {
        const p = State.player;
        p.x += dx;
        p.y += dy;
        this.movementHistory.push({x: p.x, y: p.y});
        this.stepsRemaining--;

        // 每走一格自動回復 1 HP
        p.heal(1);
        this.updateUI(); 

        // 檢查是否踩到傳送陣 (立刻觸發，不用等步數走完)
        const maze = State.mazes[p.mazeIndex];
        if (maze[p.y][p.x] === TILE_TYPES.TELEPORT) {
            const nextMaze = (p.mazeIndex + 1) % CONFIG.NUM_MAZES;
            p.mazeIndex = nextMaze;
            const startPos = findTile(nextMaze, TILE_TYPES.START);
            if(startPos) {
                p.x = startPos.x; p.y = startPos.y;
                p.visualX = p.x; p.visualY = p.y;
                this.movementHistory = [{x: p.x, y: p.y}]; // 傳送後解除方向限制
                this.showMessage("傳送陣", `傳送到迷宮層級 ${nextMaze + 1}!`);
                logMsg(`進入傳送陣，來到第 ${nextMaze + 1} 層！`);
            }
        }

        // Check encounters immediately upon stepping on a tile
        let encounter = this.checkEntityCollision();
        
        if (encounter) {
            this.triggerEncounter(encounter);
            // Stop movement on encounter
            this.stepsRemaining = 0;
            this.finishPlayerMove();
        } else if (this.stepsRemaining === 0) {
            this.finishPlayerMove();
        } else {
            // 更新按鈕上的步數提示
            document.getElementById('dice-result').innerText = `點擊發亮處 (剩 ${this.stepsRemaining} 步)`;
        }
    },

    finishPlayerMove() {
        this.setMovementPhase(false);
        this.processTileEvent();
        this.processWorldTurn();
    },

    processTileEvent() {
        const p = State.player;
        const maze = State.mazes[p.mazeIndex];
        const tile = maze[p.y][p.x];

        let msg = "";
        let eventCategory = null;

        if (tile === TILE_TYPES.EVENT_GOOD) {
            eventCategory = EVENTS.GOOD;
        } else if (tile === TILE_TYPES.EVENT_BAD) {
            eventCategory = EVENTS.BAD;
        } else if (tile === TILE_TYPES.EVENT_ITEM) {
            eventCategory = EVENTS.ITEM;
        }

        if (eventCategory) {
            const ev = eventCategory[Math.floor(Math.random() * eventCategory.length)];
            ev.effect(p);
            // Change tile back to path after using
            maze[p.y][p.x] = TILE_TYPES.PATH;
            this.showMessage(ev.name, ev.desc);
            logMsg(`遭遇事件: ${ev.name}`);
        }

        this.updateUI();
    },

    processWorldTurn() {
        State.turn++;
        
        // Monsters move
        State.entities.forEach(e => {
            if (!e.isPlayer && e.alive) {
                e.takeTurn();
            }
        });

        // Player gets stronger over time slowly
        if (State.turn % 20 === 0) {
            State.player.maxHp += 5;
            State.player.atk += 1;
            logMsg("在迷宮中探索，適應了環境，能力微幅提升。");

            // Enemy Scaling logic
            State.entities.forEach(e => {
                if (!e.isPlayer && e.alive) {
                    e.maxHp += 5;
                    e.hp += 5;
                    e.atk += 1;
                }
            });
            logMsg("迷宮深處的氣息變濃，殘存的魔物變得更強了。");
        }

        // Check if monster walked onto player
        let encounter = this.checkEntityCollision();
        if (encounter && document.getElementById('encounter-modal').classList.contains('hidden')) {
            this.triggerEncounter(encounter);
        } else {
            // Save state if no immediate encounter blocks play
            this.saveGameState(); 
        }

        this.updateUI();
        this.checkWinCondition();
    },

    checkEntityCollision() {
        const p = State.player;
        return State.entities.find(e => 
            !e.isPlayer && 
            e.alive && 
            e.mazeIndex === p.mazeIndex && 
            e.x === p.x && 
            e.y === p.y
        );
    },

    triggerEncounter(monster) {
        State.currentEncounter = monster;
        
        document.getElementById('encounter-name').innerText = `${monster.symbol} ${monster.name}`;
        document.getElementById('encounter-hp').innerText = monster.hp;
        document.getElementById('encounter-atk').innerText = monster.atk;
        document.getElementById('encounter-def').innerText = monster.def;
        
        // Update Bribe cost dynamically
        let bribeCost = monster.gold * 2;
        document.getElementById('btn-bribe').innerText = `賄賂 (${bribeCost}G)`;
        document.getElementById('btn-bribe').disabled = State.player.gold < bribeCost;
        document.getElementById('btn-bribe').style.opacity = State.player.gold < bribeCost ? 0.5 : 1;

        document.getElementById('encounter-modal').classList.remove('hidden');
    },

    resolveEncounter(action) {
        const p = State.player;
        const m = State.currentEncounter;
        if (!m || !m.alive) return;

        let modal = document.getElementById('encounter-modal');
        let closeEncounter = true;

        if (action === 'fight') {
            // Enter Independent Combat Screen
            this.startCombat();
            closeEncounter = false; 
            modal.classList.add('hidden');
        } 
        else if (action === 'flee') {
            let chance = 0.7 + (p.charm * 0.05); // charm helps slightly
            if (Math.random() < chance) {
                logMsg("逃跑成功！");
                this.bounceEntity(p);
            } else {
                logMsg("逃跑失敗，被迫應戰！");
                this.startCombat();
                closeEncounter = false;
                modal.classList.add('hidden');
            }
        }
        else if (action === 'persuade') {
            let chance = 0.2 + (p.charm * 0.1);
            if (m.behavior === 'charming') chance += 0.3;
            if (m.behavior === 'mimic') chance = 0;

            if (Math.random() < chance) {
                logMsg(`成功說服 ${m.name} 離開！`);
                m.alive = false; 
                p.kills++; 
            } else {
                logMsg("說服失敗，激怒了對方，進入戰鬥！");
                m.atk += 2; // Enrage
                this.startCombat();
                closeEncounter = false;
                modal.classList.add('hidden');
            }
        }
        else if (action === 'bribe') {
            let cost = m.gold * 2;
            if (p.gold >= cost) {
                p.gold -= cost;
                logMsg(`花費 ${cost}G 賄賂了 ${m.name}。`);
                m.alive = false;
                p.kills++;
            }
        }

        this.updateUI();

        if (closeEncounter) {
            modal.classList.add('hidden');
            State.currentEncounter = null;
            this.checkWinCondition();
            this.saveGameState(); // Save state after resolving
        }
    },

    // --- New Combat System ---
    
    startCombat() {
        const screen = document.getElementById('combat-screen');
        screen.classList.remove('hidden');
        screen.classList.add('flex');
        
        const m = State.currentEncounter;
        document.getElementById('cb-m-name').innerText = m.name;
        document.getElementById('cb-m-sym').innerText = m.symbol;
        
        this.updateCombatUI();
        
        document.getElementById('combat-log').innerHTML = ''; // clear logs
        this.logCombat(`遭遇了 ${m.name}！戰鬥開始！`, 'text-yellow-400');
    },

    updateCombatUI() {
        const p = State.player;
        const m = State.currentEncounter;
        
        document.getElementById('cb-p-hp').innerText = `HP: ${Math.floor(p.hp)}/${p.maxHp}`;
        document.getElementById('cb-p-hpbar').style.width = `${Math.max(0, (p.hp/p.maxHp)*100)}%`;
        
        if (m) {
            document.getElementById('cb-m-hp').innerText = `HP: ${Math.floor(m.hp)}/${m.maxHp}`;
            document.getElementById('cb-m-hpbar').style.width = `${Math.max(0, (m.hp/m.maxHp)*100)}%`;
        }
    },

    logCombat(msg, colorClass = 'text-gray-300') {
        const logWindow = document.getElementById('combat-log');
        const entry = document.createElement('div');
        entry.className = `mb-1 ${colorClass}`;
        entry.innerText = msg;
        logWindow.appendChild(entry);
        logWindow.scrollTop = logWindow.scrollHeight; // auto scroll
    },

    processCombatRound() {
        const p = State.player;
        const m = State.currentEncounter;
        if (!m || !m.alive || !p.alive) return;
        
        // Disable buttons during animation
        const atkBtn = document.getElementById('btn-cb-attack');
        const fleeBtn = document.getElementById('btn-cb-flee');
        atkBtn.disabled = true; fleeBtn.disabled = true;

        const pDiv = document.getElementById('combat-player');
        const mDiv = document.getElementById('combat-monster');
        
        // Player attacks
        pDiv.classList.add('anim-atk-p');
        setTimeout(() => {
            pDiv.classList.remove('anim-atk-p');
            mDiv.classList.add('anim-dmg');
            
            let pdmg = m.takeDamage(p.atk, p);
            this.logCombat(`勇者 對 ${m.name} 造成 ${pdmg} 點傷害！`, 'text-blue-400');
            this.updateCombatUI();
            
            setTimeout(() => mDiv.classList.remove('anim-dmg'), 400);

            if (!m.alive) {
                this.logCombat(`成功擊敗了 ${m.name}！`, 'text-green-400');
                setTimeout(() => this.endCombat(true), 1200);
                return;
            }

            // Monster attacks back
            setTimeout(() => {
                if (!p.alive || !m.alive) return; // double check

                mDiv.classList.add('anim-atk-m');
                setTimeout(() => {
                    mDiv.classList.remove('anim-atk-m');
                    pDiv.classList.add('anim-dmg');
                    
                    let mdmg = p.takeDamage(m.atk, m);
                    this.logCombat(`${m.name} 對你造成 ${mdmg} 點傷害！`, 'text-red-400');
                    this.updateCombatUI();
                    this.updateUI(); // update main UI too
                    
                    setTimeout(() => pDiv.classList.remove('anim-dmg'), 400);

                    if (!p.alive) {
                        this.logCombat(`你倒下了...`, 'text-red-600');
                        // Death is handled by Entity.die() calling handlePlayerDeath()
                    } else {
                        atkBtn.disabled = false; fleeBtn.disabled = false;
                    }
                }, 300);
            }, 600);
        }, 300);
    },

    combatFlee() {
         const p = State.player;
         const m = State.currentEncounter;
         const atkBtn = document.getElementById('btn-cb-attack');
         const fleeBtn = document.getElementById('btn-cb-flee');
         
         atkBtn.disabled = true; fleeBtn.disabled = true;

         // Harder to flee once in active combat (base 40% + charm)
         let chance = 0.4 + (p.charm * 0.05);
         if (Math.random() < chance) {
             this.logCombat("成功撤退！", "text-yellow-400");
             setTimeout(() => {
                 this.endCombat(false, true); // not won, but fled
             }, 1000);
         } else {
             this.logCombat("撤退失敗！破綻百出！", "text-red-500");
             
             // Monster gets a free hit
             setTimeout(() => {
                 const mDiv = document.getElementById('combat-monster');
                 const pDiv = document.getElementById('combat-player');
                 mDiv.classList.add('anim-atk-m');
                 
                 setTimeout(() => {
                    mDiv.classList.remove('anim-atk-m');
                    pDiv.classList.add('anim-dmg');
                    
                    let mdmg = p.takeDamage(m.atk * 1.2, m); // 20% more damage on failed flee
                    this.logCombat(`${m.name} 趁機對你造成 ${Math.floor(mdmg)} 點重擊！`, 'text-red-500 font-bold');
                    this.updateCombatUI();
                    this.updateUI();
                    
                    setTimeout(() => pDiv.classList.remove('anim-dmg'), 400);
                    
                    if (p.alive) {
                        atkBtn.disabled = false; fleeBtn.disabled = false;
                    }
                 }, 300);
             }, 600);
         }
    },

    endCombat(won, fled = false) {
        const screen = document.getElementById('combat-screen');
        screen.classList.add('hidden');
        screen.classList.remove('flex');
        
        const atkBtn = document.getElementById('btn-cb-attack');
        const fleeBtn = document.getElementById('btn-cb-flee');
        atkBtn.disabled = false; fleeBtn.disabled = false;

        if (won) {
            logMsg(`戰鬥勝利！`);
            State.currentEncounter = null;
            this.checkWinCondition();
            this.updateUI();
        } else if (fled) {
            logMsg(`驚險地從戰鬥中撤退。`);
            this.bounceEntity(State.player);
            State.currentEncounter = null;
            this.updateUI();
        }
        
        this.saveGameState(); // Auto save after combat completes
    },

    bounceEntity(entity) {
        // Move entity to a valid adjacent tile
        const maze = State.mazes[entity.mazeIndex];
        const dirs = [[0,-1], [0,1], [-1,0], [1,0]];
        for(let d of dirs) {
            let nx = entity.x + d[0], ny = entity.y + d[1];
            if (nx>=0 && nx<CONFIG.MAZE_WIDTH && ny>=0 && ny<CONFIG.MAZE_HEIGHT && maze[ny][nx] !== TILE_TYPES.WALL) {
                entity.x = nx; entity.y = ny;
                break;
            }
        }
    },

    render(time) {
        requestAnimationFrame(this.render.bind(this));
        
        let dt = time - this.lastTime;
        this.lastTime = time;

        State.animating = false;
        State.entities.forEach(e => e.updateAnimation());

        // Setup Canvas
        const w = this.canvas.width;
        const h = this.canvas.height;
        this.ctx.fillStyle = '#1a202c'; // bg color
        this.ctx.fillRect(0, 0, w, h);

        if (!State.player) return;

        const p = State.player;
        const maze = State.mazes[p.mazeIndex];
        
        // Camera follows visual position (將攝影機焦點向下偏移，讓主角在畫面上的顯示位置相對偏上，遠離底部的操控UI)
        State.camera.x = p.visualX * CONFIG.TILE_SIZE - w/2 + CONFIG.TILE_SIZE/2;
        State.camera.y = p.visualY * CONFIG.TILE_SIZE - h/2 + CONFIG.TILE_SIZE/2 + (h * 0.15);

        this.ctx.save();
        this.ctx.translate(-State.camera.x, -State.camera.y);

        // Draw Maze
        for (let y = 0; y < CONFIG.MAZE_HEIGHT; y++) {
            for (let x = 0; x < CONFIG.MAZE_WIDTH; x++) {
                // Frustum culling (rough)
                let scrX = x * CONFIG.TILE_SIZE - State.camera.x;
                let scrY = y * CONFIG.TILE_SIZE - State.camera.y;
                
                if (scrX > -CONFIG.TILE_SIZE && scrX < w && scrY > -CONFIG.TILE_SIZE && scrY < h) {
                    let tile = maze[y][x];
                    
                    // Draw base floor for paths
                    if (tile !== TILE_TYPES.WALL) {
                        this.ctx.fillStyle = TILE_COLORS[TILE_TYPES.PATH];
                        this.ctx.fillRect(x * CONFIG.TILE_SIZE, y * CONFIG.TILE_SIZE, CONFIG.TILE_SIZE, CONFIG.TILE_SIZE);
                    }
                    
                    // Draw tile specific coloring/design
                    if (tile === TILE_TYPES.WALL) {
                        this.ctx.fillStyle = TILE_COLORS[TILE_TYPES.WALL];
                        this.ctx.fillRect(x * CONFIG.TILE_SIZE, y * CONFIG.TILE_SIZE, CONFIG.TILE_SIZE, CONFIG.TILE_SIZE);
                        // Add some texture to wall
                        this.ctx.fillStyle = 'rgba(0,0,0,0.2)';
                        this.ctx.fillRect(x * CONFIG.TILE_SIZE, y * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE - 5, CONFIG.TILE_SIZE, 5);
                    } else if (tile === TILE_TYPES.TELEPORT) {
                        this.ctx.fillStyle = TILE_COLORS[TILE_TYPES.TELEPORT];
                        this.ctx.beginPath();
                        this.ctx.arc(x * CONFIG.TILE_SIZE + 20, y * CONFIG.TILE_SIZE + 20, 15, 0, Math.PI*2);
                        this.ctx.fill();
                    } else if (tile === TILE_TYPES.EVENT_GOOD || tile === TILE_TYPES.EVENT_BAD || tile === TILE_TYPES.EVENT_ITEM) {
                        this.ctx.fillStyle = TILE_COLORS[tile];
                        this.ctx.beginPath();
                        this.ctx.moveTo(x * CONFIG.TILE_SIZE + 20, y * CONFIG.TILE_SIZE + 10);
                        this.ctx.lineTo(x * CONFIG.TILE_SIZE + 30, y * CONFIG.TILE_SIZE + 20);
                        this.ctx.lineTo(x * CONFIG.TILE_SIZE + 20, y * CONFIG.TILE_SIZE + 30);
                        this.ctx.lineTo(x * CONFIG.TILE_SIZE + 10, y * CONFIG.TILE_SIZE + 20);
                        this.ctx.fill();
                    }
                }
            }
        }

        // Draw Highlight for possible moves
        if (this.stepsRemaining > 0) {
             const validMoves = this.getValidMoves();
             validMoves.forEach(m => {
                 // 畫黃色半透明發光框
                 this.ctx.fillStyle = 'rgba(255, 255, 0, 0.3)';
                 this.ctx.fillRect(m.x * CONFIG.TILE_SIZE, m.y * CONFIG.TILE_SIZE, CONFIG.TILE_SIZE, CONFIG.TILE_SIZE);
                 
                 // 畫上腳印提示
                 this.ctx.fillStyle = '#ffffff';
                 this.ctx.font = '20px sans-serif';
                 this.ctx.globalAlpha = 1.0;
                 this.ctx.fillText("👣", m.x * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2, m.y * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2);
             });
        }

        // Draw Entities
        // Sort by Y for simple depth sorting
        let renderQueue = State.entities.filter(e => e.alive && e.mazeIndex === p.mazeIndex)
                                        .sort((a, b) => a.visualY - b.visualY);

        renderQueue.forEach(e => {
            let px = e.visualX * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2;
            let py = e.visualY * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2;
            
            this.ctx.font = '24px sans-serif';
            this.ctx.textAlign = 'center';
            this.ctx.textBaseline = 'middle';
            
            if (e.isPlayer) {
                // Draw shadow
                this.ctx.fillStyle = 'rgba(0,0,0,0.5)';
                this.ctx.beginPath();
                this.ctx.ellipse(px, py + 12, 12, 6, 0, 0, Math.PI*2);
                this.ctx.fill();
                
                // 強制重置為不透明與白色，修正 Emoji 受到半透明影子影響變暗的問題
                this.ctx.fillStyle = '#ffffff';
                this.ctx.globalAlpha = 1.0;
                this.ctx.fillText("🧑‍🌾", px, py); // Player emoji
                
                // HP bar
                let hpPct = Math.max(0, e.hp / e.maxHp);
                this.ctx.fillStyle = 'red';
                this.ctx.fillRect(px - 15, py - 20, 30, 4);
                this.ctx.fillStyle = 'green';
                this.ctx.fillRect(px - 15, py - 20, 30 * hpPct, 4);
            } else {
                // 強制重置為不透明與白色，確保怪物圖示清晰
                this.ctx.fillStyle = '#ffffff';
                this.ctx.globalAlpha = 1.0;
                this.ctx.fillText(e.symbol, px, py);
                
                // Mini HP bar for monsters
                let hpPct = Math.max(0, e.hp / e.maxHp);
                this.ctx.fillStyle = 'rgba(255,0,0,0.5)';
                this.ctx.fillRect(px - 10, py - 15, 20, 3);
                this.ctx.fillStyle = 'red';
                this.ctx.fillRect(px - 10, py - 15, 20 * hpPct, 3);
            }
        });

        this.ctx.restore();
        
        // Vignette effect for dungeon feel
        let gradient = this.ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*0.2, w/2, h/2, Math.min(w,h)*0.8);
        gradient.addColorStop(0, 'rgba(0,0,0,0)');
        gradient.addColorStop(1, 'rgba(0,0,0,0.8)');
        this.ctx.fillStyle = gradient;
        this.ctx.fillRect(0,0,w,h);
    },

    updateUI() {
        if (!State.player) return;
        
        const p = State.player;
        document.getElementById('player-hp').innerText = `${p.hp}/${p.maxHp}`;
        document.getElementById('player-atk').innerText = p.atk;
        document.getElementById('player-def').innerText = p.def;
        document.getElementById('player-gold').innerText = p.gold;
        
        document.getElementById('loop-count').innerText = State.loop > 1 ? `(第${State.loop}輪)` : '';
        document.getElementById('turn-count').innerText = State.turn;
        document.getElementById('current-maze').innerText = p.mazeIndex + 1;

        let aliveCount = State.entities.filter(e => !e.isPlayer && e.alive).length;
        document.getElementById('alive-count').innerText = aliveCount;
    },

    showMessage(title, desc) {
        document.getElementById('message-title').innerText = title;
        document.getElementById('message-desc').innerText = desc;
        document.getElementById('message-modal').classList.remove('hidden');
    },

    handlePlayerDeath() {
        // Ensure combat screen hides so endgame modal is fully visible
        document.getElementById('combat-screen').classList.add('hidden');
        document.getElementById('combat-screen').classList.remove('flex');
        
        // Remove save since player died
        localStorage.removeItem('dungeon_save');

        const modal = document.getElementById('endgame-modal');
        const title = document.getElementById('end-title');
        const btn = document.getElementById('btn-restart');
        
        modal.classList.remove('hidden');
        title.innerText = "YOU DIED";
        title.className = "text-5xl font-black mb-2 text-center text-red-600";
        
        let aliveCount = State.entities.filter(e => !e.isPlayer && e.alive).length;
        document.getElementById('end-rank').innerText = `名次: 第 ${aliveCount + 1} 名`;
        
        document.getElementById('end-turns').innerText = State.turn;
        document.getElementById('end-kills').innerText = State.player.kills;
        document.getElementById('end-level').innerText = "死亡";
        
        btn.innerText = "重新開始";
        btn.className = "w-full py-3 rounded font-bold text-lg shadow-lg transition-transform hover:scale-105 bg-gray-600 hover:bg-gray-500 text-white";
    },

    checkWinCondition() {
        let aliveCount = State.entities.filter(e => !e.isPlayer && e.alive).length;
        if (aliveCount === 0 && State.player.alive) {
            const modal = document.getElementById('endgame-modal');
            const title = document.getElementById('end-title');
            const btn = document.getElementById('btn-restart');
            
            modal.classList.remove('hidden');
            title.innerText = "VICTORY!";
            title.className = "text-5xl font-black mb-2 text-center text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-yellow-600";
            
            document.getElementById('end-rank').innerText = "唯一的倖存者";
            
            document.getElementById('end-turns').innerText = State.turn;
            document.getElementById('end-kills').innerText = State.player.kills;
            document.getElementById('end-level').innerText = `滿載而歸 (輪迴 ${State.loop})`;
            
            btn.innerText = "開啟下一輪迴 (保留屬性, 敵人變強)";
            btn.className = "w-full py-3 rounded font-bold text-sm shadow-lg transition-transform hover:scale-105 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white mt-4";
        }
    }
};

function logMsg(msg) {
    State.logs.unshift(msg);
    if(State.logs.length > 20) State.logs.pop();
    
    const logWindow = document.getElementById('log-window');
    logWindow.innerHTML = State.logs.map((l, i) => 
        `<div class="${i===0 ? 'text-white' : 'text-gray-400'} mb-1">${l}</div>`
    ).join('');
}

// Start game when window loads
window.onload = () => {
    Game.init();
};

</script>
