<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>地城大冒險</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020617; /* tailwind slate-950 */
            color: #f8fafc; /* tailwind slate-50 */
            font-family: 'Noto Sans TC', sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none; 
            -webkit-touch-callout: none;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        button {
            touch-action: manipulation;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }
        #canvas-container {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .modal-overlay { 
            background: rgba(2, 6, 23, 0.85); 
            backdrop-filter: blur(8px); 
            z-index: 50; 
        }
        .modal-content {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .modal-enter {
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        .fade-top {
            mask-image: linear-gradient(to bottom, transparent 0%, black 20%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%);
        }

        @keyframes modalPop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes rollDice {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.2); }
            50% { transform: rotate(180deg) scale(0.8); }
            75% { transform: rotate(270deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }
        .rolling #dice-icon { animation: rollDice 0.5s ease-in-out; }
        
        @keyframes attack-player {
            0%, 100% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(20px) translateY(-20px); scale: 1.1; }
        }
        @keyframes attack-monster {
            0%, 100% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(-20px) translateY(20px); scale: 1.1; }
        }
        @keyframes damage-shake {
            0%, 100% { transform: translateX(0); filter: brightness(1); }
            25% { transform: translateX(-8px); filter: brightness(2) invert(0.2) sepia(1) hue-rotate(-50deg) saturate(5); }
            75% { transform: translateX(8px); filter: brightness(2) invert(0.2) sepia(1) hue-rotate(-50deg) saturate(5); }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .anim-atk-p { animation: attack-player 0.3s ease-in-out; z-index: 10; }
        .anim-atk-m { animation: attack-monster 0.3s ease-in-out; z-index: 10; }
        .anim-dmg { animation: damage-shake 0.4s ease-in-out; }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Game Canvas -->
    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- UI Overlay (Top Stats) -->
    <div id="top-ui" class="absolute top-0 left-0 w-full p-3 flex justify-between items-start pointer-events-none z-10 gap-2">
        <div class="bg-slate-900/90 backdrop-blur-sm p-3 rounded-xl border border-slate-700/50 shadow-2xl flex-1 max-w-[220px] transition-all">
            <div class="flex justify-between items-end mb-2">
                <div class="flex items-center gap-2">
                    <span class="text-xl filter drop-shadow">🧑‍🌾</span>
                    <div class="text-sm font-bold text-slate-200 tracking-wide">勇者 <span id="loop-count" class="text-indigo-400 text-[10px] ml-1"></span></div>
                </div>
                <div class="text-[10px] text-slate-400"><span id="player-hp" class="font-bold text-slate-300 font-mono">100/100</span> HP</div>
            </div>
            <div class="w-full bg-slate-950 rounded-full h-2 mb-2 border border-slate-700 shadow-inner">
                <div id="ui-hp-bar" class="bg-gradient-to-r from-emerald-500 to-emerald-400 h-full rounded-full transition-all duration-300" style="width: 100%"></div>
            </div>
            <div class="grid grid-cols-3 gap-1 text-xs">
                <div class="flex flex-col items-center bg-slate-800/50 rounded py-1 border border-slate-700/30"><span class="text-red-400 text-[10px]">⚔️</span><span id="player-atk" class="font-mono font-bold">10</span></div>
                <div class="flex flex-col items-center bg-slate-800/50 rounded py-1 border border-slate-700/30"><span class="text-blue-400 text-[10px]">🛡️</span><span id="player-def" class="font-mono font-bold">5</span></div>
                <div class="flex flex-col items-center bg-slate-800/50 rounded py-1 border border-slate-700/30"><span class="text-yellow-400 text-[10px]">💰</span><span id="player-gold" class="font-mono font-bold text-yellow-300">0</span></div>
            </div>
        </div>
        
        <div class="bg-slate-900/90 backdrop-blur-sm p-3 rounded-xl border border-slate-700/50 shadow-2xl flex-1 max-w-[140px] text-right flex flex-col justify-between">
            <div class="flex justify-between items-center">
                <div class="text-[10px] text-slate-400 uppercase tracking-wider">Maze</div>
                <div id="current-maze" class="text-lg font-black text-indigo-400 font-mono">1</div>
            </div>
            <div class="flex justify-between items-center mt-2">
                <div class="text-[10px] text-slate-400 uppercase tracking-wider">Monsters</div>
                <div id="alive-count" class="text-lg font-bold text-red-400 font-mono">12</div>
            </div>
            <div class="text-[10px] text-slate-500 mt-2">Turn: <span id="turn-count" class="font-mono">0</span></div>
        </div>
    </div>

    <!-- UI Overlay (Bottom Controls) -->
    <div id="bottom-ui" class="absolute bottom-0 left-0 w-full px-4 pb-[8vh] pointer-events-none z-10 flex flex-col justify-end gap-3">
        <div class="flex justify-center w-full">
            <div id="log-window" class="w-full max-w-sm bg-slate-950/80 backdrop-blur-md border border-slate-700/50 rounded-xl p-3 h-20 overflow-y-auto text-[11px] font-mono custom-scrollbar pointer-events-auto flex flex-col-reverse shadow-[0_0_20px_rgba(0,0,0,0.5)] fade-top"></div>
        </div>
        <div class="flex justify-center w-full">
            <button id="btn-roll" class="pointer-events-auto bg-gradient-to-t from-indigo-600 to-blue-500 hover:from-indigo-500 hover:to-blue-400 text-white font-bold py-3 px-8 rounded-full shadow-[0_4px_20px_rgba(59,130,246,0.5)] active:scale-95 transition-all border border-blue-400/50 flex items-center justify-center gap-3 w-full max-w-sm mx-auto group">
                <span id="dice-icon" class="text-2xl group-hover:rotate-12 transition-transform">🎲</span>
                <span id="dice-result" class="text-lg tracking-wide">擲骰移動</span>
            </button>
        </div>
    </div>

    <!-- Encounter Modal -->
    <div id="encounter-modal" class="absolute inset-0 modal-overlay hidden flex items-center justify-center z-[51] pointer-events-auto">
        <div class="modal-content rounded-2xl p-6 w-5/6 max-w-sm flex flex-col items-center modal-enter text-center border-red-500/50 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-red-600 to-orange-500"></div>
            <h2 class="text-[10px] font-black text-red-500 mb-1 tracking-widest uppercase">Encounter</h2>
            <div id="encounter-name" class="text-2xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-orange-400">🐉 魔物名稱</div>
            
            <div class="flex gap-2 mb-4 w-full text-sm">
                <div class="flex-1 bg-slate-900/80 p-2 rounded-lg text-center border border-slate-700/50 shadow-inner">
                    <div class="text-slate-400 text-[10px] tracking-wider uppercase mb-1">HP</div>
                    <div id="encounter-hp" class="text-red-400 font-bold font-mono">0</div>
                </div>
                <div class="flex-1 bg-slate-900/80 p-2 rounded-lg text-center border border-slate-700/50 shadow-inner">
                    <div class="text-slate-400 text-[10px] tracking-wider uppercase mb-1">ATK</div>
                    <div id="encounter-atk" class="text-blue-400 font-bold font-mono">0</div>
                </div>
                <div class="flex-1 bg-slate-900/80 p-2 rounded-lg text-center border border-slate-700/50 shadow-inner">
                    <div class="text-slate-400 text-[10px] tracking-wider uppercase mb-1">DEF</div>
                    <div id="encounter-def" class="text-green-400 font-bold font-mono">0</div>
                </div>
            </div>
            
            <div id="encounter-desc" class="text-xs text-slate-300 mb-6 px-2 italic bg-slate-800/50 p-3 rounded-lg border border-slate-700/30 w-full"></div>

            <div class="grid grid-cols-2 gap-3 w-full">
                <button id="btn-fight" class="bg-gradient-to-t from-red-700 to-red-500 hover:from-red-600 hover:to-red-400 py-3 rounded-xl font-bold shadow-[0_4px_15px_rgba(220,38,38,0.4)] text-white active:scale-95 transition-all border border-red-400/50 flex items-center justify-center gap-1">⚔️ 戰鬥</button>
                <button id="btn-flee-encounter" class="bg-gradient-to-t from-slate-700 to-slate-500 hover:from-slate-600 hover:to-slate-400 py-3 rounded-xl font-bold shadow-lg text-white active:scale-95 transition-all border border-slate-400/50 flex items-center justify-center gap-1">🏃 逃跑 <span class="text-[10px] text-slate-300 opacity-70">(70%)</span></button>
            </div>
        </div>
    </div>
    
    <!-- Merchant Modal -->
    <div id="merchant-modal" class="absolute inset-0 modal-overlay hidden flex items-center justify-center z-[52] pointer-events-auto">
        <div class="modal-content rounded-2xl p-6 w-5/6 max-w-sm flex flex-col items-center modal-enter text-center border-yellow-500/50 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-yellow-400 to-amber-500"></div>
            <div class="text-4xl mb-2 filter drop-shadow-[0_0_15px_rgba(234,179,8,0.5)]">🐫</div>
            <h2 class="text-2xl font-black text-yellow-400 mb-1">流浪商人</h2>
            <p class="text-slate-300 text-sm mb-4">「要來點好東西嗎？」<br>你的金幣: <span id="merchant-gold" class="text-yellow-300 font-bold font-mono text-lg ml-1 filter drop-shadow">0</span> G</p>
            <div id="merchant-items" class="w-full flex flex-col gap-3 mb-5 max-h-[45vh] overflow-y-auto custom-scrollbar px-1">
                <!-- Items injected here -->
            </div>
            <button id="btn-merchant-leave" class="bg-gradient-to-t from-slate-700 to-slate-600 hover:from-slate-600 hover:to-slate-500 py-3 rounded-xl font-bold shadow-lg text-white w-full active:scale-95 transition-all border border-slate-500/30">離開</button>
        </div>
    </div>

    <!-- General Message Modal -->
    <div id="message-modal" class="absolute inset-0 modal-overlay hidden flex items-center justify-center z-[53] pointer-events-auto">
        <div class="modal-content rounded-2xl p-6 w-5/6 max-w-sm flex flex-col items-center modal-enter border-blue-500/30">
            <h2 id="message-title" class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-300 to-indigo-300 mb-4 text-center">提示</h2>
            <p id="message-desc" class="text-slate-300 text-sm mb-6 text-center leading-relaxed">內容</p>
            <button id="btn-msg-close" class="bg-gradient-to-t from-blue-700 to-blue-500 hover:from-blue-600 hover:to-blue-400 py-2 px-8 rounded-xl font-bold shadow-lg text-white active:scale-95 transition-all w-full">確定</button>
        </div>
    </div>

    <!-- Teleport Confirm Modal -->
    <div id="teleport-modal" class="absolute inset-0 modal-overlay hidden flex items-center justify-center z-[54] pointer-events-auto">
        <div class="modal-content rounded-2xl p-6 w-5/6 max-w-sm flex flex-col items-center modal-enter text-center border-purple-500/50">
            <div class="text-5xl mb-4 filter drop-shadow-[0_0_15px_rgba(168,85,247,0.8)] animate-pulse">🌀</div>
            <h2 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-400 mb-2">發現傳送陣</h2>
            <p class="text-slate-300 text-sm mb-6 leading-relaxed">這座古老的法陣散發著魔力。<br>要進入傳送陣，前往更深的迷宮嗎？</p>
            <div class="grid grid-cols-2 gap-3 w-full">
                <button id="btn-tp-yes" class="bg-gradient-to-t from-purple-700 to-purple-500 hover:from-purple-600 hover:to-purple-400 py-3 rounded-xl font-bold shadow-[0_4px_15px_rgba(168,85,247,0.4)] text-white active:scale-95 transition-transform border border-purple-400/30">進入</button>
                <button id="btn-tp-no" class="bg-slate-700 hover:bg-slate-600 py-3 rounded-xl font-bold shadow-lg text-slate-200 active:scale-95 transition-transform border border-slate-500/30">留在這層</button>
            </div>
        </div>
    </div>
    
    <!-- Skill Selection Modal -->
    <div id="skill-modal" class="absolute inset-0 modal-overlay hidden flex items-center justify-center z-[60] pointer-events-auto">
        <div class="modal-content rounded-2xl p-6 w-5/6 max-w-sm flex flex-col items-center modal-enter border-blue-500/50">
            <h2 class="text-xl font-black text-blue-400 mb-4">選擇特技</h2>
            <div id="skill-list" class="w-full flex flex-col gap-2 mb-5 max-h-[50vh] overflow-y-auto custom-scrollbar px-1"></div>
            <button id="btn-skill-cancel" class="bg-slate-700 hover:bg-slate-600 py-3 rounded-xl font-bold shadow-lg text-white w-full active:scale-95 transition-all">取消</button>
        </div>
    </div>

    <!-- Combat Screen Overlay -->
    <div id="combat-screen" class="absolute inset-0 bg-slate-950/95 backdrop-blur-lg hidden flex-col z-[55] pointer-events-auto transition-opacity duration-300">
        <div class="p-3 bg-gradient-to-b from-slate-900 to-transparent text-center font-black text-xl tracking-widest text-red-500 shadow-md shrink-0 border-b border-red-900/30 relative">
            戰鬥階段
            <div class="absolute bottom-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-red-500 to-transparent"></div>
        </div>
        
        <div class="flex-1 flex flex-col justify-center gap-3 p-3 max-w-md mx-auto w-full min-h-0 overflow-y-auto custom-scrollbar">
            <div id="combat-monster" class="flex flex-col items-center bg-slate-900/80 border border-red-900/50 p-4 rounded-xl shadow-[0_0_20px_rgba(220,38,38,0.15)] relative backdrop-blur-sm transition-transform shrink-0">
                <div id="cb-m-name" class="text-lg text-red-400 font-bold mb-1 tracking-wide">魔物</div>
                <div id="cb-m-sym" class="text-5xl mb-3 filter drop-shadow-[0_0_15px_rgba(220,38,38,0.4)]">🐉</div>
                <div class="w-full bg-slate-950 rounded-full h-2.5 relative overflow-hidden border border-slate-700 shadow-inner">
                    <div id="cb-m-hpbar" class="absolute top-0 left-0 h-full bg-gradient-to-r from-red-600 to-orange-400 transition-all duration-300 w-full"></div>
                </div>
                <div id="cb-m-hp" class="text-[10px] mt-1.5 text-slate-400 font-mono font-bold tracking-wider">HP: 100/100</div>
            </div>
            
            <div class="text-center shrink-0 my-1">
                <span class="inline-block text-xl font-black text-transparent bg-clip-text bg-gradient-to-b from-slate-300 to-slate-600 italic px-4 py-0.5 rounded-full border border-slate-700/50 bg-slate-900/50 shadow-inner">VS</span>
            </div>
            
            <div id="combat-player" class="flex flex-col items-center bg-slate-900/80 border border-blue-900/50 p-4 rounded-xl shadow-[0_0_20px_rgba(59,130,246,0.15)] relative backdrop-blur-sm transition-transform shrink-0">
                <div class="text-lg text-blue-400 font-bold mb-1 tracking-wide">勇者</div>
                <div class="text-5xl mb-3 filter drop-shadow-[0_0_15px_rgba(59,130,246,0.4)]">🧑‍🌾</div>
                <div class="w-full bg-slate-950 rounded-full h-2.5 relative overflow-hidden border border-slate-700 shadow-inner">
                    <div id="cb-p-hpbar" class="absolute top-0 left-0 h-full bg-gradient-to-r from-blue-600 to-cyan-400 transition-all duration-300 w-full"></div>
                </div>
                <div id="cb-p-hp" class="text-[10px] mt-1.5 text-slate-400 font-mono font-bold tracking-wider">HP: 100/100</div>
            </div>
        </div>

        <div id="combat-log" class="h-28 bg-slate-950/80 border-t border-slate-800 p-2 overflow-y-auto text-[11px] font-mono custom-scrollbar flex flex-col shadow-inner shrink-0 text-center max-w-md mx-auto w-full relative">
            <div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-slate-500 to-transparent opacity-30"></div>
        </div>

        <div class="p-3 grid grid-cols-3 gap-2 bg-slate-900/90 border-t border-slate-800 pb-[max(1rem,env(safe-area-inset-bottom))] shrink-0 max-w-md mx-auto w-full backdrop-blur-md">
            <button id="btn-cb-attack" class="bg-gradient-to-b from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 py-2.5 rounded-xl font-bold text-[13px] shadow-[0_4px_10px_rgba(220,38,38,0.3)] text-white active:scale-95 transition-all border border-red-500/50">⚔️ 攻擊</button>
            <button id="btn-cb-skill" class="bg-gradient-to-b from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 py-2.5 rounded-xl font-bold text-[13px] shadow-[0_4px_10px_rgba(59,130,246,0.3)] text-white active:scale-95 transition-all border border-blue-500/50">✨ 特技</button>
            <button id="btn-cb-defend" class="bg-gradient-to-b from-green-600 to-green-700 hover:from-green-500 hover:to-green-600 py-2.5 rounded-xl font-bold text-[13px] shadow-[0_4px_10px_rgba(34,197,94,0.3)] text-white active:scale-95 transition-all border border-green-500/50">🛡️ 防禦</button>
            <button id="btn-cb-dodge" class="bg-gradient-to-b from-yellow-600 to-yellow-700 hover:from-yellow-500 hover:to-yellow-600 py-2.5 rounded-xl font-bold text-[13px] shadow-[0_4px_10px_rgba(234,179,8,0.3)] text-white active:scale-95 transition-all border border-yellow-500/50">💨 閃避</button>
            <button id="btn-cb-counter" class="bg-gradient-to-b from-purple-600 to-purple-700 hover:from-purple-500 hover:to-purple-600 py-2.5 rounded-xl font-bold text-[13px] shadow-[0_4px_10px_rgba(168,85,247,0.3)] text-white active:scale-95 transition-all border border-purple-500/50">🔄 反擊</button>
            <button id="btn-cb-flee" class="bg-gradient-to-b from-slate-600 to-slate-700 hover:from-slate-500 hover:to-slate-600 py-2.5 rounded-xl font-bold text-[13px] shadow-[0_4px_10px_rgba(100,116,139,0.3)] text-white active:scale-95 transition-all border border-slate-500/50">🏃 撤退</button>
        </div>
    </div>

    <!-- Game Over / Victory Modal -->
    <div id="endgame-modal" class="absolute inset-0 bg-slate-950/95 backdrop-blur-lg hidden flex items-center justify-center z-[70] pointer-events-auto">
        <div class="modal-content border border-slate-600 rounded-3xl p-8 w-11/12 max-w-sm flex flex-col items-center shadow-[0_0_50px_rgba(0,0,0,0.8)] modal-enter relative overflow-hidden" id="endgame-card">
            <h1 id="end-title" class="text-5xl font-black mb-4 text-center text-transparent bg-clip-text filter drop-shadow-lg"></h1>
            <div id="end-rank" class="text-lg text-slate-300 mb-6 font-bold tracking-widest bg-slate-800/80 px-5 py-2 rounded-full border border-slate-600/50 shadow-inner"></div>
            
            <div class="bg-slate-900/80 w-full p-5 rounded-2xl border border-slate-700/50 shadow-inner mb-8 text-sm flex flex-col gap-3 relative z-10">
                <div class="flex justify-between items-center border-b border-slate-800/80 pb-2"><span class="text-slate-400 font-bold">存活回合</span> <span id="end-turns" class="text-yellow-400 font-mono font-bold text-lg filter drop-shadow">0</span></div>
                <div class="flex justify-between items-center border-b border-slate-800/80 pb-2"><span class="text-slate-400 font-bold">擊敗魔物</span> <span id="end-kills" class="text-red-400 font-mono font-bold text-lg filter drop-shadow">0</span></div>
                <div class="flex justify-between items-center"><span class="text-slate-400 font-bold">最終狀態</span> <span id="end-level" class="text-purple-400 font-bold tracking-wide">1</span></div>
            </div>

            <button id="btn-restart" class="w-full py-4 rounded-xl font-black text-lg shadow-2xl transition-all hover:scale-105 active:scale-95 border relative z-10 tracking-widest"></button>
        </div>
    </div>
</div>

<script>
// --- 行動裝置防止縮放防呆 ---
document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
let lastTouchEnd = 0;
document.addEventListener('touchend', function(event) {
    const now = (new Date()).getTime();
    if (now - lastTouchEnd <= 300 && event.target.tagName !== 'BUTTON') {
        event.preventDefault();
    }
    lastTouchEnd = now;
}, { passive: false });

const CONFIG = {
    TILE_SIZE: 45, // Slightly larger tiles for better tap targets
    MAZE_WIDTH: 21,
    MAZE_HEIGHT: 21,
    NUM_MAZES: 5,
    ANIMATION_SPEED: 0.15,
};

class Entity {
    constructor(x, y, mazeIndex, isPlayer = false) {
        this.x = x; this.y = y; this.visualX = x; this.visualY = y;
        this.mazeIndex = mazeIndex; this.isPlayer = isPlayer;
        this.alive = true; this.maxHp = 100; this.hp = 100; this.atk = 10; this.def = 5;
        this.gold = 0; this.kills = 0;
        this.skills = []; this.cooldowns = {};
    }
    takeDamage(amount, source, ignoreDef = false) {
        let dmg = ignoreDef ? amount : Math.max(1, amount - this.def);
        this.hp -= dmg;
        Game.addFloatingText(this.visualX * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2, this.visualY * CONFIG.TILE_SIZE, `-${dmg}`, '#ef4444');
        if (this.hp <= 0) { this.hp = 0; this.die(source); }
        return dmg;
    }
    heal(amount) { 
        let actualHeal = Math.min(this.maxHp - this.hp, amount);
        if(actualHeal > 0) {
            this.hp += actualHeal;
            Game.addFloatingText(this.visualX * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2, this.visualY * CONFIG.TILE_SIZE, `+${actualHeal}`, '#22c55e');
        }
    }
    die(killer) {
        this.alive = false;
        if (this.isPlayer) Game.handlePlayerDeath();
        else if (killer && killer.isPlayer) {
            killer.kills++;
            killer.maxHp += 10; killer.heal(10);
            killer.atk += 2; killer.def += 1;
            killer.gold += this.gold + 50;
            logMsg(`擊敗了 ${this.name}! 能力提升！獲得金幣。`);
        }
    }
    updateAnimation(dt) {
        if (!this.alive) return;
        const dx = this.x - this.visualX, dy = this.y - this.visualY;
        const speed = (dt / 16.66) * CONFIG.ANIMATION_SPEED;
        if (Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01) {
            this.visualX += dx * speed;
            this.visualY += dy * speed;
            // Prevent overshoot
            if(Math.abs(this.x - this.visualX) < speed) this.visualX = this.x;
            if(Math.abs(this.y - this.visualY) < speed) this.visualY = this.y;
        } else {
            this.visualX = this.x; this.visualY = this.y;
        }
    }
}

class Monster extends Entity {
    constructor(x, y, mazeIndex, template) {
        super(x, y, mazeIndex);
        this.id = template.id; this.name = template.name; this.symbol = template.symbol;
        this.behavior = template.behavior; this.skill = template.skill;
        this.template = template; this.hasScaled = false; this.cooldown = 0;
        this.gold = Math.floor(Math.random() * 20) + 10;
    }
    takeTurn() {
        if (!this.alive) return;
        const dirs = [[0,-1], [0,1], [-1,0], [1,0]];
        const maze = State.mazes[this.mazeIndex];
        const p = State.player;
        
        let validMoves = dirs.map(d => ({nx: this.x + d[0], ny: this.y + d[1]}))
                             .filter(pos => pos.nx >= 0 && pos.nx < maze[0].length && pos.ny >= 0 && pos.ny < maze.length && maze[pos.ny][pos.nx] !== TILE_TYPES.WALL);
        
        if (validMoves.length > 0) {
            let chosenMove = validMoves[Math.floor(Math.random() * validMoves.length)];
            if (p.mazeIndex === this.mazeIndex && p.alive) {
                let dx = p.x - this.x, dy = p.y - this.y;
                let dist = Math.abs(dx) + Math.abs(dy);
                
                if (dist < 10) {
                    let idealDx = dx === 0 ? 0 : (dx > 0 ? 1 : -1);
                    let idealDy = dy === 0 ? 0 : (dy > 0 ? 1 : -1);
                    
                    if (['defensive', 'mimic'].includes(this.behavior)) {
                        chosenMove = {nx: this.x, ny: this.y};
                    } else if (['aggressive', 'hunter', 'boss'].includes(this.behavior)) {
                        let chase = validMoves.filter(m => (m.nx - this.x === idealDx && idealDx !== 0) || (m.ny - this.y === idealDy && idealDy !== 0));
                        if (chase.length > 0) chosenMove = chase[Math.floor(Math.random() * chase.length)];
                    } else if (['smart', 'charming', 'greedy', 'coward'].includes(this.behavior)) {
                        if (p.hp > this.hp || p.atk > this.atk || this.behavior === 'coward') {
                            let flee = validMoves.filter(m => (m.nx - this.x === -idealDx && idealDx !== 0) || (m.ny - this.y === -idealDy && idealDy !== 0));
                            if (flee.length > 0) chosenMove = flee[Math.floor(Math.random() * flee.length)];
                        } else {
                            let chase = validMoves.filter(m => (m.nx - this.x === idealDx && idealDx !== 0) || (m.ny - this.y === idealDy && idealDy !== 0));
                            if (chase.length > 0) chosenMove = chase[Math.floor(Math.random() * chase.length)];
                        }
                    }
                }
            }
            this.x = chosenMove.nx; this.y = chosenMove.ny;
            // Monster hitting teleporter logic
            if (maze[this.y][this.x] === TILE_TYPES.TELEPORT) {
                const nextMaze = (this.mazeIndex + 1) % CONFIG.NUM_MAZES;
                this.mazeIndex = nextMaze;
                const startPos = findTile(nextMaze, TILE_TYPES.TELEPORT) || findTile(nextMaze, TILE_TYPES.START);
                if(startPos) { this.x = startPos.x; this.y = startPos.y; this.visualX = this.x; this.visualY = this.y; }
            }
        }
    }
}

function generateMaze(width, height) {
    let maze = Array.from({length: height}, () => Array(width).fill(TILE_TYPES.WALL));
    let startX = 1, startY = 1; maze[startY][startX] = TILE_TYPES.START;
    let stack = [{x: startX, y: startY}];
    const dirs = [[0, -2], [0, 2], [-2, 0], [2, 0]];
    
    // Recursive Backtracking
    while(stack.length > 0) {
        let curr = stack[stack.length - 1];
        let unvisited = dirs.map(d => ({x: curr.x + d[0], y: curr.y + d[1], dx: d[0], dy: d[1]}))
                            .filter(n => n.x > 0 && n.x < width - 1 && n.y > 0 && n.y < height - 1 && maze[n.y][n.x] === TILE_TYPES.WALL)
                            .sort(() => Math.random() - 0.5);
        if (unvisited.length > 0) {
            let next = unvisited[0];
            maze[curr.y + next.dy/2][curr.x + next.dx/2] = TILE_TYPES.PATH;
            maze[next.y][next.x] = TILE_TYPES.PATH;
            stack.push({x: next.x, y: next.y});
        } else stack.pop();
    }
    
    // Add some loops
    for(let y=1; y<height-1; y+=2) {
        for(let x=1; x<width-1; x+=2) {
            if (Math.random() < 0.2 && maze[y][x] === TILE_TYPES.PATH) {
                let neighbors = [[0,-1],[0,1],[-1,0],[1,0]];
                let n = neighbors[Math.floor(Math.random()*neighbors.length)];
                if (y+n[1] > 0 && y+n[1] < height-1 && x+n[0] > 0 && x+n[0] < width-1) maze[y+n[1]][x+n[0]] = TILE_TYPES.PATH;
            }
        }
    }
    
    // Place Teleport
    let placedTeleport = false;
    while(!placedTeleport) {
        let tx = Math.floor(Math.random() * Math.floor(width / 2)) * 2 + 1;
        let ty = Math.floor(Math.random() * Math.floor(height / 2)) * 2 + 1;
        if (maze[ty][tx] === TILE_TYPES.PATH && (tx !== startX || ty !== startY)) {
            maze[ty][tx] = TILE_TYPES.TELEPORT; placedTeleport = true;
        }
    }
    return maze;
}

function findTile(mazeIndex, type) {
    const m = State.mazes[mazeIndex];
    for(let y=0; y<m.length; y++){
        for(let x=0; x<m[y].length; x++){
            if(m[y][x] === type) return {x, y};
        }
    }
    return null;
}

const Game = {
    canvas: null, ctx: null, lastTime: 0, stepsRemaining: 0, lastMove: { dx: 0, dy: 0 },
    canvasW: 0, canvasH: 0,
    
    saveGameState() {
        try {
            const saveData = {
                loop: State.loop, turn: State.turn, mazes: State.mazes, logs: State.logs, stepsRemaining: this.stepsRemaining, lastMove: this.lastMove,
                entities: State.entities.map(e => ({...e, type: e.isPlayer ? 'player' : 'monster'}))
            };
            localStorage.setItem('dungeon_save', JSON.stringify(saveData));
        } catch(e) { console.error("Save failed", e); }
    },
    
    loadGameState() {
        try {
            const data = localStorage.getItem('dungeon_save');
            if(!data) return false;
            const parsed = JSON.parse(data);
            if(parsed.entities.find(e => e.type === 'player' && e.hp <= 0)) return false;
            State.loop = parsed.loop; State.turn = parsed.turn; State.mazes = parsed.mazes; State.logs = parsed.logs || [];
            this.stepsRemaining = parsed.stepsRemaining || 0;
            this.lastMove = parsed.lastMove || { dx: 0, dy: 0 };
            State.entities = parsed.entities.map(eData => {
                let e = eData.type === 'player' ? new Entity(eData.x, eData.y, eData.mazeIndex, true) : new Monster(eData.x, eData.y, eData.mazeIndex, MONSTER_TEMPLATES.find(t => t.id === eData.id) || MONSTER_TEMPLATES[0]);
                Object.assign(e, eData);
                return e;
            });
            State.player = State.entities.find(e => e.isPlayer);
            return true;
        } catch(e) { return false; }
    },
    
    init() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        window.addEventListener('resize', this.resize.bind(this)); this.resize();
        this.setupUI();
        if (this.loadGameState()) {
            logMsg("載入上次儲存的遊戲進度...");
            this.updateUI();
            if(this.stepsRemaining > 0) this.setMovementPhase(true);
            requestAnimationFrame(this.render.bind(this));
        } else this.startLoop(State.loop > 1);
    },

    resize() {
        const container = document.getElementById('canvas-container');
        const dpr = window.devicePixelRatio || 1;
        this.canvasW = container.clientWidth;
        this.canvasH = container.clientHeight;
        this.canvas.width = this.canvasW * dpr;
        this.canvas.height = this.canvasH * dpr;
        this.ctx.scale(dpr, dpr);
        this.canvas.style.width = `${this.canvasW}px`;
        this.canvas.style.height = `${this.canvasH}px`;
    },

    startLoop(keepStats = false) {
        document.getElementById('endgame-modal').classList.add('hidden');
        document.getElementById('encounter-modal').classList.add('hidden');
        document.getElementById('message-modal').classList.add('hidden');
        document.getElementById('combat-screen').classList.add('hidden');
        document.getElementById('combat-screen').classList.remove('flex');
        
        let oldStats = null;
        if (keepStats && State.player) {
            oldStats = { maxHp: State.player.maxHp, hp: State.player.maxHp, atk: State.player.atk, def: State.player.def, gold: State.player.gold, kills: State.player.kills, skills: State.player.skills, cooldowns: {} };
        }
        
        State.turn = 0; State.mazes = []; State.entities = []; State.logs = []; State.floatingTexts = []; this.stepsRemaining = 0; this.lastMove = { dx: 0, dy: 0 };
        logMsg(`--- 第 ${State.loop} 輪迴開始 ---`);
        
        for(let i=0; i<CONFIG.NUM_MAZES; i++) State.mazes.push(generateMaze(CONFIG.MAZE_WIDTH, CONFIG.MAZE_HEIGHT));
        
        let startPos = findTile(0, TILE_TYPES.START);
        State.player = new Entity(startPos.x, startPos.y, 0, true);
        State.player.name = "勇者";
        if (oldStats) Object.assign(State.player, oldStats);
        State.entities.push(State.player);

        let availableMonsters = [...MONSTER_TEMPLATES].sort(() => Math.random() - 0.5);
        for(let i=0; i<12; i++) {
            let mIndex = i % CONFIG.NUM_MAZES;
            let placed = false;
            while(!placed) {
                let rx = Math.floor(Math.random() * CONFIG.MAZE_WIDTH), ry = Math.floor(Math.random() * CONFIG.MAZE_HEIGHT);
                if (State.mazes[mIndex][ry][rx] !== TILE_TYPES.WALL) {
                    State.entities.push(new Monster(rx, ry, mIndex, availableMonsters[i])); placed = true;
                }
            }
        }
        this.updateUI(); this.saveGameState();
        this.lastTime = 0; // reset for smooth animation start
        requestAnimationFrame(this.render.bind(this));
    },

    setupUI() {
        const checkModalOpen = () => !document.getElementById('encounter-modal').classList.contains('hidden') || !document.getElementById('message-modal').classList.contains('hidden') || !document.getElementById('combat-screen').classList.contains('hidden') || !document.getElementById('endgame-modal').classList.contains('hidden') || !document.getElementById('merchant-modal').classList.contains('hidden') || !document.getElementById('skill-modal').classList.contains('hidden') || !document.getElementById('teleport-modal').classList.contains('hidden');

        this.canvas.addEventListener('pointerdown', (e) => {
            if (this.stepsRemaining <= 0 || checkModalOpen()) return;
            const rect = this.canvas.getBoundingClientRect();
            // Map click to logic coordinates
            const worldX = e.clientX - rect.left + State.camera.x;
            const worldY = e.clientY - rect.top + State.camera.y;
            const gridX = Math.floor(worldX / CONFIG.TILE_SIZE), gridY = Math.floor(worldY / CONFIG.TILE_SIZE);
            const move = this.getValidMoves().find(m => m.x === gridX && m.y === gridY);
            if (move) this.movePlayer(move.dx, move.dy);
        });

        document.getElementById('btn-roll').addEventListener('click', () => {
            if (this.stepsRemaining > 0 || State.player.hp <= 0 || checkModalOpen()) return;
            const btn = document.getElementById('btn-roll');
            if (btn.classList.contains('rolling')) return; 
            btn.classList.add('rolling');
            setTimeout(() => {
                this.stepsRemaining = Math.floor(Math.random() * 6) + 1;
                btn.classList.remove('rolling');
                this.setMovementPhase(true);
            }, 500);
        });

        window.addEventListener('keydown', (e) => {
            if (this.stepsRemaining <= 0 || checkModalOpen()) return;
            let dx = 0, dy = 0; const key = e.key.toLowerCase();
            if (key === 'arrowup' || key === 'w') dy = -1;
            else if (key === 'arrowdown' || key === 's') dy = 1;
            else if (key === 'arrowleft' || key === 'a') dx = -1;
            else if (key === 'arrowright' || key === 'd') dx = 1;
            else return;
            const move = this.getValidMoves().find(m => m.dx === dx && m.dy === dy);
            if (move) this.movePlayer(dx, dy);
        });

        // Event Listeners for UI Modals
        document.getElementById('btn-fight').addEventListener('click', () => this.resolveEncounter('fight'));
        document.getElementById('btn-flee-encounter').addEventListener('click', () => this.resolveEncounter('flee'));
        
        document.getElementById('btn-cb-attack').addEventListener('click', () => this.executeCombatTurn('attack'));
        document.getElementById('btn-cb-skill').addEventListener('click', () => this.openSkillModal());
        document.getElementById('btn-cb-defend').addEventListener('click', () => this.executeCombatTurn('defend'));
        document.getElementById('btn-cb-dodge').addEventListener('click', () => this.executeCombatTurn('dodge'));
        document.getElementById('btn-cb-counter').addEventListener('click', () => this.executeCombatTurn('counter'));
        document.getElementById('btn-cb-flee').addEventListener('click', () => this.executeCombatTurn('flee'));
        
        document.getElementById('btn-skill-cancel').addEventListener('click', () => document.getElementById('skill-modal').classList.add('hidden'));
        document.getElementById('btn-merchant-leave').addEventListener('click', () => {
            document.getElementById('merchant-modal').classList.add('hidden');
            this.processWorldTurn();
        });
        document.getElementById('btn-msg-close').addEventListener('click', () => document.getElementById('message-modal').classList.add('hidden'));
        
        document.getElementById('btn-restart').addEventListener('click', () => {
            document.getElementById('endgame-modal').classList.add('hidden');
            State.loop = document.getElementById('btn-restart').innerText.includes('下一輪迴') ? State.loop + 1 : 1;
            this.startLoop(State.loop > 1);
        });

        document.getElementById('btn-tp-yes').addEventListener('click', () => {
            document.getElementById('teleport-modal').classList.add('hidden');
            this.executeTeleport();
        });

        document.getElementById('btn-tp-no').addEventListener('click', () => {
            document.getElementById('teleport-modal').classList.add('hidden');
            logMsg("決定留在這層迷宮繼續探索。");
            this.processTileEvent(); this.processWorldTurn();
        });
    },

    getValidMoves() {
        const p = State.player, maze = State.mazes[p.mazeIndex], dirs = [[0,-1], [0,1], [-1,0], [1,0]];
        let valid = [];
        for (let d of dirs) {
            let nx = p.x + d[0], ny = p.y + d[1];
            let isBacktrack = (d[0] === -this.lastMove.dx && d[1] === -this.lastMove.dy) && (this.lastMove.dx !== 0 || this.lastMove.dy !== 0);
            if (nx >= 0 && nx < CONFIG.MAZE_WIDTH && ny >= 0 && ny < CONFIG.MAZE_HEIGHT && maze[ny][nx] !== TILE_TYPES.WALL) {
                if (!isBacktrack) valid.push({x: nx, y: ny, dx: d[0], dy: d[1]});
            }
        }
        if (valid.length === 0) {
            this.lastMove = { dx: 0, dy: 0 }; // 解除回頭限制
            return this.getValidMoves();
        }
        return valid;
    },

    setMovementPhase(isMoving) {
        const btn = document.getElementById('btn-roll'), icon = document.getElementById('dice-icon'), text = document.getElementById('dice-result');
        if (isMoving) {
            btn.className = "pointer-events-auto bg-gradient-to-t from-yellow-600 to-yellow-500 text-white font-bold py-3 px-8 rounded-full shadow-[0_4px_15px_rgba(234,179,8,0.5)] border border-yellow-400/50 flex items-center justify-center gap-3 w-full max-w-sm mx-auto animate-pulse";
            icon.innerText = '👣'; text.innerText = `點擊發亮處 (剩 ${this.stepsRemaining} 步)`;
        } else {
            btn.className = "pointer-events-auto bg-gradient-to-t from-indigo-600 to-blue-500 hover:from-indigo-500 hover:to-blue-400 active:scale-95 text-white font-bold py-3 px-8 rounded-full shadow-[0_4px_20px_rgba(59,130,246,0.5)] border border-blue-400/50 flex items-center justify-center gap-3 w-full max-w-sm mx-auto transition-all group";
            icon.innerText = '🎲'; icon.className = "text-2xl group-hover:rotate-12 transition-transform"; text.innerText = '擲骰移動';
            this.lastMove = { dx: 0, dy: 0 };
        }
    },

    movePlayer(dx, dy) {
        const p = State.player; p.x += dx; p.y += dy; this.stepsRemaining--;
        this.lastMove = { dx, dy };
        p.heal(1); this.updateUI();
        
        const maze = State.mazes[p.mazeIndex];
        if (maze[p.y][p.x] === TILE_TYPES.TELEPORT) {
            this.stepsRemaining = 0; 
            this.setMovementPhase(false);
            this.promptTeleport(); 
            return;
        }
        
        let encounter = this.checkEntityCollision();
        if (encounter) { this.stepsRemaining = 0; this.triggerEncounter(encounter); this.setMovementPhase(false); }
        else if (this.stepsRemaining === 0) { this.setMovementPhase(false); this.processTileEvent(); }
        else document.getElementById('dice-result').innerText = `點擊發亮處 (剩 ${this.stepsRemaining} 步)`;
    },

    processTileEvent() {
        const p = State.player;
        let r = Math.random();
        
        if (r < 0.25) { 
            const ev = EVENTS.GOOD[Math.floor(Math.random() * EVENTS.GOOD.length)];
            ev.effect(p); this.showMessage(ev.name, ev.desc); 
            logMsg(`遭遇事件: ${ev.name}`);
        } else if (r < 0.33) { 
            const ev = EVENTS.BAD[Math.floor(Math.random() * EVENTS.BAD.length)];
            ev.effect(p); this.showMessage(ev.name, ev.desc); 
            logMsg(`遭遇事件: ${ev.name}`);
        } else if (r < 0.41) { 
            this.openMerchant(); return; 
        }
        this.updateUI(); this.processWorldTurn();
    },
    
    openMerchant() {
        const SHOP_ITEMS = [
            { name: "鐵劍", type: "atk", val: 5, cost: 40 }, { name: "鋼鐵大劍", type: "atk", val: 12, cost: 100 }, { name: "王者之劍", type: "atk", val: 25, cost: 250 },
            { name: "皮甲", type: "def", val: 3, cost: 40 }, { name: "秘銀鎧甲", type: "def", val: 10, cost: 120 }, { name: "神聖之盾", type: "def", val: 20, cost: 220 },
            { name: "生命護符", type: "maxHp", val: 20, cost: 60 }, { name: "巨人之心", type: "maxHp", val: 50, cost: 150 },
            { name: "初級藥水", type: "heal", val: 30, cost: 20 }, { name: "精靈靈藥", type: "heal", val: 100, cost: 70 }
        ];
        const p = State.player;
        document.getElementById('merchant-gold').innerText = p.gold;
        const container = document.getElementById('merchant-items'); container.innerHTML = '';
        let available = [...SHOP_ITEMS].sort(() => Math.random() - 0.5).slice(0, 3);
        
        available.forEach(baseItem => {
            let item = { ...baseItem }, rand = Math.random(), tag = "", nameColor = "text-slate-200";
            if (rand < 0.05) { item.cost = 0; item.val = Math.max(1, Math.floor(item.val * 0.3)); item.name = `破舊的 ${item.name}`; tag = "<span class='bg-green-600 text-[9px] py-0.5 px-1.5 rounded ml-2 shadow uppercase tracking-widest'>FREE</span>"; nameColor = "text-slate-400"; }
            else if (rand < 0.35) { item.cost = Math.max(1, Math.floor(item.cost * 0.5)); item.val = Math.max(1, Math.floor(item.val * 0.6)); item.name = `中古的 ${item.name}`; tag = "<span class='bg-red-600 text-[9px] py-0.5 px-1.5 rounded ml-2 shadow uppercase tracking-widest'>SALE</span>"; nameColor = "text-yellow-200"; }

            let desc = item.type === 'atk' ? `攻擊力 +${item.val}` : (item.type === 'def' ? `防禦力 +${item.val}` : (item.type === 'maxHp' ? `最大生命 +${item.val}` : `恢復生命 ${item.val}`));
            const btn = document.createElement('button');
            let borderColor = item.cost === 0 ? 'border-green-500/50' : (item.cost < baseItem.cost ? 'border-red-500/50' : 'border-slate-600/50');
            btn.className = `w-full bg-slate-900/80 border ${borderColor} p-4 rounded-xl flex justify-between items-center hover:bg-slate-800 transition-colors shadow-md active:scale-95`;
            btn.innerHTML = `<div class="text-left"><div class="font-bold text-sm ${nameColor}">${item.name} ${tag}</div><div class="text-[11px] text-slate-400 mt-1">${desc}</div></div><div class="font-black font-mono text-lg flex items-center gap-1 ${item.cost === 0 ? 'text-green-400' : 'text-yellow-400'} filter drop-shadow">${item.cost} <span class="text-xs">G</span></div>`;
            btn.onclick = () => {
                if (p.gold >= item.cost) {
                    p.gold -= item.cost;
                    if (item.type === 'atk') p.atk += item.val;
                    if (item.type === 'def') p.def += item.val;
                    if (item.type === 'maxHp') { p.maxHp += item.val; p.heal(item.val); }
                    if (item.type === 'heal') p.heal(item.val);
                    logMsg(`購買了 ${item.name}！ (花費 ${item.cost}G)`);
                    document.getElementById('merchant-modal').classList.add('hidden');
                    this.updateUI(); this.processWorldTurn();
                } else logMsg(`金幣不足，無法購買！`);
            };
            container.appendChild(btn);
        });
        document.getElementById('merchant-modal').classList.remove('hidden');
    },

    processWorldTurn() {
        State.turn++;
        State.entities.forEach(e => {
            if (!e.isPlayer && e.alive) { e.takeTurn(); e.heal(1); }
        });
        if (State.turn % 20 === 0) {
            State.player.maxHp += 5; State.player.atk += 1; logMsg("在迷宮中探索，適應了環境，能力提升。");
            State.entities.forEach(e => { if (!e.isPlayer && e.alive) { e.maxHp += 5; e.hp += 5; e.atk += 1; } });
            logMsg("迷宮深處的氣息變濃，魔物變強了。");
        }
        let encounter = this.checkEntityCollision();
        if (encounter && document.getElementById('encounter-modal').classList.contains('hidden')) this.triggerEncounter(encounter);
        else this.saveGameState(); 
        this.updateUI(); this.checkWinCondition();
    },

    executeTeleport() {
        const p = State.player;
        const nextMaze = (p.mazeIndex + 1) % CONFIG.NUM_MAZES;
        p.mazeIndex = nextMaze;
        const startPos = findTile(nextMaze, TILE_TYPES.START);
        
        if (startPos) {
            p.x = startPos.x; 
            p.y = startPos.y;
            p.visualX = p.x; 
            p.visualY = p.y;
            this.showMessage("傳送陣", `穿越古老魔法陣，來到了迷宮第 ${nextMaze + 1} 層！`);
            logMsg(`進入傳送陣，來到第 ${nextMaze + 1} 層！`);
            this.updateUI();
            this.processWorldTurn(); 
        }
    },

    checkEntityCollision() {
        const p = State.player;
        return State.entities.find(e => !e.isPlayer && e.alive && e.mazeIndex === p.mazeIndex && e.x === p.x && e.y === p.y);
    },

    triggerEncounter(monster) {
        State.currentEncounter = monster;
        if (!monster.hasScaled) {
            const p = State.player, scale = 1 + (State.loop - 1) * 0.35 + (State.turn * 0.005), variance = () => 0.85 + Math.random() * 0.3;
            monster.maxHp = Math.max(20, Math.floor(p.maxHp * monster.template.hpRatio * scale * variance())); monster.hp = monster.maxHp; 
            monster.atk = Math.max(2, Math.floor(p.atk * monster.template.atkRatio * scale * variance()));
            monster.def = Math.max(0, Math.floor(p.def * monster.template.defRatio * scale * variance()));
            monster.hasScaled = true;
        }
        document.getElementById('encounter-name').innerText = `${monster.symbol} ${monster.name}`;
        document.getElementById('encounter-hp').innerText = Math.floor(monster.hp);
        document.getElementById('encounter-atk').innerText = monster.atk;
        document.getElementById('encounter-def').innerText = monster.def;
        document.getElementById('encounter-desc').innerHTML = `${monster.template.desc}<br><br><span class="text-blue-300">特技: ${SKILLS[monster.skill].name}</span> | <span class="text-yellow-400">弱點: ${SKILLS[monster.template.weakness].name}</span>`;
        document.getElementById('encounter-modal').classList.remove('hidden');
    },

    resolveEncounter(action) {
        const p = State.player, m = State.currentEncounter;
        if (!m || !m.alive) return;
        let modal = document.getElementById('encounter-modal');
        if (action === 'fight') { this.startCombat(); modal.classList.add('hidden'); }
        else if (action === 'flee') {
            if (Math.random() < 0.7) { logMsg("逃跑成功！"); this.bounceEntity(p); modal.classList.add('hidden'); State.currentEncounter = null; this.saveGameState(); }
            else { logMsg("逃跑失敗，被迫應戰！"); this.startCombat(); modal.classList.add('hidden'); }
        }
        this.updateUI();
    },

    startCombat() {
        const screen = document.getElementById('combat-screen'), m = State.currentEncounter;
        screen.classList.remove('hidden'); screen.classList.add('flex');
        document.getElementById('cb-m-name').innerText = m.name; document.getElementById('cb-m-sym').innerText = m.symbol;
        this.updateCombatUI(); document.getElementById('combat-log').innerHTML = '<div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-slate-500 to-transparent opacity-30"></div>';
        this.logCombat(`遭遇了 ${m.name}！戰鬥開始！`, 'text-yellow-400 font-bold');
    },

    updateCombatUI() {
        const p = State.player, m = State.currentEncounter;
        document.getElementById('cb-p-hp').innerText = `HP: ${Math.floor(p.hp)}/${p.maxHp}`;
        document.getElementById('cb-p-hpbar').style.width = `${Math.max(0, (p.hp/p.maxHp)*100)}%`;
        if (m) {
            document.getElementById('cb-m-hp').innerText = `HP: ${Math.floor(m.hp)}/${m.maxHp}`;
            document.getElementById('cb-m-hpbar').style.width = `${Math.max(0, (m.hp/m.maxHp)*100)}%`;
        }
    },

    logCombat(msg, colorClass = 'text-slate-300') {
        const logWindow = document.getElementById('combat-log'), entry = document.createElement('div');
        entry.className = `mb-1 ${colorClass} animate-fade-in relative z-10`; entry.innerText = msg;
        logWindow.appendChild(entry); logWindow.scrollTop = logWindow.scrollHeight;
    },
    
    spawnCombatFloatingText(elementId, text, colorClass) {
        const el = document.getElementById(elementId);
        if(!el) return;
        const floatEl = document.createElement('div');
        floatEl.className = `absolute text-2xl font-black ${colorClass} pointer-events-none drop-shadow-lg z-20 whitespace-nowrap`;
        floatEl.innerText = text;
        const offsetX = (Math.random() - 0.5) * 60;
        const offsetY = -20 + (Math.random() - 0.5) * 30;
        floatEl.style.left = `calc(50% + ${offsetX}px)`;
        floatEl.style.top = `calc(50% + ${offsetY}px)`;
        floatEl.style.transform = 'translate(-50%, -50%)';
        floatEl.style.transition = 'all 1s ease-out';
        floatEl.style.opacity = '1';
        el.appendChild(floatEl);
        
        setTimeout(() => { floatEl.style.top = `calc(50% + ${offsetY - 60}px)`; floatEl.style.opacity = '0'; }, 50);
        setTimeout(() => { if(el.contains(floatEl)) el.removeChild(floatEl); }, 1050);
    },

    toggleCombatButtons(enabled) {
        ['btn-cb-attack', 'btn-cb-skill', 'btn-cb-defend', 'btn-cb-dodge', 'btn-cb-counter', 'btn-cb-flee'].forEach(id => {
            const btn = document.getElementById(id);
            btn.disabled = !enabled;
            if(!enabled) btn.classList.add('opacity-50'); else btn.classList.remove('opacity-50');
        });
    },

    openSkillModal() {
        const p = State.player, container = document.getElementById('skill-list'); container.innerHTML = '';
        if (p.skills.length === 0) container.innerHTML = '<div class="text-slate-400 text-center py-6">尚未學會任何特技<br><span class="text-[10px] mt-2 block opacity-70">擊敗魔物以學習特技</span></div>';
        else {
            p.skills.forEach(skillId => {
                const sk = SKILLS[skillId], cd = p.cooldowns[skillId] || 0, btn = document.createElement('button');
                btn.className = `w-full p-4 rounded-xl flex justify-between items-center mb-3 shadow-md border ${cd > 0 ? 'bg-slate-800 border-slate-700 opacity-50 cursor-not-allowed' : 'bg-slate-900 border-blue-500/50 hover:bg-slate-800 active:scale-95 transition-colors'}`;
                btn.innerHTML = `<div class="text-left"><div class="font-bold text-blue-300 text-sm mb-1">${sk.name}</div><div class="text-[10px] text-slate-400">倍率: ${sk.mult} ${sk.ignoreDef?'<span class="ml-1 text-purple-400">無視防禦</span>':''} ${sk.healRate>0?'<span class="ml-1 text-green-400">吸血</span>':''}</div></div><div class="text-xs font-mono font-bold ${cd>0?'text-red-400':'text-green-400'}">${cd > 0 ? `CD: ${cd}` : '可使用'}</div>`;
                if (cd <= 0) btn.onclick = () => { document.getElementById('skill-modal').classList.add('hidden'); this.executeCombatTurn('skill', skillId); };
                container.appendChild(btn);
            });
        }
        document.getElementById('skill-modal').classList.remove('hidden');
    },

    executeCombatTurn(action, skillId = null) {
        const p = State.player, m = State.currentEncounter;
        if (!m || !m.alive || !p.alive) return;
        this.toggleCombatButtons(false);

        let mAction = 'attack', mSkillDef = SKILLS[m.skill], rand = Math.random();
        if (m.behavior === 'coward' && rand < 0.6) mAction = 'flee';
        else if (m.hp < m.maxHp * 0.3 && rand < 0.25 && !['boss', 'mimic'].includes(m.behavior)) mAction = 'flee';
        else if (m.cooldown <= 0 && rand < 0.45) { mAction = 'skill'; m.cooldown = mSkillDef.cd + 1; }
        else {
            let r = Math.random();
            if (['defensive', 'mimic'].includes(m.behavior)) { if (r < 0.35) mAction = 'defend'; else if (r < 0.65) mAction = 'counter'; else if (r < 0.75) mAction = 'dodge'; else mAction = 'attack'; }
            else if (['smart', 'charming', 'greedy', 'coward'].includes(m.behavior)) { if (r < 0.35) mAction = 'dodge'; else if (r < 0.55) mAction = 'defend'; else if (r < 0.70) mAction = 'counter'; else mAction = 'attack'; }
            else { if (r < 0.15) mAction = 'defend'; else if (r < 0.30) mAction = 'dodge'; else if (r < 0.40) mAction = 'counter'; else mAction = 'attack'; }
        }

        let pDefMult = 1, pEvade = false, pCounter = false, msgP = "";
        if (action === 'defend') { pDefMult = 0.3; msgP = "勇者採取了防禦姿勢。"; }
        if (action === 'dodge') { pEvade = Math.random() < 0.5; msgP = pEvade ? "勇者準備閃避！" : "勇者試圖閃避，但失敗了！"; }
        if (action === 'counter') { pDefMult = 0.7; pCounter = true; msgP = "勇者擺出反擊架勢！"; }
        
        let mDefMult = 1, mEvade = false, mCounter = false, msgM = "", monsterFled = false, playerFled = false;
        if (mAction === 'defend') { mDefMult = 0.3; msgM = `${m.name} 採取了防禦姿勢。`; }
        if (mAction === 'dodge') { mEvade = Math.random() < 0.5; msgM = mEvade ? `${m.name} 準備閃避！` : `${m.name} 試圖閃避，但失敗了！`; }
        if (mAction === 'counter') { mDefMult = 0.7; mCounter = true; msgM = `${m.name} 擺出反擊架勢！`; }

        if (action === 'flee') { if (Math.random() < 0.4) { this.logCombat("成功撤退！", "text-yellow-400 font-bold"); playerFled = true; } else { msgP = "撤退失敗，破綻百出！"; pDefMult = 1.2; } }
        if (mAction === 'flee' && !playerFled) { if (Math.random() < 0.6) { this.logCombat(`${m.name} 夾著尾巴逃跑了！`, "text-yellow-400 font-bold"); monsterFled = true; } else { msgM = `${m.name} 逃跑被攔截！`; mDefMult = 1.3; } }

        if (msgP) this.logCombat(msgP, 'text-slate-400');
        if (msgM) this.logCombat(msgM, 'text-slate-500');

        if (playerFled) { setTimeout(() => this.endCombat(false, true), 1000); return; }
        if (monsterFled) { setTimeout(() => this.endCombat(false, false, true), 1000); return; }

        const processAttack = (attacker, defender, act, sDef, defM, isEvading, callback) => {
            if (!attacker.alive || !defender.alive) { callback(); return; }
            if (!['attack', 'skill', 'do_counter'].includes(act)) { callback(); return; }
            const aDiv = document.getElementById(attacker.isPlayer ? 'combat-player' : 'combat-monster');
            const dDiv = document.getElementById(attacker.isPlayer ? 'combat-monster' : 'combat-player');
            
            aDiv.classList.add(attacker.isPlayer ? 'anim-atk-p' : 'anim-atk-m');
            setTimeout(() => {
                aDiv.classList.remove(attacker.isPlayer ? 'anim-atk-p' : 'anim-atk-m');
                if (isEvading) { this.logCombat(`${defender.name} 成功閃避了攻擊！`, 'text-green-400 font-bold'); callback(); return; }
                
                dDiv.classList.add('anim-dmg');
                let rawDmg = 0, isSkill = false;
                
                if (act === 'skill' && sDef) {
                    rawDmg = attacker.atk * sDef.mult; isSkill = true;
                    if (attacker.isPlayer) attacker.cooldowns[sDef.id] = sDef.cd;
                    this.logCombat(`${attacker.name} 施放了 【${sDef.name}】！`, attacker.isPlayer ? 'text-blue-400 font-bold' : 'text-purple-400 font-bold');
                    if (attacker.isPlayer && MONSTER_TEMPLATES.find(t=>t.id === defender.id).weakness === sDef.id) { rawDmg *= 2; this.logCombat(`擊中弱點！效果拔群！`, 'text-yellow-400 font-black'); }
                } else if (act === 'do_counter') { rawDmg = Math.floor(attacker.atk * 1.5); this.logCombat(`${attacker.name} 發動反擊！`, 'text-yellow-400 font-bold'); }
                else rawDmg = attacker.atk;

                let actualDmg = isSkill && sDef.ignoreDef ? rawDmg : Math.max(1, rawDmg - defender.def);
                actualDmg = Math.floor(actualDmg * defM);
                defender.hp -= actualDmg;
                
                this.spawnCombatFloatingText(attacker.isPlayer ? 'combat-monster' : 'combat-player', `-${actualDmg}`, 'text-red-500');
                this.logCombat(`${attacker.name} 對 ${defender.name} 造成 ${actualDmg} 傷害！`, attacker.isPlayer ? 'text-blue-300' : 'text-red-400');
                
                if (isSkill && sDef.healRate > 0) { 
                    let heal = Math.floor(actualDmg * sDef.healRate); 
                    attacker.heal(heal); 
                    this.spawnCombatFloatingText(attacker.isPlayer ? 'combat-player' : 'combat-monster', `+${heal}`, 'text-green-400');
                    this.logCombat(`吸收了 ${heal} 生命！`, 'text-green-400'); 
                }
                
                this.updateCombatUI(); this.updateUI();
                setTimeout(() => { dDiv.classList.remove('anim-dmg'); if (defender.hp <= 0) defender.hp = 0; callback(); }, 400);
            }, 300);
        };

        const step4 = () => { if (p.hp > 0 && m.hp > 0 && mCounter && !mEvade && ['attack', 'skill'].includes(action)) processAttack(m, p, 'do_counter', null, 1, false, () => { if(p.hp<=0) { this.logCombat(`你倒下了...`, 'text-red-600 font-black'); p.die(m); } else this.endRoundTasks(); }); else this.endRoundTasks(); };
        const step3 = () => { if (p.hp > 0 && m.hp > 0 && pCounter && !pEvade && ['attack', 'skill'].includes(mAction)) processAttack(p, m, 'do_counter', null, 1, false, () => { if(m.hp<=0) this.resolveCombatWin(); else step4(); }); else step4(); };
        const step2 = () => { if (p.hp > 0 && m.hp > 0 && ['attack', 'skill'].includes(mAction)) processAttack(m, p, mAction, mAction==='skill'?mSkillDef:null, pDefMult, pEvade, () => { if(p.hp<=0) { this.logCombat(`你倒下了...`, 'text-red-600 font-black'); p.die(m); } else step3(); }); else step3(); };
        const step1 = () => { if (p.hp > 0 && m.hp > 0 && ['attack', 'skill'].includes(action)) processAttack(p, m, action, action==='skill'?SKILLS[skillId]:null, mDefMult, mEvade, () => { if(m.hp<=0) this.resolveCombatWin(); else step2(); }); else step2(); };
        step1();
    },

    resolveCombatWin() {
        const m = State.currentEncounter, p = State.player;
        this.logCombat(`成功擊敗了 ${m.name}！`, 'text-green-400 font-bold');
        let mTemp = MONSTER_TEMPLATES.find(t=>t.id === m.id);
        if (!p.skills.includes(mTemp.skill)) { p.skills.push(mTemp.skill); this.logCombat(`學會了新特技：【${SKILLS[mTemp.skill].name}】！`, 'text-yellow-400 font-black'); }
        m.die(p); setTimeout(() => this.endCombat(true), 1500);
    },

    endRoundTasks() {
        if (!State.player.alive) return;
        const p = State.player;
        for(let k in p.cooldowns) if(p.cooldowns[k] > 0) p.cooldowns[k]--;
        if (State.currentEncounter && State.currentEncounter.cooldown > 0) State.currentEncounter.cooldown--;
        this.toggleCombatButtons(true);
    },

    endCombat(won, fled = false, monsterFled = false) {
        document.getElementById('combat-screen').classList.add('hidden');
        document.getElementById('combat-screen').classList.remove('flex');
        const m = State.currentEncounter;
        if (monsterFled && m) { logMsg(`${m.name} 倉皇逃走，行為變得膽小！`); m.behavior = 'coward'; this.bounceEntity(m); }
        else if (won) logMsg(`戰勝魔物，凱旋歸來！`);
        else if (fled) { logMsg(`驚險地從戰鬥中撤退。`); this.bounceEntity(State.player); }
        State.currentEncounter = null; this.checkWinCondition(); this.updateUI(); this.saveGameState();
        this.toggleCombatButtons(true);
    },

    bounceEntity(entity) {
        const maze = State.mazes[entity.mazeIndex], dirs = [[0,-1], [0,1], [-1,0], [1,0]];
        for(let d of dirs) { let nx = entity.x + d[0], ny = entity.y + d[1]; if (nx>=0 && nx<CONFIG.MAZE_WIDTH && ny>=0 && ny<CONFIG.MAZE_HEIGHT && maze[ny][nx] !== TILE_TYPES.WALL) { entity.x = nx; entity.y = ny; break; } }
    },

    addFloatingText(x, y, text, color) {
        State.floatingTexts.push({
            x: x, y: y, text: text, color: color,
            life: 1.0, maxLife: 1.0,
            vy: -15 - Math.random() * 10
        });
    },

    render(time) {
        requestAnimationFrame(this.render.bind(this));
        if(!this.lastTime) this.lastTime = time;
        let dt = time - this.lastTime; this.lastTime = time;
        if(dt > 100) dt = 16.66; // Prevent huge jumps
        
        State.entities.forEach(e => e.updateAnimation(dt));

        const w = this.canvasW, h = this.canvasH;
        this.ctx.fillStyle = '#020617'; // bg-slate-950
        this.ctx.fillRect(0, 0, w, h);
        if (!State.player) return;

        const p = State.player, maze = State.mazes[p.mazeIndex];
        State.camera.x = p.visualX * CONFIG.TILE_SIZE - w/2 + CONFIG.TILE_SIZE/2;
        State.camera.y = p.visualY * CONFIG.TILE_SIZE - h/2 + CONFIG.TILE_SIZE/2 + (h * 0.15);

        this.ctx.save(); this.ctx.translate(-State.camera.x, -State.camera.y);

        for (let y = 0; y < CONFIG.MAZE_HEIGHT; y++) {
            for (let x = 0; x < CONFIG.MAZE_WIDTH; x++) {
                let scrX = x * CONFIG.TILE_SIZE - State.camera.x, scrY = y * CONFIG.TILE_SIZE - State.camera.y;
                if (scrX > -CONFIG.TILE_SIZE && scrX < w && scrY > -CONFIG.TILE_SIZE && scrY < h) {
                    let tile = maze[y][x];
                    let drawX = x * CONFIG.TILE_SIZE, drawY = y * CONFIG.TILE_SIZE;
                    
                    if (tile !== TILE_TYPES.WALL) { 
                        // Path base
                        this.ctx.fillStyle = '#334155'; // slate-700
                        this.ctx.fillRect(drawX, drawY, CONFIG.TILE_SIZE, CONFIG.TILE_SIZE); 
                        // Texture detail
                        this.ctx.strokeStyle = '#1e293b'; // slate-800
                        this.ctx.lineWidth = 1;
                        this.ctx.strokeRect(drawX, drawY, CONFIG.TILE_SIZE, CONFIG.TILE_SIZE);
                        if ((x * 7 + y * 13) % 5 === 0) {
                            this.ctx.fillStyle = '#1e293b';
                            this.ctx.fillRect(drawX + 4, drawY + 4, 8, 8);
                        }
                    }
                    if (tile === TILE_TYPES.WALL) { 
                        this.ctx.fillStyle = '#1e293b'; // Top of wall
                        this.ctx.fillRect(drawX, drawY, CONFIG.TILE_SIZE, CONFIG.TILE_SIZE); 
                        this.ctx.fillStyle = '#0f172a'; // Front face for 3D
                        this.ctx.fillRect(drawX, drawY + CONFIG.TILE_SIZE - 6, CONFIG.TILE_SIZE, 6); 
                    }
                    else if (tile === TILE_TYPES.TELEPORT) { 
                        let timeOsc = (Date.now() % 2000) / 2000;
                        this.ctx.fillStyle = `rgba(168, 85, 247, ${0.4 + 0.4 * Math.sin(timeOsc * Math.PI * 2)})`;
                        this.ctx.beginPath(); this.ctx.arc(drawX + CONFIG.TILE_SIZE/2, drawY + CONFIG.TILE_SIZE/2, CONFIG.TILE_SIZE*0.4, 0, Math.PI*2); this.ctx.fill(); 
                        this.ctx.strokeStyle = '#d8b4fe'; this.ctx.lineWidth = 2; this.ctx.stroke();
                    }
                    else if ([TILE_TYPES.EVENT_GOOD, TILE_TYPES.EVENT_BAD, TILE_TYPES.EVENT_ITEM].includes(tile)) { 
                        this.ctx.fillStyle = '#64748b'; // slate-500 indicator
                        this.ctx.beginPath(); this.ctx.moveTo(drawX+CONFIG.TILE_SIZE/2, drawY+10); this.ctx.lineTo(drawX+CONFIG.TILE_SIZE-10, drawY+CONFIG.TILE_SIZE/2); this.ctx.lineTo(drawX+CONFIG.TILE_SIZE/2, drawY+CONFIG.TILE_SIZE-10); this.ctx.lineTo(drawX+10, drawY+CONFIG.TILE_SIZE/2); this.ctx.fill(); 
                    }
                }
            }
        }

        if (this.stepsRemaining > 0) {
            this.getValidMoves().forEach(m => {
                this.ctx.fillStyle = 'rgba(250, 204, 21, 0.2)'; // yellow-400
                this.ctx.fillRect(m.x * CONFIG.TILE_SIZE, m.y * CONFIG.TILE_SIZE, CONFIG.TILE_SIZE, CONFIG.TILE_SIZE);
                this.ctx.fillStyle = '#fef08a'; this.ctx.font = '20px sans-serif'; this.ctx.textAlign = 'center'; this.ctx.textBaseline = 'middle';
                this.ctx.fillText("👣", m.x * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2, m.y * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2);
            });
        }

        let renderQueue = State.entities.filter(e => e.alive && e.mazeIndex === p.mazeIndex).sort((a, b) => a.visualY - b.visualY);
        renderQueue.forEach(e => {
            let px = e.visualX * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2, py = e.visualY * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2;
            this.ctx.font = '26px sans-serif'; this.ctx.textAlign = 'center'; this.ctx.textBaseline = 'middle';
            
            // Entity shadow
            this.ctx.fillStyle = 'rgba(0,0,0,0.6)'; this.ctx.beginPath(); this.ctx.ellipse(px, py + 15, 14, 7, 0, 0, Math.PI*2); this.ctx.fill();
            
            this.ctx.fillStyle = '#ffffff'; 
            this.ctx.shadowColor = e.isPlayer ? 'rgba(59, 130, 246, 0.8)' : 'rgba(239, 68, 68, 0.8)';
            this.ctx.shadowBlur = 15;
            this.ctx.fillText(e.isPlayer ? "🧑‍🌾" : e.symbol, px, py);
            this.ctx.shadowBlur = 0; // reset
            
            let hpPct = Math.max(0, e.hp / e.maxHp); 
            this.ctx.fillStyle = 'rgba(15, 23, 42, 0.8)'; this.ctx.fillRect(px - 16, py - 24, 32, 6); 
            this.ctx.fillStyle = e.isPlayer ? '#10b981' : '#ef4444'; // emerald-500 / red-500
            this.ctx.fillRect(px - 15, py - 23, 30 * hpPct, 4);
        });
        
        // Render Floating Texts
        for (let i = State.floatingTexts.length - 1; i >= 0; i--) {
            let ft = State.floatingTexts[i];
            ft.life -= dt / 1000;
            ft.y += ft.vy * (dt / 1000);
            if (ft.life <= 0) {
                State.floatingTexts.splice(i, 1);
            } else {
                this.ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
                this.ctx.fillStyle = ft.color;
                this.ctx.font = '900 22px "Noto Sans TC", sans-serif';
                this.ctx.textAlign = 'center';
                this.ctx.strokeStyle = '#020617';
                this.ctx.lineWidth = 4;
                this.ctx.strokeText(ft.text, ft.x, ft.y);
                this.ctx.fillText(ft.text, ft.x, ft.y);
                this.ctx.globalAlpha = 1.0;
            }
        }

        this.ctx.restore();
        
        // Improved Fog of War (Gradient centered precisely on player in screen space)
        let gradient = this.ctx.createRadialGradient(w/2, h/2 - (h*0.15), Math.min(w,h)*0.15, w/2, h/2 - (h*0.15), Math.min(w,h)*0.7);
        gradient.addColorStop(0, 'rgba(2, 6, 23, 0)');
        gradient.addColorStop(0.6, 'rgba(2, 6, 23, 0.7)');
        gradient.addColorStop(1, 'rgba(2, 6, 23, 1)');
        this.ctx.fillStyle = gradient; this.ctx.fillRect(0,0,w,h);
    },

    updateUI() {
        if (!State.player) return;
        const p = State.player;
        document.getElementById('player-hp').innerText = `${Math.floor(p.hp)}/${p.maxHp}`;
        const hpPct = Math.max(0, p.hp / p.maxHp) * 100;
        document.getElementById('ui-hp-bar').style.width = `${hpPct}%`;
        
        document.getElementById('player-atk').innerText = p.atk; document.getElementById('player-def').innerText = p.def; document.getElementById('player-gold').innerText = p.gold;
        document.getElementById('loop-count').innerText = State.loop > 1 ? `(第${State.loop}輪)` : '';
        document.getElementById('turn-count').innerText = State.turn; document.getElementById('current-maze').innerText = p.mazeIndex + 1;
        document.getElementById('alive-count').innerText = State.entities.filter(e => !e.isPlayer && e.alive).length;
    },

    showMessage(title, desc) {
        document.getElementById('message-title').innerText = title; document.getElementById('message-desc').innerText = desc;
        document.getElementById('message-modal').classList.remove('hidden');
    },

    handlePlayerDeath() {
        document.getElementById('combat-screen').classList.add('hidden'); document.getElementById('combat-screen').classList.remove('flex');
        localStorage.removeItem('dungeon_save');
        const modal = document.getElementById('endgame-modal'), title = document.getElementById('end-title'), btn = document.getElementById('btn-restart');
        modal.classList.remove('hidden'); 
        title.innerText = "YOU DIED"; title.className = "text-5xl font-black mb-4 text-center text-red-600 filter drop-shadow-lg";
        document.getElementById('endgame-card').classList.add('border-red-600');
        document.getElementById('end-rank').innerText = `名次: 第 ${State.entities.filter(e => !e.isPlayer && e.alive).length + 1} 名`;
        document.getElementById('end-turns').innerText = State.turn; document.getElementById('end-kills').innerText = State.player.kills; document.getElementById('end-level').innerText = "死亡";
        btn.innerText = "重新開始"; btn.className = "w-full py-4 rounded-xl font-black text-lg shadow-2xl transition-all hover:scale-105 active:scale-95 border-red-500/50 bg-slate-800 hover:bg-slate-700 text-white relative z-10 tracking-widest";
    },

    checkWinCondition() {
        if (State.entities.filter(e => !e.isPlayer && e.alive).length === 0 && State.player.alive) {
            const modal = document.getElementById('endgame-modal'), title = document.getElementById('end-title'), btn = document.getElementById('btn-restart');
            modal.classList.remove('hidden'); 
            title.innerText = "VICTORY!"; title.className = "text-5xl font-black mb-4 text-center text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-amber-600 filter drop-shadow-lg";
            document.getElementById('endgame-card').classList.add('border-yellow-500');
            document.getElementById('end-rank').innerText = "唯一的倖存者";
            document.getElementById('end-turns').innerText = State.turn; document.getElementById('end-kills').innerText = State.player.kills; document.getElementById('end-level').innerText = `滿載而歸 (輪迴 ${State.loop})`;
            btn.innerText = "開啟下一輪迴 (繼承屬性)"; btn.className = "w-full py-4 rounded-xl font-black text-lg shadow-[0_10px_30px_rgba(168,85,247,0.4)] transition-all hover:scale-105 active:scale-95 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white mt-2 border border-purple-400/50 relative z-10 tracking-widest";
        }
    },

    promptTeleport() {document.getElementById('teleport-modal').classList.remove('hidden');}
};

function logMsg(msg) {
    State.logs.unshift(msg); if(State.logs.length > 20) State.logs.pop();
    document.getElementById('log-window').innerHTML = State.logs.map((l, i) => `<div class="${i===0 ? 'text-slate-100 font-bold' : 'text-slate-400 opacity-80'} mb-1 break-words">${l}</div>`).join('');
}

window.onload = () => Game.init();
</script>
