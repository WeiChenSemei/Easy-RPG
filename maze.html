<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>地城大冒險</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a202c;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none; 
            -webkit-touch-callout: none;
        }
        button {
            touch-action: manipulation;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }
        #canvas-container {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .pointer-events-auto { pointer-events: auto; }
        .modal-overlay { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); z-index: 50; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.5); }

        @keyframes rollDice {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.2); }
            50% { transform: rotate(180deg) scale(0.8); }
            75% { transform: rotate(270deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }
        .rolling { animation: rollDice 0.5s ease-in-out; }

        @keyframes attack-player {
            0%, 100% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(20px) translateY(-20px); scale: 1.1; }
        }
        @keyframes attack-monster {
            0%, 100% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(-20px) translateY(20px); scale: 1.1; }
        }
        @keyframes damage-shake {
            0%, 100% { transform: translateX(0); border-color: inherit; }
            25% { transform: translateX(-8px); border-color: #ef4444; }
            75% { transform: translateX(8px); border-color: #ef4444; }
        }
        .anim-atk-p { animation: attack-player 0.3s ease-in-out; z-index: 10; }
        .anim-atk-m { animation: attack-monster 0.3s ease-in-out; z-index: 10; }
        .anim-dmg { animation: damage-shake 0.4s ease-in-out; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Game Canvas -->
    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- UI Overlay (Top Stats) -->
    <div id="top-ui" class="absolute top-0 left-0 w-full p-2 flex justify-between items-start pointer-events-none z-10">
        <div class="bg-gray-800/80 p-2 rounded border border-gray-700 shadow-lg flex flex-col gap-1 w-1/3">
            <div class="text-xs font-bold text-yellow-400">玩家狀態 <span id="loop-count" class="text-purple-400 text-[10px] ml-1"></span></div>
            <div class="text-xs flex justify-between"><span>HP:</span> <span id="player-hp" class="text-red-400">100/100</span></div>
            <div class="text-xs flex justify-between"><span>ATK:</span> <span id="player-atk" class="text-blue-400">10</span></div>
            <div class="text-xs flex justify-between"><span>DEF:</span> <span id="player-def" class="text-green-400">5</span></div>
            <div class="text-xs flex justify-between"><span>GOLD:</span> <span id="player-gold" class="text-yellow-300">0</span></div>
            <div class="text-[10px] text-gray-400 mt-1">回合: <span id="turn-count">0</span></div>
        </div>
        
        <div class="bg-gray-800/80 p-2 rounded border border-gray-700 shadow-lg text-right w-1/3">
            <div class="text-xs font-bold text-red-500 mb-1">存活魔物</div>
            <div id="alive-count" class="text-xl font-bold">12</div>
            <div class="text-[10px] text-gray-400">當前迷宮: <span id="current-maze">1</span></div>
        </div>
    </div>

    <!-- UI Overlay (Bottom Controls) -->
    <div id="bottom-ui" class="absolute bottom-0 left-0 w-full px-4 pt-0 pb-[15vh] pointer-events-none z-10 flex flex-col justify-end gap-2">
        <div id="log-window" class="bg-black/60 border border-gray-700 rounded p-2 h-16 overflow-y-auto text-xs font-mono custom-scrollbar pointer-events-auto flex flex-col-reverse shadow-lg"></div>
        <div class="flex justify-center w-full">
            <button id="btn-roll" class="pointer-events-auto bg-gradient-to-r from-blue-600 to-blue-800 hover:from-blue-500 hover:to-blue-700 text-white font-bold py-2 px-8 rounded-full shadow-[0_0_15px_rgba(37,99,235,0.5)] active:scale-95 transition-all border-2 border-blue-400 flex items-center justify-center gap-2 w-full max-w-xs mx-auto">
                <span id="dice-icon" class="text-xl">🎲</span>
                <span id="dice-result" class="text-lg font-bold">擲骰移動</span>
            </button>
        </div>
    </div>

    <!-- Encounter Modal -->
    <div id="encounter-modal" class="absolute inset-0 modal-overlay hidden flex items-center justify-center pb-[15vh] pointer-events-auto z-[51]">
        <div class="bg-gray-800 border-2 border-red-500 rounded-xl p-6 w-5/6 max-w-sm flex flex-col items-center shadow-2xl">
            <h2 class="text-2xl font-bold text-red-500 mb-2">遭遇魔物！</h2>
            <div id="encounter-name" class="text-xl font-bold mb-4 text-purple-400">魔物名稱</div>
            
            <div class="flex gap-4 mb-4 w-full text-sm">
                <div class="flex-1 bg-gray-900 p-2 rounded text-center">
                    <div class="text-gray-400 text-xs">HP</div>
                    <div id="encounter-hp" class="text-red-400">0</div>
                </div>
                <div class="flex-1 bg-gray-900 p-2 rounded text-center">
                    <div class="text-gray-400 text-xs">ATK</div>
                    <div id="encounter-atk" class="text-blue-400">0</div>
                </div>
                <div class="flex-1 bg-gray-900 p-2 rounded text-center">
                    <div class="text-gray-400 text-xs">DEF</div>
                    <div id="encounter-def" class="text-green-400">0</div>
                </div>
            </div>
            
            <div id="encounter-desc" class="text-xs text-gray-300 mb-6 text-center"></div>

            <div class="grid grid-cols-2 gap-3 w-full">
                <button id="btn-fight" class="bg-red-600 hover:bg-red-500 py-2 rounded font-bold shadow">⚔️ 戰鬥</button>
                <button id="btn-flee-encounter" class="bg-gray-600 hover:bg-gray-500 py-2 rounded font-bold shadow">🏃 逃跑 (70%)</button>
            </div>
        </div>
    </div>
    
    <!-- Merchant Modal -->
    <div id="merchant-modal" class="absolute inset-0 modal-overlay hidden flex items-center justify-center pb-[15vh] pointer-events-auto z-[52]">
        <div class="bg-gray-800 border-2 border-yellow-500 rounded-xl p-6 w-5/6 max-w-sm flex flex-col items-center shadow-2xl">
            <h2 class="text-2xl font-bold text-yellow-400 mb-2">流浪商人</h2>
            <p class="text-gray-300 text-sm mb-4 text-center">「要來點好東西嗎？」<br>你的金幣: <span id="merchant-gold" class="text-yellow-300 font-bold">0</span> G</p>
            <div id="merchant-items" class="w-full flex flex-col gap-2 mb-4 max-h-64 overflow-y-auto custom-scrollbar">
                <!-- Items injected here -->
            </div>
            <button id="btn-merchant-leave" class="bg-gray-600 hover:bg-gray-500 py-2 px-8 rounded font-bold shadow w-full">離開</button>
        </div>
    </div>

    <!-- General Message Modal -->
    <div id="message-modal" class="absolute inset-0 modal-overlay hidden flex items-center justify-center pb-[15vh] pointer-events-auto z-[53]">
        <div class="bg-gray-800 border-2 border-gray-500 rounded-xl p-6 w-5/6 max-w-sm flex flex-col items-center shadow-2xl transition-transform transform scale-95 duration-200">
            <h2 id="message-title" class="text-xl font-bold text-white mb-4 text-center">提示</h2>
            <p id="message-desc" class="text-gray-300 text-sm mb-6 text-center leading-relaxed">內容</p>
            <button id="btn-msg-close" class="bg-blue-600 hover:bg-blue-500 py-2 px-8 rounded font-bold shadow">確定</button>
        </div>
    </div>
    
    <!-- Skill Selection Modal -->
    <div id="skill-modal" class="absolute inset-0 bg-black/80 hidden flex items-center justify-center pb-[15vh] pointer-events-auto z-[60]">
        <div class="bg-gray-800 border-2 border-blue-500 rounded-xl p-6 w-5/6 max-w-sm flex flex-col items-center shadow-2xl">
            <h2 class="text-xl font-bold text-blue-400 mb-4">選擇特技</h2>
            <div id="skill-list" class="w-full flex flex-col gap-2 mb-4 max-h-64 overflow-y-auto custom-scrollbar"></div>
            <button id="btn-skill-cancel" class="bg-gray-600 hover:bg-gray-500 py-2 px-8 rounded font-bold shadow w-full">取消</button>
        </div>
    </div>

    <!-- Combat Screen Overlay -->
    <div id="combat-screen" class="absolute inset-0 bg-gray-900 hidden flex-col z-[55] pointer-events-auto">
        <div class="p-2 bg-gray-800 text-center font-bold text-lg text-red-500 border-b border-gray-700 shadow-md shrink-0">戰鬥階段</div>
        
        <div class="shrink-0 flex flex-col justify-center gap-2 p-3">
            <div id="combat-monster" class="flex flex-col items-center bg-gray-800/80 p-3 rounded-xl border-2 border-gray-700 shadow-lg relative transition-transform">
                <div id="cb-m-name" class="text-base text-purple-400 font-bold mb-1">魔物</div>
                <div id="cb-m-sym" class="text-5xl mb-2 filter drop-shadow-[0_0_10px_rgba(168,85,247,0.5)]">🐉</div>
                <div class="w-full bg-gray-900 rounded-full h-3 relative overflow-hidden border border-gray-700">
                    <div id="cb-m-hpbar" class="absolute top-0 left-0 h-full bg-gradient-to-r from-red-600 to-red-400 transition-all duration-300 w-full"></div>
                </div>
                <div id="cb-m-hp" class="text-[10px] mt-1 text-gray-300 font-mono">HP: 100/100</div>
            </div>
            <div class="text-center text-lg font-black text-gray-600 italic">VS</div>
            <div id="combat-player" class="flex flex-col items-center bg-gray-800/80 p-3 rounded-xl border-2 border-blue-800 shadow-lg relative transition-transform">
                <div class="text-base text-blue-400 font-bold mb-1">勇者</div>
                <div class="text-5xl mb-2 filter drop-shadow-[0_0_10px_rgba(59,130,246,0.5)]">🧑‍🌾</div>
                <div class="w-full bg-gray-900 rounded-full h-3 relative overflow-hidden border border-gray-700">
                    <div id="cb-p-hpbar" class="absolute top-0 left-0 h-full bg-gradient-to-r from-green-600 to-green-400 transition-all duration-300 w-full"></div>
                </div>
                <div id="cb-p-hp" class="text-[10px] mt-1 text-gray-300 font-mono">HP: 100/100</div>
            </div>
        </div>

        <div id="combat-log" class="flex-1 bg-black/90 border-t-2 border-b-2 border-gray-700 p-3 overflow-y-auto text-xs font-mono custom-scrollbar flex flex-col shadow-inner min-h-0"></div>

        <div class="p-2 grid grid-cols-3 gap-2 bg-gray-800 pb-[15vh] shrink-0">
            <button id="btn-cb-attack" class="bg-red-600 hover:bg-red-500 py-3 rounded-lg font-bold text-sm shadow text-white active:scale-95 transition-transform">⚔️攻擊</button>
            <button id="btn-cb-skill" class="bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold text-sm shadow text-white active:scale-95 transition-transform">✨特技</button>
            <button id="btn-cb-defend" class="bg-green-600 hover:bg-green-500 py-3 rounded-lg font-bold text-sm shadow text-white active:scale-95 transition-transform">🛡️防禦</button>
            <button id="btn-cb-dodge" class="bg-yellow-600 hover:bg-yellow-500 py-3 rounded-lg font-bold text-sm shadow text-white active:scale-95 transition-transform">💨閃避</button>
            <button id="btn-cb-counter" class="bg-purple-600 hover:bg-purple-500 py-3 rounded-lg font-bold text-sm shadow text-white active:scale-95 transition-transform">🔄反擊</button>
            <button id="btn-cb-flee" class="bg-gray-600 hover:bg-gray-500 py-3 rounded-lg font-bold text-sm shadow text-white active:scale-95 transition-transform">🏃撤退</button>
        </div>
    </div>

    <!-- Game Over / Victory Modal -->
    <div id="endgame-modal" class="absolute inset-0 modal-overlay hidden flex items-center justify-center pb-[15vh] pointer-events-auto z-[70]">
        <div class="bg-gray-800 border-4 rounded-xl p-6 w-5/6 max-w-sm flex flex-col items-center shadow-[0_0_30px_rgba(0,0,0,0.8)]">
            <h1 id="end-title" class="text-4xl font-black mb-2 text-center text-transparent bg-clip-text"></h1>
            <div id="end-rank" class="text-xl text-gray-300 mb-6"></div>
            
            <div class="bg-gray-900 w-full p-4 rounded mb-6 text-sm">
                <div class="flex justify-between mb-1"><span>存活回合:</span> <span id="end-turns" class="text-yellow-400">0</span></div>
                <div class="flex justify-between mb-1"><span>擊敗魔物:</span> <span id="end-kills" class="text-red-400">0</span></div>
                <div class="flex justify-between"><span>最終等級:</span> <span id="end-level" class="text-purple-400">1</span></div>
            </div>

            <button id="btn-restart" class="w-full py-3 rounded font-bold text-lg shadow-lg transition-transform hover:scale-105"></button>
        </div>
    </div>
</div>

<script>
// --- 行動裝置防止縮放防呆 ---
document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
let lastTouchEnd = 0;
document.addEventListener('touchend', function(event) {
    const now = (new Date()).getTime();
    if (now - lastTouchEnd <= 300 && event.target.tagName !== 'BUTTON') {
        event.preventDefault();
    }
    lastTouchEnd = now;
}, { passive: false });

// --- Configuration & Constants ---
const CONFIG = {
    TILE_SIZE: 40,
    MAZE_WIDTH: 21,
    MAZE_HEIGHT: 21,
    NUM_MAZES: 5,
    ANIMATION_SPEED: 0.15,
};

const TILE_TYPES = {
    WALL: 0, PATH: 1, START: 2, TELEPORT: 3, EVENT_GOOD: 4, EVENT_BAD: 5, EVENT_ITEM: 6, EVENT_EMPTY: 7
};

const TILE_COLORS = {
    [TILE_TYPES.WALL]: '#2d3748', [TILE_TYPES.PATH]: '#cbd5e1', [TILE_TYPES.START]: '#3b82f6',
    [TILE_TYPES.TELEPORT]: '#a855f7', [TILE_TYPES.EVENT_GOOD]: '#4ade80', [TILE_TYPES.EVENT_BAD]: '#f87171',
    [TILE_TYPES.EVENT_ITEM]: '#fbbf24', [TILE_TYPES.EVENT_EMPTY]: '#94a3b8'
};

const EVENTS = {
    GOOD: [
        { name: "神秘泉水", desc: "恢復 30 HP", effect: (p) => p.heal(30) },
        { name: "戰神雕像", desc: "攻擊力永久 +2", effect: (p) => p.atk += 2 },
        { name: "守護者祝福", desc: "防禦力永久 +2", effect: (p) => p.def += 2 },
        { name: "隱藏的金庫", desc: "獲得 50 金幣", effect: (p) => p.gold += 50 },
        { name: "精靈之吻", desc: "生命值完全恢復！", effect: (p) => p.heal(p.maxHp) },
        { name: "英雄祭壇", desc: "最大生命 +10，攻擊 +1", effect: (p) => { p.maxHp += 10; p.atk += 1; p.heal(10); } }
    ],
    BAD: [
        { name: "毒氣陷阱", desc: "失去 15 HP", effect: (p) => p.takeDamage(15, null, true) },
        { name: "詛咒之刃", desc: "攻擊力 -1", effect: (p) => p.atk = Math.max(1, p.atk - 1) },
        { name: "生鏽的鎧甲", desc: "防禦力 -1", effect: (p) => p.def = Math.max(0, p.def - 1) },
        { name: "落石陷阱", desc: "被砸中，失去 25 HP", effect: (p) => p.takeDamage(25, null, true) },
        { name: "疲勞詛咒", desc: "最大生命 -5", effect: (p) => { p.maxHp = Math.max(1, p.maxHp - 5); if(p.hp>p.maxHp) p.hp=p.maxHp; } },
        { name: "強盜", desc: "失去一半金幣", effect: (p) => p.gold = Math.floor(p.gold / 2) }
    ]
};

// --- Data Dictionaries (Skills & Monsters) ---
const SKILLS = {
    s1: { id: 's1', name: '狂暴連擊', cd: 3, mult: 1.5, ignoreDef: false, healRate: 0 },
    s2: { id: 's2', name: '貪婪掠奪', cd: 2, mult: 1.2, ignoreDef: false, healRate: 0.3 },
    s3: { id: 's3', name: '骸骨穿刺', cd: 3, mult: 1.0, ignoreDef: true, healRate: 0 },
    s4: { id: 's4', name: '背刺', cd: 4, mult: 2.0, ignoreDef: false, healRate: 0 },
    s5: { id: 's5', name: '石化凝視', cd: 4, mult: 1.3, ignoreDef: false, healRate: 0 },
    s6: { id: 's6', name: '魅惑之吻', cd: 3, mult: 1.1, ignoreDef: false, healRate: 0.5 },
    s7: { id: 's7', name: '野蠻衝撞', cd: 3, mult: 1.6, ignoreDef: false, healRate: 0 },
    s8: { id: 's8', name: '劇毒啃咬', cd: 2, mult: 1.2, ignoreDef: true, healRate: 0 },
    s9: { id: 's9', name: '金幣吞噬', cd: 4, mult: 1.4, ignoreDef: false, healRate: 0.2 },
    s10: { id: 's10', name: '死亡凋零', cd: 5, mult: 1.8, ignoreDef: true, healRate: 0 },
    s11: { id: 's11', name: '地獄業火', cd: 4, mult: 1.5, ignoreDef: false, healRate: 0 },
    s12: { id: 's12', name: '龍息', cd: 5, mult: 2.0, ignoreDef: false, healRate: 0 }
};

const MONSTER_TEMPLATES = [
    { id: 1, name: "狂暴哥布林", symbol: "👺", hpRatio: 0.8, atkRatio: 1.2, defRatio: 0.5, behavior: "aggressive", skill: "s1", weakness: "s12", desc: "脾氣暴躁" },
    { id: 2, name: "貪婪史萊姆", symbol: "💧", hpRatio: 1.2, atkRatio: 0.8, defRatio: 0.8, behavior: "greedy", skill: "s2", weakness: "s1", desc: "喜歡收集閃亮物" },
    { id: 3, name: "骷髏劍士", symbol: "💀", hpRatio: 0.9, atkRatio: 1.1, defRatio: 0.6, behavior: "patrol", skill: "s3", weakness: "s2", desc: "死板巡邏" },
    { id: 4, name: "幽靈刺客", symbol: "👻", hpRatio: 0.6, atkRatio: 1.5, defRatio: 0.2, behavior: "hunter", skill: "s4", weakness: "s3", desc: "暗殺者" },
    { id: 5, name: "石像鬼", symbol: "🗿", hpRatio: 1.5, atkRatio: 0.7, defRatio: 1.5, behavior: "defensive", skill: "s5", weakness: "s4", desc: "防禦極高" },
    { id: 6, name: "魅魔", symbol: "🧛‍♀️", hpRatio: 0.8, atkRatio: 1.0, defRatio: 0.8, behavior: "charming", skill: "s6", weakness: "s5", desc: "擅長誘惑" },
    { id: 7, name: "牛頭人", symbol: "🐂", hpRatio: 1.3, atkRatio: 1.3, defRatio: 1.0, behavior: "aggressive", skill: "s7", weakness: "s6", desc: "力大無窮" },
    { id: 8, name: "毒蜘蛛", symbol: "🕷️", hpRatio: 0.7, atkRatio: 1.1, defRatio: 0.5, behavior: "coward", skill: "s8", weakness: "s7", desc: "打帶跑" },
    { id: 9, name: "寶箱怪", symbol: "🎁", hpRatio: 1.1, atkRatio: 1.0, defRatio: 1.2, behavior: "mimic", skill: "s9", weakness: "s8", desc: "偽裝成寶物" },
    { id: 10, name: "巫妖", symbol: "🧙‍♂️", hpRatio: 0.9, atkRatio: 1.4, defRatio: 0.8, behavior: "smart", skill: "s10", weakness: "s9", desc: "高智商法師" },
    { id: 11, name: "地獄犬", symbol: "🐕‍🦺", hpRatio: 1.0, atkRatio: 1.2, defRatio: 0.9, behavior: "hunter", skill: "s11", weakness: "s10", desc: "窮追不捨" },
    { id: 12, name: "深淵魔龍", symbol: "🐉", hpRatio: 2.0, atkRatio: 1.8, defRatio: 1.5, behavior: "boss", skill: "s12", weakness: "s11", desc: "迷宮霸主" }
];

// --- Game State & Classes ---
const State = {
    loop: 1, turn: 0, mazes: [], entities: [], player: null, currentEncounter: null,
    animating: false, camera: { x: 0, y: 0 }, logs: []
};

class Entity {
    constructor(x, y, mazeIndex, isPlayer = false) {
        this.x = x; this.y = y; this.visualX = x; this.visualY = y;
        this.mazeIndex = mazeIndex; this.isPlayer = isPlayer;
        this.alive = true; this.maxHp = 100; this.hp = 100; this.atk = 10; this.def = 5;
        this.gold = 0; this.kills = 0;
        this.skills = []; this.cooldowns = {};
    }
    takeDamage(amount, source, ignoreDef = false) {
        let dmg = ignoreDef ? amount : Math.max(1, amount - this.def);
        this.hp -= dmg;
        if (this.hp <= 0) { this.hp = 0; this.die(source); }
        return dmg;
    }
    heal(amount) { this.hp = Math.min(this.maxHp, this.hp + amount); }
    die(killer) {
        this.alive = false;
        if (this.isPlayer) Game.handlePlayerDeath();
        else if (killer && killer.isPlayer) {
            killer.kills++;
            killer.maxHp += 10; killer.heal(10);
            killer.atk += 2; killer.def += 1;
            killer.gold += this.gold + 50;
            logMsg(`擊敗了 ${this.name}! 能力提升！獲得金幣。`);
        }
    }
    updateAnimation() {
        if (!this.alive) return;
        const dx = this.x - this.visualX, dy = this.y - this.visualY;
        if (Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01) {
            this.visualX += dx * CONFIG.ANIMATION_SPEED;
            this.visualY += dy * CONFIG.ANIMATION_SPEED;
            State.animating = true;
        } else {
            this.visualX = this.x; this.visualY = this.y;
        }
    }
}

class Monster extends Entity {
    constructor(x, y, mazeIndex, template) {
        super(x, y, mazeIndex);
        this.id = template.id; this.name = template.name; this.symbol = template.symbol;
        this.behavior = template.behavior; this.skill = template.skill;
        this.template = template; this.hasScaled = false; this.cooldown = 0;
        this.gold = Math.floor(Math.random() * 20) + 10;
    }
    takeTurn() {
        if (!this.alive) return;
        const dirs = [[0,-1], [0,1], [-1,0], [1,0]];
        const maze = State.mazes[this.mazeIndex];
        const p = State.player;
        
        let validMoves = dirs.map(d => ({nx: this.x + d[0], ny: this.y + d[1]}))
                             .filter(pos => pos.nx >= 0 && pos.nx < maze[0].length && pos.ny >= 0 && pos.ny < maze.length && maze[pos.ny][pos.nx] !== TILE_TYPES.WALL);
        
        if (validMoves.length > 0) {
            let chosenMove = validMoves[Math.floor(Math.random() * validMoves.length)];
            if (p.mazeIndex === this.mazeIndex && p.alive) {
                let dx = p.x - this.x, dy = p.y - this.y;
                let dist = Math.abs(dx) + Math.abs(dy);
                
                if (dist < 10) {
                    let idealDx = dx === 0 ? 0 : (dx > 0 ? 1 : -1);
                    let idealDy = dy === 0 ? 0 : (dy > 0 ? 1 : -1);
                    
                    if (['defensive', 'mimic'].includes(this.behavior)) {
                        chosenMove = {nx: this.x, ny: this.y};
                    } else if (['aggressive', 'hunter', 'boss'].includes(this.behavior)) {
                        let chase = validMoves.filter(m => (m.nx - this.x === idealDx && idealDx !== 0) || (m.ny - this.y === idealDy && idealDy !== 0));
                        if (chase.length > 0) chosenMove = chase[Math.floor(Math.random() * chase.length)];
                    } else if (['smart', 'charming', 'greedy', 'coward'].includes(this.behavior)) {
                        if (p.hp > this.hp || p.atk > this.atk || this.behavior === 'coward') {
                            let flee = validMoves.filter(m => (m.nx - this.x === -idealDx && idealDx !== 0) || (m.ny - this.y === -idealDy && idealDy !== 0));
                            if (flee.length > 0) chosenMove = flee[Math.floor(Math.random() * flee.length)];
                        } else {
                            let chase = validMoves.filter(m => (m.nx - this.x === idealDx && idealDx !== 0) || (m.ny - this.y === idealDy && idealDy !== 0));
                            if (chase.length > 0) chosenMove = chase[Math.floor(Math.random() * chase.length)];
                        }
                    }
                }
            }
            this.x = chosenMove.nx; this.y = chosenMove.ny;
            if (maze[this.y][this.x] === TILE_TYPES.TELEPORT) {
                const nextMaze = (this.mazeIndex + 1) % CONFIG.NUM_MAZES;
                this.mazeIndex = nextMaze;
                const startPos = findTile(nextMaze, TILE_TYPES.TELEPORT) || findTile(nextMaze, TILE_TYPES.START);
                if(startPos) { this.x = startPos.x; this.y = startPos.y; this.visualX = this.x; this.visualY = this.y; }
            }
        }
    }
}

// --- Maze Generation ---
function generateMaze(width, height) {
    let maze = Array.from({length: height}, () => Array(width).fill(TILE_TYPES.WALL));
    let startX = 1, startY = 1; maze[startY][startX] = TILE_TYPES.START;
    let stack = [{x: startX, y: startY}];
    const dirs = [[0, -2], [0, 2], [-2, 0], [2, 0]];
    
    while(stack.length > 0) {
        let curr = stack[stack.length - 1];
        let unvisited = dirs.map(d => ({x: curr.x + d[0], y: curr.y + d[1], dx: d[0], dy: d[1]}))
                            .filter(n => n.x > 0 && n.x < width - 1 && n.y > 0 && n.y < height - 1 && maze[n.y][n.x] === TILE_TYPES.WALL)
                            .sort(() => Math.random() - 0.5);
        if (unvisited.length > 0) {
            let next = unvisited[0];
            maze[curr.y + next.dy/2][curr.x + next.dx/2] = TILE_TYPES.PATH;
            maze[next.y][next.x] = TILE_TYPES.PATH;
            stack.push({x: next.x, y: next.y});
        } else stack.pop();
    }
    for(let y=1; y<height-1; y+=2) {
        for(let x=1; x<width-1; x+=2) {
            if (Math.random() < 0.2 && maze[y][x] === TILE_TYPES.PATH) {
                let neighbors = [[0,-1],[0,1],[-1,0],[1,0]];
                let n = neighbors[Math.floor(Math.random()*neighbors.length)];
                if (y+n[1] > 0 && y+n[1] < height-1 && x+n[0] > 0 && x+n[0] < width-1) maze[y+n[1]][x+n[0]] = TILE_TYPES.PATH;
            }
        }
    }
    let placedTeleport = false;
    while(!placedTeleport) {
        let tx = Math.floor(Math.random() * Math.floor(width / 2)) * 2 + 1;
        let ty = Math.floor(Math.random() * Math.floor(height / 2)) * 2 + 1;
        if (maze[ty][tx] === TILE_TYPES.PATH && (tx !== startX || ty !== startY)) {
            maze[ty][tx] = TILE_TYPES.TELEPORT; placedTeleport = true;
        }
    }
    for(let y=1; y<height-1; y++) {
        for(let x=1; x<width-1; x++) {
            if (maze[y][x] === TILE_TYPES.PATH) {
                let r = Math.random();
                if (r < 0.08) maze[y][x] = TILE_TYPES.EVENT_GOOD;
                else if (r < 0.16) maze[y][x] = TILE_TYPES.EVENT_BAD;
                else if (r < 0.24) maze[y][x] = TILE_TYPES.EVENT_ITEM;
            }
        }
    }
    return maze;
}

function findTile(mazeIndex, type) {
    const m = State.mazes[mazeIndex];
    for(let y=0; y<m.length; y++){
        for(let x=0; x<m[y].length; x++){
            if(m[y][x] === type) return {x, y};
        }
    }
    return null;
}

// --- Core System ---
const Game = {
    canvas: null, ctx: null, lastTime: 0, stepsRemaining: 0, lastMove: { dx: 0, dy: 0 },
    
    saveGameState() {
        try {
            const saveData = {
                loop: State.loop, turn: State.turn, mazes: State.mazes, logs: State.logs, stepsRemaining: this.stepsRemaining, lastMove: this.lastMove,
                entities: State.entities.map(e => ({...e, type: e.isPlayer ? 'player' : 'monster'}))
            };
            localStorage.setItem('dungeon_save', JSON.stringify(saveData));
        } catch(e) { console.error("Save failed", e); }
    },
    loadGameState() {
        try {
            const data = localStorage.getItem('dungeon_save');
            if(!data) return false;
            const parsed = JSON.parse(data);
            if(parsed.entities.find(e => e.type === 'player' && e.hp <= 0)) return false;
            State.loop = parsed.loop; State.turn = parsed.turn; State.mazes = parsed.mazes; State.logs = parsed.logs || [];
            this.stepsRemaining = parsed.stepsRemaining || 0;
            this.lastMove = parsed.lastMove || { dx: 0, dy: 0 };
            State.entities = parsed.entities.map(eData => {
                let e = eData.type === 'player' ? new Entity(eData.x, eData.y, eData.mazeIndex, true) : new Monster(eData.x, eData.y, eData.mazeIndex, MONSTER_TEMPLATES.find(t => t.id === eData.id) || MONSTER_TEMPLATES[0]);
                Object.assign(e, eData);
                return e;
            });
            State.player = State.entities.find(e => e.isPlayer);
            return true;
        } catch(e) { return false; }
    },
    
    init() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        window.addEventListener('resize', this.resize.bind(this)); this.resize();
        this.setupUI();
        if (this.loadGameState()) {
            logMsg("載入上次儲存的遊戲進度...");
            this.updateUI();
            if(this.stepsRemaining > 0) this.setMovementPhase(true);
            requestAnimationFrame(this.render.bind(this));
        } else this.startLoop(State.loop > 1);
    },

    resize() {
        this.canvas.width = document.getElementById('canvas-container').clientWidth;
        this.canvas.height = document.getElementById('canvas-container').clientHeight;
    },

    startLoop(keepStats = false) {
        document.getElementById('endgame-modal').classList.add('hidden');
        document.getElementById('encounter-modal').classList.add('hidden');
        document.getElementById('message-modal').classList.add('hidden');
        document.getElementById('combat-screen').classList.add('hidden');
        document.getElementById('combat-screen').classList.remove('flex');
        
        let oldStats = null;
        if (keepStats && State.player) {
            oldStats = { maxHp: State.player.maxHp, hp: State.player.maxHp, atk: State.player.atk, def: State.player.def, gold: State.player.gold, kills: State.player.kills, skills: State.player.skills, cooldowns: {} };
        }
        
        State.turn = 0; State.mazes = []; State.entities = []; State.logs = []; this.stepsRemaining = 0; this.lastMove = { dx: 0, dy: 0 };
        logMsg(`--- 第 ${State.loop} 輪迴開始 ---`);
        
        for(let i=0; i<CONFIG.NUM_MAZES; i++) State.mazes.push(generateMaze(CONFIG.MAZE_WIDTH, CONFIG.MAZE_HEIGHT));
        
        let startPos = findTile(0, TILE_TYPES.START);
        State.player = new Entity(startPos.x, startPos.y, 0, true);
        State.player.name = "勇者";
        if (oldStats) Object.assign(State.player, oldStats);
        State.entities.push(State.player);

        let availableMonsters = [...MONSTER_TEMPLATES].sort(() => Math.random() - 0.5);
        for(let i=0; i<12; i++) {
            let mIndex = i % CONFIG.NUM_MAZES;
            let placed = false;
            while(!placed) {
                let rx = Math.floor(Math.random() * CONFIG.MAZE_WIDTH), ry = Math.floor(Math.random() * CONFIG.MAZE_HEIGHT);
                if (State.mazes[mIndex][ry][rx] !== TILE_TYPES.WALL) {
                    State.entities.push(new Monster(rx, ry, mIndex, availableMonsters[i])); placed = true;
                }
            }
        }
        this.updateUI(); this.saveGameState();
        requestAnimationFrame(this.render.bind(this));
    },

    setupUI() {
        const checkModalOpen = () => !document.getElementById('encounter-modal').classList.contains('hidden') || !document.getElementById('message-modal').classList.contains('hidden') || !document.getElementById('combat-screen').classList.contains('hidden') || !document.getElementById('endgame-modal').classList.contains('hidden') || !document.getElementById('merchant-modal').classList.contains('hidden') || !document.getElementById('skill-modal').classList.contains('hidden');

        this.canvas.addEventListener('pointerdown', (e) => {
            if (this.stepsRemaining <= 0 || checkModalOpen()) return;
            const rect = this.canvas.getBoundingClientRect();
            const worldX = e.clientX - rect.left + State.camera.x;
            const worldY = e.clientY - rect.top + State.camera.y;
            const gridX = Math.floor(worldX / CONFIG.TILE_SIZE), gridY = Math.floor(worldY / CONFIG.TILE_SIZE);
            const move = this.getValidMoves().find(m => m.x === gridX && m.y === gridY);
            if (move) this.movePlayer(move.dx, move.dy);
        });

        document.getElementById('btn-roll').addEventListener('click', () => {
            if (this.stepsRemaining > 0 || State.player.hp <= 0 || checkModalOpen()) return;
            const btn = document.getElementById('btn-roll');
            if (btn.classList.contains('rolling')) return; 
            btn.classList.add('rolling');
            setTimeout(() => {
                this.stepsRemaining = Math.floor(Math.random() * 6) + 1;
                btn.classList.remove('rolling');
                this.setMovementPhase(true);
            }, 500);
        });

        window.addEventListener('keydown', (e) => {
            if (this.stepsRemaining <= 0 || checkModalOpen()) return;
            let dx = 0, dy = 0; const key = e.key.toLowerCase();
            if (key === 'arrowup' || key === 'w') dy = -1;
            else if (key === 'arrowdown' || key === 's') dy = 1;
            else if (key === 'arrowleft' || key === 'a') dx = -1;
            else if (key === 'arrowright' || key === 'd') dx = 1;
            else return;
            const move = this.getValidMoves().find(m => m.dx === dx && m.dy === dy);
            if (move) this.movePlayer(dx, dy);
        });

        document.getElementById('btn-fight').addEventListener('click', () => this.resolveEncounter('fight'));
        document.getElementById('btn-flee-encounter').addEventListener('click', () => this.resolveEncounter('flee'));
        
        document.getElementById('btn-cb-attack').addEventListener('click', () => this.executeCombatTurn('attack'));
        document.getElementById('btn-cb-skill').addEventListener('click', () => this.openSkillModal());
        document.getElementById('btn-cb-defend').addEventListener('click', () => this.executeCombatTurn('defend'));
        document.getElementById('btn-cb-dodge').addEventListener('click', () => this.executeCombatTurn('dodge'));
        document.getElementById('btn-cb-counter').addEventListener('click', () => this.executeCombatTurn('counter'));
        document.getElementById('btn-cb-flee').addEventListener('click', () => this.executeCombatTurn('flee'));
        
        document.getElementById('btn-skill-cancel').addEventListener('click', () => document.getElementById('skill-modal').classList.add('hidden'));
        document.getElementById('btn-merchant-leave').addEventListener('click', () => {
            document.getElementById('merchant-modal').classList.add('hidden');
            this.processWorldTurn();
        });
        document.getElementById('btn-msg-close').addEventListener('click', () => document.getElementById('message-modal').classList.add('hidden'));
        document.getElementById('message-modal').addEventListener('click', (e) => {
            if (e.target.id === 'message-modal') document.getElementById('message-modal').classList.add('hidden');
        });
        document.getElementById('btn-restart').addEventListener('click', () => {
            document.getElementById('endgame-modal').classList.add('hidden');
            State.loop = document.getElementById('btn-restart').innerText.includes('下一輪迴') ? State.loop + 1 : 1;
            this.startLoop(State.loop > 1);
        });
    },

    getValidMoves() {
        const p = State.player, maze = State.mazes[p.mazeIndex], dirs = [[0,-1], [0,1], [-1,0], [1,0]];
        let valid = [];
        for (let d of dirs) {
            let nx = p.x + d[0], ny = p.y + d[1];
            let isBacktrack = (d[0] === -this.lastMove.dx && d[1] === -this.lastMove.dy) && (this.lastMove.dx !== 0 || this.lastMove.dy !== 0);
            if (nx >= 0 && nx < CONFIG.MAZE_WIDTH && ny >= 0 && ny < CONFIG.MAZE_HEIGHT && maze[ny][nx] !== TILE_TYPES.WALL) {
                if (!isBacktrack) valid.push({x: nx, y: ny, dx: d[0], dy: d[1]});
            }
        }
        if (valid.length === 0) {
            this.lastMove = { dx: 0, dy: 0 }; // 解除回頭限制
            return this.getValidMoves();
        }
        return valid;
    },

    setMovementPhase(isMoving) {
        const btn = document.getElementById('btn-roll'), icon = document.getElementById('dice-icon'), text = document.getElementById('dice-result');
        if (isMoving) {
            btn.className = "pointer-events-auto bg-gradient-to-r from-yellow-600 to-yellow-800 text-white font-bold py-2 px-8 rounded-full shadow-[0_0_15px_rgba(234,179,8,0.5)] border-2 border-yellow-400 flex items-center justify-center gap-2 w-full max-w-xs mx-auto";
            icon.innerText = '👣'; text.innerText = `點擊發亮處 (剩 ${this.stepsRemaining} 步)`;
        } else {
            btn.className = "pointer-events-auto bg-gradient-to-r from-blue-600 to-blue-800 hover:from-blue-500 hover:to-blue-700 active:scale-95 text-white font-bold py-2 px-8 rounded-full shadow-[0_0_15px_rgba(37,99,235,0.5)] border-2 border-blue-400 flex items-center justify-center gap-2 w-full max-w-xs mx-auto transition-all";
            icon.innerText = '🎲'; text.innerText = '擲骰移動';
            this.lastMove = { dx: 0, dy: 0 };
        }
    },

    movePlayer(dx, dy) {
        const p = State.player; p.x += dx; p.y += dy; this.stepsRemaining--;
        this.lastMove = { dx, dy };
        p.heal(1); this.updateUI();
        
        const maze = State.mazes[p.mazeIndex];
        if (maze[p.y][p.x] === TILE_TYPES.TELEPORT) {
            const nextMaze = (p.mazeIndex + 1) % CONFIG.NUM_MAZES; p.mazeIndex = nextMaze;
            const startPos = findTile(nextMaze, TILE_TYPES.START);
            if(startPos) {
                p.x = startPos.x; p.y = startPos.y; p.visualX = p.x; p.visualY = p.y;
                this.lastMove = { dx: 0, dy: 0 }; // 傳送後解除方向限制
                this.showMessage("傳送陣", `傳送到迷宮層級 ${nextMaze + 1}!`);
                logMsg(`進入傳送陣，來到第 ${nextMaze + 1} 層！`);
            }
        }
        
        let encounter = this.checkEntityCollision();
        if (encounter) { this.stepsRemaining = 0; this.triggerEncounter(encounter); this.setMovementPhase(false); }
        else if (this.stepsRemaining === 0) { this.setMovementPhase(false); this.processTileEvent(); }
        else document.getElementById('dice-result').innerText = `點擊發亮處 (剩 ${this.stepsRemaining} 步)`;
    },

    processTileEvent() {
        const p = State.player, maze = State.mazes[p.mazeIndex], tile = maze[p.y][p.x];
        if (tile === TILE_TYPES.EVENT_ITEM) {
            this.openMerchant(); maze[p.y][p.x] = TILE_TYPES.PATH; return;
        }
        let category = tile === TILE_TYPES.EVENT_GOOD ? EVENTS.GOOD : (tile === TILE_TYPES.EVENT_BAD ? EVENTS.BAD : null);
        if (category) {
            const ev = category[Math.floor(Math.random() * category.length)];
            ev.effect(p); maze[p.y][p.x] = TILE_TYPES.PATH;
            this.showMessage(ev.name, ev.desc); logMsg(`遭遇事件: ${ev.name}`);
        }
        this.updateUI(); this.processWorldTurn();
    },
    
    openMerchant() {
        const SHOP_ITEMS = [
            { name: "鐵劍", type: "atk", val: 5, cost: 40 }, { name: "鋼鐵大劍", type: "atk", val: 12, cost: 100 }, { name: "王者之劍", type: "atk", val: 25, cost: 250 },
            { name: "皮甲", type: "def", val: 3, cost: 40 }, { name: "秘銀鎧甲", type: "def", val: 10, cost: 120 }, { name: "神聖之盾", type: "def", val: 20, cost: 220 },
            { name: "生命護符", type: "maxHp", val: 20, cost: 60 }, { name: "巨人之心", type: "maxHp", val: 50, cost: 150 },
            { name: "初級藥水", type: "heal", val: 30, cost: 20 }, { name: "精靈靈藥", type: "heal", val: 100, cost: 70 }
        ];
        const p = State.player;
        document.getElementById('merchant-gold').innerText = p.gold;
        const container = document.getElementById('merchant-items'); container.innerHTML = '';
        let available = [...SHOP_ITEMS].sort(() => Math.random() - 0.5).slice(0, 3);
        
        available.forEach(baseItem => {
            let item = { ...baseItem }, rand = Math.random(), tag = "", nameColor = "text-white";
            if (rand < 0.05) { item.cost = 0; item.val = Math.max(1, Math.floor(item.val * 0.3)); item.name = `破舊的 ${item.name}`; tag = "<span class='bg-green-600 text-[10px] py-0.5 px-1.5 rounded ml-2 shadow'>免費</span>"; nameColor = "text-gray-400"; }
            else if (rand < 0.35) { item.cost = Math.max(1, Math.floor(item.cost * 0.5)); item.val = Math.max(1, Math.floor(item.val * 0.6)); item.name = `中古的 ${item.name}`; tag = "<span class='bg-red-600 text-[10px] py-0.5 px-1.5 rounded ml-2 shadow'>半價</span>"; nameColor = "text-yellow-200"; }

            let desc = item.type === 'atk' ? `攻擊力 +${item.val}` : (item.type === 'def' ? `防禦力 +${item.val}` : (item.type === 'maxHp' ? `最大生命 +${item.val}` : `恢復生命 ${item.val}`));
            const btn = document.createElement('button');
            let borderColor = item.cost === 0 ? 'border-green-600' : (item.cost < baseItem.cost ? 'border-red-500' : 'border-gray-600');
            btn.className = `w-full bg-gray-900 border-2 ${borderColor} p-3 rounded-lg flex justify-between items-center hover:bg-gray-700 mb-2 shadow-md`;
            btn.innerHTML = `<div class="text-left"><div class="font-bold text-sm ${nameColor}">${item.name} ${tag}</div><div class="text-xs text-gray-400 mt-1">${desc}</div></div><div class="font-black flex items-center gap-1 ${item.cost === 0 ? 'text-green-400' : 'text-yellow-400'}">${item.cost} <span class="text-xs">G</span></div>`;
            btn.onclick = () => {
                if (p.gold >= item.cost) {
                    p.gold -= item.cost;
                    if (item.type === 'atk') p.atk += item.val;
                    if (item.type === 'def') p.def += item.val;
                    if (item.type === 'maxHp') { p.maxHp += item.val; p.heal(item.val); }
                    if (item.type === 'heal') p.heal(item.val);
                    logMsg(`購買了 ${item.name}！ (花費 ${item.cost}G)`);
                    document.getElementById('merchant-modal').classList.add('hidden');
                    this.updateUI(); this.processWorldTurn();
                } else logMsg(`金幣不足，無法購買！`);
            };
            container.appendChild(btn);
        });
        document.getElementById('merchant-modal').classList.remove('hidden');
    },

    processWorldTurn() {
        State.turn++;
        State.entities.forEach(e => {
            if (!e.isPlayer && e.alive) { e.takeTurn(); e.heal(1); }
        });
        if (State.turn % 20 === 0) {
            State.player.maxHp += 5; State.player.atk += 1; logMsg("在迷宮中探索，適應了環境，能力提升。");
            State.entities.forEach(e => { if (!e.isPlayer && e.alive) { e.maxHp += 5; e.hp += 5; e.atk += 1; } });
            logMsg("迷宮深處的氣息變濃，魔物變強了。");
        }
        let encounter = this.checkEntityCollision();
        if (encounter && document.getElementById('encounter-modal').classList.contains('hidden')) this.triggerEncounter(encounter);
        else this.saveGameState(); 
        this.updateUI(); this.checkWinCondition();
    },

    checkEntityCollision() {
        const p = State.player;
        return State.entities.find(e => !e.isPlayer && e.alive && e.mazeIndex === p.mazeIndex && e.x === p.x && e.y === p.y);
    },

    triggerEncounter(monster) {
        State.currentEncounter = monster;
        if (!monster.hasScaled) {
            const p = State.player, scale = 1 + (State.loop - 1) * 0.35 + (State.turn * 0.005), variance = () => 0.85 + Math.random() * 0.3;
            monster.maxHp = Math.max(20, Math.floor(p.maxHp * monster.template.hpRatio * scale * variance())); monster.hp = monster.maxHp; 
            monster.atk = Math.max(2, Math.floor(p.atk * monster.template.atkRatio * scale * variance()));
            monster.def = Math.max(0, Math.floor(p.def * monster.template.defRatio * scale * variance()));
            monster.hasScaled = true;
        }
        document.getElementById('encounter-name').innerText = `${monster.symbol} ${monster.name}`;
        document.getElementById('encounter-hp').innerText = Math.floor(monster.hp);
        document.getElementById('encounter-atk').innerText = monster.atk;
        document.getElementById('encounter-def').innerText = monster.def;
        document.getElementById('encounter-desc').innerText = `${monster.template.desc} (特技: ${SKILLS[monster.skill].name} | 弱點: ${SKILLS[monster.template.weakness].name})`;
        document.getElementById('encounter-modal').classList.remove('hidden');
    },

    resolveEncounter(action) {
        const p = State.player, m = State.currentEncounter;
        if (!m || !m.alive) return;
        let modal = document.getElementById('encounter-modal');
        if (action === 'fight') { this.startCombat(); modal.classList.add('hidden'); }
        else if (action === 'flee') {
            if (Math.random() < 0.7) { logMsg("逃跑成功！"); this.bounceEntity(p); modal.classList.add('hidden'); State.currentEncounter = null; this.saveGameState(); }
            else { logMsg("逃跑失敗，被迫應戰！"); this.startCombat(); modal.classList.add('hidden'); }
        }
        this.updateUI();
    },

    startCombat() {
        const screen = document.getElementById('combat-screen'), m = State.currentEncounter;
        screen.classList.remove('hidden'); screen.classList.add('flex');
        document.getElementById('cb-m-name').innerText = m.name; document.getElementById('cb-m-sym').innerText = m.symbol;
        this.updateCombatUI(); document.getElementById('combat-log').innerHTML = '';
        this.logCombat(`遭遇了 ${m.name}！戰鬥開始！`, 'text-yellow-400');
    },

    updateCombatUI() {
        const p = State.player, m = State.currentEncounter;
        document.getElementById('cb-p-hp').innerText = `HP: ${Math.floor(p.hp)}/${p.maxHp}`;
        document.getElementById('cb-p-hpbar').style.width = `${Math.max(0, (p.hp/p.maxHp)*100)}%`;
        if (m) {
            document.getElementById('cb-m-hp').innerText = `HP: ${Math.floor(m.hp)}/${m.maxHp}`;
            document.getElementById('cb-m-hpbar').style.width = `${Math.max(0, (m.hp/m.maxHp)*100)}%`;
        }
    },

    logCombat(msg, colorClass = 'text-gray-300') {
        const logWindow = document.getElementById('combat-log'), entry = document.createElement('div');
        entry.className = `mb-1 ${colorClass}`; entry.innerText = msg;
        logWindow.appendChild(entry); logWindow.scrollTop = logWindow.scrollHeight;
    },

    toggleCombatButtons(enabled) {
        ['btn-cb-attack', 'btn-cb-skill', 'btn-cb-defend', 'btn-cb-dodge', 'btn-cb-counter', 'btn-cb-flee'].forEach(id => document.getElementById(id).disabled = !enabled);
    },

    openSkillModal() {
        const p = State.player, container = document.getElementById('skill-list'); container.innerHTML = '';
        if (p.skills.length === 0) container.innerHTML = '<div class="text-gray-400 text-center py-4">尚未學會任何特技<br><span class="text-xs">擊敗魔物以學習特技</span></div>';
        else {
            p.skills.forEach(skillId => {
                const sk = SKILLS[skillId], cd = p.cooldowns[skillId] || 0, btn = document.createElement('button');
                btn.className = `w-full p-3 rounded-lg flex justify-between items-center mb-2 shadow-md ${cd > 0 ? 'bg-gray-700 opacity-50 cursor-not-allowed' : 'bg-gray-900 border border-blue-500 hover:bg-gray-700 active:scale-95'}`;
                btn.innerHTML = `<div class="text-left"><div class="font-bold text-blue-300">${sk.name}</div><div class="text-[10px] text-gray-400">倍率:${sk.mult} | ${sk.ignoreDef?'無視防禦':''}</div></div><div class="text-xs ${cd>0?'text-red-400':'text-green-400'}">${cd > 0 ? `CD: ${cd}` : '可使用'}</div>`;
                if (cd <= 0) btn.onclick = () => { document.getElementById('skill-modal').classList.add('hidden'); this.executeCombatTurn('skill', skillId); };
                container.appendChild(btn);
            });
        }
        document.getElementById('skill-modal').classList.remove('hidden');
    },

    executeCombatTurn(action, skillId = null) {
        const p = State.player, m = State.currentEncounter;
        if (!m || !m.alive || !p.alive) return;
        this.toggleCombatButtons(false);

        let mAction = 'attack', mSkillDef = SKILLS[m.skill], rand = Math.random();
        if (m.behavior === 'coward' && rand < 0.6) mAction = 'flee';
        else if (m.hp < m.maxHp * 0.3 && rand < 0.25 && !['boss', 'mimic'].includes(m.behavior)) mAction = 'flee';
        else if (m.cooldown <= 0 && rand < 0.45) { mAction = 'skill'; m.cooldown = mSkillDef.cd + 1; }
        else {
            let r = Math.random();
            if (['defensive', 'mimic'].includes(m.behavior)) { if (r < 0.35) mAction = 'defend'; else if (r < 0.65) mAction = 'counter'; else if (r < 0.75) mAction = 'dodge'; else mAction = 'attack'; }
            else if (['smart', 'charming', 'greedy', 'coward'].includes(m.behavior)) { if (r < 0.35) mAction = 'dodge'; else if (r < 0.55) mAction = 'defend'; else if (r < 0.70) mAction = 'counter'; else mAction = 'attack'; }
            else { if (r < 0.15) mAction = 'defend'; else if (r < 0.30) mAction = 'dodge'; else if (r < 0.40) mAction = 'counter'; else mAction = 'attack'; }
        }

        let pDefMult = 1, pEvade = false, pCounter = false, msgP = "";
        if (action === 'defend') { pDefMult = 0.3; msgP = "勇者採取了防禦姿勢。"; }
        if (action === 'dodge') { pEvade = Math.random() < 0.5; msgP = pEvade ? "勇者準備閃避！" : "勇者試圖閃避，但失敗了！"; }
        if (action === 'counter') { pDefMult = 0.7; pCounter = true; msgP = "勇者擺出反擊架勢！"; }
        
        let mDefMult = 1, mEvade = false, mCounter = false, msgM = "", monsterFled = false, playerFled = false;
        if (mAction === 'defend') { mDefMult = 0.3; msgM = `${m.name} 採取了防禦姿勢。`; }
        if (mAction === 'dodge') { mEvade = Math.random() < 0.5; msgM = mEvade ? `${m.name} 準備閃避！` : `${m.name} 試圖閃避，但失敗了！`; }
        if (mAction === 'counter') { mDefMult = 0.7; mCounter = true; msgM = `${m.name} 擺出反擊架勢！`; }

        if (action === 'flee') { if (Math.random() < 0.4) { this.logCombat("成功撤退！", "text-yellow-400 font-bold"); playerFled = true; } else { msgP = "撤退失敗，破綻百出！"; pDefMult = 1.2; } }
        if (mAction === 'flee' && !playerFled) { if (Math.random() < 0.6) { this.logCombat(`${m.name} 夾著尾巴逃跑了！`, "text-yellow-400 font-bold"); monsterFled = true; } else { msgM = `${m.name} 逃跑被攔截！`; mDefMult = 1.3; } }

        if (msgP) this.logCombat(msgP, 'text-gray-400');
        if (msgM) this.logCombat(msgM, 'text-gray-500');

        if (playerFled) { setTimeout(() => this.endCombat(false, true), 900); return; }
        if (monsterFled) { setTimeout(() => this.endCombat(false, false, true), 900); return; }

        const processAttack = (attacker, defender, act, sDef, defM, isEvading, callback) => {
            if (!attacker.alive || !defender.alive) { callback(); return; }
            if (!['attack', 'skill', 'do_counter'].includes(act)) { callback(); return; }
            const aDiv = document.getElementById(attacker.isPlayer ? 'combat-player' : 'combat-monster');
            const dDiv = document.getElementById(attacker.isPlayer ? 'combat-monster' : 'combat-player');
            
            aDiv.classList.add(attacker.isPlayer ? 'anim-atk-p' : 'anim-atk-m');
            setTimeout(() => {
                aDiv.classList.remove(attacker.isPlayer ? 'anim-atk-p' : 'anim-atk-m');
                if (isEvading) { this.logCombat(`${defender.name} 成功閃避了攻擊！`, 'text-green-400 font-bold'); callback(); return; }
                dDiv.classList.add('anim-dmg');
                let rawDmg = 0, isSkill = false;
                
                if (act === 'skill' && sDef) {
                    rawDmg = attacker.atk * sDef.mult; isSkill = true;
                    if (attacker.isPlayer) attacker.cooldowns[sDef.id] = sDef.cd;
                    this.logCombat(`${attacker.name} 施放了 【${sDef.name}】！`, attacker.isPlayer ? 'text-blue-400 font-bold' : 'text-purple-400 font-bold');
                    if (attacker.isPlayer && MONSTER_TEMPLATES.find(t=>t.id === defender.id).weakness === sDef.id) { rawDmg *= 2; this.logCombat(`擊中弱點！效果拔群！`, 'text-yellow-400 font-black'); }
                } else if (act === 'do_counter') { rawDmg = Math.floor(attacker.atk * 1.5); this.logCombat(`${attacker.name} 發動反擊！`, 'text-yellow-400 font-bold'); }
                else rawDmg = attacker.atk;

                let actualDmg = isSkill && sDef.ignoreDef ? rawDmg : Math.max(1, rawDmg - defender.def);
                actualDmg = Math.floor(actualDmg * defM);
                defender.hp -= actualDmg;
                this.logCombat(`${attacker.name} 對 ${defender.name} 造成 ${actualDmg} 傷害！`, attacker.isPlayer ? 'text-blue-300' : 'text-red-400');
                
                if (isSkill && sDef.healRate > 0) { let heal = Math.floor(actualDmg * sDef.healRate); attacker.heal(heal); this.logCombat(`吸收了 ${heal} 生命！`, 'text-green-400'); }
                
                this.updateCombatUI(); this.updateUI();
                setTimeout(() => { dDiv.classList.remove('anim-dmg'); if (defender.hp <= 0) defender.hp = 0; callback(); }, 400);
            }, 300);
        };

        const step4 = () => { if (p.hp > 0 && m.hp > 0 && mCounter && !mEvade && ['attack', 'skill'].includes(action)) processAttack(m, p, 'do_counter', null, 1, false, () => { if(p.hp<=0) { this.logCombat(`你倒下了...`, 'text-red-600 font-black'); p.die(m); } else this.endRoundTasks(); }); else this.endRoundTasks(); };
        const step3 = () => { if (p.hp > 0 && m.hp > 0 && pCounter && !pEvade && ['attack', 'skill'].includes(mAction)) processAttack(p, m, 'do_counter', null, 1, false, () => { if(m.hp<=0) this.resolveCombatWin(); else step4(); }); else step4(); };
        const step2 = () => { if (p.hp > 0 && m.hp > 0 && ['attack', 'skill'].includes(mAction)) processAttack(m, p, mAction, mAction==='skill'?mSkillDef:null, pDefMult, pEvade, () => { if(p.hp<=0) { this.logCombat(`你倒下了...`, 'text-red-600 font-black'); p.die(m); } else step3(); }); else step3(); };
        const step1 = () => { if (p.hp > 0 && m.hp > 0 && ['attack', 'skill'].includes(action)) processAttack(p, m, action, action==='skill'?SKILLS[skillId]:null, mDefMult, mEvade, () => { if(m.hp<=0) this.resolveCombatWin(); else step2(); }); else step2(); };
        step1();
    },

    resolveCombatWin() {
        const m = State.currentEncounter, p = State.player;
        this.logCombat(`成功擊敗了 ${m.name}！`, 'text-green-400 font-bold');
        let mTemp = MONSTER_TEMPLATES.find(t=>t.id === m.id);
        if (!p.skills.includes(mTemp.skill)) { p.skills.push(mTemp.skill); this.logCombat(`學會了新特技：【${SKILLS[mTemp.skill].name}】！`, 'text-yellow-400 font-black'); }
        m.die(p); setTimeout(() => this.endCombat(true), 1500);
    },

    endRoundTasks() {
        if (!State.player.alive) return;
        const p = State.player;
        for(let k in p.cooldowns) if(p.cooldowns[k] > 0) p.cooldowns[k]--;
        if (State.currentEncounter && State.currentEncounter.cooldown > 0) State.currentEncounter.cooldown--;
        this.toggleCombatButtons(true);
    },

    endCombat(won, fled = false, monsterFled = false) {
        document.getElementById('combat-screen').classList.add('hidden');
        document.getElementById('combat-screen').classList.remove('flex');
        const m = State.currentEncounter;
        if (monsterFled && m) { logMsg(`${m.name} 倉皇逃走，行為變得膽小！`); m.behavior = 'coward'; this.bounceEntity(m); }
        else if (won) logMsg(`戰勝魔物，凱旋歸來！`);
        else if (fled) { logMsg(`驚險地從戰鬥中撤退。`); this.bounceEntity(State.player); }
        State.currentEncounter = null; this.checkWinCondition(); this.updateUI(); this.saveGameState();
        this.toggleCombatButtons(true);
    },

    bounceEntity(entity) {
        const maze = State.mazes[entity.mazeIndex], dirs = [[0,-1], [0,1], [-1,0], [1,0]];
        for(let d of dirs) { let nx = entity.x + d[0], ny = entity.y + d[1]; if (nx>=0 && nx<CONFIG.MAZE_WIDTH && ny>=0 && ny<CONFIG.MAZE_HEIGHT && maze[ny][nx] !== TILE_TYPES.WALL) { entity.x = nx; entity.y = ny; break; } }
    },

    render(time) {
        requestAnimationFrame(this.render.bind(this));
        let dt = time - this.lastTime; this.lastTime = time;
        State.animating = false; State.entities.forEach(e => e.updateAnimation());

        const w = this.canvas.width, h = this.canvas.height;
        this.ctx.fillStyle = '#1a202c'; this.ctx.fillRect(0, 0, w, h);
        if (!State.player) return;

        const p = State.player, maze = State.mazes[p.mazeIndex];
        State.camera.x = p.visualX * CONFIG.TILE_SIZE - w/2 + CONFIG.TILE_SIZE/2;
        State.camera.y = p.visualY * CONFIG.TILE_SIZE - h/2 + CONFIG.TILE_SIZE/2 + (h * 0.15);

        this.ctx.save(); this.ctx.translate(-State.camera.x, -State.camera.y);

        for (let y = 0; y < CONFIG.MAZE_HEIGHT; y++) {
            for (let x = 0; x < CONFIG.MAZE_WIDTH; x++) {
                let scrX = x * CONFIG.TILE_SIZE - State.camera.x, scrY = y * CONFIG.TILE_SIZE - State.camera.y;
                if (scrX > -CONFIG.TILE_SIZE && scrX < w && scrY > -CONFIG.TILE_SIZE && scrY < h) {
                    let tile = maze[y][x];
                    if (tile !== TILE_TYPES.WALL) { this.ctx.fillStyle = TILE_COLORS[TILE_TYPES.PATH]; this.ctx.fillRect(x * CONFIG.TILE_SIZE, y * CONFIG.TILE_SIZE, CONFIG.TILE_SIZE, CONFIG.TILE_SIZE); }
                    if (tile === TILE_TYPES.WALL) { this.ctx.fillStyle = TILE_COLORS[TILE_TYPES.WALL]; this.ctx.fillRect(x * CONFIG.TILE_SIZE, y * CONFIG.TILE_SIZE, CONFIG.TILE_SIZE, CONFIG.TILE_SIZE); this.ctx.fillStyle = 'rgba(0,0,0,0.2)'; this.ctx.fillRect(x * CONFIG.TILE_SIZE, y * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE - 5, CONFIG.TILE_SIZE, 5); }
                    else if (tile === TILE_TYPES.TELEPORT) { this.ctx.fillStyle = TILE_COLORS[TILE_TYPES.TELEPORT]; this.ctx.beginPath(); this.ctx.arc(x * CONFIG.TILE_SIZE + 20, y * CONFIG.TILE_SIZE + 20, 15, 0, Math.PI*2); this.ctx.fill(); }
                    else if ([TILE_TYPES.EVENT_GOOD, TILE_TYPES.EVENT_BAD, TILE_TYPES.EVENT_ITEM].includes(tile)) { this.ctx.fillStyle = TILE_COLORS[tile]; this.ctx.beginPath(); this.ctx.moveTo(x*CONFIG.TILE_SIZE+20, y*CONFIG.TILE_SIZE+10); this.ctx.lineTo(x*CONFIG.TILE_SIZE+30, y*CONFIG.TILE_SIZE+20); this.ctx.lineTo(x*CONFIG.TILE_SIZE+20, y*CONFIG.TILE_SIZE+30); this.ctx.lineTo(x*CONFIG.TILE_SIZE+10, y*CONFIG.TILE_SIZE+20); this.ctx.fill(); }
                }
            }
        }

        if (this.stepsRemaining > 0) {
            this.getValidMoves().forEach(m => {
                this.ctx.fillStyle = 'rgba(255, 255, 0, 0.3)'; this.ctx.fillRect(m.x * CONFIG.TILE_SIZE, m.y * CONFIG.TILE_SIZE, CONFIG.TILE_SIZE, CONFIG.TILE_SIZE);
                this.ctx.fillStyle = '#ffffff'; this.ctx.font = '20px sans-serif'; this.ctx.globalAlpha = 1.0; this.ctx.fillText("👣", m.x * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2, m.y * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2);
            });
        }

        let renderQueue = State.entities.filter(e => e.alive && e.mazeIndex === p.mazeIndex).sort((a, b) => a.visualY - b.visualY);
        renderQueue.forEach(e => {
            let px = e.visualX * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2, py = e.visualY * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2;
            this.ctx.font = '24px sans-serif'; this.ctx.textAlign = 'center'; this.ctx.textBaseline = 'middle';
            if (e.isPlayer) {
                this.ctx.fillStyle = 'rgba(0,0,0,0.5)'; this.ctx.beginPath(); this.ctx.ellipse(px, py + 12, 12, 6, 0, 0, Math.PI*2); this.ctx.fill();
                this.ctx.fillStyle = '#ffffff'; this.ctx.globalAlpha = 1.0; this.ctx.fillText("🧑‍🌾", px, py);
                let hpPct = Math.max(0, e.hp / e.maxHp); this.ctx.fillStyle = 'red'; this.ctx.fillRect(px - 15, py - 20, 30, 4); this.ctx.fillStyle = 'green'; this.ctx.fillRect(px - 15, py - 20, 30 * hpPct, 4);
            } else {
                this.ctx.fillStyle = '#ffffff'; this.ctx.globalAlpha = 1.0; this.ctx.fillText(e.symbol, px, py);
                let hpPct = Math.max(0, e.hp / e.maxHp); this.ctx.fillStyle = 'rgba(255,0,0,0.5)'; this.ctx.fillRect(px - 10, py - 15, 20, 3); this.ctx.fillStyle = 'red'; this.ctx.fillRect(px - 10, py - 15, 20 * hpPct, 3);
            }
        });

        this.ctx.restore();
        let gradient = this.ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*0.2, w/2, h/2, Math.min(w,h)*0.8);
        gradient.addColorStop(0, 'rgba(0,0,0,0)'); gradient.addColorStop(1, 'rgba(0,0,0,0.8)');
        this.ctx.fillStyle = gradient; this.ctx.fillRect(0,0,w,h);
    },

    updateUI() {
        if (!State.player) return;
        const p = State.player;
        document.getElementById('player-hp').innerText = `${Math.floor(p.hp)}/${p.maxHp}`;
        document.getElementById('player-atk').innerText = p.atk; document.getElementById('player-def').innerText = p.def; document.getElementById('player-gold').innerText = p.gold;
        document.getElementById('loop-count').innerText = State.loop > 1 ? `(第${State.loop}輪)` : '';
        document.getElementById('turn-count').innerText = State.turn; document.getElementById('current-maze').innerText = p.mazeIndex + 1;
        document.getElementById('alive-count').innerText = State.entities.filter(e => !e.isPlayer && e.alive).length;
    },

    showMessage(title, desc) {
        document.getElementById('message-title').innerText = title; document.getElementById('message-desc').innerText = desc;
        document.getElementById('message-modal').classList.remove('hidden');
    },

    handlePlayerDeath() {
        document.getElementById('combat-screen').classList.add('hidden'); document.getElementById('combat-screen').classList.remove('flex');
        localStorage.removeItem('dungeon_save');
        const modal = document.getElementById('endgame-modal'), title = document.getElementById('end-title'), btn = document.getElementById('btn-restart');
        modal.classList.remove('hidden'); title.innerText = "YOU DIED"; title.className = "text-5xl font-black mb-2 text-center text-red-600";
        document.getElementById('end-rank').innerText = `名次: 第 ${State.entities.filter(e => !e.isPlayer && e.alive).length + 1} 名`;
        document.getElementById('end-turns').innerText = State.turn; document.getElementById('end-kills').innerText = State.player.kills; document.getElementById('end-level').innerText = "死亡";
        btn.innerText = "重新開始"; btn.className = "w-full py-3 rounded font-bold text-lg shadow-lg transition-transform hover:scale-105 bg-gray-600 hover:bg-gray-500 text-white";
    },

    checkWinCondition() {
        if (State.entities.filter(e => !e.isPlayer && e.alive).length === 0 && State.player.alive) {
            const modal = document.getElementById('endgame-modal'), title = document.getElementById('end-title'), btn = document.getElementById('btn-restart');
            modal.classList.remove('hidden'); title.innerText = "VICTORY!"; title.className = "text-5xl font-black mb-2 text-center text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-yellow-600";
            document.getElementById('end-rank').innerText = "唯一的倖存者";
            document.getElementById('end-turns').innerText = State.turn; document.getElementById('end-kills').innerText = State.player.kills; document.getElementById('end-level').innerText = `滿載而歸 (輪迴 ${State.loop})`;
            btn.innerText = "開啟下一輪迴 (保留屬性, 敵人變強)"; btn.className = "w-full py-3 rounded font-bold text-sm shadow-lg transition-transform hover:scale-105 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white mt-4";
        }
    }
};

function logMsg(msg) {
    State.logs.unshift(msg); if(State.logs.length > 20) State.logs.pop();
    document.getElementById('log-window').innerHTML = State.logs.map((l, i) => `<div class="${i===0 ? 'text-white' : 'text-gray-400'} mb-1">${l}</div>`).join('');
}

window.onload = () => Game.init();
</script>
