<title>星碎戰記 v1.1</title>
<style>
*{box-sizing:border-box;margin:0;touch-action:manipulation}
:root{--bg:#10142a;--pn:#1c2142;--ink:#ece8da;--dim:#8d92b5;--gold:#e8b957;--hp:#e2655d;--mp:#4fb3a9;--bk:#ff8f5a;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;max-width:460px;margin:auto;padding:8px;display:flex;flex-direction:column;background:linear-gradient(#10142a,#1a1633);color:var(--ink);font:15px/1.4 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
header{display:flex;align-items:center;gap:6px;white-space:nowrap;justify-content:space-between;font-family:"Noto Serif TC","Songti TC",serif;color:var(--gold);letter-spacing:.1em}
#wv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:center;font-size:12px;letter-spacing:0}
header>span:nth-child(3){font-size:12px;letter-spacing:0}
#ord{display:flex;gap:4px;margin:6px 0;min-height:40px;align-items:center;overflow:hidden}
#ord i{font-style:normal;flex:none;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:var(--pn);border:2px solid #5a4a7a}
#ord i.p{border-color:#4f86b3}#ord i.e{border-color:#a04a54}
#ord i.on{width:38px;height:38px;border-color:var(--gold);box-shadow:0 0 8px var(--gold)}
#ord i.bk{opacity:.45}
#en{flex:1;display:flex;gap:6px;align-items:center;justify-content:center}
.c{flex:1;min-width:0;background:var(--pn);border-radius:10px;padding:6px;text-align:center}
.c.e{max-width:140px}
.em{font-size:34px;line-height:1.2}
.c b{display:block;font-size:13px;overflow-wrap:anywhere}
.bar{height:6px;margin:2px 0;background:#0007;border-radius:3px;overflow:hidden}
.bar u{display:block;height:100%;background:var(--hp);transition:width .3s}
.bar.m u{background:var(--mp)}
#lb{margin-bottom:4px}#lb small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar.l u{background:var(--gold)}.bar.l.full{box-shadow:0 0 8px var(--gold)}
.sh{color:var(--gold);font-size:12px}.wk{font-size:13px}
.rw{font-style:normal;font-size:9px;color:var(--dim);margin-left:3px;border:1px solid #4b4f7c;border-radius:3px;padding:0 2px}
#pt .c.rb{margin-top:10px}
.st{height:15px;font-size:10px;line-height:15px;white-space:nowrap;overflow:hidden}
.in{font-size:12px;height:16px;white-space:nowrap;overflow:hidden;color:var(--dim)}.in.hv{color:var(--bk);font-weight:700}.in.sp{color:var(--mp)}
small{display:block;font-size:11px;color:var(--dim)}
.c.act{outline:2px solid var(--gold)}
.c.tg{outline:2px dashed #fff;animation:bl 1s infinite}
.c.dead{opacity:.2;transform:scale(.82) translateY(8px);filter:grayscale(1)}
.c.hit{animation:hit .32s;animation:hit calc(.32s*var(--sp,1))}
.c.hitw{animation:hitw .42s;animation:hitw calc(.42s*var(--sp,1))}
.c.spawnin{animation:spawnin .55s;animation:spawnin calc(.55s*var(--sp,1))}
@keyframes spawnin{0%{transform:scale(.2);opacity:0;filter:brightness(3)}60%{transform:scale(1.15);opacity:1}100%{transform:none;filter:none}}
.c.dying{animation:die .6s forwards;animation:die calc(.6s*var(--sp,1)) forwards}
.c.lungep{animation:lungep .3s;animation:lungep calc(.3s*var(--sp,1))}
.c.lungee{animation:lungee .3s;animation:lungee calc(.3s*var(--sp,1))}
.shk{animation:shk .3s;animation:shk calc(.3s*var(--sp,1))}
.shk2{animation:shk2 .4s;animation:shk2 calc(.4s*var(--sp,1))}
@keyframes hit{0%{filter:brightness(2.2)}25%{transform:translateX(-6px)}55%{transform:translateX(6px)}100%{filter:none;transform:none}}
@keyframes hitw{0%{filter:brightness(2.8) sepia(1) saturate(5)}20%{transform:translate(-9px,2px) scale(1.06)}45%{transform:translate(9px,-2px)}70%{transform:translate(-4px,0)}100%{filter:none;transform:none}}
@keyframes die{0%{filter:brightness(3)}35%{transform:scale(1.1)}100%{opacity:.2;transform:scale(.82) translateY(8px);filter:grayscale(1)}}
@keyframes lungep{40%{transform:translateY(-14px)}}
@keyframes lungee{40%{transform:translateY(14px)}}
@keyframes shk2{15%{transform:translate(-11px,4px)}35%{transform:translate(11px,-4px)}55%{transform:translate(-8px,3px)}75%{transform:translate(5px,-2px)}}
@keyframes shk{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
@keyframes bl{50%{opacity:.6}}
#pt{display:flex;gap:4px;margin:6px 0}
#pt .c{padding:5px 3px}#pt .em{font-size:28px}#pt small{font-size:10px}
#log{height:66px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:6px 8px;background:#0005;border-radius:8px;font-size:13px;color:var(--dim)}
#log div:last-child{color:var(--ink)}
#log .sub{padding-left:10px;font-size:12px}
#hint{margin:6px 0 4px;min-height:20px;color:var(--gold);font-size:13px}
#menu button{white-space:pre-line;font-size:13px;padding:6px 4px;line-height:1.25;text-wrap:balance}
#menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px;min-height:50px;margin-bottom:4px}
button{font:inherit;color:var(--ink);background:var(--pn);border:1px solid #4b4f7c;border-radius:8px;padding:10px;min-height:44px}
button:disabled{opacity:.35}
#sp,#fxb{min-height:0;padding:2px 8px;font-size:12px}
#fx{position:fixed;inset:0;pointer-events:none}
.pop{position:absolute;transform:translate(-50%,0);font-weight:900;font-size:21px;text-shadow:0 0 3px #000,0 1px 4px #000;animation:up .9s forwards;animation:up calc(.9s*var(--sp,1)) forwards}
.pop.heal{color:#7be0a0}.pop.poi{color:#b58cf0}.c.dead.tg{opacity:.6}
.pop.weak{color:var(--gold);font-size:24px}.pop.brk{color:var(--bk);font-size:24px}
@keyframes up{0%{transform:translate(-50%,8px) scale(.5);opacity:0}15%{transform:translate(-50%,-4px) scale(1.45);opacity:1}35%{transform:translate(-50%,-10px) scale(1)}100%{transform:translate(-50%,-40px) scale(1);opacity:0}}
.pop.big{color:#ff9f43;font-size:27px}
.sp{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font-size:30px;text-shadow:0 0 6px #fff}
.sp.bl{animation:burst .55s forwards;animation:burst calc(.55s*var(--sp,1)) forwards}
.sp.sl{font-size:64px;color:#fff;font-weight:900;animation:slash .4s forwards;animation:slash calc(.4s*var(--sp,1)) forwards}
.sp.ar{animation:arrow .4s forwards;animation:arrow calc(.4s*var(--sp,1)) forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-75%) scale(1.8);opacity:0}}
@keyframes slash{0%{transform:translate(-95%,-50%) scale(.4,1);opacity:0}30%{opacity:1}100%{transform:translate(-5%,-50%) scale(1.3,1);opacity:0}}
@keyframes arrow{0%{transform:translate(-220%,-110%);opacity:0}30%{opacity:1}100%{transform:translate(-35%,-50%);opacity:0}}
#cut{position:fixed;left:0;right:0;top:32%;height:64px;display:flex;align-items:center;gap:12px;padding:0 20px;background:linear-gradient(90deg,#0000,#e8b957f0 18%,#e8b957f0 82%,#0000);color:#1a1633;font-size:26px;font-weight:900;letter-spacing:.12em;transform:translateX(-110%);pointer-events:none}
#cut.on{animation:cut .8s forwards;animation:cut calc(.8s*var(--sp,1)) forwards}
@keyframes cut{0%{transform:translateX(-110%)}20%{transform:translateX(0)}80%{transform:translateX(0)}100%{transform:translateX(110%)}}
#ov{position:fixed;inset:0;display:flex;overflow-y:auto;padding:16px;text-align:center;background:#0a0d1ef2}
#ov[hidden]{display:none}
#ov>div{margin:auto;max-width:340px}
#ov p{font-size:13px;line-height:1.55}
#obs{display:flex;flex-wrap:wrap;gap:8px;position:sticky;bottom:0;padding:8px 0;background:#0a0d1e}#obs button{flex:1 1 30%;white-space:pre-line;font-size:13px;padding:8px 4px;line-height:1.35;text-wrap:balance;overflow-wrap:anywhere}
h1{margin-bottom:10px;font-family:"Noto Serif TC","Songti TC",serif;color:var(--gold);letter-spacing:.15em}
@media(max-height:780px){.em{font-size:28px}#log{height:54px}#ord{min-height:34px;margin:4px 0}}
body.nofx *{animation:none!important}
</style>

 if(endless){if((w+1)%5===0)return startWave();const A={l:WV[w],s:SCE[w],m:MD[w]},l2=gen(w,1),B={l:l2,s:SCE[w],m:MD[w]};return rt(w,A,B,'層')}
 const b=BR[w];if(!b)return startWave();
 rt(w,{l:WV[w],s:SC[w],m:null},{l:b.l,s:b.s,m:MODS.find(x=>x&&x.n===b.m)},'戰')}
function rt(w,A,B,u){
 const lab=X=>`${X.s.n}\n${X.l.map(k=>EN[k].e).join('')}\n${X.m?X.m.n+'：'+X.m.d+'\n🎁 '+RW(X.m):'無特殊限制'}`;
 const go=X=>()=>{WV[w]=X.l;SCE[w]=X.s;MD[w]=X.m;startWave()};
 ov('選擇前進的區域',`第 ${w+1} ${u}：前方出現兩條路線。`,[[lab(A),go(A)],[lab(B),go(B)]],0)}
function pickUp(){const o=UP.filter(u=>u!==UP[3]||P.some(p=>(p.ks||0)<10)).sort(()=>Math.random()-.5).slice(0,3);ov('選擇強化',(rwtx?rwtx+'<br>':'')+'每場勝利後可選一項，效果持續到本次挑戰結束。',o.map(u=>[u.n+'\n'+u.d,()=>{u.f();rwtx='';say('獲得強化：'+u.n);if(xp>0){xp--;pickUp()}else route()}]),0)}
function startWave(){if(!endless&&STORY[wave]&&!shown[wave]){shown[wave]=1;return story(wave,startWave)}cb=0;bt=0;lastEl=null;if(acc.includes('cr'))lb=Math.min(100,lb+30);if(acc.includes('mg'))P.forEach(p=>p.mp=Math.min(p.mmp,p.mp+15));if(acc.includes('gd'))P.forEach(p=>{if(p.hp>0)p.guard=true});document.body.style.background=`linear-gradient(${scn().c[0]},${scn().c[1]})`;
 E=WV[wave].map(k=>{const e=mk(EN[k],'e');e.id=k;return e});E.forEach(e=>{const o=['sword','bow','fire','ice','bolt'].filter(k=>!e.w.includes(k));if(o.length){const w=[...e.w];w[Math.random()*w.length|0]=rnd(o);e.w=w}});if(hard)E.forEach(e=>{e.hp=e.mhp=Math.round(e.hp*DF[hard].h);e.atk=Math.round(e.atk*DF[hard].a)});if(endless){const m=1+wave*.08+wave*wave*.003,q=1+wave*.07+wave*wave*.0025;E.forEach(e=>{e.hp=e.mhp=Math.round(e.hp*m*AB.hp);e.atk=Math.round(e.atk*q*AB.atk);e.def=Math.round(e.def+wave*.4);e.sh+=AB.sh;e.msh+=AB.sh})}const md=MD[wave];if(md){if(md.n==='疾風')E.forEach(e=>e.spd=Math.round(e.spd*1.2));else if(md.n==='硬殼')E.forEach(e=>{e.sh++;e.msh++});else if(md.n==='狂亂')E.forEach(e=>e.atk=Math.round(e.atk*1.25))}
E.forEach(e=>plan(e));
 [...P,...E].forEach(u=>u.t=1000/u.spd*(.6+Math.random()*.4));
 say(`📍 ${scn().n}：`+(WV[wave].some(k=>EN[k].boss)?'強敵現身了！':endless?`第 ${wave+1} 層${MD[wave]?'・'+MD[wave].n+'（'+MD[wave].d+'）':''}`:`第 ${wave+1} 戰開始${MD[wave]?'・'+MD[wave].n+'（'+MD[wave].d+'）':''}`));loop()}
const BK='shardsBest15';
const old=()=>{try{return!!(localStorage.getItem('shardsBest14')||localStorage.getItem('shardsBest13')||localStorage.getItem('shardsBest12')||localStorage.getItem('shardsBest10')||localStorage.getItem('shardsBest8')||localStorage.getItem('shardsBest'))}catch(e){return false}};
const loadBest=()=>{try{return JSON.parse(localStorage.getItem(BK))||{}}catch(e){return{}}};
function saveBest(){const b=loadBest(),r=b[hard];let nw=false;if(!r||stat.turns<r.t){b[hard]={t:stat.turns,d:stat.down};nw=true;try{localStorage.setItem(BK,JSON.stringify(b))}catch(e){}}return nw}
const bestTx=()=>{const b=loadBest();return '🏆 最佳通關（最少行動）：'+DF.map((d,i)=>`${d.n} ${b[i]?b[i].t+' 次':'—'}`).join('・')+'<br>♾️ 無盡塔最高層數：'+(bestFl()||'—')+'・📅 今日挑戰：'+(dailyBest()||'—')};
const GR=[[88,113,150],[107,137,178],[155,195,249]];
function grade(){const T=GR[hard];let i=stat.turns<=T[0]?0:stat.turns<=T[1]?1:stat.turns<=T[2]?2:3;return 'SABC'[Math.min(3,i+stat.down)]}
const rs=()=>`${endless?`${daily?'每日挑戰':'無盡塔'}・到達第 ${wave+1} 層`:`難度 ${DF[hard].n}・到達第 ${Math.min(wave+1,WV.length)} 戰`}<br>我方行動 ${stat.turns} 次・隊友倒下 ${stat.down} 次・使用道具 ${stat.items} 次`;
function init(h,e,d){if(h!==undefined){hard=h;endless=e?1:0;daily=d?1:0}stat={turns:0,down:0,items:0};cb=0;WV=BASE.map(a=>[...a]);SCE=[];MD=[];xp=0;rwtx='';acc=[];AB={atk:1,hp:1,sh:0,n:0};shown={};if(endless){WV=[];WV[0]=gen(0)}P=(endless?H:H.slice(0,3)).map(d=>mk(d,'p'));P.forEach(p=>{p.bs={atk:p.atk,mhp:p.mhp,spd:p.spd};p.pk=[]});wave=0;lb=0;inv={pot:3,eth:2,fea:1};log=[];startWave()}
function ov(h,p,b,f){$('#ov').innerHTML=`<div><h1>${h}</h1><p>${p}</p><br><div id="obs"></div></div>`;$('#ov').hidden=false;const o=$('#obs');(Array.isArray(b)?b:[[b,f]]).forEach(([t,g])=>{const x=document.createElement('button');x.textContent=t;x.onclick=()=>{$('#ov').hidden=true;g()};o.appendChild(x)})}

$('#en').onclick=ev=>{const c=ev.target.closest('.c');if(mode!=='tgt'||!c)return;const e=E[+c.dataset.i];if(e&&e.hp>0){mode='';tcb(e)}};

 ['☠️ 狀態','☠️ 中毒：自己的回合開始時扣血。⛓️ 麻痺：回合開始時有 50% 機率無法行動。🛡️ 防禦：承受傷害減半。🎯 挑釁：敵人的單體攻擊集中到自己。數字是剩餘回合。'],

 ['🎁 飾品、事件與路線','擊敗強敵會掉落飾品（三選一，全隊永久生效）。戰鬥之間可能遇到營火、寶箱、神殿事件，部分關卡前可以選擇路線，限制較多的路線有額外獎勵。'],
 ['♾️ 無盡塔與每日挑戰','通關任一難度後解鎖。樓層隨機生成、逐層變強，每 5 層有強敵，每 10 層可為一位隊員解鎖專屬能力，每 25 層有深淵事件（強力但代價永久的契約）。每日挑戰用當天日期決定樓層，同一天的內容都一樣。'],
 ['📊 其他','右上角 ⏩ 可加速戰鬥演出，✨ 可開關動畫特效。「紀錄」頁有累計數據、各角色單次最高傷害與治療，以及成就。戰鬥紀錄區可以上下滑動回看。']];
 ov('📘 遊戲說明',S.map(([t,d])=>`<span style="display:block;text-align:left;margin:9px 0"><b style="color:var(--gold)">${t}</b><br>${d}</span>`).join(''),[['返回',title],['📜 更新日誌',logPage]],0)}
